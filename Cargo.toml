[package]
name = "pipestream-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Provider-neutral distributed lexical, vector, and hybrid search"

[workspace]
members = ["crates/protomolt-analyzer", "crates/protomolt-search-embedded"]
exclude = ["sidecars/route-cost"]
resolver = "2"

[dependencies]
turbovec = { git = "https://github.com/ai-pipestream/turbovec.git", branch = "turbovec-pipestream-s20" }
turbovec-grpc = { git = "https://github.com/ai-pipestream/turbovec-grpc.git", rev = "0b21a161d008936d21feb474e801e456415e6622", optional = true }
# tonic's core (Status, Request, codegen, the prost codec) is all the
# embedded runtime needs; the HTTP/2 transport rides the `net` feature.
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost"] }
prost = "0.13"
# google.protobuf.Timestamp on the ingest wire compiles to this crate's
# type; tonic-build emits the reference, the runtime needs the crate.
# Locked to prost's minor version: prost-types 0.14 implements prost
# 0.14's Message trait, which tonic 0.12's prost 0.13 codec refuses.
# It moves when tonic and prost move, never on its own.
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
memmap2 = "0.9"
protomolt-analyzer = { path = "crates/protomolt-analyzer" }
# The in-process node link (src/link.rs) frames request streams into the
# handler's body itself: the body trait and the byte buffers, no socket.
http-body = "1"
bytes = "1"
tower = { version = "0.5", features = ["util"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
# The snapshot repository's HTTP(S) source (docs/snapshots.md): a node
# GETs a repository from a NAS or object store itself. hyper's HTTP/1.1
# client over hyper-util's connector is the client tonic already links;
# http-body-util streams the response body to disk. `net` only.
hyper = { version = "1", features = ["client", "http1"], optional = true }
http-body-util = { version = "0.1", optional = true }
# HTTPS for that source over the rustls stack tonic's `tls` feature
# links (rustls 0.23 with `ring`, the provider already in the tree):
# hyper-rustls is the connector, webpki-roots the public trust anchors,
# rustls and rustls-pki-types add the cluster CA from `--tls-ca` to the
# same trust store. Nothing here is a second TLS stack; `tls` only.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"], optional = true }
webpki-roots = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }

[features]
# The network stack (docs/embedded-mobile.md): tonic's HTTP/2 transport,
# Tokio's sockets and signals, the clustered TurboVec gRPC client, and
# everything that listens or dials — the serving binary, the harness,
# replication, snapshots, the sidecar client, the UDP floor lane. Off,
# the library is the same handlers reached in-process through
# `link::NodeLink`; that is what the embedded runtime links, and
# `cargo tree -p protomolt-search-embedded` shows no h2, hyper, or
# Tokio `net` because of it.
net = [
    "tonic/transport",
    "tokio/net",
    "tokio/signal",
    "tokio-stream/net",
    "dep:tower",
    "dep:hyper-util",
    "hyper-util/client-legacy",
    "hyper-util/http1",
    "dep:hyper",
    "dep:http-body-util",
    "dep:turbovec-grpc",
]
# TLS/mTLS on the gRPC listeners and the cluster-internal channels
# (docs/security.md): rustls through tonic. On by default for the serving
# binary; the embedded runtime turns it off, because it reaches its nodes
# in-process and must not carry a TLS stack onto a phone.
default = ["net", "tls"]
tls = [
    "net",
    "tonic/tls",
    "dep:hyper-rustls",
    "dep:webpki-roots",
    "dep:rustls",
    "dep:rustls-pki-types",
]

[[bin]]
name = "pipestream-search"
path = "src/main.rs"
required-features = ["net"]

[[bin]]
name = "console"
path = "src/bin/console.rs"
required-features = ["net"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bzip2 = "0.6"
csv = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
# The HTTPS repository test (tests/snapshot_https.rs) serves a directory
# over TLS from the test certificates; tokio-rustls is the acceptor the
# tree already links through tonic. TEST-ONLY.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The CEL differential oracle (tests/cel_filters.rs): the reference
# interpreter the compiled ordinal path is held to agreement with,
# wherever stock CEL is defined. TEST-ONLY by design — the serving
# binary compiles filters, it never interprets them, and this crate's
# dependency tree (regex included) stays out of it.
cel-interpreter = "0.10"
