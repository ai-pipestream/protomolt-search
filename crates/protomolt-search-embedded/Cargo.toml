[package]
name = "protomolt-search-embedded"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Embedded, no-egress Protomolt Search runtime for Android, iOS, and desktop"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pipestream-search = { path = "../..", default-features = false }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-stream = "0.1"
# tonic core only: Status and Code on the bridge. The transport (HTTP/2,
# hyper, Tokio net) is the search crate's `net` feature, off here; the
# gate in tests/dependency_gate.rs keeps it off.
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[dev-dependencies]
prost-types = "0.13"
