syntax = "proto3";

// Distributed lexical, vector, and hybrid search over provider-backed shards.
//
// Architecture: hub-and-spoke. A client-facing coordinator fans each query
// out to shard-owner nodes over `NodeService.SearchShard` (bidi stream),
// merges the per-shard top-k lists, and answers over `SearchService.Search`.
//
// Collaborative mid-query floor sharing: while a node scans its shard in
// chunks, it publishes its current k-th best score (its heap floor) once its
// top-k heap is full. The coordinator tracks the maximum floor over all
// shards and pushes it back down to every node; nodes seed the remainder of
// their scan with it via turbovec's `SearchOptions.initial_threshold`.
//
// Lossless invariant: once any shard holds k candidates, its k-th best is a
// lower bound on the GLOBAL k-th best (the k-th best of a subset never
// exceeds the k-th best of the union), so pruning candidates that score at
// or below the max published floor can never drop a true global top-k hit.
// turbovec keeps candidates scoring exactly at the floor, so ties at the
// boundary survive.
package ai.pipestream.search.v1;

import "google/protobuf/timestamp.proto";
import "ai/pipestream/search/v1/source.proto";

// NodeService is the internal shard-owner API. Exactly one node owns a given
// shard; the coordinator is the only intended client.
service NodeService {
  // Runs one distributed search against this node's shard.
  //
  // The client sends exactly one `StartShardSearch` first, then any number
  // of `FloorUpdate` messages (monotonically non-decreasing floors; stale or
  // lower updates are ignored). The server scans its shard in chunks of
  // `chunk_blocks` SIMD blocks; between chunks it applies the highest floor
  // received so far to the next chunk's `initial_threshold`, and after each
  // chunk in which its local top-k heap is full it emits a `FloorUpdate`
  // carrying its current k-th best. The stream ends with exactly one
  // `SearchShardDone` holding the shard's local top-k.
  //
  // Cancellation (client closing the stream) aborts the scan between
  // chunks.
  rpc SearchShard(stream SearchShardRequest) returns (stream SearchShardResponse);

  // Streaming scan: the shard emits EVERY candidate at or above the live
  // floor as the scan passes each calibration block, holds no top-k, and
  // never sees k. The client (the coordinator) owns k: it merges all
  // shards' emissions into the only heap in the system, raises the floor
  // as its global k-th best tightens, and may abandon the scan with
  // `StopStreamSearch`. The terminal `StreamSearchSummary` with
  // `completed = true` is the exactness certificate: every live slot
  // scoring at or above the floor in effect when its block was scored
  // was emitted. Without a floor this emits the whole shard; the relayed
  // floor is the mechanism, not an optimization.
  rpc StreamSearch(stream StreamSearchRequest) returns (stream StreamSearchResponse);

  // Reports the active vector provider, scoring identity, quality contract,
  // capabilities, and opaque construction state. Shard scores are mergeable
  // only when their scoring fingerprints match.
  rpc GetVectorBackend(GetVectorBackendRequest) returns (GetVectorBackendResponse);

  // Configures an empty shard from provider-owned opaque state. Repeating the
  // identical configuration is idempotent; changing it after vectors exist is
  // rejected. The named provider must be installed on the node.
  rpc ConfigureVectorBackend(ConfigureVectorBackendRequest) returns (ConfigureVectorBackendResponse);

  // Deprecated compatibility view for the embedded TurboVec adapter.
  rpc GetCalibration(GetCalibrationRequest) returns (GetCalibrationResponse);

  // Pushes a TQ+ calibration to this shard BEFORE its first vector is
  // added. The shard constructs (or, while still empty, re-constructs) its
  // index with `TurboQuantIndex::new_with_calibration`, locking the
  // calibration for the index's lifetime — the same rule turbovec enforces.
  //
  // Rules:
  // - On an empty shard this locks the calibration; sending the SAME
  //   calibration again is an idempotent no-op (`already_seeded = true`).
  // - On a non-empty shard, or with a different calibration than the one
  //   already locked, it is rejected (FAILED_PRECONDITION): calibration
  //   can never change once vectors exist.
  // - Field validation errors (bad dim/bit_width, non-finite shift,
  //   non-positive scale, wrong lengths) are INVALID_ARGUMENT.
  //
  // Deployment order for a from-scratch cluster: fit a calibration on a
  // representative sample, SetCalibration on every shard, then ingest.
  rpc SetCalibration(SetCalibrationRequest) returns (SetCalibrationResponse);

  // Ingests vectors into this shard. Client-streaming: each message is one
  // flat batch (`vectors.len()` a multiple of the shard dim); batches are
  // applied in stream order under the shard's write lock on the blocking
  // pool, so searches never observe a half-applied batch.
  //
  // Ids are SERVER-ASSIGNED and positional: the i-th vector of the shard
  // gets global id `slot_offset + i` (matching `SearchShardDone.hits`).
  // turbovec's id-mapped index does not support the masked, floor-seeded
  // scan this service is built around, so client-chosen ids are out of
  // scope; ingestion order defines identity.
  //
  // If the shard has no index yet (started empty, no SetCalibration), the
  // first batch constructs one: with `dim` from the request (required then)
  // and the shard's configured bit width, UNSEEDED — turbovec will fit
  // calibration from that first batch. Mixing unseeded-from-scratch shards
  // with seeded shards yields incomparable scores; seed first instead.
  //
  // Dimension mismatches and non-finite coordinates are INVALID_ARGUMENT.
  rpc AddVectors(stream AddVectorsRequest) returns (AddVectorsResponse);

  // Persists the shard's index to its configured path (the `index` path of
  // its config entry) in turbovec's atomic .tv format. A restarted node
  // with the same config comes back with all ingested vectors. On a shard
  // with no persistence path configured this is a no-op (`written=false`).
  rpc Flush(FlushRequest) returns (FlushResponse);

  // Installs a centrally built shard image (the atomic .tv index plus its
  // optional exact-vector, BM25, and live-row sidecars) over one client
  // stream — the bulk-load path
  // for pre-computed corpora. Where AddVectors builds the shard on the
  // node from streamed vectors, InstallSnapshot ships the FINISHED index:
  // build once anywhere with the cluster's seeded calibration, push the
  // artifact to every shard owner, and each node swaps it in atomically —
  // no per-node re-embedding, and byte-identical calibration everywhere
  // by construction.
  //
  // Protocol: the first message must be `manifest`, then `data` chunks in
  // any chunking the sender likes. The first `manifest.vector_bytes` of data
  // are the provider image, followed by exact FP32, BM25, and live-row bytes
  // declared by the manifest. The node stages all files inside a generation directory
  // (`<index path>.snap/`), loads and validates the image, then swaps the
  // directory into place with ONE atomic rename — the generation can never
  // tear, searches never observe a half-installed shard, and a rejected
  // install leaves both the live shard and the active generation
  // untouched. Replacing an existing generation renames it aside first;
  // the crash window between the two renames is recovered deterministically
  // at startup (snap-old restored or removed).
  //
  // Rules:
  // - The shard must have a persistence path configured
  //   (FAILED_PRECONDITION otherwise): a snapshot install IS persistence.
  // - When the shard has a calibration locked (seeded or fitted) and the
  //   image's calibration differs, the install is rejected
  //   (FAILED_PRECONDITION): mixed calibrations make scores incomparable
  //   across shards. Seed first with SetCalibration, or install on an
  //   unseeded shard, which adopts the image's calibration.
  // - Byte counts that overrun or truncate the manifest's declared sizes
  //   are INVALID_ARGUMENT; nothing is installed.
  //
  // Replacing a NON-empty shard is allowed and wholesale: the image's ids
  // restart at the shard's slot_offset, and an image WITHOUT a .bm25
  // sidecar replaces any existing postings store with none. Callers
  // rebuilding a cluster (recalibration on data drift) must replace every
  // shard together, the same rule BroadcastCalibration documents.
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);

  // Publishes the shard's current generation as a snapshot repository
  // (docs/snapshots.md): flushes, then copies every generation artifact
  // (provider image, exact FP32 sidecar, BM25 image, live-row overlay; the
  // segment catalog tree for the segment layout) into `directory` and
  // writes `snapshot-manifest.json` beside them — provider descriptor,
  // slot offset, collection, row counts, analysis fingerprints, the WAL
  // cutoff the image contains, and every artifact's byte size and SHA-256.
  // The copy runs under the shard's state READ lock: queries proceed,
  // writes wait, and the hashes and the WAL cutoff describe the same
  // bytes. A NAS path is the intended repository. A non-empty directory
  // is refused by name (INVALID_ARGUMENT), as is a shard without a
  // persistence path (FAILED_PRECONDITION).
  rpc ExportSnapshot(ExportSnapshotRequest) returns (ExportSnapshotResponse);

  // Streams the shard's current generation to a peer: the repository
  // manifest first (`SnapshotChunk.repository`), then each artifact's
  // bytes in manifest order. The node exports under its read lock exactly
  // as ExportSnapshot does, into a private staging directory, and streams
  // from that copy with the lock released.
  rpc StreamSnapshot(StreamSnapshotRequest) returns (stream SnapshotChunk);

  // Installs a snapshot the node fetches itself from a repository
  // directory written by ExportSnapshot, an HTTP(S) URL serving that
  // directory, or a peer node's StreamSnapshot. Every artifact is staged
  // and verified against the manifest's byte size and SHA-256 before the
  // SAME install as InstallSnapshot runs (provider identity checks
  // included); a size or digest mismatch, a manifest whose SHA-256 differs
  // from `expected_manifest_sha256`, a slot offset or collection other
  // than this shard's, or a layout the shard cannot adopt is refused by
  // name, and nothing is installed. The response carries the manifest so
  // the caller learns the WAL cutoff the image contains (the exact clock
  // replication catch-up resumes from).
  rpc InstallSnapshotFrom(InstallSnapshotFromRequest) returns (InstallSnapshotResponse);

  // Ingests raw-text documents into the shard's BM25 postings index.
  // Client-streaming, one document per message. For each document the node
  // calls the configured analysis sidecar (Analyze, term vectors in
  // MODE_FULL so occurrence offsets survive) and builds postings from the
  // returned terms: term identity, frequency, and occurrence spans in
  // ORIGINAL text coordinates. The raw text is stored in the shard's doc
  // store (the highlight source, read via GetDocuments).
  //
  // Doc ids are SERVER-ASSIGNED and share the shard's positional id space
  // with ingested vectors: the next id is max(vectors, documents) so the
  // vector side can later attach the same id. Global id = slot_offset +
  // local id, as everywhere else.
  //
  // Fails UNAVAILABLE when the shard has no analysis sidecar configured,
  // INVALID_ARGUMENT on empty or oversized text.
  rpc AddDocuments(stream AddDocumentsRequest) returns (AddDocumentsResponse);

  // Idempotently hides immutable rows from every read path. IDs are global
  // and must belong to this shard. The overlay becomes durable at Flush.
  rpc DeleteDocuments(DeleteDocumentsRequest) returns (DeleteDocumentsResponse);

  // Atomically retires old rows for replacements that have already been
  // appended. Both rows must exist in every active artifact, and the new row
  // must be live before the old row is hidden.
  rpc CommitReplacements(CommitReplacementsRequest) returns (CommitReplacementsResponse);

  // Protobuf-native mapped ingest (docs/descriptor-mappings.md,
  // increment 2): documents arrive as the serialized protobuf messages
  // they already are, decoded against a derived plan the stream BINDS
  // first, and land on the ORDINARY ingest path — the same analysis
  // session, the same column validation, the same WAL records — so
  // nothing is transcoded to JSON or any intermediate document model,
  // and replay never needs the descriptor.
  //
  // Protocol: the first message must be `bind` (descriptor set, message
  // type, and the REQUIRED expected plan fingerprint from PlanIndex);
  // every later message is one serialized document of the bound type.
  // The node re-derives the plan locally and refuses a fingerprint
  // mismatch (FAILED_PRECONDITION naming both): binding is agreement on
  // the PLAN. Bind also refuses, up front and by name, a plan whose
  // landing columns this shard does not declare, a chunked plan (a
  // later increment), and a plan with no TEXT field to serve as the
  // body.
  //
  // Each mapped document carries its vector, and the two legs append in
  // LOCKSTEP under one lock: the document takes the next id and its
  // vector lands at the same slot, refused (FAILED_PRECONDITION naming
  // both tips) when the shard's document leg is ahead of its vector
  // leg. A document that fails extraction fails the stream by position
  // ("document 17: ..."), nothing half-applies.
  rpc IngestMapped(stream IngestMappedRequest) returns (IngestMappedResponse);

  // Returns this shard's per-term document frequencies and corpus stats —
  // phase (b) of the distributed BM25 flow. The coordinator sums these
  // across all shards to build the GLOBAL stats every shard then scores
  // with (see Bm25Query), which is what makes BM25 scores comparable
  // across shards.
  rpc TermStats(TermStatsRequest) returns (TermStatsResponse);
  // Expand a term prefix in one field's dictionary
  // (docs/prefix-terms.md): a binary search plus a bounded scan over
  // the byte-sorted directory, reporting the terms up to the cap and
  // the exact count.
  rpc ExpandTermPrefix(ExpandTermPrefixRequest) returns (ExpandTermPrefixResponse);
  // Autocomplete over one field's dictionary (docs/suggest.md): the
  // same binary search plus bounded scan as ExpandTermPrefix, but every
  // matching term comes back with its posting document frequency, so
  // the coordinator can rank completions by summed df. Past `max_scan`
  // matches the shard reports the count and no entries; it never
  // truncates and never walks the dictionary linearly.
  rpc SuggestTerms(SuggestTermsRequest) returns (SuggestTermsResponse);

  // Scores BM25 for the given query terms against this shard's postings,
  // using the GLOBAL corpus stats supplied by the coordinator (never
  // shard-local stats — that would make scores incomparable). k1/b of 0
  // select the defaults (1.2 / 0.75). Returns the shard's local top-k.
  rpc Bm25Query(Bm25QueryRequest) returns (Bm25QueryResponse);

  // Exact phrase-aware BM25. `query.fields` carries the ordinary additive
  // field legs; the selected phrase leg contributes only its strongest
  // matching concept per document, so nested registered concepts cannot
  // inflate a score by stacking overlapping evidence.
  rpc Bm25PhraseQuery(Bm25PhraseQueryRequest) returns (Bm25QueryResponse);

  // Bm25Query with a mid-scan candidate and floor relay — the lexical
  // twin of StreamSearch (docs/block-max.md).
  // The first client message must be `start`; later messages raise the
  // shard's score floor, applied at the scorer's next loop iteration;
  // Stop requests cancellation. The block-max scorer emits every fully
  // evaluated candidate at or above the floor in compact batches; an
  // exhaustive compatibility scorer may emit its complete local top-k
  // frontier after scoring, which is sufficient for exact global top-k.
  // The coordinator owns the authoritative global heap and relays its
  // emission-safe k-th floor back to every shard. The terminal completion carries the same
  // local top-k detail response as unary Bm25Query, which supplies offsets,
  // projections, facets, and column handshakes without attaching those
  // large values to every transient candidate. A result is exact only when
  // every shard returns completed=true with the same scoring fingerprint.
  // Cancellation, deadline, transport loss, or a missing shard therefore
  // cannot be mistaken for a partial success. Flat and fused multi-field
  // block-max scorers both consume the live inclusive floor.
  rpc Bm25QueryStream(stream Bm25QueryStreamRequest) returns (stream Bm25QueryStreamResponse);

  // Reads raw document texts from the shard's doc store (the highlight
  // source). Ids are global; ids outside this shard's range or with no
  // stored text are simply absent from the response.
  rpc GetDocuments(GetDocumentsRequest) returns (GetDocumentsResponse);

  // Resolves parent-collapse identity for a batch of stable global document
  // ids without returning document text. Ids outside this shard's range are
  // absent. Rows without lineage parent themselves in the high-bit-tagged
  // domain used by the embedded collapse path.
  rpc ResolveParents(ResolveParentsRequest) returns (ResolveParentsResponse);

  // Candidate-scoped BM25 scoring (phase 2 of FUSION_MODE_CASCADE):
  // score just `candidate_ids` against this shard's postings with the
  // supplied global stats.
  rpc Bm25Rescore(Bm25RescoreRequest) returns (Bm25RescoreResponse);

  // Candidate-scoped VALUE evaluation: evaluate compiled projections
  // and score-stage contributions for just `candidate_ids`, by global
  // id. Ids outside this shard's range are absent from the response.
  // This is the post-selection value seam: the candidate set is
  // already fixed when it runs, so no pruning certificate is involved
  // — which is exactly why the public route can serve projections on
  // every shape and stored-value scorer dimensions through it.
  rpc FetchValues(FetchValuesRequest) returns (FetchValuesResponse);

  // One shard's exact aggregation partials over its filter-admitted
  // documents (docs/aggregations.md): a single pass in doc order
  // folding every requested aggregation at once. Typo flags follow
  // the filtered-route contract; expression column leaves report like
  // projection leaves.
  rpc AggregateShard(AggregateShardRequest) returns (AggregateShardResponse);

  // One round of the exact-percentile binary search
  // (docs/aggregations.md): for each target (an expression index and
  // an order-bits threshold), the count of this shard's rankable
  // values with order bits at or below the threshold, over the same
  // admitted set AggregateShard walks. The coordinator drives at most
  // 64 rounds per request; each is one admitted-set pass here.
  rpc QuantileCounts(QuantileCountsRequest) returns (QuantileCountsResponse);

  // Candidate-scoped VECTOR scoring: the vector twin of Bm25Rescore.
  // Scores just `candidate_ids` against this shard's index through a
  // masked scan; the kernel short-circuits fully-masked SIMD blocks, so
  // the cost scales with the allowlist, not the shard. Ids outside this
  // shard's range (or beyond its live slots) are ignored. Scores are
  // bitwise identical to the same slots' scores in a full or streaming
  // search — one kernel, one calibration — which is what lets
  // FUSION_MODE_DECOMPOSED use this as phase 0: rescore the BM25 leg's
  // top docs to seed the fused floor before the vector streams open.
  rpc VectorRescore(VectorRescoreRequest) returns (VectorRescoreResponse);

  // Candidate-scoped product-owned FP32 scoring. Unlike VectorRescore,
  // this reads the original-vector sidecar and computes ordinary FP32 dot
  // products. It is the terminal rerank seam for a fixed provider-selected
  // pool, not a claim that the pool contains the corpus's exact top k.
  rpc ExactVectorRescore(ExactVectorRescoreRequest) returns (ExactVectorRescoreResponse);

  // Runs the shard's LOCAL half of a hybrid query: the chunked vector
  // scan and the BM25 scoring (with the supplied global stats), fused
  // with RRF on the node — level one of the settled two-level fusion. The
  // coordinator fuses the per-shard fused lists again (level two).
  rpc HybridShard(HybridShardRequest) returns (HybridShardResponse);

  // Returns the shard's RAW per-leg top-k lists for a hybrid query — no
  // local fusion. This is the shard side of FUSION_MODE_GLOBAL_RANK: the
  // coordinator merges the legs across shards by raw score into global
  // rankings and fuses once. Raw scores must be globally comparable per
  // leg (shared TQ+ calibration for the vector leg; the supplied global
  // stats for the BM25 leg).
  rpc ShardLegs(ShardLegsRequest) returns (ShardLegsResponse);

  // Liveness + shape of this shard: vector count, dim, bit width, BM25
  // doc count, and whether an ingest stream currently holds the shard's
  // single-writer slot. Cheap enough to poll.
  // Filter-only browse (docs/query-api.md): the shard's admitted doc
  // ids strictly above `after`, ascending, at most k — a match-all
  // iterator over the slot space gated by the resolved filter at the
  // same admission rule every scored route uses (Kleene: UNKNOWN never
  // admits). No scoring runs; global id ascending is the deterministic
  // order the absence of a relevance score requires. The `after` floor
  // makes deep paging cost one page, and it is inherently stable: the
  // engine is append-only, so ids never move or vanish.
  rpc BrowseShard(BrowseShardRequest) returns (BrowseShardResponse);

  // Resolves the product-owned filter once into a packed stable-id bitmap.
  // The vector provider can apply this without learning CEL, columns, or the
  // product shard layout. Bit i admits `base_label + i`.
  rpc ResolveFilterBitmap(FilterBitmapRequest) returns (FilterBitmapResponse);

  // Exact membership bitmaps for the recursive Boolean planner. Lexical
  // membership is the union of the requested analyzed term postings; vector
  // membership contains every live row backed by a provider vector. Scores
  // are intentionally absent: after Boolean set algebra chooses the surviving
  // candidates, the ordinary candidate-scoped rescore RPCs produce them.
  rpc ResolveLexicalBitmap(LexicalBitmapRequest) returns (MembershipBitmapResponse);
  rpc ResolveVectorBitmap(VectorBitmapRequest) returns (MembershipBitmapResponse);

  // Export one durable WAL generation in generation-clock order for replica
  // or child catch-up. The node flushes before taking the high watermark;
  // every emitted record is therefore part of a complete durability point.
  rpc ReadWal(ReadWalRequest) returns (stream ReadWalResponse);

  // Replica-only replay of the durable mapped-plan identity carried by a WAL
  // Bind record. It may establish an empty/unbound target or verify the exact
  // same binding; a different binding is never accepted.
  rpc ApplyWalBinding(ApplyWalBindingRequest) returns (ApplyWalBindingResponse);

  // Online compaction of this shard (docs/mutations.md): rebuild a dense
  // all-live generation from the WAL up to a clock cutoff while writes
  // continue, tail the log into it, and cut over under one brief write
  // lock. Unary and long-running — the build reads the whole log and
  // re-analyzes every live document — so clients set a deadline in
  // minutes, not seconds. Refuses by name when the shard has no WAL, the
  // log carries legacy unclocked records, a compaction or bulk BM25 build
  // is already running, or the work directory is not empty.
  rpc CompactShard(CompactShardRequest) returns (CompactShardResponse);

  rpc Health(HealthRequest) returns (HealthResponse);
}

// SearchService is the client-facing API served by the coordinator.
service SearchService {
  // Fans the query out to every known shard node, merges the shard top-k
  // lists into one global top-k (score descending; ties broken by stable
  // vector id), and returns it. Physical shard layout never changes order.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Distributed BM25 over the shards' postings. Flow:
  //   1. the coordinator analyzes `text` with the sidecar using the SAME
  //      analysis options, producing the query terms (stem identity when
  //      SOURCE_STEMS is configured, exactly as at ingest);
  //   2. TermStats fan-out: per-shard df + doc count + total doc length;
  //   3. the coordinator sums them into GLOBAL stats and sends them back
  //      with Bm25Query, so every shard scores with identical idf/avgdl;
  //   4. shard hits merge into the global top-k (score desc, shard, doc id).
  // Hits carry per-term occurrence offsets in original-text UTF-16 code units;
  // fetch the raw text with NodeService.GetDocuments to highlight.
  rpc Bm25Search(Bm25SearchRequest) returns (Bm25SearchResponse);

  // BM25 plus explicitly registered multiword concepts. Body terms retain
  // ordinary recall while the configured phrase field adds the strongest
  // exact phrase signal. This never synthesizes arbitrary n-grams.
  rpc PhraseSearch(PhraseSearchRequest) returns (Bm25SearchResponse);

  // Hybrid vector + BM25 search with RRF fusion. Default
  // (FUSION_MODE_GLOBAL_RANK): shards return raw per-leg lists and the
  // coordinator merges each leg by raw score into global rankings, then
  // applies single-level RRF — EXACTLY the monolithic result for
  // k <= leg_k when scores are globally comparable per leg (see
  // FusionMode). FUSION_MODE_TWO_LEVEL is the rank-based fallback for
  // incomparable scores. Hits carry global per-leg ranks and raw scores.
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);

  // Pushes one provider configuration to every known shard. The scoring
  // fingerprint is the cross-shard comparability identity.
  rpc BroadcastVectorBackend(BroadcastVectorBackendRequest) returns (BroadcastVectorBackendResponse);

  // Deprecated compatibility fan-out for the embedded TurboVec adapter.
  rpc BroadcastCalibration(BroadcastCalibrationRequest) returns (BroadcastCalibrationResponse);

  // Fans NodeService.Health out to every shard (and any configured
  // replica) and reports per-target reachability plus the shard's own
  // health. Never fails on an unreachable node — that is a reported
  // outcome, not an error.
  rpc ClusterHealth(ClusterHealthRequest) returns (ClusterHealthResponse);

  // Runs two or more query configurations over the SAME corpus in one
  // request and reports how far apart their rankings are: the A/B
  // primitive, served by the engine rather than reassembled by every
  // client.
  //
  // The engine is the right place for this because the comparison is
  // only meaningful if the runs are otherwise identical. Search is
  // bitwise deterministic and layout-invariant here (tests/score_layout),
  // so two variants of one query differ ONLY by the variant — there is no
  // recall noise to average out, and a one-query diff is already a real
  // observation rather than a sample. An approximate engine cannot make
  // that claim, which is why A/B there means traffic splitting and weeks
  // of accumulation.
  //
  // Each variant is a COMPLETE ordinary request (Bm25Search or
  // HybridSearch) and runs the ordinary code path, so the thing measured
  // is the thing served. A variant-only scoring path would eventually
  // drift from production and the A/B would then be measuring the drift.
  rpc VariantSearch(VariantSearchRequest) returns (VariantSearchResponse);

  // The public query surface (docs/query-api.md): selection tree,
  // candidate-scoped boosts, and per-signal score provenance, executed
  // by DELEGATING to the ordinary routes above — the adapter maps a
  // supported shape onto Search / Bm25Search / HybridSearch and never
  // forks their scoring logic. A shape outside the supported table is
  // refused by name (INVALID_ARGUMENT / FAILED_PRECONDITION);
  // compatibility never authorizes a heuristic substitute (no AND
  // reinterpreted as a union, no filter applied to one leg, no silent
  // strategy swap). Increment 1 executes:
  //
  //   - one lexical leaf (+ filters)              -> Bm25Search
  //   - one dense leaf (+ filters)                -> Search
  //   - filters only (browse, id order)           -> BrowseShard fan-out
  //   - OR(dense, lexical) + rrf                  -> HybridSearch GLOBAL_RANK
  //   - OR(dense, lexical) + score_blend          -> HybridSearch SCORE_BLEND
  //   - OR(dense, lexical) + decomposed           -> HybridSearch DECOMPOSED
  //   - cascade(gate = dense, rerank = lexical)   -> HybridSearch CASCADE
  //   - one lexical boost on any composite shape  -> BoostRescore
  //
  // Recursive BooleanQuery uses exact shard membership bitmaps and
  // candidate-scoped scoring. Unsupported shapes are refused by name.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Streaming form of Query. Revisions are complete replacement snapshots,
  // not patches: revision numbers strictly increase, hits carry their full
  // deterministic order, and a slower client may safely skip intermediate
  // revisions. Lexical and dense candidate collectors publish while their
  // exact global heaps are still moving; composite routes may additionally
  // publish each raw leg before the final fused order. The last message is
  // exactly one QueryStreamCompletion. Its result is usable only when
  // completed=true. Client cancellation drops the execution future and its
  // underlying shard streams; timeout, shard failure, analyzer drift, or an
  // incomplete provider certificate produces completed=false, never a
  // partial success disguised as a short result.
  rpc QueryStream(QueryStreamRequest) returns (stream QueryStreamResponse);

  // Descriptor-derived mappings, dry-run increment
  // (docs/descriptor-mappings.md): derive the deterministic,
  // fingerprinted index plan for one message type inside a serialized
  // google.protobuf.FileDescriptorSet, without creating anything. The
  // same descriptor set and type name produce the same fields, in the
  // same order, with the same fingerprint, on every node and every run;
  // two engines agree on their mapping exactly when the fingerprints
  // agree.
  //
  // Derivation refuses rather than guesses: no resolvable vector field,
  // no resolvable document id, an ambiguous candidate set, or a hint
  // that contradicts the field it sits on all fail INVALID_ARGUMENT
  // naming the field and the hint that would fix it. Fields may carry
  // explicit hints as descriptor options using the vendored
  // ai.protomolt.proto.index.hints.v1 extension; a proto annotated for
  // protomolt's indexers is understood here without modification.
  //
  // Binding and protobuf-native ingest are later increments; this RPC
  // is the part an operator argues with first.
  rpc PlanIndex(PlanIndexRequest) returns (PlanIndexResponse);

  // Product-level mapped ingest routed by opaque stable document identity.
  // The coordinator snapshots one topology generation for the whole stream,
  // hashes every document key into that generation's complete range table,
  // and forwards one ordinary IngestMapped stream per owning shard. A write
  // must name the exact generation it was planned against; zero is refused.
  // This prevents an automatic retry from silently crossing a reshard cutover.
  rpc RoutedIngestMapped(stream RoutedIngestMappedRequest) returns (RoutedIngestMappedResponse);

  // Control-plane cutover handshake. Freeze waits for every routed write in
  // the required generation, then blocks new writes while queries continue.
  rpc FreezeTopologyWrites(FreezeTopologyWritesRequest) returns (FreezeTopologyWritesResponse);
  // Validate and atomically publish the newer complete map, then release the
  // write barrier. The opaque token proves this process owns the freeze.
  rpc PublishTopology(PublishTopologyRequest) returns (PublishTopologyResponse);
  // Release a freeze without changing the map.
  rpc AbortTopologyCutover(AbortTopologyCutoverRequest) returns (AbortTopologyCutoverResponse);

  // Exact aggregates of CEL value expressions over the FILTERED
  // corpus (docs/aggregations.md). The filter is the same CEL the
  // search routes take (empty = every document); each aggregation
  // names a value expression (docs/cel-values.md, the projection
  // dialect exactly) and one operation. Shards fold exact partials
  // over their admitted documents in one pass and the coordinator
  // merges them IN SHARD ORDER, so results are deterministic
  // bit-for-bit across runs: int sums accumulate in 128-bit
  // integers (an out-of-i64 total refuses naming double() as the
  // fix, never a silent approximation), double sums are
  // Neumaier-compensated, and mean/variance merge by the Chan
  // parallel rule. Absence is Kleene: a document whose expression is
  // absent is skipped and counted nowhere — never a fabricated zero.
  rpc Aggregate(AggregateRequest) returns (AggregateResponse);

  // Autocomplete (docs/suggest.md): the terms of one indexed BM25 field
  // that start with `prefix`, ranked by document frequency summed over
  // the collection's shards (ties in term byte order), the best `limit`
  // of them. The prefix is normalized under the field's analysis spec
  // exactly as a TermPrefix is — its char filters, never its stemmer —
  // so a stemmed field suggests stems and surface-form completion needs
  // a field indexed without a stemmer (the cased twin, or a
  // SOURCE_TOKENS field). The count of dictionary terms under the
  // prefix rides the response; past `max_scan` of them on any shard, or
  // fleet-wide, the request is INVALID_ARGUMENT naming the count —
  // never a quieter match set. df is posting df: a tombstoned row still
  // counts until compaction, and the response says when that applies.
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
}

// Durable cluster membership and placement authority. Query data never flows
// through this service. Nodes lease capacity, report ready shard generations,
// and poll idempotent placement actions; the authority alone publishes a new
// complete query topology after the requested replicas report ready.
service ClusterControl {
  rpc RegisterNode(RegisterNodeRequest) returns (NodeLease);
  rpc RenewNodeLease(RenewNodeLeaseRequest) returns (NodeLease);
  rpc DrainNode(DrainNodeRequest) returns (ClusterPlan);
  rpc ReportShard(ReportShardRequest) returns (ClusterPlan);
  rpc CompletePlacementAction(CompletePlacementActionRequest) returns (ClusterPlan);
  rpc ReconcileCluster(ReconcileClusterRequest) returns (ClusterPlan);
  rpc GetClusterPlan(GetClusterPlanRequest) returns (ClusterPlan);
  rpc RollbackCluster(RollbackClusterRequest) returns (ClusterPlan);
}

// One shard's slice of a filter-only browse.
message BrowseShardRequest {
  // Maximum ids returned. Must be positive.
  uint32 k = 1;
  // Exclusive global-id floor: only ids strictly above this are
  // considered. 0 starts from the beginning (id 0 is never skipped
  // because ids are compared strictly against after = 0 only when a
  // previous page ended at 0 — the first page passes no floor, see
  // `first_page`).
  uint64 after = 2;
  // Whether `after` carries a floor at all: proto3 cannot distinguish
  // "after = 0" (resume past doc 0) from unset. True on the first
  // page; false resumes strictly after `after`.
  bool first_page = 3;
  // Geo filters, AND semantics, same rules as every scored route.
  repeated GeoFilter geo_filters = 4;
  // Compiled filter IR (the coordinator compiles CEL once), resolved
  // against this shard's dictionaries. Absent = no tree filter.
  FilterExpr filter = 5;
  // Order by a column instead of by id (docs/query-api.md). The shard
  // walks its full admitted set with a column-keyed heap — exhaustive
  // traversal, so the exactness certificate is trivial rather than
  // inherited from pruning bounds it would otherwise invalidate. A
  // document WITHOUT a value in the sort column is excluded: absence
  // has no honest position in a column order (the same stance the
  // filter rules take — absence is not a value).
  BrowseSort sort = 6;
  // Sorted resume only: the boundary's order-preserving key bits (see
  // BrowseShardResponse.sort_key_bits); pairs with `after` (the
  // boundary doc id) when `first_page` is false and `sort` is set.
  uint64 after_key_bits = 7;
}

// One browse sort order: an i64 or f64 column, ascending or
// descending. Other families refuse by name (facet/string order needs
// the sorted term dictionary that does not exist yet).
message BrowseSort {
  string column = 1;
  bool descending = 2;
}

message BrowseShardResponse {
  // Admitted global doc ids, at most k: ascending by id unsorted, or
  // by (sort key, id) under `sort`.
  repeated uint64 doc_ids = 1;
  // Per-filter / per-leaf column-known flags, same typo rule as every
  // filtered route: a column NO shard resolves refuses by name at the
  // coordinator.
  repeated bool geo_columns_known = 2;
  repeated bool filter_columns_known = 3;
  // Sorted only, parallel to doc_ids: ORDER-PRESERVING u64 key bits.
  // i64 values map through offset-binary (x XOR i64::MIN); f64 values
  // through the sign-flip trick (negative: all bits flipped; positive:
  // sign bit set); a DESCENDING sort then complements the result — so
  // the merged order, the heap order, and the cursor boundary are all
  // one ascending u64 comparison regardless of kind or direction.
  repeated uint64 sort_key_bits = 4;
  // Sorted only, parallel to doc_ids: the actual column values for
  // reporting (i64 values pass through the same monotone cast the
  // column metadata uses).
  repeated double sort_keys = 5;
  // Whether this shard resolves the sort column (typo rule: refused at
  // the coordinator only when NO shard does; a shard without the
  // column contributes nothing, exactly as its documents hold no
  // value).
  bool sort_column_known = 6;
}

message FilterBitmapRequest {
  repeated GeoFilter geo_filters = 1;
  FilterExpr filter = 2;
}

message FilterBitmapResponse {
  uint64 base_label = 1;
  uint64 label_count = 2;
  bytes bits = 3;
  repeated bool geo_columns_known = 4;
  repeated bool filter_columns_known = 5;
}

message LexicalBitmapRequest {
  // Coordinator-analyzed body terms. Membership is OR: a document belongs
  // when at least one term has a posting, matching BM25's positive-score set.
  repeated string terms = 1;
}

message VectorBitmapRequest {}

message MembershipBitmapResponse {
  uint64 base_label = 1;
  uint64 label_count = 2;
  bytes bits = 3;
  // Lexical store epoch that produced the bitmap. Zero on the vector route.
  // Candidate rescoring can echo this through expected_stats_epoch.
  uint64 stats_epoch = 4;
}

// One column's aggregate over a filtered match set (docs/facets.md).
// i64 columns aggregate through the same monotone f64 cast the column
// metadata uses; sums are f64 by contract (an i64 sum can overflow any
// integer width the wire offers, and the cast is the documented one).
message ColumnStats {
  string field = 1;
  // Whether this shard (node response) or ANY shard (public response)
  // resolves the column — the usual typo rule.
  bool known = 2;
  // Documents in the match set holding a value. min/max/sum/mean are
  // meaningful only when this is nonzero.
  uint64 count = 3;
  double min = 4;
  double max = 5;
  double sum = 6;
  // Public response only: sum / count (0 when count is 0).
  double mean = 7;
}

// One shard's distinct facet VALUES over its filtered match set
// (internal: the coordinator unions these by string).
message FacetDistinct {
  string field = 1;
  bool known = 2;
  repeated string values = 3;
}

// The public exact distinct-value count for one facet column.
message FacetCardinality {
  string field = 1;
  uint64 cardinality = 2;
}

message HealthRequest {}

message ReadWalRequest {
  // Required source generation. A mismatch fails instead of silently tailing
  // a snapshot-rotated log.
  uint64 generation = 1;
  // Resume strictly after this generation-wide logical clock.
  uint64 after_clock = 2;
}

message ReadWalResponse {
  uint64 generation = 1;
  uint64 high_watermark = 2;
  // Encoded ai.pipestream.search.wal.v1.WalRecord. Empty only on the final
  // completion frame.
  bytes record = 3;
  bool completed = 4;
  // State described by this immutable prefix. Set on the completion frame.
  uint64 num_vectors = 5;
  uint64 document_slots = 6;
  uint64 live_docs = 7;
  uint64 deleted_docs = 8;
  string scoring_fingerprint = 9;
  uint64 slot_offset = 10;
}

message ApplyWalBindingRequest {
  string plan_fingerprint = 1;
  string body_path = 2;
  string materialize_sha = 3;
  // The collection the binding belongs to; a node of another
  // collection refuses (docs/collections.md).
  string collection = 4;
}

message ApplyWalBindingResponse {
  bool already_bound = 1;
}

message CompactShardRequest {
  // Scratch directory for the build. Empty = `<index path>.compact`,
  // beside the index. Must be empty (or absent) and on the same
  // filesystem as the index: the finished generation is renamed into
  // place, never copied. Removed on success; left for inspection on
  // failure, and a retry then refuses it by name.
  string work_dir = 1;
  // The tail loop keeps applying the live log to the shadow with no
  // lock held until fewer than this many records remain; the final
  // write-locked apply is bounded by it. 0 = 256.
  uint32 tail_bound = 2;
  // Run the preflight only: every refusal, the cutoff, and the row and
  // tombstone counts the compaction would work from, with no build and
  // no files written.
  bool dry_run = 3;
}

message CompactShardResponse {
  // Physical rows (live plus tombstoned) at the cutoff clock.
  uint64 rows_before = 1;
  // Physical rows served after the cutover: the dense image plus the
  // rows the tail appended. A dry run reports rows_before.
  uint64 rows_after = 2;
  // Tombstoned rows at the cutoff that the dense image dropped.
  // Tombstones written after the cutoff are carried over as tombstones,
  // not reclaimed; the next compaction takes them.
  uint64 tombstones_reclaimed = 3;
  // Live WAL records applied to the shadow after the cutoff, over every
  // tail pass and the final write-locked apply.
  uint64 tail_records_applied = 4;
  // Records applied inside the write-locked cutover (at most tail_bound).
  uint64 locked_tail_records = 5;
  // Wall time the cutover held the shard's write lock, in milliseconds:
  // the final tail apply, the marker, the renames, and the state swap.
  uint64 write_lock_ms = 6;
  // The rewritten full-history WAL generation the shard logs to after
  // the cutover; the superseded generation stays on disk as history.
  uint64 wal_generation = 7;
  // The generation clock the dense image was built through.
  uint64 cutoff_clock = 8;
  // "single-image" or "segments".
  string layout = 9;
  bool dry_run = 10;
  // Wall time of the closing Flush that makes the new generation's
  // images durable and retires the old files, in milliseconds. It holds
  // the write lock the way every Flush on the layout does (a
  // single-image flush rewrites the image; a segmented flush seals the
  // tail rows), which is why it is reported apart from write_lock_ms.
  uint64 closing_flush_ms = 11;
  // Unlocked tail passes before the cutover.
  uint64 tail_passes = 12;
  // Whether the compaction bumped the shard's stats epoch (always, after
  // a non-dry run): coordinators refetch term statistics.
  uint64 stats_epoch = 13;
}

// One shard's liveness and shape.
message HealthResponse {
  // Vectors resident in the vector index (0 for an empty shard).
  uint64 num_vectors = 1;
  // Vector dimensionality (0 until the first add locks it).
  uint32 dim = 2;
  // Provider-reported storage bits per vector dimension, when applicable.
  uint32 bits_per_dimension = 3;
  // The shard's global id base.
  uint64 slot_offset = 4;
  // Documents in the BM25 store (0 when the shard has none).
  uint64 bm25_docs = 5;
  // True while a bulk BM25 build is spilling (searchable only after Flush).
  bool bm25_building = 6;
  // True while an AddVectors/AddDocuments stream holds the single-writer
  // ingest slot.
  bool ingest_active = 7;
  // Active provider identity and score-comparability fingerprint.
  string vector_backend = 8;
  string scoring_fingerprint = 9;
  // Stable spelling of the provider's declared completion semantics.
  string quality_contract = 10;
  // Product-owned original vectors are available for every provider slot.
  bool exact_vectors_available = 11;
  uint64 exact_vector_rows = 12;
  // True when the serving representation is memory-mapped rather than a
  // mutable ingest builder.
  bool exact_vectors_mmap = 13;
  uint64 live_docs = 14;
  uint64 deleted_docs = 15;
  uint64 live_revision = 16;
  // Live WAL generation and generation-wide catch-up watermark. Zero values
  // with wal_clocked=false mean the shard has no catch-up-capable WAL.
  uint64 wal_generation = 17;
  uint64 wal_high_watermark = 18;
  bool wal_clocked = 19;
  // Next positional document id relative to slot_offset. Unlike bm25_docs,
  // this includes allocated rows with no postings and is the replication tip.
  uint64 document_slots = 20;
  // The collection this node serves (docs/collections.md); empty for
  // a node configured without one.
  string collection = 21;
}

message ClusterHealthRequest {
  // The collection to report (docs/collections.md). Empty on a
  // coordinator with named collections lists every collection's health
  // separately in `collections`, mixing no counts.
  string collection = 1;
}

// Health of one fan-out target (a shard's primary or replica).
message ShardHealth {
  // Shard index in fan-out order.
  uint32 shard = 1;
  // The address probed.
  string addr = 2;
  // True when this target is a configured replica rather than a primary.
  bool is_replica = 3;
  // Whether the probe got an answer; `error` says why not.
  bool reachable = 4;
  string error = 5;
  // The target's own report, when reachable.
  HealthResponse health = 6;
}

message ClusterHealthResponse {
  // One entry per probed target: every primary, then every configured
  // replica, in shard order.
  repeated ShardHealth targets = 1;

  // Present when vector queries use a clustered provider instead of the
  // vector indexes on the product shard nodes.
  ClusteredVectorHealth clustered_vector = 2;
  // On a coordinator with named collections and an unnamed request:
  // one entry per collection, each with its own targets and counts,
  // and the top-level `targets` empty (docs/collections.md).
  repeated CollectionHealth collections = 3;
  // Non-empty when the reachable shards do not score in one space: it
  // names each provider kind and scoring fingerprint seen and the shards
  // that serve it. A fleet in this state refuses Search/Query and routed
  // ingest by name until it is repaired (docs/mmap-vectors.md).
  string provider_mismatch = 4;
  // The coordinator's live topology generation: the value a dense quality
  // profile (docs/dense-quality-profile.md) or dense execution policy
  // (docs/dense-execution-policy.md) binds to as `corpus_generation`.
  // 0 on the per-collection listing of a coordinator with named
  // collections (each CollectionHealth carries its own).
  uint64 topology_generation = 5;
}

// One collection's health, as ClusterHealth would report it alone.
message CollectionHealth {
  string name = 1;
  ClusterHealthResponse health = 2;
}

message ClusteredVectorHealth {
  string backend_kind = 1;
  string transport = 2;
  bool reachable = 3;
  bool servable = 4;
  string error = 5;
  uint64 rows = 6;
  uint64 topology_generation = 7;
  // The clustered provider's score-space identity and dimension, as the
  // quality preflight computes them; empty/0 when unreachable. With
  // `rows` and `topology_generation` this is the identity a measured
  // profile binds to (docs/dense-quality-profile.md).
  string scoring_fingerprint = 8;
  uint32 dimensions = 9;
}

// One message on the client-to-server leg of `SearchShard`. The first
// message on a stream MUST be `start`; `floor_update` messages may follow
// in any quantity.
message SearchShardRequest {
  oneof payload {
    // Opens the scan: the query vector, the per-shard k, and the
    // coordinator-assigned request id (log correlation only).
    StartShardSearch start = 1;
    // Raises the shard's score floor. Applied to the next chunk boundary,
    // never retroactively; already-collected candidates are re-validated
    // by construction because every emitted candidate scored >= every floor
    // that was in effect when it was collected.
    FloorUpdate floor_update = 2;
  }
}

// Opens a shard scan. Exactly one per `SearchShard` stream, first message.
message StartShardSearch {
  // Coordinator-assigned id tying this shard scan to one logical query.
  // Opaque to the node; echoed in logs only.
  string request_id = 1;
  // Number of top hits this shard must return (same k as the global query).
  uint32 k = 2;
  // The query vector. Length must equal the shard index dimension.
  repeated float vector = 3;
  // When true, the shard's running top-k never evicts a candidate whose
  // score equals the current k-th best: the whole boundary tie group
  // rides along, so `SearchShardDone.hits` may exceed k by the tie-group
  // size (worst case: a shard of identical scores returns everything).
  // Used by the cascade fusion mode, whose cutoff is score-defined and
  // must include every tied doc on every shard. Off by default, leaving
  // plain vector Search semantics untouched.
  bool tie_complete = 4;
  // When true, the shard collapses by PARENT DOCUMENT: k means k
  // distinct parents, each represented by its best-scoring chunk (the
  // entry point c'), and `SearchShardDone.hits` carry `parent_id`. The
  // parent of a slot is its doc-store lineage `parent_id`; slots
  // without lineage parent themselves (high-bit-tagged global id).
  // Published floors become k-th best PARENT scores, which are >= the
  // plain chunk floors, so collaborative pruning only strengthens; the
  // lossless invariant holds unchanged (a chunk below the floor can
  // neither beat its own parent's best nor introduce a new top-k
  // parent). Mutually exclusive with `tie_complete`. Requires a doc
  // store on shards that should map real parents; a vector-only shard
  // degrades to self-parents (no collapse effect, still correct).
  bool collapse_parents = 5;
  // Filters applied to the VECTOR leg, resolved on the node against
  // this shard's columns and applied as a slot allowlist BEFORE the
  // scan kernel scores anything (docs/vector-filters.md). A filter only
  // REMOVES documents, so every floor stays a valid lower bound on the
  // filtered k-th best and no pruning math changes; what the allowlist
  // buys is that a chunk in which nothing survives is skipped outright.
  // A document with no value for a filtered column fails the filter,
  // the same absence rule the lexical leg documents.
  repeated GeoFilter geo_filters = 6;
  // Compiled filter tree (see FilterExpr), ANDed with `geo_filters`
  // when both are set. Absent = no filter.
  FilterExpr filter = 7;
}

// A score floor: a lower bound on the global k-th best score. Flows both
// directions on the `SearchShard` stream — node to coordinator when the
// node's heap fills, coordinator to node with the max over all shards.
message FloorUpdate {
  // Candidates scoring below this cannot be in the global top-k.
  // Senders must only raise the floor over the life of a stream; receivers
  // ignore updates that do not raise their current floor.
  float floor = 1;
}

// One message on the server-to-client leg of `SearchShard`.
message SearchShardResponse {
  oneof payload {
    // The node's current k-th best score, emitted after each chunk in which
    // the local top-k heap is full. Monotonically non-decreasing within a
    // stream.
    FloorUpdate floor_update = 1;
    // Terminal message: the shard's local top-k plus scan statistics.
    // Exactly one per stream; the server closes the stream after it.
    SearchShardDone done = 2;
  }
}

// Terminal message of a shard scan.
message SearchShardDone {
  // The shard's local top-k, score descending, ties broken by vector id.
  // `vector_id` is the GLOBAL id (node slot offset + local slot), so the
  // coordinator can merge without knowing shard layouts.
  repeated ScoredHit hits = 1;
  // Instrumentation for benchmarking the floor-sharing mechanism.
  ShardScanStats stats = 2;
  // Whether this shard's geo table has each requested filter's column,
  // parallel to the request's `geo_filters` (empty when none were
  // sent), and whether it can resolve each leaf of the request's
  // `filter` in `walk_leaves` order (empty when none was sent). The
  // coordinator refuses a column NO shard knows: filtering on a typo
  // would otherwise read as an honest empty result set.
  repeated bool geo_columns_known = 3;
  repeated bool filter_columns_known = 4;
}

// Per-scan counters a node reports in `SearchShardDone`. These exist so the
// effect of floor sharing is measurable without patching the turbovec scan
// kernel: `candidates_collected` counts every real (non-padding) candidate
// the per-chunk searches returned, which is exactly the set of vectors that
// survived every floor in effect during the scan.
message ShardScanStats {
  // How many per-chunk `search_with_options` calls the scan made.
  uint32 chunk_calls = 1;
  // Real candidates collected across all chunks (sentinel padding excluded).
  uint64 candidates_collected = 2;
  // How many floor values the node actually PUT ON THE WIRE. This is
  // what --floor-warmup-chunks and --floor-min-interval-ms move, and it
  // is strictly <= floors_offered.
  uint64 floors_published = 3;
  // How many chunks ran with a coordinator-pushed floor in effect.
  uint64 floor_updates_applied = 4;
  // How many chunks OFFERED a floor: one per chunk whose heap held k.
  // The scan's own behaviour, independent of what the node does with
  // them. This field used to be missing and `floors_published` counted
  // offers, so the broadcast knobs measured as having no effect.
  uint64 floors_offered = 5;
}

// One scored vector. Ids are global across the cluster (see
// `SearchShardDone.hits`).
message ScoredHit {
  // Global vector id (shard slot offset + local slot).
  uint64 vector_id = 1;
  // turbovec score; higher is better. Comparable across shards only when
  // every shard shares the same TQ+ calibration.
  float score = 2;
  // Collapse mode only: the parent document this hit represents
  // (lineage parent_id, or a high-bit-tagged global id for slots
  // without lineage). 0 outside collapse mode.
  uint64 parent_id = 3;
}

// One message on the client-to-shard leg of `StreamSearch`.
message StreamSearchRequest {
  oneof payload {
    // Opens the scan. Exactly one per stream, first message.
    StartStreamSearch start = 1;
    // Raises the shard's emission floor. Applied from the next
    // calibration block; floors only rise (lower values are ignored).
    FloorUpdate floor_update = 2;
    // Abandons the scan: emissions stop, the terminal summary arrives
    // with `completed = false`, and the stream closes.
    StopStreamSearch stop = 3;
  }
}

// Opens a streaming scan. There is no k: the shard emits everything at
// or above the floor and the client keeps what it wants.
message StartStreamSearch {
  // Coordinator-assigned id tying this scan to one logical query.
  // Opaque to the node; echoed in logs only.
  string request_id = 1;
  // The query vector. Length must equal the shard index dimension.
  repeated float vector = 2;
  // Starting emission floor: a known lower bound on the global k-th
  // best (for example a finished BM25 leg's decomposed floor). Absent
  // means no floor, which emits the entire shard.
  optional float initial_floor = 3;
  // Token identifying this stream on the node's UDP signal lane (the
  // same host:port as the gRPC listener, UDP namespace). A typed frame is 20
  // bytes: ASCII `TVS1`, u8 opcode, three zero reserved bytes, little-endian
  // u64 token, then a little-endian f32 value. Opcodes carry either a floor
  // raise or advisory cancellation. Every datagram has an authoritative twin
  // on the gRPC request stream, so loss, duplication, and reordering can only
  // delay pruning or cancellation. UDP cancellation never certifies
  // completion.
  // 0 disables the UDP lane for this stream.
  uint64 floor_token = 4;
  // Document-mode streaming: when true, every batch record carries the
  // emitted slot's PARENT (20-byte records, see StreamSearchBatch) —
  // the doc-store lineage parent_id, or a high-bit-tagged global id
  // for slots without lineage. The scan itself is unchanged; what
  // changes is the floor's MEANING: the coordinator relays k-th best
  // PARENT scores (a parent's score is its best chunk's score), which
  // are >= plain chunk floors, so pruning only strengthens and the
  // lossless invariant holds — a chunk below the floor can neither
  // beat its own parent's best nor introduce a new top-k parent.
  // Chunks of one parent may live on several shards; every shard's
  // qualifying chunks flow to the coordinator, which aggregates by
  // parent id — document collapse without Lucene-style colocation.
  bool collapse_parents = 5;
  // Filters applied to the VECTOR leg, resolved on the node against
  // this shard's columns and applied as a slot allowlist BEFORE the
  // scan kernel scores anything (docs/vector-filters.md). A filter only
  // REMOVES documents, so every floor stays a valid lower bound on the
  // filtered k-th best and no pruning math changes; what the allowlist
  // buys is that a chunk in which nothing survives is skipped outright.
  // A document with no value for a filtered column fails the filter,
  // the same absence rule the lexical leg documents.
  repeated GeoFilter geo_filters = 6;
  // Compiled filter tree (see FilterExpr), ANDed with `geo_filters`
  // when both are set. Absent = no filter.
  FilterExpr filter = 7;
}

// Authoritative abandon request for a streaming scan. The coordinator may
// send a typed UDP CANCEL first to reduce reaction latency, but this gRPC
// message defines the protocol action. A stopped scan returns
// `StreamSearchSummary.completed = false`.
message StopStreamSearch {}

// One message on the shard-to-client leg of `StreamSearch`.
message StreamSearchResponse {
  oneof payload {
    // Candidates from one calibration block.
    StreamSearchBatch batch = 1;
    // Terminal message: exactly one per stream; the server closes the
    // stream after it.
    StreamSearchSummary summary = 2;
  }
}

// Every candidate of one calibration block scoring at or above the
// floor in effect when the block was scored, as PACKED fixed-stride
// records rather than per-hit messages: streaming volume concentrates
// in the pre-floor blocks, and a single byte blob is one pack pass on
// the node (fused into the slot-to-global-id rebase it does anyway)
// and one stride walk at the coordinator — no per-hit protobuf
// encode/decode, no per-hit allocation, and 12 bytes per record on
// the wire instead of ~18.
//
// Record stride: 12 bytes, little-endian, `hits.len() % 12 == 0`:
//   u64 global vector id (shard slot offset + local slot)
//   f32 score
// When the stream's `StartStreamSearch.collapse_parents` is true the
// stride is 20 bytes (`hits.len() % 20 == 0`) with a third field:
//   u64 parent id (lineage parent_id, or high-bit-tagged global id)
// Records are score-descending within a batch. Empty batches are never
// sent.
message StreamSearchBatch {
  bytes hits = 1;
}

// What the scan did; terminal message of a `StreamSearch` stream.
message StreamSearchSummary {
  // Node-issued exactness certificate. True only when the node's engine
  // completed the scan: for this query, every live slot scoring at or above
  // the floor in effect when its block was scored was emitted. Today that
  // means traversing every logical chunk. A future node may also certify that
  // a bound over every unvisited block is strictly below the inclusive floor.
  // A coordinator cannot manufacture this value; StopStreamSearch, UDP
  // CANCEL, or a broken client connection produces false.
  bool completed = 1;
  // Candidates emitted across all batches.
  uint64 emitted = 2;
  // Calibration blocks scored.
  uint64 blocks_scanned = 3;
  // Floor raises that took effect between blocks.
  uint64 floor_raises_applied = 4;
  // Whether this shard's geo table has each requested filter's column,
  // parallel to the request's `geo_filters` (empty when none were
  // sent), and whether it can resolve each leaf of the request's
  // `filter` in `walk_leaves` order (empty when none was sent). The
  // coordinator refuses a column NO shard knows: filtering on a typo
  // would otherwise read as an honest empty result set.
  repeated bool geo_columns_known = 5;
  repeated bool filter_columns_known = 6;
  // Provider score-space identity for this exact generation. Every shard in
  // one successful stream must report the same non-empty fingerprint.
  string scoring_fingerprint = 7;
}

enum VectorScoreDirection {
  VECTOR_SCORE_DIRECTION_UNSPECIFIED = 0;
  VECTOR_SCORE_DIRECTION_HIGHER_IS_BETTER = 1;
  VECTOR_SCORE_DIRECTION_LOWER_IS_BETTER = 2;
}

enum VectorQualityContract {
  VECTOR_QUALITY_CONTRACT_UNSPECIFIED = 0;
  VECTOR_QUALITY_CONTRACT_EXHAUSTIVE_NATIVE_SCORE = 1;
  VECTOR_QUALITY_CONTRACT_CONFIGURED_ANN = 2;
  VECTOR_QUALITY_CONTRACT_PROBABILISTIC_BOUND = 3;
}

message VectorBackendConfig {
  string backend_kind = 1;
  string config_format = 2;
  bytes payload = 3;
}

message VectorBackendDescriptor {
  string backend_kind = 1;
  string backend_version = 2;
  uint32 dim = 3;
  uint32 bits_per_dimension = 4;
  string metric = 5;
  VectorScoreDirection score_direction = 6;
  string scoring_fingerprint = 7;
  VectorQualityContract quality_contract = 8;
  repeated string capabilities = 9;
}

message GetVectorBackendRequest {}

message GetVectorBackendResponse {
  VectorBackendDescriptor descriptor = 1;
  VectorBackendConfig config = 2;
  uint64 num_vectors = 3;
}

message ConfigureVectorBackendRequest {
  uint32 dim = 1;
  VectorBackendConfig config = 2;
}

message ConfigureVectorBackendResponse {
  bool already_configured = 1;
}

// Empty: the node reports whatever its loaded index holds.
message GetCalibrationRequest {}

// The shard index's shape and TQ+ calibration.
message GetCalibrationResponse {
  // Vector dimensionality the index was built with.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Number of vectors in this shard.
  uint64 num_vectors = 3;
  // Per-coordinate calibration shift (length `dim`). Absent when the index
  // has no locked calibration (never added to and not seeded).
  repeated float shift = 4;
  // Per-coordinate calibration scale (length `dim`); same presence rule as
  // `shift`.
  repeated float scale = 5;
}

// Pushes a TQ+ calibration to a shard (see `NodeService.SetCalibration`).
message SetCalibrationRequest {
  // Vector dimensionality the shard index must have.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Per-coordinate calibration shift (length `dim`).
  repeated float shift = 3;
  // Per-coordinate calibration scale (length `dim`); every entry > 0.
  repeated float scale = 4;
}

// Result of a `SetCalibration` call.
message SetCalibrationResponse {
  // True when the pushed calibration was already locked on this shard
  // (idempotent retry); false when this call locked it.
  bool already_seeded = 1;
}

// One batch on the `AddVectors` stream.
message AddVectorsRequest {
  // Flat row-major batch: `vectors.len()` must be a multiple of the shard
  // dim. Every coordinate must be finite and |value| < 1e16 (turbovec's
  // input rule).
  repeated float vectors = 1;
  // Optional explicit dim. 0 means "use the shard's known dim" (from its
  // index or seeded calibration). Required when the shard has no index
  // and no seeded calibration yet; rejected if it disagrees with a known
  // dim.
  uint32 dim = 2;
}

// Terminal response of an `AddVectors` stream.
message AddVectorsResponse {
  // Vectors added over this stream.
  uint64 added = 1;
  // Total vectors in the shard after the stream.
  uint64 total = 2;
  // Global id assigned to the first vector of this stream
  // (`slot_offset + shard count before the stream`). Ids are contiguous
  // per shard in ingestion order.
  uint64 first_id = 3;
  // The WAL generation the batch was logged in (0 on an unlogged
  // shard). Positional ids are scoped to it: a compaction or snapshot
  // install renumbers the rows, and id-addressed mutations may claim
  // the generation they were issued under (docs/mutations.md).
  uint64 wal_generation = 4;
}

// Empty: flush whatever the shard holds.
message FlushRequest {}

// Result of a `Flush` call.
message FlushResponse {
  // Path the index was written to (empty when `written` is false).
  string path = 1;
  // Vectors in the flushed index.
  uint64 num_vectors = 2;
  // False when the shard has no persistence path configured (flush is then
  // a no-op, not an error — a purely in-memory shard is a legitimate
  // configuration).
  bool written = 3;
  // Documents in the flushed BM25 postings store (0 when the shard has no
  // postings).
  uint64 num_documents = 4;
}

// One message on the `InstallSnapshot` stream. The first message MUST be
// `manifest`; `data` chunks follow in any chunking.
message SnapshotChunk {
  oneof payload {
    // Declares the byte split between the generation files. Everything
    // else about the shard (dim, bit width, vector count, calibration)
    // is read from the image itself — the file is the source of truth.
    SnapshotManifest manifest = 1;
    // Opaque image bytes: provider image first, then exact FP32 vectors,
    // BM25, and the live-row overlay. Senders should keep chunks around 1 MiB.
    bytes data = 2;
    // The first frame of a `StreamSnapshot` stream: the repository
    // manifest (docs/snapshots.md). `data` frames then carry each
    // artifact's bytes in `artifacts` order. Never the first frame of an
    // `InstallSnapshot` client stream, which refuses it.
    SnapshotRepositoryManifest repository = 3;
  }
}

// The byte layout of an `InstallSnapshot` stream.
message SnapshotManifest {
  // Total provider image bytes on the stream. Required (nonzero).
  uint64 vector_bytes = 1;
  // Total .bm25 bytes following the provider bytes; 0 for a vector-only image.
  uint64 bm25_bytes = 2;
  // Total product-owned FP32 sidecar bytes between provider and BM25 bytes.
  // 0 is accepted for legacy/native-only generations; FP32 rerank then
  // refuses until that generation is rebuilt or backfilled.
  uint64 exact_vector_bytes = 3;
  // Tombstone overlay after BM25 bytes. Zero means all rows are live.
  uint64 live_docs_bytes = 4;
}

// Result of an `InstallSnapshot` call.
message InstallSnapshotResponse {
  // The installed index file (inside the shard's generation directory;
  // the catalog root for a segment-layout install).
  string path = 1;
  // Vectors in the installed index.
  uint64 num_vectors = 2;
  // Documents in the installed BM25 sidecar (0 when none was sent).
  uint64 num_documents = 3;
  // The repository manifest the image was installed from: set by
  // InstallSnapshotFrom (its WAL cutoff is where catch-up resumes),
  // absent on the InstallSnapshot client stream.
  SnapshotRepositoryManifest manifest = 4;
}

// One artifact of a snapshot repository (docs/snapshots.md).
message SnapshotArtifact {
  // Path relative to the repository directory (`vector.index`,
  // `vectors.f32`, `documents.bm25`, `live-docs.bin`, or
  // `catalog/...` for the segment layout).
  string file = 1;
  uint64 bytes = 2;
  // Lower-case hex SHA-256 of the file's bytes.
  string sha256 = 3;
}

// The `snapshot-manifest.json` of a repository, as ExportSnapshot writes
// it and StreamSnapshot's first frame carries it (docs/snapshots.md).
message SnapshotRepositoryManifest {
  uint32 format_version = 1;
  // `single-image` or `segments`: the layout the artifacts form.
  string layout = 2;
  // The provider descriptor the image scores under.
  string backend_kind = 3;
  string scoring_fingerprint = 4;
  uint32 dim = 5;
  // The exporting shard's global id base and collection: an install
  // refuses a shard whose own values differ.
  uint64 slot_offset = 6;
  string collection = 7;
  // Row counts of the exported generation.
  uint64 vector_rows = 8;
  uint64 document_rows = 9;
  uint64 live_rows = 10;
  // Per-BM25-field analysis fingerprints, in field-table order.
  repeated uint64 analysis_fingerprints = 11;
  // The WAL cutoff the image contains: every record at or before
  // `wal_high_watermark` of `wal_generation` is in the artifacts, so
  // replication catch-up resumes from exactly this clock. Zero with
  // `wal_clocked=false` when the shard has no catch-up-capable WAL.
  uint64 wal_generation = 12;
  uint64 wal_high_watermark = 13;
  bool wal_clocked = 14;
  repeated SnapshotArtifact artifacts = 15;
}

message ExportSnapshotRequest {
  // The repository directory to write. Created when missing; refused
  // when it holds anything.
  string directory = 1;
}

message ExportSnapshotResponse {
  SnapshotRepositoryManifest manifest = 1;
  // The manifest file written, and the SHA-256 of its bytes (what
  // `InstallSnapshotFromRequest.expected_manifest_sha256` pins).
  string manifest_path = 2;
  string manifest_sha256 = 3;
  // Wall-clock milliseconds the copy held the shard's read lock: the
  // time writes waited.
  uint64 copy_millis = 4;
  // Bytes copied.
  uint64 bytes = 5;
}

message StreamSnapshotRequest {}

message InstallSnapshotFromRequest {
  oneof source {
    // A repository directory written by ExportSnapshot, readable by the
    // node (a NAS path).
    string directory = 1;
    // An HTTP(S) URL serving such a directory: the node GETs
    // `<url>/snapshot-manifest.json` and each artifact, resuming an
    // interrupted artifact with a `Range` request.
    string url = 2;
    // Another node's address: the node pulls its StreamSnapshot.
    string peer_addr = 3;
  }
  // When non-empty, the lower-case hex SHA-256 the fetched manifest's
  // bytes must have; a different digest refuses by name.
  string expected_manifest_sha256 = 4;
  // Sent as `Authorization: Bearer <token>` on every request of the
  // `url` source; ignored by the other sources.
  string bearer_token = 5;
}

// Client-facing search request.
message SearchRequest {
  // Optional caller id for log correlation; the coordinator assigns one
  // when empty and echoes it back.
  string request_id = 1;
  // Number of global top hits to return. Optional: 0 (proto3 unset)
  // selects the coordinator's configured `max_k` (default 10000, its heap
  // guardrail); a value above `max_k` is refused, never clamped. Streaming
  // nodes never receive either value.
  uint32 k = 2;
  // The query vector. Length must equal the shard dimension.
  repeated float vector = 3;
  // Collapse by parent document (Lucene-style field collapsing): k
  // means k distinct parents, each hit is a parent's best chunk and
  // carries `parent_id`. See StartShardSearch.collapse_parents.
  bool collapse_parents = 4;
  // Geo filters (docs/geo-columns.md), forwarded verbatim to every
  // shard and applied to the vector scan as a slot allowlist before
  // the kernel scores anything (docs/vector-filters.md). ALL filters
  // must pass (AND semantics), and they AND with `filter`.
  repeated GeoFilter geo_filters = 5;
  // Filter expression in CEL surface syntax (docs/cel-filters.md),
  // compiled ONCE at the coordinator into the FilterExpr IR and
  // resolved per shard. Empty = no filter. A syntax error, an
  // unsupported construct, or a column no shard knows is refused by
  // name; a filter is never reinterpreted into something that runs.
  string filter = 6;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 7;
}

// Client-facing search response.
message SearchResponse {
  // Echoes `SearchRequest.request_id` (or the assigned one).
  string request_id = 1;
  // Global top-k: score descending, ties broken by stable vector id. Fewer
  // than k entries when the whole corpus holds fewer than k vectors.
  repeated ScoredHit hits = 2;
  // Document-mode only (`collapse_parents` on a coordinator running the
  // streaming path): one group per returned parent, parallel to `hits`
  // (hits[i] is groups[i]'s best chunk). Each group holds EVERY chunk
  // of that parent scoring at or above `chunk_floor`, across all
  // shards — the cross-shard chunk retrieval that collapse-only Search
  // does not do. Empty on every other path.
  repeated ParentGroup groups = 3;
  // Document-mode only: the completeness bound on `groups` — one f32
  // ULP below the k-th best parent score when k distinct parents were
  // found, -inf otherwise (fewer than k parents exist, so no floor ever
  // rose and every chunk of every parent is present). Score-defined and
  // layout-invariant: the same corpus in any shard layout yields the
  // same groups.
  float chunk_floor = 4;
}

// One parent document's chunks in a document-mode search response.
message ParentGroup {
  // The parent (lineage parent_id, or a high-bit-tagged global id for
  // chunks ingested without lineage).
  uint64 parent_id = 1;
  // Every emitted chunk of this parent scoring at or above
  // `SearchResponse.chunk_floor`: score descending, ties by vector id.
  // chunks[0] is the parent's best chunk, the representative in `hits`.
  repeated ScoredHit chunks = 2;
}

// Passthrough for the analysis sidecar's pipeline options (vendored proto
// ai.pipestream.opennlp.analysis.v1). Values are the NUMERIC values of the
// sidecar's enums; 0 always means "sidecar default". Mirroring the enums
// here would just duplicate the vendored definitions.
message AnalysisSpec {
  // AnalysisOptions.Tokenizer value (1 = WHITESPACE, 2 = SIMPLE).
  int32 tokenizer = 1;
  // AnalysisOptions.Stemmer value (1 = NONE, 2 = PORTER, ...). Required to
  // be non-NONE when term_vector_source selects stems.
  int32 stemmer = 2;
  // TermVectorOptions.Mode value (1 = FULL with offsets, 2 = SCORING_ONLY).
  int32 term_vector_mode = 3;
  // TermVectorOptions.Source value (1 = TOKENS, 2 = STEMS). Ingest and
  // query MUST use the same source or term identities will not match.
  int32 term_vector_source = 4;
  // Character filters applied before tokenization, in order, defining
  // term identity (IGNORED when source is STEMS). "Char filter" is
  // Lucene's name for this stage and OpenNLP implements them as
  // CharSequenceNormalizer; the sidecar's wire enum spells them
  // TermVectorOptions.NormalizerStep, whose values these are.
  repeated int32 char_filters = 5;
}

// Lineage for one ingested document: where it came from in the source
// corpus. Optional and purely additive; documents ingested without it
// behave exactly as before.
message DocLineage {
  // The row's PARENT document key: the identity chunks of one source
  // document share, and the key `collapse_parents` groups by. Domain
  // pipelines map their own ids here (the court examples put the
  // opinion id); mapped chunk ingest puts the REDUCED document id.
  // Field numbers are the wire contract; this field was once named
  // opinion_id.
  uint64 parent_id = 1;
  // An optional higher-level grouping key above the parent (the court
  // examples put the cluster id). The engine stores and returns it;
  // nothing scores or groups by it today. Once named cluster_id.
  uint64 group_id = 2;
  // Chunk span start in original-text (char) coordinates.
  uint32 span_start = 3;
  // Chunk span end (exclusive).
  uint32 span_end = 4;
}

// One additional indexed field of a document (docs/multi-field.md). The
// body stays the top-level `text` + `analysis` pair; entries here index
// under their named field with their own analysis. Field values are
// indexed-only (scoring structures); the stored text remains the body.
message DocumentField {
  // Field name; must exist in the shard's field table (--bm25-fields),
  // must not be "body" (the body is the top-level text), and must not
  // repeat within one document. Unknown names are INVALID_ARGUMENT.
  string field = 1;
  // Raw field text. Non-empty, same cap as the body.
  string text = 2;
  // Analysis options for this field (a field's terms share identity
  // with queries analyzed under the same spec). Absent = sidecar
  // defaults, same rule as the body.
  AnalysisSpec analysis = 3;
}

// One facet value of a document: a single string value for one declared
// facet field ("court" -> "scotus"). Facet values are NOT analyzed —
// they are opaque identifiers counted exactly as sent — and land in the
// shard's dictionary-encoded facet column, not in postings.
message FacetValue {
  // Facet field name; must exist in the shard's facet field table
  // (--facet-fields) and must not repeat within one document. Unknown
  // names are INVALID_ARGUMENT — the same typo protection as
  // DocumentField.field.
  string field = 1;
  // The value. Non-empty; a document without a value for a facet field
  // simply omits the entry and is counted under no value.
  string value = 2;
}

// One numeric value of a document: a single f64 for one declared
// numeric field ("decision_date" -> 15706, epoch days). Values land in
// the shard's f64 column (docs/score-functions.md), never in postings.
// Non-finite values are INVALID_ARGUMENT: NaN is the column's absence
// sentinel and infinities break the score-function bound algebra.
message NumericValue {
  // Numeric field name; must exist in the shard's numeric field table
  // (--numeric-fields) and must not repeat within one document.
  // Unknown names are INVALID_ARGUMENT.
  string field = 1;
  // The value. A document without a value for a numeric field simply
  // omits the entry and passes through every score stage unchanged.
  double value = 2;
}

// One integer value of a document: a single i64 for one declared
// integer field ("citations" -> 4103). Values land in the shard's i64
// column (docs/range-facets.md), never in postings. An f64 column
// cannot hold these: past 2^53 it silently rounds, and this engine
// argues from exactness, so integers get a true i64 kind.
message IntegerValue {
  // Integer field name; must exist in the shard's integer field table
  // (--integer-fields) and must not repeat within one document (nor
  // across `integers` and `timestamps`, which target the same
  // columns). Unknown names are INVALID_ARGUMENT.
  string field = 1;
  // The value. INT64_MIN is INVALID_ARGUMENT: it is the column's
  // absence sentinel, so a document cannot hold it. A document without
  // a value for an integer field simply omits the entry.
  sint64 value = 2;
}

// One timestamp value of a document. Pure ingest sugar over
// IntegerValue: the NODE converts the instant to EPOCH MICROSECONDS
// and stores it in the named i64 column, so range facets and score
// stages over the column work in epoch micros and nothing downstream
// knows about timestamps. i64 micros spans roughly year -290307 to
// +294247, which covers every court date by a wide margin.
//
// Sub-microsecond precision is NOT representable and is dropped: the
// conversion floors toward negative infinity (nanos are always >= 0 in
// a valid Timestamp, so it is a plain truncation of the remainder). A
// producer that needs nanosecond identity must send an IntegerValue of
// its own and own the unit. The WAL persists this request verbatim, so
// replay reproduces the same conversion from the same instant.
message TimestampValue {
  // Integer field name; must exist in the shard's integer field table
  // (--integer-fields), the same table `integers` names. A field
  // valued by both `integers` and `timestamps` in one document is
  // INVALID_ARGUMENT — a document holds one value per column.
  string field = 1;
  // The instant. Refused when the epoch-micros conversion overflows
  // i64 or lands exactly on INT64_MIN (the absence sentinel).
  google.protobuf.Timestamp value = 2;
}

// One geo point of a document: a (lat, lon) pair for one declared geo
// field ("courthouse" -> 38.8904, -77.0090). Values land in the
// shard's geo-point column (kind 5, docs/geo-columns.md) as a 16-byte
// fixed-stride pair, never in postings. Coordinates are first-class so
// that bbox and radius FILTERS and distance-decay score stages can read
// them exactly, and so a routing enrichment sidecar
// (docs/plans/routing-enrichment.md) has a place to read from.
message GeoPointValue {
  // Geo field name; must exist in the shard's geo field table
  // (--geo-fields) and must not repeat within one document. Unknown
  // names are INVALID_ARGUMENT.
  string field = 1;
  // Latitude in DEGREES, finite and within [-90, 90]. Anything else is
  // INVALID_ARGUMENT: a coordinate off the globe is a producer bug, and
  // NaN is half of the column's absence sentinel.
  double lat = 2;
  // Longitude in DEGREES, finite and within [-180, 180]. Same rules.
  double lon = 3;
}

// One map-facet entry of a document: a single string value under a
// string key in one declared map<string, string> column
// (docs/map-columns.md). Keys and values are opaque — never analyzed —
// and land in the column's dictionaries; the map is ONE column no
// matter how many distinct keys the corpus carries, which is the
// structural answer to the field-per-key explosion flattening causes.
message MapFacetEntry {
  // Map column name; must exist in the shard's map-facet table
  // (--map-facet-fields). Unknown names are INVALID_ARGUMENT.
  string field = 1;
  // The entry's key. Non-empty (an empty key is almost always a
  // producer bug; a document without an entry simply omits it). At
  // most one value per (document, field, key) — map semantics.
  string key = 2;
  // The value. Non-empty, exact identity.
  string value = 3;
}

// One map-numeric entry of a document: a single f64 under a string key
// in one declared map<string, f64> column. Same rules as
// MapFacetEntry; values must be finite (there is no NaN sentinel in
// map pairs — absence is the key simply not being present — and
// infinities break the score-function bound algebra).
message MapNumericEntry {
  // Map column name; must exist in the shard's map-numeric table
  // (--map-numeric-fields).
  string field = 1;
  // The entry's key. Non-empty; at most one per (document, field, key).
  string key = 2;
  // The value. Finite.
  double value = 3;
}

// One document on the `AddDocuments` stream.
message AddDocumentsRequest {
  // Raw document text. Non-empty, at most 1 MiB (the sidecar's cap).
  string text = 1;
  // Analysis options for this document. Absent = sidecar defaults with
  // term vectors in MODE_FULL over TOKENS.
  AnalysisSpec analysis = 2;
  // Optional lineage, stored in the doc store and returned by
  // GetDocuments.
  DocLineage lineage = 3;
  // Additional indexed fields (docs/multi-field.md). Empty = body-only,
  // exactly the pre-multi-field document. This message is the WAL's
  // durable record, so old logs replay as body-only automatically and
  // reshard replay is the field-migration lever.
  repeated DocumentField fields = 4;
  // Facet values for this document, one entry per declared facet field
  // the document has a value for. Rides the same durable-record lever
  // as `fields`: old WAL logs replay facet-less, and reshard replay is
  // how an existing corpus grows facet columns.
  repeated FacetValue facets = 5;
  // Numeric values for this document, one entry per declared numeric
  // field it has a value for. Same durable-record lever as `facets`.
  repeated NumericValue numerics = 6;
  // Map-facet entries for this document (docs/map-columns.md). Same
  // durable-record lever: old WAL logs replay map-less, reshard replay
  // is how an existing corpus grows map columns.
  repeated MapFacetEntry map_facets = 7;
  // Map-numeric entries for this document. Same lever.
  repeated MapNumericEntry map_numerics = 8;
  // Integer values for this document, one entry per declared integer
  // field it has a value for. Same durable-record lever as `facets`.
  repeated IntegerValue integers = 9;
  // Timestamp values for this document: sugar over `integers`, stored
  // as epoch micros in the SAME i64 columns (see TimestampValue). Same
  // durable-record lever, and replay redoes the conversion.
  repeated TimestampValue timestamps = 10;
  // Geo points for this document, one entry per declared geo field it
  // has a value for (docs/geo-columns.md). Same durable-record lever:
  // the WAL keeps the request verbatim, so durability and reshard
  // replay come free.
  repeated GeoPointValue geo_points = 11;
  // Ingest-time quality annotation (docs/quality-columns.md). When set,
  // the node asks the sidecar for its noise and artifact layers in the
  // SAME analysis pass that produces this document's terms, derives one
  // scalar per named column, and appends them to `numerics` /
  // `integers` before applying. Two consequences follow from that
  // "append, then take the ordinary path" shape: the columns are
  // ordinary columns, so filters, facets, and score chains read them
  // with no new machinery and no new bounds math; and the WAL record
  // carries the DERIVED values with the spec cleared, so replay
  // reproduces them exactly without calling the sidecar again.
  //
  // The spec must be constant for a stream, like `analysis`: a change
  // mid-stream reopens the analysis session, since the layers are
  // requested in the session's options message.
  //
  // These layers are NOT part of `analysis` and do not enter the
  // analysis fingerprint. The fingerprint pins TERM IDENTITY; noise
  // scoring does not change a single term, and folding it in would
  // invalidate every shard ever built for a change that cannot affect
  // what matches.
  QualitySpec quality = 12;
  // Ingest-time geography annotation (docs/geography-columns.md). When
  // set, the node asks the sidecar to geocode location mentions in the
  // SAME analysis pass that produces this document's terms, reduces
  // the layer to one point / one country / one confidence, and appends
  // them to `geo_points` / `facets` / `numerics` before applying —
  // the same materialize-then-take-the-ordinary-path shape as
  // `quality`, with the same two consequences (ordinary columns;
  // replay-exact WAL records with the spec cleared).
  //
  // Unlike quality, ABSENCE is a legitimate measurement here: a
  // document that mentions no resolvable place writes NO point (there
  // is no neutral coordinate — (0,0) is a real place in the Gulf of
  // Guinea), so geo filters skip it and CEL over its columns reads
  // UNKNOWN, per the documented absence rules.
  //
  // Requires the sidecar to serve the entity layer: a session that
  // asks for geography preflights `GetCapabilities.ner_available` and
  // REFUSES when no NER model is configured, because the sidecar's own
  // contract on that state (empty layers plus a free-form warning) is
  // indistinguishable from "no locations found" and would silently
  // ingest an entire corpus as place-less.
  GeographySpec geography = 13;

  // Ingest-time materialization (docs/cel-values.md): derived columns
  // computed from THIS document's own values, once, here at ingest,
  // stored as ordinary typed columns. Filters, facets, score chains,
  // and projections over them need no new machinery. Like the quality
  // and geography specs, this is materialize-then-ordinary-path: the
  // WAL logs the document with the derived values already in its
  // numerics/integers lists and this spec cleared, so replay never
  // re-evaluates. A change to this spec mid-session is a session
  // property change, applied from the next document on.
  MaterializeSpec materialize = 14;
  // Derived glossary phrase postings. Fresh client ingest leaves this empty;
  // a configured node derives it from `text` before applying and writes the
  // populated values to the WAL. Replay therefore preserves exact posting
  // identities and original UTF-16 spans without needing the source glossary.
  repeated PhrasePosting phrases = 15;
  // Fingerprint of the glossary that produced `phrases`. Non-zero whenever
  // phrases are populated and enforced against the configured vocabulary.
  uint64 phrase_fingerprint = 16;
  // Phrase field identity persists even when this document has no glossary
  // matches, allowing WAL resharding to reconstruct an empty phrase column.
  string phrase_field = 17;
  // The proximity record (docs/phrase-proximity.md): which BM25 fields
  // keep token positions for this document. Fresh client ingest leaves
  // it empty and the node fills it from its configuration before the
  // WAL append; a replayed record must name the same fields the node is
  // configured with, or it is refused by name. Ordinals themselves are
  // not stored here: replay re-analyzes under the fingerprinted spec
  // and the same tokenizer numbers the same tokens.
  repeated string position_fields = 18;
  // Which bigram columns derive from which source fields. Same fill and
  // agreement rules as `position_fields`; resharding rebuilds the derived
  // field table from this record.
  repeated BigramField bigram_fields = 19;
  // Fields whose sentence spans this document's node stores
  // (docs/highlighting.md). Filled by the node from --sentence-fields
  // before the document is logged, so a replay stores the same spans; a
  // replay on a node with a different setting refuses by name.
  repeated string sentence_fields = 20;
  // The collection this document belongs to (docs/collections.md). A
  // node serves only one collection: a name other than the node's
  // refuses, and an empty name is written with the node's before the
  // document is logged, so a replay carries it.
  string collection = 21;
  // The declared BM25 field that receives the body's CASED term identity
  // from the same analysis pass (docs/dual-cased.md): the same tokens under
  // the body's chain minus case folding, so occurrence spans and token
  // ordinals coincide with the body's, and no second analysis runs. The
  // field must be in the shard's field table, must not be "body", and must
  // not also appear in `fields`; the body's analysis must be an explicit
  // spec with a step-chain source (SOURCE_STEMS has no folded form). The
  // sidecar must advertise GetCapabilities.dual_term_identity_available, or
  // ingest refuses by name. The field's fingerprint is the twin spec's.
  string cased_field = 22;
  // Original producer bytes associated with this row. Mapped ingest fills
  // this before the ordinary WAL/apply path. Storage interns shared sources
  // and descriptors; these bytes are not a searchable column.
  ProtobufSource original_source = 23;
  // Present for a chunk row, including ordinal zero. It is independent of
  // the generation-local physical row id.
  optional uint32 source_chunk_ordinal = 24;
}

// One canonical concept posting derived from a glossary match. Aliases share
// `term`; repeated occurrences share one posting with multiple offsets.
message PhrasePosting {
  string term = 1;
  string concept_id = 2;
  uint32 token_count = 3;
  repeated OffsetSpan offsets = 4;
  // Dedicated BM25 field that owns this posting. Persisted so generic WAL
  // resharding can rebuild the field without loading the source glossary.
  string field = 5;
}

// Which quality columns to derive from the sidecar's model-free noise
// and artifact layers (docs/quality-columns.md). Every column named
// must already be declared on the node (--numeric-fields /
// --integer-fields); an unknown name is refused like any other. A
// column left empty is not written at all, so a caller pays only for
// what it asks for.
message QualitySpec {
  // f64 column receiving the WORST noise score over the document's
  // findings — the sidecar scores each finding in (0, 1], higher is
  // noisier — or exactly 0.0 when it found none. Bounded in [0, 1] by
  // construction, which is what makes it a drop-in for
  // SCORE_OP_MULT_EXP_DECAY with origin 0 (score *= exp(-noise/scale),
  // a quality decay whose multiplier lies in (0, 1], so the stage is
  // monotone and its bound lift is identity — no new bounds math).
  string noise_column = 1;
  // i64 column receiving the number of characters the document's noise
  // findings cover: the length of their UNION, so overlapping findings
  // are counted once. Exact and denominator-free; a caller that wants
  // a fraction divides by a length it knows.
  string noise_chars_column = 2;
  // i64 column receiving the number of flagged text artifacts
  // (replacement characters, control characters, mojibake, unpaired
  // surrogates, and the like). Detection only flags; nothing in the
  // stored text is modified.
  string artifact_column = 3;
}

// Which geography columns to derive from the sidecar's geocoding layer
// (docs/geography-columns.md). Every column named must already be
// declared on the node (--geo-fields / --facet-fields /
// --numeric-fields); an unknown name is refused like any other. A
// column left empty is not written at all.
message GeographySpec {
  // GEO-POINT column receiving the document's best resolved location:
  // the highest-confidence `GeoLocation`, ties broken by text order
  // (first mention wins). Not written when the document has no
  // resolved locations.
  string point_column = 1;
  // Facet column receiving the top `RegionVote`'s ISO country code —
  // the country the document's location evidence points at, by share.
  // Not written when there are no votes.
  string country_column = 2;
  // f64 column receiving the chosen location's resolution confidence
  // in [0, 1]. Not written when there is no chosen location, so a
  // confidence threshold filter (`geo_confidence >= 0.7`) reads
  // UNKNOWN — not "confidently nowhere" — on place-less documents.
  string confidence_column = 3;
}

// Terminal response of an `AddDocuments` stream.
message AddDocumentsResponse {
  // Documents ingested over this stream.
  uint64 added = 1;
  // Total documents in the shard's postings after the stream.
  uint64 total = 2;
  // Global doc id assigned to the first document of this stream.
  uint64 first_id = 3;
  // The WAL generation the documents were logged in; see
  // AddVectorsResponse.wal_generation.
  uint64 wal_generation = 4;
}

message DeleteDocumentsRequest {
  repeated uint64 doc_ids = 1;
  // The WAL generation `doc_ids` were issued under (an ingest
  // response's wal_generation); absent claims nothing. A compaction or
  // snapshot install renumbers the shard's rows, so a claim that names
  // another generation is refused with FAILED_PRECONDITION rather than
  // applied to whatever rows now carry those ids (docs/mutations.md).
  // Presence, not zero: generation 0 is a generation like any other.
  optional uint64 expected_wal_generation = 2;
}

message DeleteDocumentsResponse {
  uint64 deleted = 1;
  uint64 already_deleted = 2;
  uint64 live_revision = 3;
  // The WAL generation the tombstones were logged in.
  uint64 wal_generation = 4;
}

message Replacement {
  uint64 old_doc_id = 1;
  uint64 new_doc_id = 2;
}

message CommitReplacementsRequest {
  repeated Replacement replacements = 1;
  // The WAL generation the ids were issued under; absent claims
  // nothing. See DeleteDocumentsRequest.expected_wal_generation.
  optional uint64 expected_wal_generation = 2;
}

message CommitReplacementsResponse {
  uint64 committed = 1;
  uint64 already_committed = 2;
  uint64 live_revision = 3;
  // The WAL generation the retirements were logged in.
  uint64 wal_generation = 4;
}

// One field's query terms in a multi-field TermStats request.
message FieldTerms {
  // Field name ("body" for field 0).
  string field = 1;
  // Query terms under THIS field's analysis (term identity is per
  // field).
  repeated string terms = 2;
}

// Phase (b) of the distributed BM25 flow: stats for these query terms.
message TermStatsRequest {
  // Query terms against the body field (exact identity: stems when
  // ingest used SOURCE_STEMS).
  repeated string terms = 1;
  // Additional per-field term lists (multi-field queries,
  // docs/multi-field.md). A shard without a named field answers zeros
  // for it — that IS its share of the global stats.
  repeated FieldTerms fields = 2;
}

// One field's share of the global stats (multi-field queries).
message FieldStats {
  // Sum of THIS field's document lengths over the shard (avgdl_f
  // numerator).
  uint64 total_doc_length = 1;
  // Document frequency per requested term, parallel to the request
  // entry's `terms`.
  repeated uint32 doc_frequencies = 2;
  // Whether this shard's field table contains the named field at all.
  //
  // The zeros above cannot answer that on their own: an empty shard, a
  // shard whose documents simply never filled the field, and a shard
  // that has never heard of the field are indistinguishable in them.
  // The difference matters because one of those is a typo in the query,
  // and scoring a misspelled field as "contributes nothing" returns a
  // confidently wrong ranking instead of an error. The coordinator
  // refuses a field NO shard knows, and tolerates one that only some
  // know (a genuinely heterogeneous fleet).
  bool known = 3;
  // Whether this shard's field carries token positions
  // (docs/phrase-proximity.md). The coordinator serves a positional
  // phrase on a field only when EVERY shard answers true; a mixed fleet
  // refuses rather than matching the phrase on half the corpus.
  bool positions = 4;
  // Whether this shard stores sentence spans for the field
  // (docs/highlighting.md).
  bool sentences = 5;
}

// This shard's share of the global BM25 corpus stats.
message TermStatsResponse {
  // Documents in this shard's postings. Shared across fields (a
  // document is a document; idf's N is corpus-wide).
  uint64 doc_count = 1;
  // Sum of BODY document lengths (in terms) over the shard.
  uint64 total_doc_length = 2;
  // Body document frequency per requested term, parallel to `terms`.
  repeated uint32 doc_frequencies = 3;
  // Per-field shares, parallel to the request's `fields`.
  repeated FieldStats field_stats = 4;
  // This shard's stats epoch: a counter that advances on every mutation
  // of the shard's BM25 store (ingest, flush, load, snapshot install).
  // Everything in this response is a pure function of the store at one
  // epoch, so a caller may cache the response for as long as the shard
  // still reports the same epoch — and may ask the shard to enforce
  // that, by echoing the epoch back as `expected_stats_epoch` on a
  // scoring request. Always >= 1 (0 is reserved to mean "no claim" in
  // the echo).
  uint64 stats_epoch = 5;
}

// Phase (c) of the distributed BM25 flow: score with GLOBAL stats.
message Bm25QueryRequest {
  // Query terms (same identity as TermStatsRequest.terms).
  repeated string terms = 1;
  // Number of top hits this shard must return.
  uint32 k = 2;
  // Total documents across ALL shards.
  uint64 global_doc_count = 3;
  // Total document length across ALL shards.
  uint64 global_total_doc_length = 4;
  // Global document frequency per term (summed over shards), parallel to
  // `terms`.
  repeated uint32 global_doc_frequencies = 5;
  // BM25 k1 saturation parameter; 0 selects the default (1.2).
  float k1 = 6;
  // BM25 length-normalization parameter; 0 selects the default (0.75).
  float b = 7;
  // Seeded floor: the lexical twin of the vector leg's
  // `SearchOptions.initial_threshold`. A coordinator that already holds
  // a merged k-th best can seed the shard with it; the shard then
  // returns only hits with score >= min_score (ties at the floor
  // survive) and block-max pruning skips postings that provably cannot
  // reach it. 0 means unseeded (scores are always positive). For a
  // fused query (`fields` non-empty) the floor applies to the FUSED
  // score.
  float min_score = 8;
  // Fused multi-field query (docs/multi-field.md): when non-empty,
  // these legs REPLACE the flat single-field query — `terms`,
  // `global_total_doc_length`, `global_doc_frequencies`, `k1`, and `b`
  // are ignored; `global_doc_count`, `k`, and `min_score` still apply.
  // The body scores as the leg named "body". List order is the pinned
  // accumulation order (IEEE addition is not associative), so the
  // coordinator MUST send the same leg order to every shard for
  // bit-identical distributed scoring. A shard skips legs naming fields
  // it does not have: its documents hold no postings there, so the
  // fused scores are unchanged — the graceful path for a fleet
  // mid-migration.
  repeated Bm25FieldLeg fields = 9;
  // The stats epoch (TermStatsResponse.stats_epoch) the global stats in
  // this request were computed under, for THIS shard. When non-zero and
  // the shard's current epoch differs, the shard REFUSES with
  // FAILED_PRECONDITION rather than scoring with stats that no longer
  // describe it: a coordinator serving stats from a cache would
  // otherwise degrade silently under ingest, with no bound on how stale
  // the idf values could get. 0 means "no claim" and is never refused —
  // the pre-epoch semantics, where the stats are simply whatever the
  // coordinator fetched moments before.
  uint64 expected_stats_epoch = 10;
  // Facet fields to count over the match set (count-then-rank,
  // docs/plans/track-1-features.md section 2): every document matching
  // at least one query term AND passing every filter (`geo_filters`
  // and `filter`) is counted, independent of `k` and `min_score` — the
  // floor bounds what is SURFACED, never what matched, while a filter
  // bounds what MATCHES. Counting walks each scored term's doc run to
  // exhaustion, so a query that asks for facets pays that traversal;
  // empty means no counting and no cost. On a fused query the match
  // set is the union over every leg's terms.
  repeated string facet_fields = 11;
  // Score-function chain (docs/score-functions.md), applied in list
  // order to each candidate's BM25 score BEFORE the floor test and
  // heap insertion: hits, `min_score`, and `kth_best` are all on the
  // FINAL scale. List order is the pinned evaluation order (IEEE math
  // is not associative), so the coordinator MUST send the same list to
  // every shard. Currently the flat single-field route only; setting
  // this with `fields` legs is refused. Empty = identity.
  repeated ScoreStage score_stages = 12;
  // Map-facet keys to count over the match set (as `facet_fields`
  // defines it, filters included; docs/map-columns.md): each entry
  // names a map column and a key,
  // counted exactly like a plain facet field — count-then-rank, one
  // ords lookup per matched document, independent of k and the floor.
  // Answered in Bm25QueryResponse.facets AFTER the plain facet
  // entries, with FacetFieldCounts.key set.
  repeated MapFacetField map_facet_fields = 13;
  // Range buckets to count over the match set (as `facet_fields`
  // defines it, filters included; docs/range-facets.md): "how many
  // results per year band". Same
  // count-then-rank pass as `facet_fields` — one shared match bitmap
  // serves all three facet kinds — so a query asking for any of them
  // pays the traversal once. Answered in
  // Bm25QueryResponse.range_facets, positionally.
  repeated RangeFacetField range_facet_fields = 14;
  // Geo filters over a geo-point column (docs/geo-columns.md). ALL
  // filters must pass (AND semantics). Applied on the node BEFORE the
  // floor test and heap insertion, in the pruned scorer and the
  // exhaustive oracle identically: a filter only REMOVES documents, so
  // every block-max bound stays a valid upper bound with no new pruning
  // math. A document without a value fails every filter — no location
  // is inside no region — which is exact, not degradation. Answered by
  // `geo_columns_known`, positionally.
  repeated GeoFilter geo_filters = 15;
  // Compiled filter tree (see FilterExpr for the full contract):
  // applied on the node BEFORE the floor test and heap insertion, in
  // the pruned scorer and the exhaustive oracle identically, ANDed
  // with `geo_filters` when both are set. The facet match set (plain,
  // map, and range) counts only documents that pass BOTH. Answered by
  // `filter_columns_known`, positionally over the tree's leaves in
  // depth-first order.
  FilterExpr filter = 16;
  // Numeric / integer columns to aggregate over the FILTERED match
  // set (docs/facets.md): per column, the count of documents holding
  // a value plus min / max / sum — all additive across shards, merged
  // like facet counts, over the same one bitmap the facet kinds share.
  // A column no shard knows is refused at the coordinator.
  repeated string stats_fields = 17;
  // Facet columns to count DISTINCT VALUES over the filtered match
  // set. Exact, not estimated: each shard reports the value strings
  // present in its match set (ordinals are shard-local, so values are
  // the only union-able currency) and the coordinator unions them.
  // The cost is proportional to the per-shard distinct counts and is
  // the caller's explicit choice — the same made-visible trade
  // count-then-rank settled on.
  repeated string cardinality_fields = 18;

  // Compiled projections, evaluated per returned hit (Bm25Hit.projected,
  // in this order). A column reference this shard's tables lack reads
  // as ABSENT for every document here — exact, this shard's documents
  // hold no such value — and resolution knowledge is reported in
  // projection_leaves_known so the coordinator can refuse a column no
  // shard knows.
  repeated CompiledProjection projections = 19;
  // Positional phrase constraint over `terms` on the flat body route;
  // same contract as Bm25FieldLeg.phrase.
  PhraseLeg phrase = 20;
  // Snippets to cut for each returned hit (docs/highlighting.md).
  HighlightSpec highlight = 21;
}

// Internal exact phrase scoring request. `phrase_leg` indexes `query.fields`.
// Its terms remain ordinary BM25 terms for idf/tf/length normalization, but a
// document receives only max(term_score * parallel weight) from that leg.
message Bm25PhraseQueryRequest {
  Bm25QueryRequest query = 1;
  uint32 phrase_leg = 2;
  repeated float phrase_term_weights = 3;
}

// One geo filter: a geo-point column plus the region a document's point
// must lie in to survive (docs/geo-columns.md).
message GeoFilter {
  // The geo-point column to read (--geo-fields). A shard whose table
  // lacks it answers known=false and contributes NO hits through this
  // filter — its documents genuinely hold no locations, so this is
  // exact — but the coordinator REFUSES a column NO shard knows, the
  // same typo rule as facets, chains, and range facets.
  string column = 1;
  // The region. Exactly one must be set; an unset region is
  // INVALID_ARGUMENT naming the column (a filter that filters nothing
  // is a request nobody meant to send).
  oneof region {
    // An axis-aligned latitude/longitude box.
    GeoBbox bbox = 2;
    // A great-circle or local-Manhattan disc.
    GeoRadius radius = 3;
  }
}

// An axis-aligned bounding box in degrees. All four edges are
// INCLUSIVE: a point exactly on a boundary is inside.
message GeoBbox {
  // Southern edge, finite, within [-90, 90], and <= max_lat.
  double min_lat = 1;
  // Northern edge, finite, within [-90, 90].
  double max_lat = 2;
  // Western edge, finite, within [-180, 180], and <= max_lon.
  // min_lon > max_lon would describe an ANTIMERIDIAN-CROSSING box; this
  // increment REFUSES that by name rather than silently reinterpreting
  // the pair as a wraparound, because the two readings differ by the
  // whole planet and only the caller knows which was meant.
  double min_lon = 3;
  // Eastern edge, finite, within [-180, 180].
  double max_lon = 4;
}

// A disc around an origin. `distance <= meters` is INSIDE (the edge
// belongs to the disc, like the bbox edges).
message GeoRadius {
  // Origin latitude, finite, within [-90, 90].
  double lat = 1;
  // Origin longitude, finite, within [-180, 180].
  double lon = 2;
  // Radius in METERS: finite and strictly greater than zero. Zero or
  // negative is INVALID_ARGUMENT naming the column.
  double meters = 3;
  // Which distance the radius measures.
  GeoMetric metric = 4;
}

// The distance function a radius filter or a decay stage measures with.
enum GeoMetric {
  // Unused zero value; refused (a filter must say what it measures).
  GEO_METRIC_UNSPECIFIED = 0;
  // Great-circle distance on a sphere of the WGS84 mean radius
  // 6371008.8 m. The general-purpose choice.
  GEO_METRIC_HAVERSINE = 1;
  // Meters along the meridian plus meters along the parallel AT THE
  // ORIGIN'S latitude — a LOCAL approximation for city-scale use, not a
  // globe-scale distance (docs/geo-columns.md).
  GEO_METRIC_MANHATTAN = 2;
}

// A compiled filter expression: the predicate IR the coordinator sends
// to every shard (docs/cel-filters.md). The public surface syntax is
// CEL (Bm25SearchRequest.filter); the coordinator parses and compiles
// it ONCE into this tree, and each shard then resolves column names
// and string values against its OWN dictionaries — ordinals are
// shard-local and never travel, and shards never see CEL text.
//
// Evaluation is three-valued (Kleene, the SQL rule): a comparison on a
// document that lacks the value is UNKNOWN; and/or/not propagate it;
// only a document whose whole tree evaluates TRUE survives. The
// presence tests (`has`, `map_has_key`) are total — TRUE or FALSE,
// never UNKNOWN — so they are the one thing an absent value can pass.
// This deliberately deviates from stock CEL, which ERRORS on a missing
// field: erroring a fleet-wide scan on its first absent value is
// unusable, and adopting proto-default zero values instead would make
// an unset string equal "" — a silent lie. The deviation is pinned in
// docs/cel-filters.md and in tests.
//
// A filter only REMOVES documents, so every block-max bound stays a
// valid upper bound with no new pruning math — the argument
// docs/score-functions.md pinned for this layer. Applied on the node
// BEFORE the floor test and heap insertion, in the pruned scorer and
// the exhaustive oracle identically; the facet match set is narrowed
// by it (all three facet kinds count only surviving documents).
//
// The typo rule guards STRUCTURE, not data: a column (or map-facet
// key) no shard knows is refused via `filter_columns_known`, but a
// VALUE the corpus never held is an honest FALSE — zero results is the
// true answer when zero documents hold the value.
message FilterExpr {
  // Exactly one must be set. An unset node is INVALID_ARGUMENT: an
  // empty filter is the `filter` field left absent, never an empty
  // node. Trees deeper than 32 nodes or holding more than 256 leaves
  // are refused (a filter is a predicate, not a program).
  oneof expr {
    // Every child must pass. Kleene AND: any FALSE child makes it
    // FALSE; otherwise any UNKNOWN child makes it UNKNOWN.
    FilterList and = 1;
    // Some child must pass. Kleene OR: any TRUE child makes it TRUE;
    // otherwise any UNKNOWN child makes it UNKNOWN.
    FilterList or = 2;
    // Kleene NOT: TRUE and FALSE swap, UNKNOWN stays UNKNOWN — a
    // document missing the value fails `!(court == "x")` exactly as it
    // fails the positive form, and `has` is the escape hatch.
    FilterExpr not = 3;
    // String equality/membership on a plain facet column.
    FacetPredicate facet = 4;
    // Range or equality on an i64 or f64 column.
    NumberPredicate number = 5;
    // String equality/membership on one key of a map-facet column.
    MapFacetPredicate map_facet = 6;
    // Range or equality on one key of a map-numeric column.
    MapNumberPredicate map_number = 7;
    // Key presence in a map column (CEL `"k" in m`).
    MapKeyPredicate map_has_key = 8;
    // Value presence under this name in ANY column family (CEL
    // `has(col)`).
    HasPredicate has = 9;
    // Geo containment: the existing filter family as a leaf, so one
    // expression can mix regions with scalar predicates.
    GeoFilter geo = 10;
    // String ordering on a facet column or one key of a map-facet
    // column (docs/prefix-terms.md): CEL `court < "b"`, `>=`, and both
    // bounds ANDed. Resolves per shard to ONE ordinal range over a
    // dictionary written in byte order; a shard whose dictionary is in
    // the older first-seen order refuses by name.
    StringRangePredicate string_range = 11;
    // Prefix on a facet column or map-facet value (CEL
    // `court.startsWith("ca")`): the ordinal range of the dictionary
    // entries sharing the prefix, same resolution and refusal rules.
    StringPrefixPredicate string_prefix = 12;
  }
}

// The children of an and/or node. At least one is required: a
// connective with nothing to connect is refused rather than resolved
// to a vacuous truth value nobody asked for.
message FilterList {
  repeated FilterExpr exprs = 1;
}

// One bound of a NumberPredicate / MapNumberPredicate range.
message FilterBound {
  // The bound's value. Exactly one must be set. Integer bounds against
  // i64 columns compare in i64 (exact); against f64 columns the
  // comparison is performed exactly across the two domains — an i64
  // bound is never rounded through f64, so a bound above 2^53 still
  // means the integer it says. Double bounds must be finite; against
  // i64 columns they are normalized to exact integer bounds
  // (ceil/floor with the exclusivity folded in), never compared in
  // float.
  oneof value {
    int64 int = 1;
    double num = 2;
  }
  // When true the bound itself is outside the range (`>` / `<` rather
  // than `>=` / `<=`).
  bool exclusive = 3;
}

// String equality/membership on a plain facet column: TRUE when the
// document's value is one of `values`, FALSE when it holds some other
// value, UNKNOWN when it holds none. Known = the shard's facet table
// has the column; the literal's TYPE picks the family, so comparing a
// number-holding column against a string refuses under the typo rule
// rather than answering an empty set.
message FacetPredicate {
  // Facet column name (--facet-fields).
  string column = 1;
  // Accepted values, at least one. One value is equality; several are
  // CEL `in`. Each value resolves against the shard's dictionary; a
  // value this shard never ingested simply matches none of its
  // documents.
  repeated string values = 2;
}

// Range or equality on an i64 column (--integer-fields) or an f64
// column (--numeric-fields), resolved in that order per shard. At
// least one bound is required (use `has` for bare presence); both with
// min > max is a legal empty range that no present value satisfies.
// Equality is min == max, both inclusive.
message NumberPredicate {
  // Column name.
  string column = 1;
  // Lower bound, absent = unbounded below.
  FilterBound min = 2;
  // Upper bound, absent = unbounded above.
  FilterBound max = 3;
}

// String equality/membership on one key of a map-facet column
// (docs/map-columns.md). Known = the column exists AND its key
// dictionary has the key — the same rule as MapFacetField counting: a
// key no shard ever ingested is drill-down structure spelled wrong.
message MapFacetPredicate {
  // Map-facet column name (--map-facet-fields).
  string column = 1;
  // The key whose value is tested.
  string key = 2;
  // Accepted values, at least one (one = equality, several = CEL `in`).
  repeated string values = 3;
}

// Range or equality on one key of a map-numeric column
// (--map-numeric-fields). Known = column AND key, like
// MapFacetPredicate; bounds as in NumberPredicate (map-numeric values
// are f64).
message MapNumberPredicate {
  // Map-numeric column name.
  string column = 1;
  // The key whose value is tested.
  string key = 2;
  // Lower bound, absent = unbounded below.
  FilterBound min = 3;
  // Upper bound, absent = unbounded above.
  FilterBound max = 4;
}

// Key presence in a map column (CEL `"k" in m`), resolved against the
// map-facet table first, then map-numeric. TOTAL: TRUE when the
// document has an entry under the key, FALSE otherwise — `"k" in {}`
// is false, not unknown, exactly as in CEL. Known = the COLUMN exists;
// the key is deliberately not part of the known handshake, because the
// key's presence is the question being asked, and refusing a key no
// shard ingested would make `!("k" in m)` unanswerable. This is the
// one deliberate departure from the map-facet counting known rule.
message MapKeyPredicate {
  // Map column name.
  string column = 1;
  // The key whose presence is tested.
  string key = 2;
}

// One bound of a StringRangePredicate: a string compared in byte order
// (the order stock CEL compares strings in, and the order every
// dictionary is written in at flush).
message StringBound {
  // The bound value; the empty string is a legal lower bound.
  string value = 1;
  // When true the bound itself is outside the range (`<` / `>`).
  bool exclusive = 2;
}

// String ordering on a facet column (`key` empty) or on one key of a
// map-facet column (`key` set): TRUE when the document's value lies in
// the range, FALSE when it holds some other value, UNKNOWN when it
// holds none. At least one bound is required. Known = the facet table
// has the column (and, for a map entry, its key dictionary has the
// key), like FacetPredicate / MapFacetPredicate.
message StringRangePredicate {
  // Column name.
  string column = 1;
  // For a map-facet column, the key whose value is tested; empty for
  // a plain facet column.
  string key = 2;
  // Lower bound, absent = unbounded below.
  StringBound min = 3;
  // Upper bound, absent = unbounded above.
  StringBound max = 4;
}

// Prefix on a facet column or map-facet value: TRUE when the
// document's value starts with `prefix`, same absence and known rules
// as StringRangePredicate. The prefix must be non-empty (an empty
// prefix is presence, which is has()).
message StringPrefixPredicate {
  // Column name.
  string column = 1;
  // For a map-facet column, the key whose value is tested; empty for
  // a plain facet column.
  string key = 2;
  // The prefix, compared in bytes.
  string prefix = 3;
}

// Value presence under a name (CEL `has(col)`): TRUE when the document
// holds a value in ANY column family of that name — facet, f64, i64,
// or geo — FALSE otherwise. TOTAL, never UNKNOWN: this is the escape
// hatch that lets a query see absence. Known = any family has the
// name. Map columns are not covered (test a key with `"k" in m`
// instead); asking `has` of a map column refuses at compile.
message HasPredicate {
  // Column name.
  string column = 1;
}

// One range-facet count request: a numeric-ish column plus the bucket
// edges to count into.
message RangeFacetField {
  // The column to read: an f64 column (--numeric-fields) or an i64
  // column (--integer-fields) when `key` is empty, resolved in that
  // order; a map<string, f64> column (--map-numeric-fields) when `key`
  // is set. i64 values are converted to double for bucketing.
  string column = 1;
  // For a map-numeric column, the key whose values are bucketed. Empty
  // selects a plain (f64 or i64) column.
  string key = 2;
  // Bucket boundaries: at least 2, all finite, STRICTLY ascending —
  // anything else is INVALID_ARGUMENT naming the column, because a
  // silently repaired edge list answers a question nobody asked.
  // Buckets are half-open [edges[i], edges[i+1]), so a value sitting
  // exactly on an interior edge lands in the UPPER bucket. There are
  // no implicit underflow/overflow buckets: a value below edges[0] or
  // at/above the last edge is counted in NO bucket. Explicit edges
  // only — if you want the tails, ask for them.
  repeated double edges = 3;
}

// One bucket's count within one range facet.
message RangeBucket {
  // Inclusive lower edge.
  double from = 1;
  // Exclusive upper edge.
  double to = 2;
  // Matching documents whose value falls in [from, to).
  uint64 count = 3;
}

// One requested range facet's counts, from one shard or merged.
message RangeFacetCounts {
  // The column name, echoed from the request.
  string column = 1;
  // The map key, echoed from the request (empty for plain columns).
  string key = 2;
  // Whether this shard can resolve the column (and, for a map entry,
  // the key). A shard without it answers known=false and no buckets —
  // legitimate for a heterogeneous fleet — but the coordinator REFUSES
  // a column NO shard knows, the same typo rule as `facet_fields`.
  bool known = 3;
  // One bucket per [edges[i], edges[i+1]) interval, in edge order.
  // Counts are additive, so the coordinator's merge is the positional
  // sum. Empty when `known` is false.
  repeated RangeBucket buckets = 4;
}

// One map-facet count request: a (column, key) pair. Structured rather
// than a "column[key]" string so keys never need escaping — keys are
// arbitrary map keys, and a parsing ambiguity here would miscount
// silently.
message MapFacetField {
  // Map column name (--map-facet-fields).
  string column = 1;
  // The key within the column whose values are counted.
  string key = 2;
}

// The transform of one score stage. Every op is monotone
// non-decreasing in the incoming score and ships with a bound rule
// (docs/score-functions.md) — that is the admission bar, because
// block-max pruning lifts its bounds through the chain.
enum ScoreOp {
  // Unused zero value; refused (a stage must say what it does).
  SCORE_OP_UNSPECIFIED = 0;
  // score *= exp(-|x - origin| / scale): recency decay. scale > 0.
  SCORE_OP_MULT_EXP_DECAY = 1;
  // score *= 1 + weight * ln(1 + max(x, 0)): log boost. weight >= 0 —
  // a negative weight could turn the factor negative, which breaks
  // monotonicity in the score, so it is refused.
  SCORE_OP_MULT_LOG = 2;
  // score += weight * x: additive boost, any finite weight. Note that
  // negative contributions can push final scores to or below zero;
  // correctness is unaffected, but kth_best seeding degrades to
  // unseeded for non-positive floors (floor_seed clamps at 0).
  SCORE_OP_ADD_LINEAR = 3;
  // score *= exp(-haversine_meters((lat, lon), (origin_lat,
  // origin_lon)) / scale): distance decay over a GEO-POINT column
  // (docs/geo-columns.md). Reads `origin_lat`, `origin_lon`, and
  // `scale` (meters, > 0). The multiplier lies in (0, 1], so the stage
  // is monotone non-decreasing in the incoming score and its bound lift
  // is identity — exactly MULT_EXP_DECAY's argument.
  SCORE_OP_MULT_GEO_DECAY_HAVERSINE = 4;
  // The same decay measured with the local Manhattan distance (meters
  // along the meridian plus meters along the parallel at the ORIGIN'S
  // latitude). A city-scale approximation, not a globe-scale distance.
  SCORE_OP_MULT_GEO_DECAY_MANHATTAN = 5;
}

// One stage of a score-function chain.
message ScoreStage {
  // The transform. SCORE_OP_UNSPECIFIED is refused.
  ScoreOp op = 1;
  // The numeric field (--numeric-fields) the stage reads — or, when
  // `key` is set, the map-numeric column (--map-numeric-fields) whose
  // entry under that key it reads. A document without a value passes
  // through unchanged (identity) — exact, not degraded, and the same
  // rule makes a shard that lacks the column entirely correct. A
  // column (or, for map stages, a (column, key) pair) NO shard knows
  // is refused by the coordinator (the typo rule, as for fields and
  // facets).
  string column = 2;
  // Weight; used by MULT_LOG (>= 0) and ADD_LINEAR (any finite).
  double weight = 3;
  // Decay origin (MULT_EXP_DECAY): the value where the factor is 1.
  double origin = 4;
  // Decay scale: > 0, finite. Value units for MULT_EXP_DECAY; METERS
  // for the two MULT_GEO_DECAY_* ops.
  double scale = 5;
  // When set, `column` names a map-numeric column and the stage reads
  // its entry under this key (docs/map-columns.md); bounds lift from
  // that key's min/max metadata. Empty = plain numeric column.
  string key = 6;
  // Decay origin latitude in degrees (MULT_GEO_DECAY_*): finite,
  // within [-90, 90]. `column` then names a geo-point column
  // (--geo-fields), resolved after the f64 and i64 tables.
  double origin_lat = 7;
  // Decay origin longitude in degrees (MULT_GEO_DECAY_*): finite,
  // within [-180, 180].
  double origin_lon = 8;
}

// One field's leg of a fused multi-field BM25 query.
message Bm25FieldLeg {
  // Field name ("body" for field 0).
  string field = 1;
  // Query terms under THIS field's analysis.
  repeated string terms = 2;
  // Global sum of this field's document lengths (avgdl_f numerator).
  uint64 global_total_doc_length = 3;
  // Global document frequency per term, parallel to `terms`.
  repeated uint32 global_doc_frequencies = 4;
  // Query-time weight w_f; 0 selects the default (1.0). Negative
  // weights are INVALID_ARGUMENT.
  float weight = 5;
  // This field's BM25 k1; 0 selects the default (1.2).
  float k1 = 6;
  // This field's BM25 b; 0 selects the default (0.75).
  float b = 7;
  // Fingerprint of the analyzer that produced `terms`
  // (`analysis_fingerprint` in the search implementation). The shard REFUSES
  // the query when this disagrees with the analyzer its column was built
  // under, because the two would score different term identities against
  // one idf and report a confident wrong ranking rather than an error.
  // 0 means the caller does not know its own analyzer and disables the
  // check; a shard whose column predates fingerprints is 0 on its side
  // and also does not enforce.
  uint64 analysis_fingerprint = 8;
  // Positional phrase constraint over `terms` (docs/phrase-proximity.md),
  // applied by the shard at the heap gate: a document enters the heap
  // only when it holds the window. Absent on an ordinary leg and on a
  // leg the coordinator already rewrote onto a bigram column. A shard
  // whose field has no token positions REFUSES the leg
  // (FAILED_PRECONDITION) rather than scoring the terms unconstrained.
  PhraseLeg phrase = 9;
}

// The shard-side form of PhraseMatch: the query's term SEQUENCE (with
// repeats, in token order) as indexes into the leg's deduplicated
// `terms`, plus the slop.
message PhraseLeg {
  // Indexes into the leg's `terms`, one per query token, in order.
  repeated uint32 sequence = 1;
  // See PhraseMatch.slop.
  uint32 slop = 2;
}

// A half-open span [start, end) in original-text UTF-16 code units. Search
// persistence uses this one canonical unit even though its analysis providers
// can expose selectable units to direct callers.
message OffsetSpan {
  // Start offset (inclusive).
  uint32 start = 1;
  // End offset (exclusive).
  uint32 end = 2;
}

// How a snippet's bounds were chosen (docs/highlighting.md).
enum HighlightMode {
  // Sentence mode.
  HIGHLIGHT_MODE_UNSPECIFIED = 0;
  // Each snippet is one stored sentence span (ingested with
  // --sentence-fields); a sentence wider than max_chars is trimmed
  // around its first highlight and marked SNIPPET_CUT_TRUNCATED_SENTENCE.
  // A field without stored sentence spans refuses this mode by name.
  HIGHLIGHT_MODE_SENTENCE = 1;
  // Each snippet is a window of at most max_chars around a cluster of
  // highlights, cut at whitespace; no sentence spans are consulted.
  HIGHLIGHT_MODE_WINDOW = 2;
}

// Server-side snippets for each hit (docs/highlighting.md). The shard
// cuts them from the stored text and the occurrence spans it already
// collected; no analyzer runs on the query path.
message HighlightSpec {
  // Fields to cut snippets from; empty means the body. Only fields with
  // stored text qualify (the body), and any other name refuses.
  repeated string fields = 1;
  // Snippets per hit per field; 0 means 3, at most 64.
  uint32 max_snippets = 2;
  // Snippet width in UTF-16 code units; 0 means 300, at least 16, at
  // most 4096.
  uint32 max_chars = 3;
  HighlightMode mode = 4;
}

enum SnippetCut {
  SNIPPET_CUT_UNSPECIFIED = 0;
  // Both edges are a stored sentence's edges.
  SNIPPET_CUT_SENTENCE = 1;
  // A stored sentence wider than max_chars, trimmed at whitespace
  // around its first highlight.
  SNIPPET_CUT_TRUNCATED_SENTENCE = 2;
  // A window around a highlight cluster, cut at whitespace.
  SNIPPET_CUT_WINDOW = 3;
}

// One snippet of one hit. Offsets are UTF-16 code units of the ORIGINAL
// stored text, the unit every persisted span uses; `text` is the UTF-8
// slice at [start, end). Highlights are merged (no two overlap or
// touch), ascending, and lie inside [start, end); subtract `start` for
// snippet-relative positions.
message Snippet {
  string field = 1;
  string text = 2;
  uint32 start = 3;
  uint32 end = 4;
  repeated OffsetSpan highlights = 5;
  SnippetCut cut = 6;
  // For a SENTENCE or TRUNCATED_SENTENCE cut: the sentence's ordinal in
  // the document's stored sentence table — the analysis sidecar's own
  // sentence layer over the original text, the same layer its
  // SOURCE_SENTENCES embeddings are computed from, in order. Sentence k
  // here is embedding k there, so a dense hit's sentence provenance and
  // a lexical hit's highlight name the same text. Absent for a WINDOW cut.
  optional uint32 sentence_index = 7;
}

// Occurrences of one query term in one hit document.
message TermOccurrences {
  // The query term as scored (stem identity when SOURCE_STEMS).
  string term = 1;
  // Every occurrence span in original-text UTF-16 code units.
  repeated OffsetSpan offsets = 2;
  // The field this term matched in. Empty on the single-field path
  // (the body); fused multi-field hits name the field explicitly
  // ("body" included).
  string field = 3;
}

// One BM25 hit, highlight-ready.
message Bm25Hit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // BM25 score computed with GLOBAL corpus stats; comparable across
  // shards. Higher is better.
  float score = 2;
  // Per-query-term occurrences in this document (terms absent from the
  // document are omitted).
  repeated TermOccurrences terms = 3;

  // Projected values, aligned with the request's projections in
  // request order. Empty when the request carried none. An unset value
  // oneof is ABSENCE: an input column the document does not hold, or
  // integer arithmetic stock CEL would call an error (overflow,
  // division by zero) — the engine's Kleene rule, absence in, absence
  // out, never a fabricated default.
  repeated ProjectedValue projected = 4;
  // Server-side snippets when the request carried a HighlightSpec
  // (docs/highlighting.md), in text order per field.
  repeated Snippet snippets = 5;
}

// A shard's BM25 top-k.
message Bm25QueryResponse {
  // Hits, score descending, ties by doc id.
  repeated Bm25Hit hits = 1;
  // The shard's k-th best score: one f32 ULP below the k-th hit's score
  // when the shard returned k hits (emitted one ULP down so a later f32
  // seed can never exceed the true f64 k-th best — scoring is f64, the
  // wire is f32), 0 otherwise (no seedable floor — the shard could not
  // fill the requested k). A caller that re-queries later (e.g. after
  // appends) can seed the fleet with it via
  // Bm25QueryRequest.min_score / Bm25SearchRequest.min_score.
  float kth_best = 2;
  // Facet counts over this shard's match set, one entry per requested
  // facet field in request order. Counts are shard-local shares; they
  // are additive, so the coordinator's global counts are the plain sum
  // over shards — there is no analog of the global-df trap here.
  repeated FacetFieldCounts facets = 3;
  // Whether this shard's numeric table has each requested score
  // stage's column, parallel to `score_stages` (empty when none were
  // sent). A shard without the column answered identity for all its
  // documents — exact — but the coordinator refuses a column NO shard
  // knows, because a typo'd chain would otherwise be a silent no-op.
  repeated bool stage_columns_known = 4;
  // Range-facet counts over this shard's match set, one entry per
  // requested range facet in request order. Additive like `facets`.
  repeated RangeFacetCounts range_facets = 5;
  // Whether this shard's geo table has each requested filter's column,
  // parallel to `geo_filters` (empty when none were sent). A shard
  // without the column contributed no hits through that filter — its
  // documents hold no locations, so failing the filter is exact — but
  // the coordinator refuses a column NO shard knows, because a typo'd
  // filter would otherwise read as "zero results everywhere".
  repeated bool geo_columns_known = 6;
  // Whether this shard can resolve each leaf of the request's `filter`
  // tree, positionally over the leaves in depth-first order (empty
  // when no filter was sent). What "resolve" means is per leaf kind —
  // see each predicate message: facet = the facet table has the
  // column; number = the i64 or f64 table has it; map predicates =
  // column and key (column alone for map_has_key); has = any family;
  // geo = the geo table. A shard that cannot resolve a leaf evaluates
  // it as the absent case for every document — exact — but the
  // coordinator refuses a leaf NO shard can resolve, the same typo
  // rule as every other named column on this response.
  repeated bool filter_columns_known = 7;
  // One entry per requested stats field, in request order.
  repeated ColumnStats stats = 8;
  // One entry per requested cardinality field, in request order, with
  // the shard's distinct VALUES (the coordinator unions and counts).
  repeated FacetDistinct distinct = 9;

  // Whether this shard resolved each column-read leaf of the request's
  // `projections`, positionally over the leaves in expression order
  // then depth-first within each expression (empty when none were
  // sent). A leaf no shard resolves is a typo'd column: the
  // coordinator refuses it by name rather than answering all-absent.
  repeated bool projection_leaves_known = 10;
}

// One message on the client-to-shard leg of `Bm25QueryStream`.
message Bm25QueryStreamRequest {
  oneof payload {
    // Opens the scan. Exactly one per stream, first message; the same
    // request the unary Bm25Query takes, `min_score` included (the
    // relay's floors arrive on top of it, never instead of it).
    Bm25QueryRequest start = 1;
    // Raises the shard's score floor mid-scan. Same monotone contract
    // as the vector relay: senders only raise, receivers ignore
    // non-raises. Values are emission-safe seeds (one f32 ULP below a
    // true k-th best), so ties at the floor survive by construction.
    FloorUpdate floor_update = 2;
    // Authoritative cancellation. A stopped shard may emit one terminal
    // completion with completed=false, but its response is never usable.
    StopBm25Query stop = 3;
  }
}

message StopBm25Query {}

// Packed lexical candidates sufficient to reconstruct this shard's possible
// contribution to global top-k. Each record is exactly 12 little-endian bytes:
// `u64 global_doc_id | f32 score`. Scores already include any certified
// score-function chain. A batch contains no offsets or projected values;
// those ride the terminal local top-k response only.
message Bm25CandidateBatch {
  bytes candidates = 1;
}

// Terminal certificate for one lexical shard scan.
message Bm25StreamCompletion {
  // True only when the entire shard was searched under the monotone floor
  // contract. False after Stop or local cancellation. A coordinator must
  // reject the whole query unless every configured shard says true.
  bool completed = 1;
  // The ordinary local response, present exactly when completed=true and
  // used to enrich the winning global heap entries with offsets,
  // projections, facets, and known-column flags.
  Bm25QueryResponse response = 2;
  // SHA-256 identity of the BM25 score space: analyzed terms/field order,
  // global statistics, k1/b, field weights/fingerprints, and score stages.
  // k, min_score, filters, projections, and stats epochs do not change a
  // score and are deliberately excluded. Every shard must report the same
  // non-empty value.
  string scoring_fingerprint = 3;
  // Number of packed candidate records emitted on this stream.
  uint64 candidates_emitted = 4;
}

// One message on the shard-to-client leg of `Bm25QueryStream`.
message Bm25QueryStreamResponse {
  oneof payload {
    // The shard's running k-th best, one f32 ULP down (`floor_seed`),
    // emitted as the local heap rises. Monotone within a stream.
    FloorUpdate floor_update = 1;
    // Deprecated pre-certificate terminal shape. New servers never emit it;
    // new coordinators reject it because it cannot prove scan completion.
    Bm25QueryResponse done = 2;
    // Compact scored candidates as the scan progresses.
    Bm25CandidateBatch candidate_batch = 3;
    // Terminal message, exactly one per stream.
    Bm25StreamCompletion completion = 4;
  }
}

// One facet value's count within one facet field.
message FacetCount {
  // The value, exactly as ingested.
  string value = 1;
  // Number of matching documents holding this value.
  uint64 count = 2;
}

// One requested facet field's counts, from one shard or merged.
message FacetFieldCounts {
  // The facet field name — a plain facet column, or a map column when
  // `key` is set.
  string field = 1;
  // Whether this shard has the field in its facet table. A shard
  // without it answers known=false and no counts — legitimate for a
  // heterogeneous fleet (its documents hold no values), but the
  // coordinator REFUSES a facet field NO shard knows, because a typo
  // would otherwise read as "zero results everywhere". The same rule
  // as FieldStats.known.
  bool known = 2;
  // Non-zero value counts. Node responses list them in dictionary
  // order; the coordinator's merged response sorts by count
  // descending, ties by value ascending. Values matched by no document
  // are omitted.
  repeated FacetCount counts = 3;
  // For a map-facet entry (docs/map-columns.md): the key within the
  // map column these counts are for. Empty for plain facet fields.
  // `known` then means "this shard's column has this key in its key
  // dictionary" — the same partial-knowledge rule, applied per key so
  // a typo'd key cannot read as zero results everywhere.
  string key = 4;
}

// Reads raw texts from the doc store.
message GetDocumentsRequest {
  // Global doc ids.
  repeated uint64 doc_ids = 1;
}

// One stored document.
message StoredDocument {
  // Global doc id.
  uint64 doc_id = 1;
  // The raw text as ingested.
  string text = 2;
  // Lineage, when the document was ingested with it.
  optional DocLineage lineage = 3;
}

// Stored documents, in request order, omitting unknown ids.
message GetDocumentsResponse {
  // Found documents.
  repeated StoredDocument documents = 1;
}

message ResolveParentsRequest {
  repeated uint64 doc_ids = 1;
}

message ResolvedParent {
  uint64 doc_id = 1;
  uint64 parent_id = 2;
}

message ResolveParentsResponse {
  repeated ResolvedParent parents = 1;
}

// Client-facing distributed BM25 request.
message Bm25SearchRequest {
  // Query text, analyzed with `analysis` before scoring.
  string text = 1;
  // Number of global top hits to return. Optional: 0 selects the
  // coordinator's `max_k`; above it is refused (see SearchRequest.k).
  uint32 k = 2;
  // Analysis options for the query. MUST match the options documents were
  // ingested with (term identity source above all).
  AnalysisSpec analysis = 3;
  // Seeded floor for the whole fleet: forwarded to every shard's
  // Bm25QueryRequest.min_score. A client that already holds a floor
  // (e.g. the kth_best of a previous identical query, re-issued after
  // appends) seeds every shard, which then skips postings that provably
  // cannot reach it. 0 means unseeded (scores are always positive).
  // For a fused query (`fields` non-empty) the floor applies to the
  // fused score.
  float min_score = 4;
  // Fused multi-field search (docs/multi-field.md): when non-empty
  // these entries REPLACE the flat single-field query. `text` is
  // analyzed once per entry under that entry's analysis and scored
  // against its field; the fused score is the weighted per-field sum,
  // accumulated in entry order. Setting `analysis` (field 3) as well is
  // REFUSED rather than ignored: a caller that set it meant it, and
  // quietly dropping it runs the query under the sidecar's default
  // analysis, whose terms need not exist in the index at all.
  repeated QueryField fields = 5;
  // Facet fields to count over the full match set (count-then-rank).
  // Forwarded to every shard's Bm25QueryRequest.facet_fields; the
  // response carries the summed global counts. A query that asks for
  // facets pays a full doc-run traversal per scored term on every
  // shard; empty means no counting and no cost. A facet field no shard
  // knows is refused (INVALID_ARGUMENT).
  repeated string facet_fields = 6;
  // Score-function chain (docs/score-functions.md), forwarded verbatim
  // to every shard's Bm25QueryRequest.score_stages: hits, `min_score`,
  // and `kth_best` are on the FINAL (chained) scale. Flat single-field
  // route only for now; setting this with `fields` is refused. A stage
  // column no shard knows is refused (INVALID_ARGUMENT).
  repeated ScoreStage score_stages = 7;
  // Map-facet keys to count over the full match set
  // (docs/map-columns.md), forwarded to every shard and summed like
  // plain facet fields; answered in `facets` after the plain entries,
  // with FacetFieldCounts.key set. A (column, key) pair no shard knows
  // is refused (INVALID_ARGUMENT).
  repeated MapFacetField map_facet_fields = 8;
  // Range buckets to count over the full match set
  // (docs/range-facets.md), forwarded to every shard and summed
  // positionally; answered in `range_facets`. A column no shard knows
  // is refused (INVALID_ARGUMENT), as are edge lists that are not at
  // least two finite strictly ascending values.
  repeated RangeFacetField range_facet_fields = 9;
  // Geo filters (docs/geo-columns.md), forwarded verbatim to every
  // shard: ALL must pass, a document without a value fails every one,
  // and a column no shard knows is refused (INVALID_ARGUMENT). Carried
  // by the flat and the fused route, and by the hybrid route, whose
  // vector leg applies the same filters as a slot allowlist
  // (docs/vector-filters.md). Facet counting (plain, map, and range)
  // counts only documents
  // that pass every filter (these and `filter` alike): a filtered-out
  // document is not in the result set, so counting it would misstate
  // the drill-down.
  repeated GeoFilter geo_filters = 10;
  // Filter expression in CEL surface syntax (docs/cel-filters.md),
  // e.g. `court == "scotus" && year >= 1990 && "color" in tags`. The
  // coordinator parses and compiles it ONCE into the FilterExpr
  // predicate IR and forwards that tree to every shard — shards never
  // see CEL text. Only constructs that compile to dictionary-resolved
  // predicates plus boolean algebra are accepted; everything else
  // (arithmetic, ternary, string functions, macros, regex `matches`)
  // is REFUSED BY NAME at INVALID_ARGUMENT, never interpreted slowly.
  // Column names no shard knows refuse under the typo rule. ANDed with
  // `geo_filters` when both are set; same absence semantics and facet
  // narrowing as FilterExpr documents. Empty = no filter. The hybrid
  // route carries it too (HybridSearchRequest.filter), where it gates
  // BOTH legs from one resolved predicate.
  string filter = 11;
  // Column aggregations over the filtered match set; forwarded to
  // every shard's Bm25QueryRequest.stats_fields and merged (counts
  // and sums add; mins and maxes fold). See that field for the rules.
  repeated string stats_fields = 12;
  // Exact distinct-value counts over the filtered match set;
  // forwarded to every shard and unioned by VALUE. See
  // Bm25QueryRequest.cardinality_fields for the cost contract.
  repeated string cardinality_fields = 13;

  // Query-time projections (docs/cel-values.md): named CEL value
  // expressions computed per RETURNED hit, after selection, over the
  // hit's own columns — compiled ONCE here at the coordinator into the
  // ValueExpr IR, resolved per shard against local tables, never
  // interpreted per document. Values ride each hit in request order.
  // A projection never selects and never scores: it annotates. Flat
  // (non-fused) route only, like stats_fields.
  repeated NamedProjection projections = 14;
  // Ordered-window constraint over `text`'s analyzed terms on the body
  // (docs/phrase-proximity.md). Flat route only; on the fused route
  // each QueryField carries its own. See PhraseMatch for what a field
  // must have declared to serve it, and Bm25SearchResponse.phrase_routing
  // for what served it.
  PhraseMatch phrase = 15;
  // Term prefixes expanded in the body's dictionary and added to the
  // query's terms (docs/prefix-terms.md). Flat route only; on the
  // fused route each QueryField carries its own.
  repeated TermPrefix prefixes = 16;
  // Server-side snippets per hit (docs/highlighting.md). Absent means
  // no snippets; hits keep their occurrence spans either way.
  HighlightSpec highlight = 17;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 18;
}

// A prefix over a field's term dictionary (docs/prefix-terms.md): every
// term starting with `prefix` joins the query's terms, each scored as
// the ordinary term it is (BM25 sums their contributions). The
// coordinator applies the field's analysis normalizer chain to the
// prefix (never the stemmer: a prefix of a stem is what the dictionary
// holds) and expands it on every shard, where the byte-sorted
// directory answers with a binary search plus a bounded scan. The
// fleet-wide union past the cap is INVALID_ARGUMENT naming the term
// count — never a silently narrower set.
message TermPrefix {
  // The prefix, in the field's surface form; non-empty.
  string prefix = 1;
  // Expansion cap; 0 selects the default (128). Values above the
  // absolute maximum (1024) are refused.
  uint32 max_expansions = 2;
}

// What one TermPrefix expanded to, reported on the response so the
// terms actually scored are never a guess.
message PrefixExpansion {
  // The field the prefix was expanded in.
  string field = 1;
  // The prefix as matched (normalized).
  string prefix = 2;
  // The expanded terms, in byte order.
  repeated string terms = 3;
}

// Shard-side prefix expansion (docs/prefix-terms.md).
message ExpandTermPrefixRequest {
  // The field whose dictionary is searched ("body" for the body).
  string field = 1;
  // The prefix, already normalized by the coordinator.
  string prefix = 2;
  // Expansion cap; past it the shard reports the count and no terms.
  uint32 cap = 3;
}

message ExpandTermPrefixResponse {
  // Matching terms in byte order; empty when past the cap.
  repeated string terms = 1;
  // Exact number of matching terms on this shard.
  uint64 count = 2;
  // Whether this shard's field table has the field at all.
  bool known = 3;
}

// Shard-side autocomplete scan (docs/suggest.md): every term of one
// field's dictionary under a prefix, with its posting df.
message SuggestTermsRequest {
  // The field whose dictionary is scanned ("body" for the body).
  string field = 1;
  // The prefix, already normalized by the coordinator; non-empty.
  string prefix = 2;
  // Scan bound; past it the shard reports the count and no entries.
  uint64 max_scan = 3;
}

// One dictionary term under the prefix and its posting df on the shard.
message SuggestTermEntry {
  // The term as the dictionary holds it (a stem on a stemmed field).
  string term = 1;
  // Posting document frequency: the number of rows whose posting list
  // holds the term, tombstoned rows included until compaction.
  uint64 df = 2;
}

message SuggestTermsResponse {
  // Matching terms in byte order with their df; empty when past the
  // scan bound.
  repeated SuggestTermEntry entries = 1;
  // Exact number of matching terms on this shard.
  uint64 count = 2;
  // Whether this shard's field table has the field at all.
  bool known = 3;
  // The shard's live-docs tombstone count. Non-zero means the df above
  // still counts rows a delete removed from every search result.
  uint64 tombstoned_rows = 4;
}

// Autocomplete over one field's dictionary (docs/suggest.md).
message SuggestRequest {
  // The collection the field belongs to (docs/collections.md): empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 1;
  // The indexed BM25 field whose dictionary is completed ("body", the
  // cased twin, the glossary phrase field, any per-field column). A
  // field no shard indexes refuses by name.
  string field = 2;
  // The prefix, in the field's surface form; non-empty. Normalized
  // under `analysis`'s char filters before the dictionary is searched,
  // never stemmed.
  string prefix = 3;
  // How many suggestions to return; 0 selects the default (10). Values
  // above the absolute maximum (100) are refused.
  uint32 limit = 4;
  // The most dictionary terms under the prefix the request may scan,
  // per shard and fleet-wide; 0 selects the default (100000). Values
  // above the absolute maximum (1000000) are refused, as is a prefix
  // that has more matches than the bound, naming the count.
  uint64 max_scan = 5;
  // The field's analysis spec, whose char filters normalize the prefix
  // (docs/prefix-terms.md). Required: the sidecar's default chain is
  // not known to the coordinator, so an absent spec refuses by name.
  AnalysisSpec analysis = 6;
}

// One completion, ranked by df descending then term bytes ascending.
message Suggestion {
  // The dictionary term (a stem on a stemmed field).
  string term = 1;
  // Posting df summed over the collection's shards.
  uint64 df = 2;
  // How many shards hold the term.
  uint32 shards = 3;
}

message SuggestResponse {
  // The best `limit` completions in rank order.
  repeated Suggestion suggestions = 1;
  // How many dictionary terms start with the prefix across the
  // collection (the union over shards), whether or not they were
  // returned.
  uint64 dictionary_terms_with_prefix = 2;
  // True when any shard reported tombstoned rows: df then counts rows
  // a delete removed from search until compaction restores exactness.
  bool df_includes_tombstoned_rows = 3;
}

// An ordered-window constraint over a lexical query's analyzed terms
// (docs/phrase-proximity.md): the terms must occur in the field in query
// order, and the window they occupy may contain at most `slop` token
// positions beyond the phrase's own length. `slop = 0` is an exact
// phrase. Positions are token ORDINALS from the ingest analysis, never
// character offsets, so a dropped token between two terms counts as a
// gap exactly as a visible one does.
//
// A field serves this only through a payload it declared at ingest: a
// two-term exact phrase can ride the field's bigram column (one term
// lookup); anything else needs the field's token positions. A field
// with neither is refused BY NAME (INVALID_ARGUMENT) naming what it
// lacks — the engine never narrows a phrase to "all terms present" or
// guesses adjacency from spans. A single-term phrase is the ordinary term
// query. The constraint only REMOVES documents, so block-max pruning
// and facet counts stay exact; the score is the ordinary BM25 of what
// matched (the bigram term on the bigram route, the constituent terms
// otherwise), reported per field in the hit's occurrences.
message PhraseMatch {
  // Maximum number of extra token positions the ordered window may span.
  uint32 slop = 1;
}

// Which payload served one field's PhraseMatch, reported on the
// response so a caller can tell a bigram-column answer from a
// positional one without inferring it from field names.
message PhraseRouting {
  // The field the request named.
  string field = 1;
  // The field actually scored: the bigram column, or `field` itself
  // when its token positions served the window.
  string served_field = 2;
  // True when the bigram column served it; false for token positions.
  bool bigram_column = 3;
  // The slop the window was checked at (0 on the bigram route).
  uint32 slop = 4;
}

// One derived bigram column, as recorded on a document's durable ingest
// record (AddDocumentsRequest.bigram_fields): `field` is derived from
// `source`'s adjacent token pairs. Replay and resharding rebuild the
// column from this record and the re-analysis; they never guess which
// field a column came from.
message BigramField {
  // The analyzed source field ("body" for the body).
  string source = 1;
  // The derived BM25 field holding the pairs (`<source>.bigrams`).
  string field = 2;
}

// Client-facing phrase-aware request. `base` supplies all ordinary BM25
// field legs, filters, and facets. The coordinator appends its configured
// phrase field and derives concept terms from the raw query text. Score stages,
// stats, cardinality, and projections are refused until their max-group
// interaction is certified.
message PhraseSearchRequest {
  Bm25SearchRequest base = 1;
  PhraseSearchOptions options = 2;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 3;
}

message PhraseSearchOptions {
  // Multiplier per registered phrase token. 0 selects 1.0.
  float weight_per_token = 1;
  // Maximum phrase multiplier. 0 selects 3.0. The resulting multiplier is
  // min(max_weight, token_count * weight_per_token).
  float max_weight = 2;
}

// One field of a fused multi-field search.
message QueryField {
  // Field to score ("body" for the body field).
  string field = 1;
  // Analysis options for THIS field's query terms; MUST match the
  // options the field was ingested with (term identity is per field).
  AnalysisSpec analysis = 2;
  // Query-time weight w_f; 0 selects the default (1.0).
  float weight = 3;
  // This field's BM25 k1; 0 selects the coordinator's configured
  // default.
  float k1 = 4;
  // This field's BM25 b; 0 selects the coordinator's configured
  // default.
  float b = 5;
  // Ordered-window constraint over this field's analyzed query terms
  // (docs/phrase-proximity.md). The coordinator routes it to the
  // field's bigram column or token positions and refuses by name when
  // the fleet declared neither for this field.
  PhraseMatch phrase = 6;
  // Term prefixes expanded in this field's dictionary and added to
  // its query terms (docs/prefix-terms.md).
  repeated TermPrefix prefixes = 7;
}

// Client-facing distributed BM25 response.
message Bm25SearchResponse {
  // Global top-k: score descending, ties by shard index then doc id.
  repeated Bm25Hit hits = 1;
  // The merged k-th best score: one f32 ULP below the k-th hit's score
  // when k hits were returned (see Bm25QueryResponse.kth_best for why),
  // 0 otherwise. Seed a later re-query with it via
  // Bm25SearchRequest.min_score.
  float kth_best = 2;
  // Global facet counts, one entry per requested facet field in
  // request order: the plain sum of every shard's shares, sorted by
  // count descending, ties by value ascending. EXACT over the full
  // match set — computed by full traversal, never sampled from the
  // candidate pool. `known` is true when at least one shard has the
  // field (a field no shard knows was refused instead). Empty when the
  // query analyzed to no scoring terms — there is no match set to
  // count.
  repeated FacetFieldCounts facets = 3;
  // Global range-facet counts, one entry per requested range facet in
  // request order: the positional sum of every shard's bucket counts,
  // buckets in edge order. EXACT over the full match set, like
  // `facets`, and empty under the same conditions.
  repeated RangeFacetCounts range_facets = 4;
  // One entry per requested stats field, in request order: the merged
  // aggregate over every shard's filtered match set. `mean` is
  // sum / count, computed here so clients cannot get it wrong; it is
  // 0 when count is 0 (no document held a value).
  repeated ColumnStats stats = 5;
  // One entry per requested cardinality field, in request order, with
  // the exact distinct-value count over the global filtered match set
  // (values unioned across shards). The per-shard value lists are not
  // echoed.
  repeated FacetCardinality cardinality = 6;
  // One entry per field the request constrained with a PhraseMatch,
  // saying which payload served it (docs/phrase-proximity.md). Empty
  // when the request carried no phrase.
  repeated PhraseRouting phrase_routing = 7;
  // One entry per TermPrefix the request carried, in request order:
  // the terms it expanded to and was scored over.
  repeated PrefixExpansion prefix_expansions = 8;
}

// How the coordinator fuses the per-shard leg results of a hybrid query.
enum FusionMode {
  // Unused zero value; resolves to FUSION_MODE_CASCADE.
  FUSION_MODE_UNSPECIFIED = 0;

  // Default. Shards return RAW per-leg lists (ShardLegs); the coordinator
  // merges each leg across shards by raw score into GLOBAL rankings and
  // applies single-level RRF over them. With globally comparable scores
  // per leg (shared calibration for vectors, global stats for BM25) this
  // is EXACTLY the monolithic result for k <= leg_k: any doc in the true
  // global top-leg_k of a leg is in its shard's local top-leg_k (local
  // rank <= global rank), so the union of shard lists contains the exact
  // global top-leg_k and merging by score reconstructs it.
  FUSION_MODE_GLOBAL_RANK = 1;

  // Fallback for incomparable scores: each shard RRF-fuses its legs
  // locally (HybridShard) and the coordinator RRF-merges the shard lists.
  // Rank-based and therefore scale-free, but NOT partition-independent —
  // shard-local ranks are compressed relative to global ranks, so the
  // result can differ from a monolithic index.
  FUSION_MODE_TWO_LEVEL = 2;

  // Default. Cascade, no score fusion: phase 1 generates vector
  // candidates through the floor-sharing bidi path (cross-shard early
  // termination applies — the cutoff IS the savings, no leg_k hits per
  // shard), with a TIE-COMPLETE cutoff: the candidate pool is
  // {score >= s_k} where s_k is the global k-th vector score, so the
  // pool can exceed k by the boundary tie-group size. Phase 2 reranks
  // the pool by BM25 (global stats, candidate-scoped scoring per owning
  // shard) and returns the top k. Vector recall is a GATE here:
  // keyword-strong but vector-weak docs are not surfaced — use
  // Bm25Search for pure lexical queries, or GLOBAL_RANK for true fusion.
  FUSION_MODE_CASCADE = 3;

  // Score-based fusion (the normalize + weighted-combine family):
  // shards return RAW per-leg lists exactly as in GLOBAL_RANK; the
  // coordinator merges each leg into one global list, truncates it
  // TIE-COMPLETE to leg_k (the retained set is {score >= s_k} with s_k
  // the leg's leg_k-th best — score-defined, hence layout-invariant),
  // normalizes the retained scores per leg (ScoreNormalization) and
  // combines each doc's normalized leg scores (ScoreCombination)
  // weighted by vector_weight/bm25_weight. Rank-free: score GAPS
  // survive fusion — a runaway leg leader stays far ahead where RRF
  // compresses every gap to the fixed distance between adjacent ranks.
  // Requires globally comparable scores per leg, same as GLOBAL_RANK.
  FUSION_MODE_SCORE_BLEND = 4;

  // EXACT fused top-k over the raw weighted sum
  //
  //   fused(d) = vector_weight * v(d) + bm25_weight * b(d)
  //
  // with no leg truncation: unlike SCORE_BLEND (whose blend runs over
  // the union of two leg_k-deep lists, missing docs mediocre in both
  // legs but strong fused), every doc in the corpus is accounted for.
  // Requires both weights > 0 and globally comparable raw scores per
  // leg (shared calibration, global stats).
  //
  // Execution is BM25-first with decomposed floors over the streaming
  // vector path (docs/multi-field.md "Hybrid streaming interplay"):
  //   1. the BM25 leg runs to depth leg_k (milliseconds; postings over
  //      a few terms). Its top score b_1 is the EXACT global maximum
  //      b(d), the bound every decomposed floor divides through.
  //   2. VectorRescore pins v(d) for the leg's top k docs — k true
  //      fused scores, whose k-th best s_0 is a lower bound on the
  //      final fused k-th best. Every vector stream then opens with
  //      initial_floor = (s_0 - bm25_weight * b_1) / vector_weight:
  //      any doc scoring below that satisfies fused(d) < s_0 whatever
  //      its b(d), so pruning it is lossless. (A BM25-only bound can
  //      never floor the vector scan — the top lexical doc could sit
  //      at any vector score — which is why phase 2 exists.)
  //   3. as emissions accumulate, the coordinator's k-th best known
  //      fused lower bound rises and re-decomposed floors chase it.
  //   4. close-out: emitted docs outside the BM25 leg's list get their
  //      b(d) pinned by Bm25Rescore (candidate-scoped) unless even
  //      b = the leg's boundary score cannot lift them to the k-th
  //      best; docs never emitted were certified fused < s by their
  //      floor. Exact by construction, every certificate checked.
  // leg_k is a cost knob here, not a correctness knob: deeper legs
  // pin more b(d) up front and shrink the close-out rescore.
  FUSION_MODE_DECOMPOSED = 5;
}

// SCORE_BLEND only: how each leg's retained scores are rescaled before
// combining. Statistics are computed over the leg's GLOBAL retained
// list (tie-complete top leg_k across all shards) — never per shard,
// which would break partition-independence.
enum ScoreNormalization {
  // Unused zero value; resolves to SCORE_NORMALIZATION_MIN_MAX.
  SCORE_NORMALIZATION_UNSPECIFIED = 0;
  // (s - min) / (max - min), onto [0, 1]. A degenerate leg (every
  // retained score equal) maps to 1.0. The default: bounded and
  // scale-free, and the boundary doc maps to 0.0 — a doc AT the
  // truncation boundary blends exactly like an absent one, which makes
  // min-max robust to boundary-tie membership differences between
  // layouts.
  SCORE_NORMALIZATION_MIN_MAX = 1;
  // (s - mean) / stddev (population stddev over the retained set).
  // Unbounded and can be negative; a degenerate leg maps to 0.0.
  // Preserves outlier magnitude that min-max compresses. Caveat: under
  // ARITHMETIC combination a doc ABSENT from a leg contributes 0 (the
  // leg mean), which outscores a present-but-weak (negative z) doc;
  // GEOMETRIC/HARMONIC skip non-positive scores entirely.
  SCORE_NORMALIZATION_Z_SCORE = 2;
  // No rescaling: raw leg scores combine directly. Only meaningful when
  // the legs already share a scale (or to inspect the blend itself).
  SCORE_NORMALIZATION_NONE = 3;
}

// SCORE_BLEND only: how one doc's normalized per-leg scores combine
// into its fused score, weighted by vector_weight/bm25_weight.
enum ScoreCombination {
  // Unused zero value; resolves to SCORE_COMBINATION_ARITHMETIC.
  SCORE_COMBINATION_UNSPECIFIED = 0;
  // Weighted arithmetic mean over ALL weighted legs: a leg the doc is
  // absent from contributes 0 with its weight still in the denominator,
  // so single-leg docs are proportionally penalized. This is the
  // classic weighted-sum hybrid formula (union-flavored). The default.
  SCORE_COMBINATION_ARITHMETIC = 1;
  // Weighted geometric mean over the legs where the doc has a POSITIVE
  // normalized score, weights renormalized over those legs; a doc with
  // no positive leg scores 0. Favors docs that are good in EVERY leg
  // without zeroing single-leg docs.
  SCORE_COMBINATION_GEOMETRIC = 2;
  // Weighted harmonic mean over the positive legs (same skip rule as
  // GEOMETRIC). The most AND-flavored: dominated by the doc's WEAKEST
  // leg.
  SCORE_COMBINATION_HARMONIC = 3;
}

// Per-leg options for hybrid (RRF-fused) search. Every field is optional;
// 0 selects the documented default.
message HybridLegOptions {
  // Fusion strategy. Absent = FUSION_MODE_GLOBAL_RANK.
  FusionMode fusion_mode = 5;
  // How deep each leg is fetched before fusion. 0 = default
  // max(k, rrf_k): the RRF constant should never exceed a leg's depth, or
  // deep-ranked docs could not contribute their 1/(rrf_k + rank) share.
  // Values below k are clamped to k. For DECOMPOSED this is the BM25
  // leg's depth — a cost knob, never a correctness knob (see
  // FUSION_MODE_DECOMPOSED).
  uint32 leg_k = 1;
  // Weight of the vector leg: its RRF weight under GLOBAL_RANK and
  // TWO_LEVEL, its blend weight under SCORE_BLEND. ABSENT = default
  // 1.0; an EXPLICIT 0 disables the leg entirely (GLOBAL_RANK and
  // SCORE_BLEND only — a single-leg query is how "vector primary" or
  // "lexical primary" runs through the hybrid path, composing with
  // boost and debug; TWO_LEVEL rejects explicit 0, its wire format
  // cannot distinguish 0 from unset at the node; CASCADE ignores
  // weights). Disabling both legs is INVALID_ARGUMENT.
  optional float vector_weight = 2;
  // Weight of the BM25 leg (same dual role, same disable rule).
  optional float bm25_weight = 3;
  // The RRF constant. 0 = default 60 (the usual value from the RRF paper).
  float rrf_k = 4;
  // SCORE_BLEND only: per-leg score normalization before combining.
  // Absent = MIN_MAX.
  ScoreNormalization normalization = 6;
  // SCORE_BLEND only: how normalized leg scores combine. Absent =
  // ARITHMETIC.
  ScoreCombination combination = 7;
  // Vector-score floor on the RESULT SET: every returned hit must have
  // a vector-leg score >= this (docs absent from the vector leg are
  // dropped too). Applied BEFORE fusion, truncation, and boost, so
  // deeper qualifying docs are promoted rather than the list just
  // shrinking, and (SCORE_BLEND) normalization statistics are computed
  // over the filtered retained set. Score-defined, hence
  // layout-invariant. Applies to every mode including cascade (where
  // it tightens the phase-1 gate before the BM25 rerank). 0 = off.
  float min_vector_score = 8;
}

// One hybrid query against a shard (internal). The shard runs BOTH legs
// locally — the chunked vector scan and the BM25 scoring with the
// supplied global stats — and fuses them with RRF before returning.
// Per-shard-then-coordinator is the settled two-level fusion design; the
// shared positional doc-ID space is what lets one shard's legs rank the
// same ids.
message HybridShardRequest {
  // Coordinator-assigned request id (log correlation only).
  string request_id = 1;
  // Depth of each leg AND of the fused shard list (the coordinator's
  // leg_k).
  uint32 k = 2;
  // Vector leg query (shard dim).
  repeated float vector = 3;
  // BM25 leg query terms (already analyzed by the coordinator).
  repeated string terms = 4;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 5;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 6;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 7;
  // RRF weight of the vector leg; 0 = default 1.0.
  float vector_weight = 8;
  // RRF weight of the BM25 leg; 0 = default 1.0.
  float bm25_weight = 9;
  // RRF constant; 0 = default 60.
  float rrf_k = 10;
  // BM25 k1 for the BM25 leg; 0 selects the default (1.2). The
  // coordinator forwards its configured params; before this field the
  // leg always scored with defaults regardless of tuning.
  float k1 = 11;
  // BM25 b for the BM25 leg; 0 selects the default (0.75).
  float b = 12;
  // Stats-epoch claim for the BM25 leg's global stats; see
  // Bm25QueryRequest.expected_stats_epoch. 0 = no claim.
  uint64 expected_stats_epoch = 13;
  // Filters applied to BOTH legs of this shard's hybrid work: the same
  // allowlist gates the vector scan and the lexical heap, so the fused
  // list cannot mix a filtered half with an unfiltered one. A document
  // with no value for a filtered column fails the filter, the same
  // absence rule the lexical leg documents.
  repeated GeoFilter geo_filters = 14;
  // Compiled filter tree (see FilterExpr), ANDed with `geo_filters`
  // when both are set. Absent = no filter.
  FilterExpr filter = 15;
}

// One fused hit in a shard's hybrid result, with per-leg provenance.
message HybridLegHit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // Shard-level fused RRF score.
  float fused_score = 2;
  // 1-based rank in the shard's vector leg. Absent when the doc is not in
  // that leg's fetched depth.
  optional uint32 vector_rank = 3;
  // Raw vector score (turbovec; comparable across shards via shared
  // calibration).
  float vector_score = 4;
  // 1-based rank in the shard's BM25 leg. Absent when not in that leg.
  optional uint32 bm25_rank = 5;
  // Raw BM25 score (computed with global stats; comparable across shards).
  float bm25_score = 6;
}

// A shard's fused hybrid top-k.
message HybridShardResponse {
  // Fused hits, shard-level RRF score descending.
  repeated HybridLegHit hits = 1;
  // Whether this shard's geo table has each requested filter's column,
  // parallel to the request's `geo_filters` (empty when none were
  // sent), and whether it can resolve each leaf of the request's
  // `filter` in `walk_leaves` order (empty when none was sent). The
  // coordinator refuses a column NO shard knows: filtering on a typo
  // would otherwise read as an honest empty result set.
  repeated bool geo_columns_known = 2;
  repeated bool filter_columns_known = 3;
}

// A second-pass lexical boost applied AFTER fusion (the rescore-window
// pattern): the top `window` hits are rescored as
//
//   final = base_weight * base + boost_weight * bm25(text)
//
// and reordered by it; hits beyond the window keep their relative order
// after the reordered window. `base` is the mode's ordering score: the
// fused score for the fused modes, the phase-2 BM25 score for cascade.
// The boost BM25 runs CANDIDATE-SCOPED through NodeService.Bm25Rescore
// with global stats fetched for the boost terms, so a boost costs one
// TermStats fan-out plus one Bm25Rescore per owning shard — never a
// full postings walk.
//
// Scale note: `base` and the boost BM25 live on unrelated scales (RRF
// fused scores are ~1/rrf_k; BM25 is unbounded), exactly as in the
// classic rescore pattern — the weights are the scale knob, and hits
// carry `boost_score` separately so clients can see both parts.
message BoostRescore {
  // Boost query text, analyzed with the request's `analysis` options
  // (same identity rules as the main query). Must be non-empty.
  string text = 1;
  // How many top hits are rescored. 0 = the whole result list.
  uint32 window = 2;
  // Weight of the base score. 0 = default 1.0.
  float base_weight = 3;
  // Weight of the boost BM25 score. 0 = default 1.0.
  float boost_weight = 4;
}

// Client-facing hybrid (vector + BM25) search request.
message HybridSearchRequest {
  // Optional caller id; assigned when empty and echoed back.
  string request_id = 1;
  // BM25 leg query text, analyzed with `analysis` (same options as
  // ingest).
  string text = 2;
  // Vector leg query.
  repeated float vector = 3;
  // Number of global fused hits to return. Optional: 0 selects the
  // coordinator's `max_k`; above it is refused (see SearchRequest.k).
  uint32 k = 4;
  // Analysis options for the BM25 leg query.
  AnalysisSpec analysis = 5;
  // Per-leg fusion options; absent = defaults (see HybridLegOptions).
  HybridLegOptions legs = 6;
  // When true, the response's `debug` block carries coordinator phase
  // timings, per-shard leg wall times and depths, and (cascade) the
  // vector scan's stats — the explain/profile surface. Costs a few
  // clock reads; results are unchanged.
  bool debug = 7;
  // Optional second-pass boost over the top hits (any fusion mode).
  BoostRescore boost = 8;
  // Geo filters (docs/geo-columns.md), forwarded verbatim to every
  // shard and applied to the vector scan as a slot allowlist before
  // the kernel scores anything (docs/vector-filters.md). ALL filters
  // must pass (AND semantics), and they AND with `filter`.
  repeated GeoFilter geo_filters = 9;
  // Filter expression in CEL surface syntax (docs/cel-filters.md),
  // compiled ONCE at the coordinator into the FilterExpr IR and
  // resolved per shard. Empty = no filter. A syntax error, an
  // unsupported construct, or a column no shard knows is refused by
  // name; a filter is never reinterpreted into something that runs.
  string filter = 10;
  // Both filters gate BOTH legs. The hybrid route used to refuse them
  // outright, because filtering only the lexical half would have been
  // a lie about the result set; the vector leg now applies the same
  // allowlist, so a fused hit is a document that passed every filter
  // on whichever leg found it.
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 11;
}

// Profile of one hybrid query; populated only when the request set
// `debug`.
message HybridDebug {
  // The fusion mode that actually ran.
  FusionMode fusion_mode = 1;
  // Effective per-leg depth after defaulting and clamping.
  uint32 leg_k = 2;
  // Query terms after analysis: the BM25 leg's identity.
  repeated string terms = 3;
  // Coordinator phases, milliseconds of wall time. `legs_ms` covers the
  // whole shard fan-out (for cascade: both phases); `fusion_ms` the
  // coordinator-side merge and fuse.
  float analysis_ms = 4;
  float stats_ms = 5;
  float legs_ms = 6;
  float fusion_ms = 7;
  float total_ms = 8;
  // Per-shard visibility, in shard order.
  repeated HybridShardDebug shards = 9;
  // Wall time of the boost pass (boost analysis + stats + rescore
  // fan-out), included in total_ms; 0 when no boost was requested.
  float boost_ms = 10;
  // The boost query's terms after analysis; empty without boost.
  repeated string boost_terms = 11;
}

// One shard's contribution to a hybrid query.
message HybridShardDebug {
  // Shard index in fan-out order.
  uint32 shard = 1;
  // Wall time of this shard's leg work as measured at the coordinator:
  // the ShardLegs / HybridShard RPC, or for cascade the phase-1
  // SearchShard stream plus this shard's phase-2 Bm25Rescore.
  float rpc_ms = 2;
  // Hits this shard returned per leg; for cascade: phase-1 candidates
  // generated / phase-2 candidates rescored on this shard.
  uint32 vector_hits = 3;
  uint32 bm25_hits = 4;
  // Cascade only: the phase-1 vector scan's stats.
  ShardScanStats scan = 5;
}

// One fused hit, with per-leg provenance from the owning shard so clients
// can see WHY it ranked. A doc present in only one leg has no rank for
// the other leg.
message HybridHit {
  // Global doc id.
  uint64 doc_id = 1;
  // The coordinator-level fused score: RRF for GLOBAL_RANK/TWO_LEVEL,
  // the normalized combination for SCORE_BLEND, and the raw weighted
  // sum vector_weight * v + bm25_weight * b for DECOMPOSED.
  float fused_score = 2;
  // Shard that owns the doc.
  uint32 shard = 3;
  // 1-based rank in the owning shard's vector leg (absent if not in it).
  optional uint32 vector_rank = 4;
  // Raw vector score.
  float vector_score = 5;
  // 1-based rank in the owning shard's BM25 leg (absent if not in it).
  optional uint32 bm25_rank = 6;
  // Raw BM25 score (global stats).
  float bm25_score = 7;
  // Raw BM25 score of the boost query against this doc (global stats
  // over the BOOST terms). 0 when no boost was requested, the doc fell
  // outside the boost window, or no boost term matches it. When a boost
  // ran, the window is ordered by
  // base_weight * fused_score + boost_weight * boost_score.
  float boost_score = 8;
}

// Client-facing hybrid search response.
message HybridSearchResponse {
  // Echoes the request id (or the assigned one).
  string request_id = 1;
  // Global fused top-k: coordinator-level RRF score descending, ties by
  // shard then doc id. Populated for FUSION_MODE_GLOBAL_RANK and
  // FUSION_MODE_TWO_LEVEL.
  repeated HybridHit hits = 2;
  // Cascade top-k (BM25 rerank order; pool beyond k is truncated here).
  // Populated for FUSION_MODE_CASCADE; `hits` is then empty.
  repeated CascadeHit cascade_hits = 3;
  // The profile block; present only when the request set `debug`.
  HybridDebug debug = 4;
}

// A shard's raw per-leg lists for a hybrid query (FUSION_MODE_GLOBAL_RANK).
message ShardLegsRequest {
  // Coordinator-assigned request id (log correlation only).
  string request_id = 1;
  // Depth of each leg (the coordinator's leg_k).
  uint32 k = 2;
  // Vector leg query (shard dim).
  repeated float vector = 3;
  // BM25 leg query terms (already analyzed by the coordinator).
  repeated string terms = 4;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 5;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 6;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 7;
  // BM25 k1 for the BM25 leg; 0 selects the default (1.2). The
  // coordinator forwards its configured params; before this field the
  // leg always scored with defaults regardless of tuning.
  float k1 = 8;
  // BM25 b for the BM25 leg; 0 selects the default (0.75).
  float b = 9;
  // Stats-epoch claim for the BM25 leg's global stats; see
  // Bm25QueryRequest.expected_stats_epoch. 0 = no claim.
  uint64 expected_stats_epoch = 10;
  // Filters applied to BOTH legs of this shard's leg work; see
  // HybridShardRequest.
  repeated GeoFilter geo_filters = 11;
  // Compiled filter tree (see FilterExpr), ANDed with `geo_filters`
  // when both are set. Absent = no filter.
  FilterExpr filter = 12;
}

// One raw leg hit.
message RawLegHit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // Raw leg score; globally comparable per leg by the caller's
  // construction (shared calibration / global BM25 stats).
  float score = 2;
}

// A shard's unfused legs, each score-descending.
message ShardLegsResponse {
  // Vector leg top-k, raw scores.
  repeated RawLegHit vector_hits = 1;
  // BM25 leg top-k, raw scores (global stats).
  repeated RawLegHit bm25_hits = 2;
  // Whether this shard's geo table has each requested filter's column,
  // parallel to the request's `geo_filters` (empty when none were
  // sent), and whether it can resolve each leaf of the request's
  // `filter` in `walk_leaves` order (empty when none was sent). The
  // coordinator refuses a column NO shard knows: filtering on a typo
  // would otherwise read as an honest empty result set.
  repeated bool geo_columns_known = 3;
  repeated bool filter_columns_known = 4;
}

// Pushes one TQ+ calibration to every shard (see
// SearchService.BroadcastCalibration).
message BroadcastCalibrationRequest {
  // Vector dimensionality.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Per-coordinate calibration shift (length `dim`).
  repeated float shift = 3;
  // Per-coordinate calibration scale (length `dim`).
  repeated float scale = 4;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 5;
}

// One node's outcome of a calibration broadcast.
message CalibrationApplyResult {
  // The node address, as configured on the coordinator.
  string node = 1;
  // Whether the calibration was applied (or was already locked
  // identically).
  bool ok = 2;
  // True when the node already had this exact calibration locked.
  bool already_seeded = 3;
  // The failure reason when `ok` is false (for example a non-empty shard,
  // which locks calibration for the index lifetime).
  string error = 4;
}

// Per-node outcomes of a calibration broadcast, in configured node order.
message BroadcastCalibrationResponse {
  // One result per configured node.
  repeated CalibrationApplyResult results = 1;
}

message BroadcastVectorBackendRequest {
  uint32 dim = 1;
  VectorBackendConfig config = 2;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 3;
}

message VectorBackendApplyResult {
  string node = 1;
  bool ok = 2;
  bool already_configured = 3;
  string error = 4;
}

message BroadcastVectorBackendResponse {
  repeated VectorBackendApplyResult results = 1;
}

// Candidate-scoped BM25 scoring: phase 2 of the cascade fusion mode.
// The coordinator routes each candidate's id to its owning shard; the
// shard scores just those ids against its postings (intersection over
// the append-only, doc-id-sorted postings lists, not a full walk) with
// the supplied GLOBAL stats, so scores are cross-shard comparable.
message Bm25RescoreRequest {
  // Query terms (already analyzed by the coordinator).
  repeated string terms = 1;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 2;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 3;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 4;
  // Global candidate doc ids to score. Ids outside this shard's range
  // (or with no postings) are ignored.
  repeated uint64 candidate_ids = 5;
  // BM25 k1; 0 selects the default (1.2).
  float k1 = 6;
  // BM25 b; 0 selects the default (0.75).
  float b = 7;
  // Stats-epoch claim for the global stats above; see
  // Bm25QueryRequest.expected_stats_epoch. 0 = no claim.
  uint64 expected_stats_epoch = 8;
  // Monotonic score-function stages, applied on the shard before the
  // final f32 conversion exactly as on the ordinary BM25 route.
  repeated ScoreStage score_stages = 9;
}

// BM25 scores for the requested candidates, doc id ascending.
message Bm25RescoreResponse {
  // One hit per candidate that scored above zero.
  repeated Bm25Hit hits = 1;
  // Per requested stage, true when this shard resolved its column.
  // The coordinator rejects a stage no shard resolves.
  repeated bool stage_columns_known = 2;
}

// Candidate-scoped value evaluation (see NodeService.FetchValues).
message FetchValuesRequest {
  // Global candidate doc ids. Ids outside this shard's range are
  // ignored; duplicates collapse.
  repeated uint64 candidate_ids = 1;
  // Compiled projections (the internal fan-out form, compiled once at
  // the coordinator), evaluated per candidate with the ordinary value
  // semantics: absence in, absence out.
  repeated CompiledProjection projections = 2;
  // Score stages, each evaluated at its IDENTITY score per candidate:
  // the factor for the multiplicative ops (exp decay, log boost, geo
  // decay), the addend for ADD_LINEAR. A candidate without the value
  // is absent — identity, which a stored-value scorer dimension reads
  // as a missing signal. Parameters follow the stage admission rules.
  repeated ScoreStage stages = 3;
}

// One candidate's evaluated values.
message FetchedRow {
  // Global doc id.
  uint64 doc_id = 1;
  // Aligned with the request's projections. Unset oneof = absence.
  repeated ProjectedValue values = 2;
  // Aligned with the request's stages: the identity-score
  // contribution as a double, or absent.
  repeated ProjectedValue stage_values = 3;
}

// The candidates this shard owns, doc id ascending.
message FetchValuesResponse {
  repeated FetchedRow rows = 1;
  // Whether this shard resolved each stage's column, parallel to
  // `stages` (empty when none were sent). A shard without the column
  // answered absence for all its documents — exact — but the
  // coordinator refuses a column NO shard knows (the typo rule, as
  // everywhere).
  repeated bool stage_columns_known = 2;
  // Whether this shard resolved each projection column-read leaf, in
  // the same depth-first wire order as
  // Bm25QueryResponse.projection_leaves_known; the coordinator applies
  // the same typo rule.
  repeated bool projection_leaves_known = 3;
}

// Candidate-scoped vector scoring (see NodeService.VectorRescore).
message VectorRescoreRequest {
  // The query vector (shard dim).
  repeated float vector = 1;
  // Global candidate doc ids to score. Ids outside this shard's range,
  // or beyond its live slots, are ignored.
  repeated uint64 candidate_ids = 2;
}

// Scores for the requested candidates present on this shard, score
// descending. A shard with no index answers empty (it holds none of
// the candidates).
message VectorRescoreResponse {
  repeated RawLegHit hits = 1;
}

// Candidate-scoped original-vector scoring (see
// NodeService.ExactVectorRescore).
message ExactVectorRescoreRequest {
  repeated float vector = 1;
  repeated uint64 candidate_ids = 2;
  // Per-shard logical row-byte ceiling. Zero means the caller already
  // enforced its own bound. A node refuses before touching row payload when
  // its owned candidates exceed this value.
  uint64 max_logical_bytes = 3;
}

message ExactVectorRescoreResponse {
  // One row per distinct requested id owned by this shard, in request order.
  repeated RawLegHit hits = 1;
  uint64 logical_bytes = 2;
  uint64 pages_touched = 3;
  uint32 tasks = 4;
}

// One cascade hit: the two leg scores as SEPARATE fields (no fused
// score) plus the final rerank rank.
message CascadeHit {
  // Global doc id.
  uint64 doc_id = 1;
  // Final 1-based rank after the BM25 rerank (BM25 desc, vector desc,
  // doc id asc).
  uint32 rank = 2;
  // Shard that owns the doc.
  uint32 shard = 3;
  // Raw vector score from phase 1 (shared calibration; globally
  // comparable).
  float vector_score = 4;
  // Raw BM25 score from phase 2 (global stats; globally comparable).
  float bm25_score = 5;
  // Raw BM25 score of the boost query (see HybridHit.boost_score; for
  // cascade the boosted window orders by
  // base_weight * bm25_score + boost_weight * boost_score, and `rank`
  // reflects the final order).
  float boost_score = 6;
}

// One labelled query configuration to evaluate.
//
// A variant carries a whole request rather than a set of overrides so
// that anything the engine can be asked is something the engine can A/B,
// including comparisons across kinds: BM25-only against hybrid answers
// "is the vector leg earning its latency", which an overrides-shaped
// message could not express.
message SearchVariant {
  // Caller's name for this configuration ("control", "normalized-stems").
  // Echoed on every result and diff; must be non-empty and unique within
  // the request, because the diffs are unreadable if two arms share a
  // name.
  string label = 1;
  // The query to run. Its own `k` and `request_id` are ignored: depth is
  // shared across the request so the rankings are comparable, and the
  // request id is assigned once for the whole comparison.
  oneof query {
    Bm25SearchRequest bm25 = 2;
    HybridSearchRequest hybrid = 3;
  }
}

// Evaluate several query configurations over one corpus.
message VariantSearchRequest {
  // Optional caller id; assigned when empty and echoed back.
  string request_id = 1;
  // The configurations to compare, in order. At least two. The FIRST is
  // the reference for every diff (conventionally the incumbent), which is
  // what makes score_regret's asymmetry well defined.
  repeated SearchVariant variants = 2;
  // Depth for every variant and for the diffs. Applied to all arms, since
  // rankings truncated at different depths are not comparable. Optional:
  // 0 selects the coordinator's `max_k`; above it is refused (see
  // SearchRequest.k). An arm's own `k` is always overridden by this one.
  uint32 k = 3;
  // RBO persistence: the probability a reader continues to the next rank,
  // so 0.9 weights roughly the first ten results. 0 selects 0.9.
  float rbo_p = 4;
  // When true, also return the two variants' results merged by team-draft
  // interleaving, ready to serve to a user whose selection then credits
  // one arm. Requires EXACTLY two variants: team draft is a two-way
  // method, and an "interleaving" of three arms would be a different
  // algorithm wearing the same name.
  bool interleave = 5;
  // Seed for the interleaving's tie-breaking coin. 0 derives a stable
  // seed from the first variant's query text, which keeps a re-run of the
  // same query reproducible while still varying across queries. Set it
  // explicitly only to replay a specific past interleaving.
  uint64 interleave_seed = 6;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 7;
}

// One variant's ranking.
message VariantResult {
  // The variant's label, echoed.
  string label = 1;
  // The top-k, best first. Ids and scores only: this message exists to be
  // compared, and per-term occurrences would multiply the response by the
  // number of arms. Re-issue the winning variant as an ordinary request
  // for the full hit detail.
  repeated RankedHit hits = 2;
  // Wall time of this variant's fan-out, measured at the coordinator.
  // Variants run one after another, not concurrently, so this is the
  // configuration's own cost rather than its share of a contended fleet.
  float elapsed_ms = 3;
}

// A ranked result reduced to what a comparison needs.
message RankedHit {
  // Global doc id.
  uint64 doc_id = 1;
  // The variant's own score for it: fused score for a hybrid variant, the
  // (possibly multi-field) BM25 score for a BM25 variant. Comparable
  // WITHIN a variant, and across variants only when they score the same
  // way — which is why the diffs below lean on rank, and why score_regret
  // reads its scores from the reference alone.
  float score = 2;
}

// How far one variant's ranking sits from the reference's.
//
// These measure disagreement, not quality. Nothing here says which arm is
// better; that needs labels, or the interleaving's selections.
message RankingDiff {
  // Label of the reference arm (the request's first variant).
  string reference = 1;
  // Label of the arm being compared to it.
  string variant = 2;
  // Ranks compared: min(k, both list lengths).
  uint32 depth = 3;
  // Documents present in both top-`depth` sets.
  uint32 overlap = 4;
  // `overlap` as a fraction of `depth`; 1.0 means the same set in any
  // order.
  float overlap_fraction = 5;
  // Kendall tau-b over the UNION of both rankings: +1 identical order, -1
  // reversed, 0 no association. Documents one arm omitted are ranked past
  // the end of its list rather than dropped, so omission counts as the
  // disagreement it is.
  float kendall_tau = 6;
  // Truncated rank-biased overlap at the request's `rbo_p`: like overlap
  // but top-weighted, so a swap at rank 1 costs far more than one at rank
  // 50. Truncated means it assumes nothing about the unseen tail and is
  // therefore a LOWER bound.
  float rbo = 7;
  // Mean reference score given up per compared rank: at each rank, the
  // reference's score there minus the reference's score of whatever this
  // variant put there. Both sides are measured by the reference's
  // yardstick, so only the selection differs.
  //
  // This measures the SET and not the order — any reordering of the same
  // documents cancels to exactly 0. Read it WITH kendall_tau: a large tau
  // change at zero regret is the near-duplicate shuffle signature, while
  // real regret means the variant reached for worse documents.
  //
  // The SIGN is only meaningful when regret_unscored below is 0. The
  // cancellation needs the compared ranks to be a permutation of the
  // reference's own prefix, and skipped ranks break that, so a divergent
  // variant can report a negative mean that says nothing about quality.
  float score_regret = 8;
  // Ranks where both the reference and the variant's document had a
  // reference score, so the regret term above is a mean over these.
  uint32 regret_counted = 9;
  // Variant documents the reference never scored. Not averaged in: they
  // may be better or worse and this measure cannot tell, so they are
  // reported instead of being silently absorbed into the mean. A high
  // count means the arms have diverged past what regret can judge.
  uint32 regret_unscored = 10;
  // Whether the two arms disagree about the single best result — the
  // difference a user is most likely to notice, and easily invisible in
  // an aggregate.
  bool top1_flipped = 11;
}

// Which arm contributed an interleaved result.
enum InterleaveTeam {
  // Unused zero value.
  INTERLEAVE_TEAM_UNSPECIFIED = 0;
  // The request's first variant.
  INTERLEAVE_TEAM_A = 1;
  // The request's second variant.
  INTERLEAVE_TEAM_B = 2;
}

// Two variants merged into the one list a user sees.
//
// Team-draft interleaving alternates which arm contributes the next
// result, so both get equal exposure within a single query and a
// selection is evidence about the ranking rather than about the position.
// A document both arms returned is contributed once and credits neither
// beyond that: results the arms agree on carry no information, and
// counting them would drown the disagreements that discriminate.
message Interleaving {
  // The merged list, in display order.
  repeated uint64 doc_ids = 1;
  // Contributing arm per position; parallel to `doc_ids`.
  repeated InterleaveTeam teams = 2;
  // The seed actually used, so the exact merge can be replayed.
  uint64 seed = 3;
}

// The comparison.
message VariantSearchResponse {
  // Echoes the request id (or the assigned one).
  string request_id = 1;
  // One entry per variant, in request order.
  repeated VariantResult results = 2;
  // Every variant after the first, diffed against the first.
  repeated RankingDiff diffs = 3;
  // Present only when the request asked to interleave.
  Interleaving interleaving = 4;
}

// ---------------------------------------------------------------------------
// The public Query surface (docs/query-api.md). The contract separates
// three things that are easy to conflate: SELECTION decides membership
// and produces base relevance signals; a BOOST scores only the fixed
// candidate set and never admits a document; the strategy defines how
// selection signals establish the base order. Increment 1 implements
// the adapter over the routes that already exist (see rpc Query).

// The public query request.
message QueryRequest {
  // Optional caller id; assigned when empty and echoed back.
  string request_id = 1;
  // Final hits returned. Same guardrail as every route: 0 selects the
  // coordinator's max_k; above max_k is refused, never clamped.
  uint32 k = 2;
  // Candidate-set depth for the selection phase: leg depth for the
  // composite strategies, gate depth for cascade, and the pool a boost
  // rescoring runs over. 0 = k. Must satisfy k <= selection_k; the
  // response is the best k of the selection_k candidates under the
  // final order (docs/query-api.md, the honest form of the
  // rescore-window behavior).
  uint32 selection_k = 3;
  // The selection tree. Required.
  SelectionQuery selection = 4;
  // Candidate-scoped boosts: lexical or dense, on any SCORED
  // selection (a browse has no base order to boost). A boost never
  // admits a document. Without a scorer exactly one boost is served —
  // its base_weight/boost_weight reorder is the combination; multiple
  // boosts require the composite scorer, which owns combination and
  // consumes each boost's relevance as a named signal. A boost makes
  // selection_k meaningful on single-leaf shapes: it is the pool the
  // boost rescores (the honest form of the rescore window), and a
  // boosted query pages within it.
  repeated BoostQuery boosts = 5;
  // The generic named-dimension composite scorer (docs/query-api.md):
  // combines the base order and the named raw signals into the FINAL
  // order, with per-dimension provenance on every hit
  // (QueryHit.dimensions). Runs after selection (and after boost
  // signals are computed) over the fixed selection_k candidate set, so
  // it can never invalidate a first-stage pruning certificate.
  // Requires a SCORED selection: a browse has no relevance signals to
  // combine. Because normalization statistics depend on the candidate
  // pool, a scored query pages WITHIN its fixed selection_k pool,
  // exactly like a composite; selection_k is therefore meaningful on
  // single-leaf shapes when a scorer is present (the pool the scorer
  // reorders).
  CompositeScorer scorer = 6;
  // Profile timings: when true the response carries QueryProfile.
  // Timings never alter results — the same request with profile off
  // returns the identical hits, bitwise.
  bool profile = 7;
  // Resume token from a previous response's `next_cursor`
  // (docs/query-api.md): search-after paging. The rest of the request
  // must repeat the original query verbatim; the page returned is the
  // k hits strictly after the cursor's boundary in the current order.
  //
  // The token embeds the boundary hit's (rank, score bits, doc id).
  // Resumption re-finds that exact hit — bitwise — and refuses with
  // FAILED_PRECONDITION when it is gone or its score moved: search is
  // bitwise deterministic here, so an exact match is the corpus-state
  // check, and a mismatch means the corpus changed under the cursor.
  // Documents ingested after the first page that rank before the
  // boundary are skipped (standard search-after semantics).
  //
  // Depth rules: a single-leaf query pages by fetching deeper (its
  // order is depth-independent by the exact top-k prefix property),
  // capped by max_k. A composite pages WITHIN its fixed selection_k
  // candidate set — the fusion strategies' orders are depth-dependent
  // (RRF ranks, blend normalization, the cascade gate), so the pool is
  // never silently deepened; an exhausted pool refuses and names
  // selection_k as the knob.
  string cursor = 8;
  // Order the result by a column instead of by relevance
  // (docs/query-api.md). Increment 1: browse selections only — a
  // column order over a SCORED selection must re-argue the pruning
  // certificate (block-max bounds the score, not the column) and is
  // refused by name until that path exists. The column must be an i64
  // or f64 column; documents without a value are excluded, because
  // absence has no honest position in a column order.
  QuerySort sort = 9;

  // Query-time projections (docs/cel-values.md), by name per hit. Routes
  // without inline projection support use candidate-scoped FetchValues.
  repeated NamedProjection projections = 10;
  // Optional optimistic topology stamp. Zero accepts the coordinator's
  // current generation. A nonzero mismatch fails before analysis or fan-out,
  // so a retry can never silently cross a live reshard cutover.
  uint64 required_topology_generation = 11;
  // Server-side snippets on each hit (docs/highlighting.md). Served for
  // the single lexical selection; every other shape refuses by name,
  // because only the lexical leg carries the occurrence spans snippets
  // are cut around.
  HighlightSpec highlight = 12;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 13;
}

// A column sort order for browse.
message QuerySort {
  string column = 1;
  bool descending = 2;
}

// One node of the selection tree.
message SelectionQuery {
  oneof node {
    SearchQuery search = 1;
    FilterQuery filter = 2;
    CompositeSearchStrategy composite = 3;
    BooleanQuery boolean = 4;
  }
}

// Recursive boolean selection. Search, filter, and nested BooleanQuery nodes
// may appear in any clause list. Dense and lexical search clauses provide the
// hybrid signal set; legacy CompositeSearchStrategy stays a top-level
// compatibility shape. Membership follows
// must/should/must_not/minimum_should_match; relevance is the sum of matching
// positive scoring clauses unless QueryRequest.scorer explicitly replaces the
// combination. Evaluation resolves exact shard membership bitmaps, applies
// boolean set algebra, then scores only the surviving candidates.
message BooleanQuery {
  repeated SelectionQuery must = 1;
  repeated SelectionQuery should = 2;
  repeated SelectionQuery must_not = 3;
  // Zero resolves to 1 when there are SHOULD clauses and no MUST clauses,
  // otherwise 0. A value above should.size is refused.
  uint32 minimum_should_match = 4;
  // Optional exact aggregation over the final boolean match set. Its own
  // filter/geo fields must be empty because selection already owns membership.
  AggregateRequest aggregate = 5;
}

// A scoring leaf. Its raw relevance is a named signal, reported per
// hit under `id`.
message SearchQuery {
  // Request-unique id, required. Names this leaf's signal in hit
  // provenance and in strategy references (CascadeScore.gate_id).
  string id = 1;
  oneof query {
    LexicalQuery lexical = 2;
    DenseQuery dense = 3;
  }
}

// BM25 relevance over analyzed terms (the Bm25Search leg).
message LexicalQuery {
  // Query text, analyzed with `analysis`.
  string text = 1;
  // Analysis options; MUST match ingest term identity, as everywhere.
  AnalysisSpec analysis = 2;
  // Bounded score-function chain over stored columns
  // (docs/score-functions.md). Served by a single lexical leaf and by
  // candidate-scoped lexical leaves in recursive BooleanQuery. Legacy
  // CompositeSearchStrategy still refuses stages on hybrid legs.
  repeated ScoreStage score_stages = 3;
  // Ordered-window constraint over the analyzed terms
  // (docs/phrase-proximity.md); served on the single lexical leaf through
  // Bm25Search's phrase route, refused by name elsewhere until certified.
  PhraseMatch phrase = 4;
  // Term prefixes expanded in the field's dictionary
  // (docs/prefix-terms.md); served on the single lexical leaf.
  repeated TermPrefix prefixes = 5;
}

// Dense vector relevance (the Search leg).
enum DenseScoreMode {
  // Backward-compatible provider-native scoring.
  DENSE_SCORE_MODE_UNSPECIFIED = 0;
  DENSE_SCORE_MODE_NATIVE = 1;
  // Select `selection_k` candidates with the configured provider, then
  // replace their scores with product-owned FP32 dot products and reorder
  // that fixed pool. Exact within the pool, not a global recall guarantee.
  DENSE_SCORE_MODE_FP32_RERANK = 2;
}

// How the dense candidate set is selected. This is independent of
// DenseScoreMode: FP32_RERANK may replace scores inside either an exhaustive
// or approximate candidate pool, but it does not turn an approximate pool
// into a corpus-wide exact result.
enum DenseExecutionMode {
  // Backward-compatible exact traversal. Callers that want the planner must
  // opt into AUTO explicitly so a future backend change cannot silently
  // weaken an existing request's quality contract.
  DENSE_EXECUTION_MODE_UNSPECIFIED = 0;
  // Require an exhaustive provider-native traversal and completion
  // certificate. The request is refused if the live provider cannot prove it.
  DENSE_EXECUTION_MODE_EXACT = 1;
  // Accept the live provider's configured approximate traversal. The response
  // reports the provider quality contract; it never claims corpus-wide top-k.
  DENSE_EXECUTION_MODE_ANN = 2;
  // Let the coordinator choose. AUTO is conservative: it uses exact traversal
  // today and will admit ANN only after a generation-bound adaptive policy is
  // installed and qualified for the live provider.
  DENSE_EXECUTION_MODE_AUTO = 3;
}

message DenseQuery {
  // The query vector; length must equal the shard dimension.
  repeated float vector = 1;
  DenseScoreMode score_mode = 2;
  // Optional measured recall policy. This is served only with FP32_RERANK
  // on a single dense selection. When present, QueryRequest.selection_k
  // MUST be zero: the coordinator resolves the candidate depth from its
  // generation-bound quality profile instead of accepting two competing
  // depth authorities.
  DenseQualityPolicy quality = 3;
  // Candidate traversal contract. Unspecified preserves the historical exact
  // behavior; AUTO must be requested explicitly.
  DenseExecutionMode execution_mode = 4;
}

// A request for a measured candidate depth. Recall is expressed in parts per
// million so common targets are exact on the wire: 950000 = 95%, 990000 =
// 99%, 999000 = 99.9%, and 1000000 = every held-out query in the profile.
message DenseQualityPolicy {
  uint32 target_recall_ppm = 1;
  // Optional request-local hard ceiling after profile resolution. Zero uses
  // the coordinator's configured rerank limits. A profile point above this
  // value is refused, never clamped.
  uint32 max_candidates = 2;
  // Optional pin supplied by a client or experiment. When non-empty it must
  // equal the loaded profile's content fingerprint.
  string required_profile_fingerprint = 3;
}

// A membership-only leaf: never contributes a relevance score and
// never appears as a score signal. It stands alone (or ANDs with other
// filters) as a filter-only BROWSE — the admitted documents in global
// id order, the deterministic order the absence of a relevance score
// requires — or attaches to a search structure through an AND wrapper.
// Under OR it is refused: a filter-only admission inside a SCORED
// result has no honest place in that ranking.
message FilterQuery {
  // Request-unique id, required; reported in matched-clause provenance.
  string id = 1;
  oneof predicate {
    // CEL surface syntax (docs/cel-filters.md), compiled once,
    // resolved per shard, three-valued.
    string cel = 2;
    // One typed geo predicate (docs/geo-columns.md).
    GeoFilter geo = 3;
  }
}

// AND/OR over child nodes plus an explicit strategy for how the
// scoring leaves establish the base order. The boolean tree and the
// scoring strategy are distinct on purpose: AND says a document must
// pass both gates; it does not say how two relevance scores combine.
message CompositeSearchStrategy {
  SelectionOperator operator = 1;
  repeated SelectionQuery clauses = 2;
  // Required when this composite holds more than one scoring leaf.
  SelectionScoreStrategy scoring = 3;
}

enum SelectionOperator {
  // Left unset when the strategy itself defines membership (cascade:
  // the gate's admissions are the membership). Naming an operator a
  // cascade contradicts is refused.
  SELECTION_OPERATOR_UNSPECIFIED = 0;
  // Every child must admit. Increment 1: filters-around-a-search-
  // structure only; AND over two scoring leaves has no certifiable
  // engine path yet and is refused by name.
  SELECTION_OPERATOR_AND = 1;
  // Any child admits. Increment 1: exactly one dense and one lexical
  // leaf (the hybrid union), no filter children.
  SELECTION_OPERATOR_OR = 2;
}

// How the scoring leaves of one composite establish the base order.
// Every strategy names its exactness domain in the mode it maps to
// (see FusionMode); a shape the engine cannot certify is refused.
message SelectionScoreStrategy {
  oneof strategy {
    SingleScore single = 1;
    RrfScore rrf = 2;
    BlendScore score_blend = 3;
    DecomposedScore decomposed = 4;
    CascadeScore cascade = 5;
  }
}

// Exactly one scoring leaf; its raw relevance is the base order.
message SingleScore {}

// Global-rank RRF over the leaves (FUSION_MODE_GLOBAL_RANK).
message RrfScore {
  // The RRF constant. 0 = default 60.
  float rrf_k = 1;
  // Per-leaf RRF weights (HybridLegOptions semantics: absent = 1.0,
  // explicit 0 disables the leaf).
  optional float dense_weight = 2;
  optional float lexical_weight = 3;
}

// Retained-set score blend (FUSION_MODE_SCORE_BLEND).
message BlendScore {
  // Per-leg normalization before combining. Absent = MIN_MAX.
  ScoreNormalization normalization = 1;
  // How normalized leg scores combine. Absent = ARITHMETIC.
  ScoreCombination combination = 2;
  optional float dense_weight = 3;
  optional float lexical_weight = 4;
}

// Exact decomposed weighted sum (FUSION_MODE_DECOMPOSED). Both
// weights must be positive; every document in the corpus is
// accounted for.
message DecomposedScore {
  optional float dense_weight = 1;
  optional float lexical_weight = 2;
}

// Gate-and-rerank (FUSION_MODE_CASCADE): the gate leaf's tie-complete
// top selection_k admissions are the membership; the other leaf
// reranks that pool and its score is the base order. The composite's
// operator must be left UNSPECIFIED — membership is the gate's, and
// neither AND nor OR describes it.
message CascadeScore {
  // Which leaf gates. Increment 1: must name the dense leaf (the
  // engine's cascade is vector-gate, BM25-rerank).
  string gate_id = 1;
}

// A candidate-scoped scoring query: runs against the selection's top
// selection_k documents, never the corpus. Its relevance is another
// named signal (under its query's id).
//
// With a composite scorer present the boost is SIGNAL-ONLY: the scorer
// owns combination, so `window`, `base_weight`, and `boost_weight`
// must be left unset (each would be a silent no-op) and the whole
// candidate set is scored — a window would manufacture missing signals
// out of rescore cost, and the pool is already bounded by selection_k.
message BoostQuery {
  // The boost's scoring query: lexical (the Bm25Rescore seam; scored
  // with global stats, comparable across shards) or dense (the
  // VectorRescore seam; bitwise the calibrated products a full search
  // emits). A lexical boost inherits the selection's lexical leaf's
  // analysis when one exists — term identity must match the index the
  // leaf searched, so a spec of its own refuses there; on a dense-only
  // selection it carries its own.
  SearchQuery query = 1;
  // How many top candidates are rescored. 0 = all selection_k.
  uint32 window = 2;
  // Weight of the base (selection) score in the reorder. 0 = 1.0.
  float base_weight = 3;
  // Weight of the boost relevance in the reorder. 0 = 1.0.
  float boost_weight = 4;
}

// The generic named-dimension scorer (docs/query-api.md): explicit
// weights, per-dimension normalization over the candidate pool, an
// explicit missing-signal policy, and per-dimension reporting
// (QueryHit.dimensions) precise enough to recompute the final score
// client-side without reimplementing server arithmetic. All scorer
// arithmetic is f64, evaluated in dimension list order (IEEE ops are
// not associative across reorderings), and the final order is
// composite score descending, doc id ascending.
//
// A dimension is ACTIVE on a hit when it is not disabled (explicit
// zero weight), not skipped by its missing policy, and not skipped by
// the positive-value rule of the geometric/harmonic operations. A
// document with NO active dimension scores 0 under every operation.
message CompositeScorer {
  // Required: an unspecified operation would have to be defaulted
  // silently, which would misreport what ran.
  CompositeScoreOperation operation = 1;
  // At least one dimension, and at least one must not be disabled — an
  // all-disabled scorer would order every document at 0, silently.
  repeated ScoreDimension dimensions = 2;
}

enum CompositeScoreOperation {
  COMPOSITE_SCORE_OPERATION_UNSPECIFIED = 0;
  // S = sum(w_i * n_i) over active dimensions. The one operation that
  // admits a NEGATIVE weight (a penalty term).
  COMPOSITE_SCORE_OPERATION_WEIGHTED_SUM = 1;
  // S = sum(w_i * n_i) / sum(w_i), both over active dimensions.
  COMPOSITE_SCORE_OPERATION_WEIGHTED_MEAN = 2;
  // S = max(w_i * n_i) over active dimensions.
  COMPOSITE_SCORE_OPERATION_MAXIMUM = 3;
  // S = product(w_i * n_i) over active dimensions. Signs multiply;
  // dimensions kept positive keep the product monotone.
  COMPOSITE_SCORE_OPERATION_PRODUCT = 4;
  // Weighted geometric mean over the active dimensions with POSITIVE
  // normalized values, weights renormalized over those (the blend
  // rule, ScoreCombination): S = product(n_i ^ (w_i / W)) with W the
  // positive dimensions' weight sum.
  COMPOSITE_SCORE_OPERATION_GEOMETRIC_MEAN = 5;
  // Weighted harmonic mean over the positive values (same skip rule):
  // S = W / sum(w_i / n_i). The most AND-flavored: dominated by the
  // document's weakest dimension.
  COMPOSITE_SCORE_OPERATION_HARMONIC_MEAN = 6;
}

// One named scoring dimension.
message ScoreDimension {
  // Names this dimension in QueryHit.dimensions. Non-empty, unique
  // among the scorer's dimensions; it MAY deliberately equal the query
  // id it sources (the natural spelling), because the two provenance
  // surfaces are separate.
  string id = 1;
  // Absent = 1.0. An explicit 0 is an explicit disable: the dimension
  // is still evaluated and reported, but excluded from the
  // combination. Must be finite; negative admitted only under
  // WEIGHTED_SUM.
  optional double weight = 2;
  // Where the raw value comes from. Required.
  ScoreSignal source = 3;
  // Normalization over the candidate pool's PRESENT raw values for
  // this dimension. UNSPECIFIED resolves to MIN_MAX, the engine-wide
  // default; NONE is the explicit raw identity. Degenerate pools
  // follow the blend rules: every present value equal (or a single
  // present value) maps to 1.0 under MIN_MAX and 0.0 under Z_SCORE.
  ScoreNormalization normalization = 4;
  // What a candidate without this signal scores. UNSPECIFIED resolves
  // to ZERO (the union-flavored default, matching the blend's
  // absent-leg rule). Policies apply to disabled dimensions too: they
  // are evaluated for reporting, so ERROR still refuses.
  MissingScorePolicy missing = 5;
}

message ScoreSignal {
  oneof source {
    // The first-stage composite base score: the selection strategy's
    // own order (the fused score, a single leaf's raw relevance, or
    // cascade's rerank-leg score). Never missing on a scored
    // selection.
    bool base = 1;
    // A search or boost query's raw relevance, by id. Never a filter
    // (a filter never contributes a relevance score). Missing exactly
    // when the hit's `signals` provenance omits the id.
    string query_relevance_id = 2;
    // A bounded stored-value score function evaluated at its identity
    // score. Not served yet: stored-value dimensions arrive with the
    // candidate-scoped value fetch; until then this source is refused
    // by name.
    ScoreStage bounded_value = 3;
  }
}

enum MissingScorePolicy {
  MISSING_SCORE_POLICY_UNSPECIFIED = 0;
  // The dimension contributes a NORMALIZED zero (not min-max of some
  // raw zero) with its weight still active — under WEIGHTED_MEAN the
  // weight stays in the denominator, proportionally penalizing the
  // document, exactly like the blend's absent-leg rule. The resolved
  // default.
  MISSING_SCORE_POLICY_ZERO = 1;
  // The dimension is excluded from the combination entirely: its
  // weight leaves every sum and renormalization.
  MISSING_SCORE_POLICY_SKIP = 2;
  // A missing signal refuses the whole request with
  // FAILED_PRECONDITION naming the document and the dimension: the
  // caller asserted every candidate carries this signal, and a
  // candidate without it is evidence the assertion is wrong.
  MISSING_SCORE_POLICY_ERROR = 3;
}

// The public query response.
message QueryResponse {
  // Echoes `QueryRequest.request_id` (or the assigned one).
  string request_id = 1;
  // The best k documents under the final order: score descending,
  // deterministic tie-break (score desc, doc id asc).
  repeated QueryHit hits = 2;
  // The route and strategy that actually ran, e.g. "bm25_search",
  // "search", "hybrid_search:global_rank" — the strategy-and-defaults
  // echo the contract requires, in executable terms.
  string executed = 3;
  // Resume token for the next page (QueryRequest.cursor). Empty when
  // this page was short of k — there is provably nothing after it at
  // the served depth.
  string next_cursor = 4;
  // Phase timings, present exactly when the request set `profile`.
  QueryProfile profile = 5;
  // Present when a DenseQualityPolicy selected the FP32 rerank pool. Unlike
  // timing profile data this provenance is always returned: callers can see
  // which measured contract chose the candidate depth.
  DenseQualityOutcome dense_quality = 6;
  // Present for every selection containing a dense leaf. This is semantic
  // provenance, not optional timing data: it states what traversal actually
  // ran and which live provider contract justified that choice.
  DenseExecutionOutcome dense_execution = 7;
  // Immutable topology snapshot used for the whole request.
  uint64 served_topology_generation = 8;
  // Present when the root BooleanQuery requested an exact aggregation over
  // its full match set (not merely the returned page).
  AggregateResponse aggregate = 9;
}

message DenseQualityOutcome {
  uint32 target_recall_ppm = 1;
  uint32 selection_k = 2;
  string profile_fingerprint = 3;
  string profile_id = 4;
  string embedding_model = 5;
  uint64 corpus_generation = 6;
  uint64 corpus_rows = 7;
  string provider_backend = 8;
  string scoring_fingerprint = 9;
}

message DenseExecutionOutcome {
  // The wire value supplied by the caller. UNSPECIFIED is retained here even
  // though it resolves to EXACT for backward compatibility.
  DenseExecutionMode requested_mode = 1;
  // The traversal that actually ran. Never UNSPECIFIED on success.
  DenseExecutionMode resolved_mode = 2;
  string provider_backend = 3;
  VectorQualityContract quality_contract = 4;
  string scoring_fingerprint = 5;
  // True only when every shard/provider advertised and completed an
  // exhaustive traversal contract. False is not an error for explicit ANN.
  bool exhaustive_completion = 6;
  // Stable, human-readable planner explanation for logs and experiments.
  string planner_reason = 7;
  // AUTO provenance: the generation-bound policy that admitted the resolved
  // traversal, and the point it matched. Empty when AUTO resolved to EXACT on
  // an exhaustive provider, and for explicit EXACT/ANN requests.
  string policy_id = 8;
  string policy_fingerprint = 9;
  DensePolicyPoint policy_point = 10;
  // The live request key AUTO was judged on: filter selectivity in parts per
  // million of the corpus (1,000,000 when unfiltered) and the candidate depth
  // the providers were asked for. Set whenever a policy was consulted.
  uint32 filter_selectivity_ppm = 11;
  uint32 candidate_depth = 12;
}

// One measured point of a dense execution policy
// (docs/dense-execution-policy.md): the exact key a request must match and
// the recall measured there against the exhaustive traversal.
message DensePolicyPoint {
  uint32 k = 1;
  uint32 filter_selectivity_ppm_min = 2;
  uint32 filter_selectivity_ppm_max = 3;
  uint32 candidates = 4;
  uint32 measured_recall_ppm = 5;
}

// Public streaming query controls. The query itself is byte-for-byte the
// ordinary Query contract and the terminal successful response is exactly
// what Query would return.
message QueryStreamRequest {
  QueryRequest query = 1;
  // Whole-query deadline from stream acceptance through terminal completion.
  // 0 means no additional deadline beyond transport and shard limits.
  uint64 timeout_ms = 2;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 3;
}

enum QueryStreamPhase {
  QUERY_STREAM_PHASE_UNSPECIFIED = 0;
  QUERY_STREAM_PHASE_ACCEPTED = 1;
  QUERY_STREAM_PHASE_LEXICAL = 2;
  QUERY_STREAM_PHASE_DENSE = 3;
  QUERY_STREAM_PHASE_HYBRID = 4;
  QUERY_STREAM_PHASE_FINAL = 5;
}

// One provisional ranked hit. It deliberately carries only stable identity
// and score: highlights, projections, boosts, and scorer dimensions become
// authoritative in the terminal QueryResponse after their phases complete.
message QueryStreamHit {
  uint64 doc_id = 1;
  float score = 2;
  uint32 rank = 3;
}

// A complete replacement snapshot. Clients apply the greatest revision they
// have seen and discard older ones; no patch replay or arrival-order merge is
// required. `content_fingerprint` hashes phase plus ordered (id, score-bits)
// rows, making duplicate snapshots and deterministic retries observable.
message QueryStreamRevision {
  uint64 revision = 1;
  QueryStreamPhase phase = 2;
  repeated QueryStreamHit hits = 3;
  string content_fingerprint = 4;
  // Score-space identity when the collector has certified it. Empty on the
  // accepted revision and on a provisional collector awaiting completions.
  string scoring_fingerprint = 5;
}

// The only terminal shape. `response` is present exactly on success.
message QueryStreamCompletion {
  bool completed = 1;
  QueryResponse response = 2;
  // Last emitted revision. A successful completion is itself represented by
  // a FINAL revision immediately before this certificate.
  uint64 final_revision = 3;
  // Distinct lexical/vector score-space identities observed during the run,
  // sorted lexicographically for a stable wire representation.
  repeated string scoring_fingerprints = 4;
  // Canonical tonic code number and message when completed=false; both empty
  // on success. The stream remains well-formed and terminal even on deadline
  // or shard failure, so clients never infer completeness from EOF.
  uint32 error_code = 5;
  string error_message = 6;
}

message QueryStreamResponse {
  oneof payload {
    QueryStreamRevision revision = 1;
    QueryStreamCompletion completion = 2;
  }
}

// Where the request's time went, by adapter phase. Purely
// observational: timings never alter results.
message QueryProfile {
  // The delegated selection route (analysis, stats, fan-out, fusion —
  // and, for the composite + single lexical boost without a scorer,
  // that boost's rescore, which rides inside the hybrid route).
  float selection_ms = 1;
  // Adapter-side boost signal rescores (the Bm25Rescore/VectorRescore
  // seams).
  float boost_ms = 2;
  // The stored-dimension value fetch over the candidate pool (the
  // FetchValues seam). 0 when the scorer has no stored dimensions.
  float values_ms = 3;
  // The composite scorer arithmetic.
  float scorer_ms = 4;
  // The post-selection projection fetch for the returned page (the
  // shapes the lexical route does not carry natively).
  float projection_ms = 5;
  // Wall time of the whole adapter call.
  float total_ms = 6;
  // Candidate-scoped exact-vector scoring and reorder. 0 on native scoring.
  float rerank_ms = 7;
  // Physical work of FP32 reranking. Logical bytes count row payload, while
  // pages count distinct 4 KiB file pages touched by product shards.
  uint64 rerank_rows = 8;
  uint64 rerank_logical_bytes = 9;
  uint64 rerank_pages = 10;
  uint32 rerank_tasks = 11;
}

// One public hit with score provenance.
message QueryHit {
  // Global doc id (stable across identical corpus layouts; lineage
  // identity arrives with the document store).
  uint64 doc_id = 1;
  // Final score under the executed strategy.
  float score = 2;
  // 1-based deterministic rank.
  uint32 rank = 3;
  // Raw relevance per matched search/boost query id. A filter never
  // appears here.
  repeated QuerySignal signals = 4;
  // Ids of the clauses this document matched: every search leaf that
  // scored it, and every filter (a returned hit passed all filters by
  // construction).
  repeated string matched = 5;
  // Sorted browse only: this document's sort-column value (i64 values
  // through the monotone f64 cast). 0 elsewhere.
  double sort_key = 6;

  // Projected values, aligned with QueryRequest.projections in request
  // order. Empty when the request carried none.
  repeated ProjectedValue projected = 7;

  // Per-dimension scorer provenance, aligned with the request's scorer
  // dimensions in request order (every dimension is reported, skipped
  // ones included). Empty when the request carried no scorer.
  repeated DimensionScore dimensions = 8;
  // Snippets when the request carried a HighlightSpec.
  repeated Snippet snippets = 9;
}

// One named raw relevance signal.
message QuerySignal {
  // The search or boost query id.
  string id = 1;
  // Raw relevance on that query's own scale (BM25 for lexical,
  // calibrated dot product for dense, boost BM25 for a boost). Scales
  // are per-signal; the contract never pretends they share one.
  float score = 2;
}

// One scorer dimension's evaluation on one hit, precise enough to
// recompute the final score client-side: the reported doubles are the
// exact f64 terms the combination consumed, and QueryHit.score is
// their combination cast to f32.
message DimensionScore {
  // ScoreDimension.id.
  string id = 1;
  // The raw signal value. Absent exactly when the signal was missing
  // for this document (the dimension's missing policy then applied).
  optional double raw = 2;
  // The value after the dimension's normalization; 0 when the signal
  // was missing under the ZERO policy.
  double normalized = 3;
  // This dimension's term in the combination, by operation: the
  // additive term w*n (already divided by the active weight sum under
  // WEIGHTED_MEAN), the candidate value w*n for MAXIMUM, the factor
  // w*n for PRODUCT, the renormalized-exponent factor n^(w/W) for
  // GEOMETRIC_MEAN, and the reciprocal term w/n for HARMONIC_MEAN
  // (whose score is the active weight sum divided by the term sum).
  // 0 when skipped.
  double contribution = 4;
  // True when this dimension was excluded from the combination on
  // this hit: an explicit zero weight, SKIP on a missing signal, or
  // the geometric/harmonic positive-value rule.
  bool skipped = 5;
}

// ---------------------------------------------------------------------------
// Descriptor-derived mappings (docs/descriptor-mappings.md), increment 1:
// dry-run plan derivation. Descriptors are vocabulary, mappings are policy:
// the FileDescriptorSet says what fields a message has; this engine decides
// which become columns, which is the document id, and what a chunk is —
// deterministically, with a fingerprint, refusing wherever a guess would be
// required.

// PlanIndexRequest asks for a dry-run derivation.
message PlanIndexRequest {
  // A serialized google.protobuf.FileDescriptorSet containing the message
  // type and every import it needs (protoc --include_imports, or any
  // registry that stores complete sets — the descriptor exchange contract
  // moves exactly these bytes, content-addressed by SHA-256).
  bytes descriptor_set = 1;

  // Fully qualified message type to plan over, e.g. "shop.v1.Product".
  // No leading dot.
  string message_type = 2;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 3;
}

// PlanIndexResponse returns the plan a future bind would bind.
message PlanIndexResponse {
  // The derived plan.
  MappedPlan plan = 1;
}

// MappedKind is the resolved index type of one planned field, aligned with
// the ai.protomolt hint vocabulary where the concepts coincide. Every
// planned field has a definite kind.
enum MappedKind {
  // Zero value. Never present in a derived plan.
  MAPPED_KIND_UNSPECIFIED = 0;
  // Full-text analyzed string.
  MAPPED_KIND_TEXT = 1;
  // Exact-value string (enum fields plan as their value names).
  MAPPED_KIND_KEYWORD = 2;
  // 32-bit integer.
  MAPPED_KIND_INT32 = 3;
  // 64-bit integer.
  MAPPED_KIND_INT64 = 4;
  // 32-bit float.
  MAPPED_KIND_FLOAT = 5;
  // 64-bit float.
  MAPPED_KIND_DOUBLE = 6;
  // Boolean.
  MAPPED_KIND_BOOLEAN = 7;
  // Date/time, sourced from google.protobuf.Timestamp, landing as epoch
  // MICROSECONDS in the i64 family — the unit timestamp() filter literals
  // already compile to (docs/range-facets.md).
  MAPPED_KIND_DATE = 8;
  // Opaque bytes. Recorded, no column family.
  MAPPED_KIND_BINARY = 9;
  // The KNN vector the dense leg is built over.
  MAPPED_KIND_VECTOR = 10;
  // A message field kept as a single un-expanded entry. Recorded, no
  // column family: this is a flat engine.
  MAPPED_KIND_OBJECT = 11;
  // A repeated or map message field kept as a single un-expanded entry.
  // Recorded, no column family.
  MAPPED_KIND_NESTED = 12;
}

// MappedRole is the structural role a field plays, beyond its kind.
enum MappedRole {
  // A regular field.
  MAPPED_ROLE_NONE = 0;
  // The document's stable identity. Exactly one per plan. An integer id
  // is used verbatim; a string id is reduced to the first 8 bytes of
  // SHA-256 over its UTF-8 bytes, big-endian — part of this contract, so
  // any client can compute the same id.
  MAPPED_ROLE_DOC_ID = 1;
  // The repeated message field holding child chunks. At most one per
  // plan; its children are planned as their own unprefixed fields.
  MAPPED_ROLE_CHUNKS = 2;
  // Per-chunk identity inside the CHUNKS scope.
  MAPPED_ROLE_CHUNK_ID = 3;
}

// ColumnFamily names the engine column plane a mapped field lands on. The
// dry run makes non-landing fields VISIBLE: FAMILY_NONE is recorded in the
// plan, never silently dropped at ingest.
enum ColumnFamily {
  // Recorded in the plan, stored nowhere. OBJECT/NESTED/BINARY fields,
  // and repeated scalars: the facet, i64, and f64 planes hold one value
  // per document slot, and this engine does not guess a collapse rule.
  COLUMN_FAMILY_NONE = 0;
  // The analyzed BM25 field plane (multi-field columns, docs/bm25.md).
  COLUMN_FAMILY_TEXT_FIELD = 1;
  // The facet ordinal plane (docs/facets.md). KEYWORD and BOOLEAN
  // ("true"/"false") land here.
  COLUMN_FAMILY_FACET = 2;
  // The i64 plane (docs/range-facets.md). INT32, INT64, and DATE (epoch
  // micros) land here.
  COLUMN_FAMILY_I64 = 3;
  // The f64 plane (NaN-absent). FLOAT and DOUBLE land here.
  COLUMN_FAMILY_F64 = 4;
  // The dense vector leg.
  COLUMN_FAMILY_VECTOR = 5;
}

// MappedField is one field of the derived plan.
message MappedField {
  // Dotted path of proto field names from the message root, e.g.
  // "metadata.created_at". This is how a future extractor navigates a
  // document; it never changes with naming conventions.
  string path = 1;

  // Engine column name: the underscore-joined qualified name, or the
  // hint's explicit override. Filters and projections address the field
  // by this name.
  string name = 2;

  // Resolved index kind. Never MAPPED_KIND_UNSPECIFIED.
  MappedKind kind = 3;

  // True for a repeated or map field.
  bool repeated = 4;

  // Structural role, from the hint's block_role or name-based
  // resolution.
  MappedRole role = 5;

  // Declared vector dimensionality for a VECTOR field, 0 when the hint
  // does not declare one (the first document then binds it).
  uint32 vector_dims = 6;

  // Index-time analyzer name for a TEXT field, empty for the default.
  // Analysis identity is enforced by the analysis fingerprint at ingest
  // and query; the plan records the requested name.
  string analyzer = 7;

  // Query-time analyzer when it differs from the index-time one.
  string search_analyzer = 8;

  // The column plane this field lands on. Absence semantics on every
  // family follow descriptor presence: absent explicit-presence fields
  // are missing; present defaults are retained. Implicit-presence scalars
  // project their protobuf defaults. Comparisons on missing values use
  // the engine's Kleene rule (docs/cel-filters.md).
  ColumnFamily family = 9;
}

// MappedPlan is the complete derived plan for one message type.
message MappedPlan {
  // Fully qualified message type the plan was derived from.
  string message_type = 1;

  // Planned fields, in derivation order. The order is a function of the
  // descriptor, so it is part of what the fingerprint covers.
  repeated MappedField fields = 2;

  // Lowercase hex SHA-256 over the canonical encoding of this plan
  // and its reachable wire schema (fixed-layout bytes, never protobuf
  // serialization). The v3 identity covers decoder semantics, reachable
  // extension declarations and projection policy. A drift at restore time is
  // an index compatibility event, not a warning.
  string fingerprint = 3;

  // Path of the field ingest will read the vector from.
  string vector_path = 4;

  // Path of the field ingest will read the document id from.
  string doc_id_path = 5;

  // Vector dimensionality the plan declares, 0 when unknown until the
  // first document binds it.
  uint32 dim = 6;

  // Path of the CHUNKS scope; empty for a flat plan.
  string chunks_path = 7;

  // Path of the CHUNK_ID field; empty when the scope numbers its chunks
  // by ordinal (or the plan is flat).
  string chunk_id_path = 8;

  // Lowercase hex SHA-256 of the request's descriptor_set bytes: the
  // set's content address, the same identity the descriptor exchange
  // contract registers. NOT covered by the plan fingerprint — two
  // different descriptor sets may derive the same plan, and the plan is
  // what an index is bound to.
  string descriptor_sha256 = 9;
}

// One message on the IngestMapped stream: the bind first, then
// serialized documents.
message IngestMappedRequest {
  oneof payload {
    // The stream's binding. Exactly one, first; a repeat mid-stream is
    // refused.
    MappedBind bind = 1;

    // One serialized protobuf message of the bound type. Decoded by
    // the validated descriptor before projection. Oneof selection and
    // message merges resolve before column extraction; malformed bytes
    // refuse by position. Original payload retention is a separate contract.
    bytes document = 2;
    // Routed form. The document bytes have identical mapping semantics; the
    // stable key is copied into the ordinary document/vector WAL records.
    RoutedMappedDocument routed_document = 3;
  }
}

// The binding that opens a mapped ingest stream. Everything here is a
// session property, constant for the stream, like AnalysisSpec on the
// ordinary AddDocuments stream.
message MappedBind {
  // Serialized google.protobuf.FileDescriptorSet with every import
  // included (protoc --include_imports) — the same bytes PlanIndex
  // takes.
  bytes descriptor_set = 1;

  // Fully qualified message type to bind, e.g. "shop.v1.Product".
  string message_type = 2;

  // REQUIRED: the plan fingerprint the client reviewed (PlanIndex).
  // The node re-derives the plan locally — derivation is deterministic,
  // so both sides compute it independently — and refuses a mismatch.
  // An empty value is refused: dry-run first, then bind what you saw.
  string expected_fingerprint = 3;

  // Which TEXT field is the document BODY (the stored, highlighted
  // text). Empty binds the plan's ONLY text field; a plan with several
  // refuses by name until this picks one. The remaining text fields
  // index as ordinary multi-field columns (docs/multi-field.md) under
  // their engine names.
  string body_path = 4;

  // Body analysis options for every document on the stream. Absent =
  // sidecar defaults, the same rule as AddDocumentsRequest.analysis.
  // Non-body text fields analyze under sidecar defaults in this
  // increment; the plan's analyzer NAMES are recorded, not resolved.
  AnalysisSpec analysis = 5;

  // CEL materialization (docs/cel-values.md) applied to every mapped
  // document: derived columns computed from the document's OWN mapped
  // values, stored as ordinary typed columns. The WAL logs each
  // document with the derived values and the spec cleared, so replay
  // never re-evaluates — the same contract as ordinary ingest.
  MaterializeSpec materialize = 6;
  // The collection this bind writes into; a node of another
  // collection refuses (docs/collections.md).
  string collection = 7;
}

message IngestMappedResponse {
  // Documents applied (each carrying one vector).
  uint64 added = 1;

  // The shard's total BM25 document count afterwards.
  uint64 total = 2;

  // Global id of the first document this call applied.
  uint64 first_id = 3;

  // The bound plan fingerprint, echoed for provenance.
  string fingerprint = 4;

  // Source documents consumed. Equal to `added` on a flat plan; on a
  // chunked plan each source document yields one row per chunk
  // (including zero — a chunkless document is a legitimate empty
  // document and adds nothing), so `added` counts rows and this counts
  // documents.
  uint64 parents = 5;
  // The WAL generation the rows were logged in; see
  // AddVectorsResponse.wal_generation.
  uint64 wal_generation = 6;
}

// First message on a routed mapped-ingest stream.
message RoutedMappedBind {
  MappedBind bind = 1;
  // Required optimistic topology stamp. Writes never interpret zero as
  // "current": the caller must first observe the live generation.
  uint64 required_topology_generation = 2;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 3;
}

// One source document and the stable product identity used only for routing.
// The key is opaque, non-empty, and is not a generation-local vector/doc id.
message RoutedMappedDocument {
  bytes stable_key = 1;
  bytes document = 2;
}

message RoutedIngestMappedRequest {
  oneof payload {
    RoutedMappedBind bind = 1;
    RoutedMappedDocument document = 2;
  }
}

message RoutedShardIngest {
  uint32 shard = 1;
  string addr = 2;
  uint64 added = 3;
  uint64 parents = 4;
  uint64 first_id = 5;
}

message RoutedIngestMappedResponse {
  uint64 added = 1;
  uint64 parents = 2;
  uint64 served_topology_generation = 3;
  repeated RoutedShardIngest shards = 4;
}

message FreezeTopologyWritesRequest {
  uint64 required_topology_generation = 1;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 2;
}

message FreezeTopologyWritesResponse {
  uint64 topology_generation = 1;
  uint64 cutover_token = 2;
}

message PublishedTopologyShard {
  string addr = 1;
  string replica = 2;
  uint64 hash_lo = 3;
  uint64 hash_hi = 4;
}

message PublishTopologyRequest {
  uint64 cutover_token = 1;
  uint64 generation = 2;
  repeated PublishedTopologyShard shards = 3;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 4;
}

message PublishTopologyResponse {
  uint64 topology_generation = 1;
}

message AbortTopologyCutoverRequest {
  uint64 cutover_token = 1;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 2;
}

message AbortTopologyCutoverResponse {
  uint64 topology_generation = 1;
}

enum ClusterNodeState {
  CLUSTER_NODE_STATE_UNSPECIFIED = 0;
  CLUSTER_NODE_STATE_ACTIVE = 1;
  CLUSTER_NODE_STATE_DRAINING = 2;
  CLUSTER_NODE_STATE_EXPIRED = 3;
}

enum ShardReplicaRole {
  SHARD_REPLICA_ROLE_UNSPECIFIED = 0;
  SHARD_REPLICA_ROLE_PRIMARY = 1;
  SHARD_REPLICA_ROLE_REPLICA = 2;
}

enum PlacementActionKind {
  PLACEMENT_ACTION_KIND_UNSPECIFIED = 0;
  PLACEMENT_ACTION_KIND_COPY_REPLICA = 1;
  PLACEMENT_ACTION_KIND_DROP_REPLICA = 2;
  PLACEMENT_ACTION_KIND_PROMOTE_REPLICA = 3;
  PLACEMENT_ACTION_KIND_SPLIT_SHARD = 4;
  PLACEMENT_ACTION_KIND_MERGE_SHARDS = 5;
  PLACEMENT_ACTION_KIND_COMPACT_SHARD = 6;
}

message NodeCapacity {
  uint64 disk_bytes = 1;
  uint64 used_disk_bytes = 2;
  uint64 memory_bytes = 3;
  uint32 search_threads = 4;
  string failure_domain = 5;
}

message RegisterNodeRequest {
  string node_id = 1;
  string addr = 2;
  NodeCapacity capacity = 3;
  // Requested lease duration. Zero selects the authority policy.
  uint64 lease_ms = 4;
  // The collection the node serves (docs/collections.md).
  string collection = 5;
}

message RenewNodeLeaseRequest {
  string node_id = 1;
  uint64 lease_token = 2;
  NodeCapacity capacity = 3;
  uint64 lease_ms = 4;
  // The collection the lease belongs to (docs/collections.md).
  string collection = 5;
}

message NodeLease {
  string node_id = 1;
  uint64 lease_token = 2;
  uint64 expires_unix_ms = 3;
  uint64 control_revision = 4;
}

message DrainNodeRequest {
  string node_id = 1;
  uint64 lease_token = 2;
  // The collection the node serves (docs/collections.md).
  string collection = 3;
}

message ShardReplicaState {
  string shard_id = 1;
  string node_id = 2;
  // The listener serving this copy. Empty means the node's registered
  // address; a node with several listeners (one per shard, and one per
  // replica it placed under --data-dir) reports each shard's own, and
  // the lease owner vouches for it. Another node's registered address
  // is refused. The published topology carries this address.
  string addr = 3;
  uint64 generation = 4;
  uint64 hash_lo = 5;
  uint64 hash_hi = 6;
  uint64 slot_offset = 7;
  uint64 rows = 8;
  uint64 bytes = 9;
  ShardReplicaRole role = 10;
  bool ready = 11;
  string scoring_fingerprint = 12;
  string analysis_fingerprint = 13;
  uint32 immutable_segments = 14;
  uint64 tombstones = 15;
  // The collection the shard belongs to (docs/collections.md).
  string collection = 16;
}

message ReportShardRequest {
  string node_id = 1;
  uint64 lease_token = 2;
  ShardReplicaState replica = 3;
  // The collection the shard belongs to (docs/collections.md).
  string collection = 4;
}

message CompletePlacementActionRequest {
  string node_id = 1;
  uint64 lease_token = 2;
  uint64 action_id = 3;
  // Complete replacement state produced by the action. COPY and COMPACT
  // return one replica, SPLIT returns every child, MERGE returns one merged
  // primary, and DROP returns none.
  repeated ShardReplicaState outputs = 4;
  // The collection the action belongs to (docs/collections.md).
  string collection = 5;
}

message ReconcileClusterRequest {
  // A dry run computes and returns actions without persisting them.
  bool dry_run = 1;
  // The collection to reconcile (docs/collections.md).
  string collection = 2;
}

message GetClusterPlanRequest {
  // The collection whose plan to return (docs/collections.md).
  string collection = 1;
}

message RollbackClusterRequest {
  // Historical topology generation to restore as a NEW generation. Zero
  // selects the immediately previous published topology.
  uint64 topology_generation = 1;
  // The collection to roll back (docs/collections.md).
  string collection = 2;
}

message ClusterNode {
  string node_id = 1;
  string addr = 2;
  ClusterNodeState state = 3;
  reserved 4; // Lease credentials are returned only to their registering node.
  uint64 expires_unix_ms = 5;
  NodeCapacity capacity = 6;
  // The collection the node serves (docs/collections.md).
  string collection = 7;
}

message PlacementAction {
  uint64 action_id = 1;
  PlacementActionKind kind = 2;
  string shard_id = 3;
  string peer_shard_id = 4;
  string source_node_id = 5;
  string target_node_id = 6;
  uint64 source_generation = 7;
  uint64 target_generation = 8;
  uint64 hash_lo = 9;
  uint64 hash_hi = 10;
  string reason = 11;
  // Exact peer generation captured when a merge was planned; zero otherwise.
  uint64 peer_source_generation = 12;
  // The collection the action stays inside (docs/collections.md).
  string collection = 13;
}

message ClusterPlan {
  uint64 control_revision = 1;
  uint64 topology_generation = 2;
  repeated ClusterNode nodes = 3;
  repeated ShardReplicaState replicas = 4;
  repeated PlacementAction actions = 5;
  repeated uint64 topology_history = 6;
  // The collection this plan governs (docs/collections.md).
  string collection = 7;
  // The published topology of `topology_generation`: the routes the
  // live coordinator fans out to. A node whose configuration does not
  // name its shard's hash range finds it here by its listener address
  // (docs/cluster-control.md, "Node lifecycle").
  repeated PublishedTopologyShard topology = 8;
}

// ---------------------------------------------------------------------------
// First-class CEL values (docs/cel-values.md): the same compiled dialect
// that selects (FilterExpr) extended to PRODUCE values — query-time
// projections per hit, ingest-time materialized columns. Compile once,
// resolve per shard, never interpret per document; a construct that does
// not compile is refused by name.

// One named projection as the public surface carries it.
message NamedProjection {
  // Name the values are returned under. Non-empty, request-unique.
  string name = 1;

  // CEL value expression over the document's columns: column reads
  // (dotted names fold, map access by string-literal key), int,
  // double, and bool literals, `+ - * / %`, unary minus, `double()`,
  // comparisons (`== != < <= > >=`), Kleene `&& || !`, and the
  // ternary `cond ? a : b`. Typing is stock CEL's: int with int,
  // double with double, mixed arithmetic or comparison refused naming
  // double(). A bare facet or map-facet read projects the string
  // value; strings join no arithmetic and compare (`==`/`!=` only)
  // against string literals.
  string expression = 2;
}

// One compiled projection on the internal fan-out.
message CompiledProjection {
  // Name, echoed for provenance; values align positionally.
  string name = 1;

  // The compiled expression.
  ValueExpr expr = 2;
}

// ValueExpr is the compiled value-expression IR, the sibling of
// FilterExpr: leaves read columns or hold literals, nodes are pure
// arithmetic, comparison, Kleene logic, and the conditional.
// Shards resolve column names against their own
// dictionaries and evaluate with array reads — never text, never an
// interpreter.
message ValueExpr {
  oneof expr {
    // Read one column by engine name. Resolves per shard to an f64,
    // i64, facet, or map-numeric-free column; the value's type is the
    // column's. Absent value = absent result.
    string column = 1;

    // Read one map-column entry under a string key.
    MapRead map = 2;

    // Integer literal (CEL int, i64).
    sint64 int_literal = 3;

    // Double literal. Always finite: NaN and infinity do not lex.
    double float_literal = 4;

    // Binary arithmetic over two subexpressions of the SAME type.
    ValueArith arith = 5;

    // CEL double(x): int to double conversion (identity on double).
    ValueExpr to_double = 6;

    // Unary minus. Kept as its own node because -x and 0-x differ on
    // IEEE signed zero, and stock CEL negates.
    ValueExpr negate = 7;

    // One comparison, bool-typed. Numeric sides follow the arithmetic
    // rule (int with int, double with double, mixed refused naming
    // double()); `==`/`!=` also compare a facet or map-facet read
    // against a string literal, and two bool subexpressions. String
    // and bool ORDERING refuse by name. Doubles compare IEEE: every
    // comparison with NaN is false except `!=`, which is true.
    ValueCompare compare = 8;

    // Kleene `&&` / `||` over bool subexpressions. A determinate
    // answer absorbs an absent operand — `false && absent` is false,
    // `true || absent` is true — exactly stock CEL's commutative
    // error-absorbing logic with absence in the error role; otherwise
    // an absent operand makes the result absent.
    ValueLogic logic = 9;

    // Logical `!` over a bool subexpression. Absent stays absent.
    ValueExpr not = 10;

    // CEL's conditional `cond ? a : b`. The condition is bool and the
    // branches are the SAME type; only the TAKEN branch's value (and
    // absence) matters, and an absent condition makes the result
    // absent.
    ValueTernary ternary = 11;

    // Bool literal.
    bool bool_literal = 12;

    // String literal. Legal only as a `==`/`!=` operand against a
    // facet or map-facet read; a string literal is not a computable
    // value anywhere else.
    string string_literal = 13;

    // A math function call. The `math.*` names carry the official CEL
    // math extension's semantics; the `engine.*` names are this
    // engine's own transcendentals, documented in docs/cel-values.md.
    ValueFunc func = 14;
  }
}

// The function vocabulary. Typing per function: ABS, SIGN, GREATEST,
// and LEAST are type-preserving over one numeric type (int with int,
// double with double, mixed refused naming double()); the rest take
// doubles only (an int converts explicitly with double()) and return
// a double, except the three predicates, which return bool. All
// results are IEEE values, never errors: sqrt(-1.0) is NaN,
// engine.ln(0.0) is -inf. The one integer edge: math.abs(i64 MIN)
// overflows, so it evaluates ABSENT where stock CEL errors, the same
// deviation the checked arithmetic takes.
enum ValueFn {
  // Zero value. Never present in a compiled expression.
  VALUE_FN_UNSPECIFIED = 0;
  // math.abs(x): absolute value, type-preserving.
  VALUE_FN_ABS = 1;
  // math.sign(x): -1, 0, or 1 in the argument's type; NaN stays NaN.
  VALUE_FN_SIGN = 2;
  // math.ceil(x): double, rounds up.
  VALUE_FN_CEIL = 3;
  // math.floor(x): double, rounds down.
  VALUE_FN_FLOOR = 4;
  // math.round(x): double, rounds half away from zero (CEL's rule).
  VALUE_FN_ROUND = 5;
  // math.trunc(x): double, rounds toward zero.
  VALUE_FN_TRUNC = 6;
  // math.sqrt(x): double square root; negative input is NaN.
  VALUE_FN_SQRT = 7;
  // math.isNaN(x): bool.
  VALUE_FN_IS_NAN = 8;
  // math.isInf(x): bool, true for either infinity.
  VALUE_FN_IS_INF = 9;
  // math.isFinite(x): bool.
  VALUE_FN_IS_FINITE = 10;
  // math.greatest(x, ...): n-ary maximum, type-preserving; a double
  // NaN operand propagates.
  VALUE_FN_GREATEST = 11;
  // math.least(x, ...): n-ary minimum, type-preserving; a double NaN
  // operand propagates.
  VALUE_FN_LEAST = 12;
  // engine.ln(x): natural log; ln(0.0) is -inf, negatives are NaN.
  VALUE_FN_LN = 13;
  // engine.exp(x): e to the x.
  VALUE_FN_EXP = 14;
  // engine.log10(x): base-10 log.
  VALUE_FN_LOG10 = 15;
  // engine.pow(x, y): x to the y, IEEE powf.
  VALUE_FN_POW = 16;
}

// One function call node.
message ValueFunc {
  // The function.
  ValueFn function = 1;

  // Arguments in source order. Arity is the function's: one for the
  // unary functions, two for engine.pow, one or more for
  // math.greatest and math.least.
  repeated ValueExpr args = 2;
}

// ---------------------------------------------------------------------
// Aggregations (docs/aggregations.md): exact folds of value
// expressions over the filtered corpus.
// ---------------------------------------------------------------------

message AggregateRequest {
  // CEL filter (docs/cel-filters.md). Empty or whitespace = every
  // document.
  string filter = 1;

  // Geo filters, AND semantics, the same rules as every filtered
  // route.
  repeated GeoFilter geo_filters = 2;

  // The aggregations, at most 32; names non-empty and request-unique
  // across aggregations and histograms. At least one aggregation or
  // histogram per request.
  repeated Aggregation aggregations = 3;

  // Group the aggregations by one facet column's values: every
  // aggregation folds once fleet-wide (`results`) and once per
  // distinct value (`groups`, ascending by value). An admitted
  // document WITHOUT the value joins no group (absence is not a
  // value) and counts in `ungrouped`. Empty = no grouping.
  string group_by = 4;

  // Cap on distinct groups, 0 = 1000. Exceeding it REFUSES loudly
  // (naming the cap), never a silent truncation: a top-N cut would
  // need an ordering this request did not state.
  uint32 max_groups = 5;

  // Fixed-interval histograms, at most 8.
  repeated HistogramSpec histograms = 6;

  // Exact percentiles, at most 8 specs. EXACT: the answer to every
  // requested percentile is the nearest-rank order statistic — a
  // value some admitted document actually holds — found by a
  // coordinator-driven binary search over the order-bits domain with
  // count-below rounds (at most 64), never a sketch, never an
  // interpolation. Fleet-wide only: percentiles ignore group_by.
  repeated PercentileSpec percentiles = 7;
  // The collection this request addresses (docs/collections.md). Empty
  // names the coordinator's only, unnamed dataset, or its configured
  // default; an unknown name, or no name where named collections exist
  // and no default is configured, refuses by name.
  string collection = 8;
}

// One requested percentile set over one expression.
message PercentileSpec {
  // Name the result is returned under; one namespace with the
  // aggregations and histograms.
  string name = 1;

  // CEL value expression, int or double typed. The answer's type is
  // the expression's.
  string expression = 2;

  // The requested percentiles, 1 to 16 values, each finite in
  // [0, 100]. Nearest-rank: percentile p answers the k-th smallest
  // present value with k = max(1, ceil(p/100 * n)); 0 is the
  // minimum, 100 the maximum, 50 the lower median on even counts.
  repeated double percentiles = 3;
}

// One requested histogram: counts of a double expression's present
// values in fixed intervals. Bucket index = floor(value / interval);
// the bucket's inclusive lower bound is index * interval. Buckets are
// SPARSE: only occupied ones return, ascending.
message HistogramSpec {
  // Name the result is returned under.
  string name = 1;

  // CEL value expression, double-typed (an int expression converts
  // with double()).
  string expression = 2;

  // Bucket width. Positive and finite.
  double interval = 3;

  // Cap on distinct buckets, 0 = 1024. Exceeding it REFUSES loudly:
  // the honest fixes are a coarser interval or a tighter filter.
  uint32 max_buckets = 4;
}

// One requested aggregate.
message Aggregation {
  // Name the result is returned under.
  string name = 1;

  // CEL value expression over the document's columns — exactly the
  // projection dialect (docs/cel-values.md), functions and the
  // conditional layer included.
  string expression = 2;

  // The fold.
  AggregateOp op = 3;
}

// The aggregate operations. Typing: COUNT serves every expression
// type, strings included; SUM, MIN, and MAX serve int and double
// expressions in their own type; MEAN, VARIANCE, and STDDEV serve
// doubles only (an int expression converts with double()). A boolean
// expression aggregates nowhere — filter on it instead and read
// `matched`.
enum AggregateOp {
  // Zero value. Refused.
  AGGREGATE_OP_UNSPECIFIED = 0;
  // Documents where the expression holds a value.
  AGGREGATE_OP_COUNT = 1;
  // Exact sum. Int expressions accumulate in 128-bit integers and a
  // total outside i64 REFUSES naming double() as the fix; double
  // expressions sum Neumaier-compensated in doc order per shard,
  // partials folded in shard order.
  AGGREGATE_OP_SUM = 2;
  // Minimum, in the expression's type. A double NaN propagates, the
  // same rule math.least takes.
  AGGREGATE_OP_MIN = 3;
  // Maximum, in the expression's type. A double NaN propagates.
  AGGREGATE_OP_MAX = 4;
  // Arithmetic mean of the present values, Welford per shard and the
  // Chan parallel merge across shards.
  AGGREGATE_OP_MEAN = 5;
  // Population variance (M2 / n) of the present values.
  AGGREGATE_OP_VARIANCE = 6;
  // Population standard deviation, sqrt of the variance.
  AGGREGATE_OP_STDDEV = 7;
}

message AggregateResponse {
  // One result per requested aggregation, in request order —
  // fleet-wide totals whether or not the request groups.
  repeated AggregateResult results = 1;

  // Documents the filter admitted, fleet-wide.
  uint64 matched = 2;

  // Per-group results when `group_by` is set, ascending by value.
  repeated AggregateGroup groups = 3;

  // Admitted documents without the group_by value (group_by only).
  uint64 ungrouped = 4;

  // One result per requested histogram, in request order.
  repeated HistogramResult histograms = 5;

  // One result per requested percentile spec, in request order.
  repeated PercentileResult percentiles = 6;
}

// One percentile spec's answers.
message PercentileResult {
  // The request's name, echoed.
  string name = 1;

  // Rankable present values (a computed NaN is present but has no
  // honest rank; see unrankable).
  uint64 present = 2;

  // Present values excluded from ranking: computed NaN. Reported,
  // never silently dropped. Infinities rank (at the ends).
  uint64 unrankable = 3;

  // One answer per requested percentile, request order.
  repeated PercentileValue values = 4;
}

// One percentile answer: an exact order statistic.
message PercentileValue {
  // The requested percentile, echoed.
  double percentile = 1;

  // The 1-based rank answered: k = max(1, ceil(p/100 * present)).
  // 0 when present = 0 (no value).
  uint64 rank = 2;

  // The k-th smallest value, in the expression's type. Unset when no
  // rankable value exists.
  oneof value {
    // Double-typed answer.
    double double_value = 3;

    // Int-typed answer.
    sint64 int_value = 4;
  }
}

// One group's results.
message AggregateGroup {
  // The facet value.
  string value = 1;

  // Admitted documents carrying this value.
  uint64 matched = 2;

  // The aggregations folded over this group's documents, request
  // order — the same exactness contract as the totals.
  repeated AggregateResult results = 3;
}

// One histogram's merged buckets.
message HistogramResult {
  // The request's name, echoed.
  string name = 1;

  // Occupied buckets, ascending by lower bound.
  repeated HistogramBucket buckets = 2;

  // Values bucketed.
  uint64 present = 3;

  // Present values no bucket can hold honestly: NaN, an infinity, or
  // a bucket index outside i64 (an interval too fine for the value's
  // magnitude). Reported, never silently dropped.
  uint64 unbucketable = 4;
}

// One occupied bucket.
message HistogramBucket {
  // Inclusive lower bound: index * interval.
  double lower = 1;

  // Present values with floor(value / interval) at this index.
  uint64 count = 2;
}

// One aggregate result.
message AggregateResult {
  // The request's name, echoed.
  string name = 1;

  // Documents where the expression held a value (present values, the
  // Kleene rule: absence is skipped, never counted as zero).
  uint64 present = 2;

  // The folded value; unset when no document held a value. COUNT
  // reports `present` as int_value (0 included). SUM, MIN, and MAX
  // report in the expression's type; the statistical ops report
  // doubles.
  oneof value {
    // Double-typed result.
    double double_value = 3;

    // Int-typed result.
    sint64 int_value = 4;
  }
}

// The internal fan-out: compiled expressions, resolved per shard.
message AggregateShardRequest {
  // Compiled filter IR; absent = no tree filter.
  FilterExpr filter = 1;

  // Geo filters, verbatim.
  repeated GeoFilter geo_filters = 2;

  // Compiled aggregations, request order.
  repeated CompiledAggregation aggregations = 3;

  // Facet column to group by; empty = no grouping.
  string group_by = 4;

  // The resolved group cap (a shard exceeding it alone refuses
  // early; the merged count checks again at the coordinator).
  uint32 max_groups = 5;

  // Compiled histograms, request order.
  repeated CompiledHistogram histograms = 6;

  // Compiled percentile expressions, request order.
  repeated CompiledPercentile percentiles = 7;
  // Exact global-id allowlist when restrict_doc_ids is true.
  repeated uint64 doc_ids = 8;
  // Distinguishes an intentionally empty allowlist from no allowlist.
  bool restrict_doc_ids = 9;
}

// One compiled percentile expression.
message CompiledPercentile {
  // The compiled expression.
  ValueExpr expr = 1;

  // The request's name, so shard-side refusals name the spec.
  string name = 2;
}

// One compiled histogram.
message CompiledHistogram {
  // The compiled expression.
  ValueExpr expr = 1;

  // Bucket width, validated at the coordinator.
  double interval = 2;

  // The resolved bucket cap.
  uint32 max_buckets = 3;

  // The request's name, so shard-side refusals name the histogram.
  string name = 4;
}

// One compiled aggregation.
message CompiledAggregation {
  // The compiled expression.
  ValueExpr expr = 1;

  // The fold.
  AggregateOp op = 2;

  // The request's name, so shard-side refusals name the aggregation.
  string name = 3;
}

message AggregateShardResponse {
  // One partial per aggregation, request order.
  repeated AggregatePartial partials = 1;

  // Documents this shard's filter admitted.
  uint64 matched = 2;

  // Geo/filter typo flags, the filtered-route contract.
  repeated bool geo_columns_known = 3;
  repeated bool filter_columns_known = 4;

  // Column-read leaves across ALL aggregation and histogram
  // expressions, aggregations first then histograms, request order
  // then depth-first within each — the projection typo rule: a leaf
  // no shard knows refuses by name at the coordinator.
  repeated bool expr_leaves_known = 5;

  // This shard's groups, one per distinct facet value among its
  // admitted documents. Order is unspecified; the coordinator merges
  // by value.
  repeated AggregateShardGroup groups = 6;

  // Admitted documents without the group_by value here. A shard
  // whose tables lack the column counts every admitted document.
  uint64 ungrouped = 7;

  // Whether this shard resolves the group_by column (facet family);
  // a column NO shard knows refuses by name at the coordinator.
  bool group_column_known = 8;

  // One sparse histogram per compiled histogram, request order.
  repeated ShardHistogram histograms = 9;

  // One partial per compiled percentile expression, request order:
  // the phase-1 statistics the binary search starts from.
  repeated PercentilePartial percentile_partials = 10;
}

// One shard's phase-1 percentile statistics.
message PercentilePartial {
  // The type this shard resolved the expression to (INT or DOUBLE;
  // ABSENT when it can never hold a value here).
  AggregateValueType vtype = 1;

  // Rankable values on this shard.
  uint64 present = 2;

  // Computed-NaN values, excluded from ranking.
  uint64 unrankable = 3;

  // Order bits of the smallest and largest rankable values here;
  // meaningful only when present > 0.
  fixed64 min_bits = 4;
  fixed64 max_bits = 5;
}

// One binary-search round.
message QuantileCountsRequest {
  // Compiled filter IR; absent = no tree filter.
  FilterExpr filter = 1;

  // Geo filters, verbatim.
  repeated GeoFilter geo_filters = 2;

  // The percentile expressions, request order (indexes in targets
  // refer here).
  repeated CompiledPercentile exprs = 3;

  // The still-unconverged targets this round probes.
  repeated QuantileTarget targets = 4;
  repeated uint64 doc_ids = 5;
  bool restrict_doc_ids = 6;
}

// One probe: an expression and a threshold in its order-bits domain.
message QuantileTarget {
  // Index into QuantileCountsRequest.exprs.
  uint32 expr_index = 1;

  // The order-bits threshold.
  fixed64 threshold_bits = 2;
}

message QuantileCountsResponse {
  // Per target, in request order: this shard's rankable values whose
  // order bits are at or below the threshold.
  repeated uint64 counts = 1;
}

// One shard's partials for one facet value.
message AggregateShardGroup {
  // The facet value, rendered from this shard's dictionary.
  string value = 1;

  // Admitted documents carrying this value here.
  uint64 matched = 2;

  // One partial per aggregation, request order.
  repeated AggregatePartial partials = 3;
}

// One shard's sparse histogram: parallel index/count columns.
message ShardHistogram {
  // Occupied bucket indexes (floor(value / interval)).
  repeated sint64 bucket_index = 1;

  // Counts, parallel to bucket_index.
  repeated uint64 bucket_count = 2;

  // Values bucketed on this shard.
  uint64 present = 3;

  // Values no bucket holds honestly (NaN, infinity, index outside
  // i64).
  uint64 unbucketable = 4;
}

// One shard's exact partial for one aggregation. Only the fields for
// the resolved type and requested op carry meaning; the rest stay at
// their defaults.
message AggregatePartial {
  // The type this shard resolved the expression to. ABSENT when the
  // expression can never hold a value here (a column this shard
  // lacks): present = 0 and no type vote.
  AggregateValueType vtype = 1;

  // Documents where the expression held a value on this shard.
  uint64 present = 2;

  // SUM over an int expression: the exact signed 128-bit sum, two's
  // complement split (hi carries the sign).
  sfixed64 int_sum_hi = 3;
  fixed64 int_sum_lo = 4;

  // SUM over a double expression: Neumaier-compensated running sum
  // and its compensation, folded in doc order.
  double double_sum = 5;
  double double_compensation = 6;

  // MIN/MAX in the resolved type.
  sint64 int_min = 7;
  sint64 int_max = 8;
  double double_min = 9;
  double double_max = 10;

  // MEAN/VARIANCE/STDDEV: the Welford partial (mean, M2) over this
  // shard's present values in doc order.
  double mean = 11;
  double m2 = 12;
}

// The type a shard resolved one aggregation expression to.
enum AggregateValueType {
  // Zero value. Never sent.
  AGGREGATE_VALUE_TYPE_UNSPECIFIED = 0;
  // The expression can never hold a value on this shard.
  AGGREGATE_VALUE_TYPE_ABSENT = 1;
  // CEL int.
  AGGREGATE_VALUE_TYPE_INT = 2;
  // CEL double.
  AGGREGATE_VALUE_TYPE_DOUBLE = 3;
  // A facet or map-facet read; COUNT only.
  AGGREGATE_VALUE_TYPE_STRING = 4;
}

// Comparison operations over value subexpressions.
enum ValueCmpOp {
  // Zero value. Never present in a compiled expression.
  VALUE_CMP_OP_UNSPECIFIED = 0;
  // Equality.
  VALUE_CMP_OP_EQ = 1;
  // Inequality.
  VALUE_CMP_OP_NE = 2;
  // Less than.
  VALUE_CMP_OP_LT = 3;
  // Less than or equal.
  VALUE_CMP_OP_LE = 4;
  // Greater than.
  VALUE_CMP_OP_GT = 5;
  // Greater than or equal.
  VALUE_CMP_OP_GE = 6;
}

// Binary comparison node.
message ValueCompare {
  // Left operand.
  ValueExpr left = 1;

  // Right operand.
  ValueExpr right = 2;

  // The operation.
  ValueCmpOp op = 3;
}

// Kleene logic operations.
enum ValueLogicOp {
  // Zero value. Never present in a compiled expression.
  VALUE_LOGIC_OP_UNSPECIFIED = 0;
  // Conjunction.
  VALUE_LOGIC_OP_AND = 1;
  // Disjunction.
  VALUE_LOGIC_OP_OR = 2;
}

// N-ary Kleene logic node; children in source order.
message ValueLogic {
  // Bool-typed operands, at least two.
  repeated ValueExpr children = 1;

  // The operation.
  ValueLogicOp op = 2;
}

// The conditional node.
message ValueTernary {
  // Bool-typed condition.
  ValueExpr cond = 1;

  // Value when the condition is true.
  ValueExpr then_value = 2;

  // Value when the condition is false.
  ValueExpr else_value = 3;
}

// One map-column read.
message MapRead {
  // Map column name.
  string column = 1;

  // Entry key, a string literal in the source expression. A key this
  // shard's key dictionary lacks reads as absent.
  string key = 2;
}

// Binary arithmetic node.
message ValueArith {
  // Left operand.
  ValueExpr left = 1;

  // Right operand.
  ValueExpr right = 2;

  // The operation.
  ArithOp op = 3;
}

// Arithmetic operations, CEL semantics per type: i64 ops are checked
// (overflow, division by zero, and i64::MIN edge cases evaluate to
// ABSENT where stock CEL errors — the documented deviation, absence
// instead of failure); f64 ops are IEEE. Integer division truncates
// toward zero and % is remainder, exactly CEL's.
enum ArithOp {
  // Zero value. Never present in a compiled expression.
  ARITH_OP_UNSPECIFIED = 0;
  // Addition.
  ARITH_OP_ADD = 1;
  // Subtraction.
  ARITH_OP_SUB = 2;
  // Multiplication.
  ARITH_OP_MUL = 3;
  // Division.
  ARITH_OP_DIV = 4;
  // Remainder (integers only, like CEL).
  ARITH_OP_MOD = 5;
}

// One projected value. The unset oneof is ABSENCE.
message ProjectedValue {
  oneof value {
    // A double-typed result.
    double double_value = 1;

    // An int-typed result.
    sint64 int_value = 2;

    // A string result: a bare facet or map-facet column read, or a
    // ternary whose branches read facet columns.
    string string_value = 3;

    // A bool result: a comparison, Kleene logic, `!`, or a bool
    // literal as the whole expression.
    bool bool_value = 4;
  }
}

// Ingest-time materialization spec: a session property of the ingest
// stream, like the quality and geography specs.
message MaterializeSpec {
  // Derived columns, evaluated in list order against each document's
  // own request values (numerics, integers, map numerics). Names must
  // not collide with each other or with columns the request itself
  // carries — a collision refuses the document, it never overwrites.
  repeated MaterializedColumn columns = 1;
}

// The stored kind of one materialized column. Explicit, never
// inferred: the expression's evaluated type must MATCH (write
// double(...) to land an integer expression in the f64 family), so
// the column's family cannot drift with the data.
enum MaterializeKind {
  // Zero value. Refused.
  MATERIALIZE_KIND_UNSPECIFIED = 0;
  // The f64 family; the expression must evaluate double-typed.
  MATERIALIZE_KIND_F64 = 1;
  // The i64 family; the expression must evaluate int-typed.
  MATERIALIZE_KIND_I64 = 2;
}

// One derived column.
message MaterializedColumn {
  // Column name the derived value stores under.
  string name = 1;

  // CEL value expression over the document's own values, the same
  // dialect NamedProjection documents. A name the document does not
  // carry is ABSENT, and absence propagates: the derived value is then
  // simply not stored for this document (Kleene, never proto3
  // defaults). String-typed expressions are refused: a bare column
  // copy stores nothing new.
  string expression = 2;

  // Target family. The evaluated type must match, per document.
  MaterializeKind kind = 3;
}
