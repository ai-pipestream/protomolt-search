[package]
name = "pipestream-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Provider-neutral distributed lexical, vector, and hybrid search"

[workspace]
members = ["crates/protomolt-analyzer", "crates/protomolt-embedder", "crates/protomolt-search-embedded"]
exclude = ["sidecars/route-cost"]
resolver = "2"

[dependencies]
turbovec = { git = "https://github.com/ai-pipestream/turbovec.git", branch = "turbovec-pipestream-s17" }
turbovec-grpc = { git = "https://github.com/ai-pipestream/turbovec-grpc.git", rev = "1dab45f33a408506aef17610680f1ffc5d9a03b8" }
tonic = "0.12"
prost = "0.13"
# google.protobuf.Timestamp on the ingest wire compiles to this crate's
# type; tonic-build emits the reference, the runtime needs the crate.
# Locked to prost's minor version: prost-types 0.14 implements prost
# 0.14's Message trait, which tonic 0.12's prost 0.13 codec refuses.
# It moves when tonic and prost move, never on its own.
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
memmap2 = "0.9"
protomolt-analyzer = { path = "crates/protomolt-analyzer" }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# The embedder loop test (tests/embedder_loop.rs) proves the provider crate
# and the embedded runtime compose; dev-only so the product gains no
# dependency on the provider while the ownership question stands.
protomolt-embedder = { path = "crates/protomolt-embedder" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bzip2 = "0.6"
csv = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
# The CEL differential oracle (tests/cel_filters.rs): the reference
# interpreter the compiled ordinal path is held to agreement with,
# wherever stock CEL is defined. TEST-ONLY by design — the serving
# binary compiles filters, it never interprets them, and this crate's
# dependency tree (regex included) stays out of it.
cel-interpreter = "0.10"
