syntax = "proto3";
package ai.protomolt.search.storage.v1;
import "ai/protomolt/search/v1/document_write.proto";
import "ai/protomolt/search/v1/search.proto";

message DocumentCatalogHeader {
  uint32 format_version = 1;
  string collection = 2;
  uint64 accepted_sequence = 3;
  // Format 3: created once and persisted; reopen never invents a replacement.
  bytes history_id = 4;
  // Receipts through this migration boundary may predate the identity field.
  uint64 legacy_receipts_through_sequence = 5;
}
message DocumentVersionKey {
  bytes document_key = 1;
  uint64 version = 2;
}
message DocumentVersion {
  bytes document_key = 1;
  uint64 version = 2;
  uint64 accepted_sequence = 3;
  bytes source_sha256 = 4;
  bool deleted = 5;
}
message DocumentOperation {
  bytes request_sha256 = 1;
  ai.protomolt.search.v1.DocumentWriteReceipt receipt = 2;
}

// Optional source-catalog extension. Decisions describe durable index artifacts,
// never a serving-state activation or a searchable write receipt.
message ProjectionJournalHeader {
  uint32 format_version = 1;
  bytes history_id = 2;
}
message ProjectionDecisionKey {
  bytes index_key = 1;
  uint64 accepted_sequence = 2;
}
message ProjectionIntent {
  bytes index_key = 1;
  bytes history_id = 2;
  DocumentVersion source = 3;
  bytes before_manifest_sha256 = 4;
  bytes after_manifest_sha256 = 5;
  uint64 before_epoch = 6;
  uint64 after_epoch = 7;
  uint64 rows = 8;
  // SHA-256 of this message with intent_id empty, using format-1 encoding.
  bytes intent_id = 9;
}
message ProjectionJournalState {
  bytes index_key = 1;
  bytes history_id = 2;
  uint64 committed_sequence = 3;
  bytes committed_manifest_sha256 = 4;
  ProjectionIntent pending = 5;
}

// Persistent authority of a source-managed index. It is not a credential and
// contains no storage path or network address. Mutations must join this source
// history's publication journal; ordinary row/WAL mutation routes refuse.
message SourceIndexOwner {
  uint32 format_version = 1;
  bytes history_id = 2;
  bytes index_key = 3;
  string collection = 4;
}

// Local artifact comparison, not an authorization grant or a write receipt.
// The maintenance publisher must compute this from its held before/after views.
message SourceRewriteCertificate {
  uint32 format_version = 1;
  SourceIndexOwner owner = 2;
  uint64 live_rows = 3;
  bytes schema_sha256 = 4;
  bytes identity_content_sha256 = 5;
}

// Physical index semantics retained independently of the remaining row files.
message IndexGenerationDeclaration {
  uint32 format_version = 1;
  repeated GenerationTextField text_fields = 2;
  GenerationColumns columns = 3;
  ai.protomolt.search.v1.DerivedColumns derived = 4;
  // Absent until a source publication first establishes a vector backend.
  GenerationVectorState vector = 5;
}
message GenerationTextField {
  string name = 1;
  // Absent until analysis has established this field's fingerprint.
  optional fixed64 analysis_fingerprint = 2;
  bool positions = 3;
  bool sentences = 4;
}
message GenerationColumns {
  repeated string facets = 1;
  repeated string numerics = 2;
  repeated string integers = 3;
  repeated string unsigned_integers = 4;
  repeated string geo = 5;
  repeated string map_facets = 6;
  repeated string map_numerics = 7;
  repeated string map_integers = 8;
  repeated string map_unsigned_integers = 9;
}
message GenerationVectorState {
  uint32 dimension = 1;
  ai.protomolt.search.v1.VectorBackendConfig config = 2;
}
