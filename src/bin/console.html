<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turbovec console</title>
<style>
  :root {
    --bg: #101418; --panel: #171c22; --panel2: #1d242c; --line: #2a333d;
    --ink: #d7dee6; --muted: #8b98a5; --accent: #4cc2ff; --vec: #7aa2f7;
    --lex: #9ece6a; --boost: #e0af68; --bad: #f7768e; --ok: #9ece6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-monospace, "JetBrains Mono", Menlo, monospace; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; color: var(--accent); font-weight: 600; }
  #health { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .dot { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
         border: 1px solid var(--line); border-radius: 10px; font-size: 12px;
         color: var(--muted); }
  .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%;
                 background: var(--muted); }
  .dot.up::before { background: var(--ok); }
  .dot.down::before { background: var(--bad); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: calc(100vh - 46px); }
  #controls { padding: 14px; border-right: 1px solid var(--line); background: var(--panel); }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px;
             padding: 10px 10px 12px; }
  legend { color: var(--muted); font-size: 11px; text-transform: uppercase;
           letter-spacing: 0.08em; padding: 0 6px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  label.check { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  label.check input { width: auto; }
  input, select, textarea, button {
    width: 100%; background: var(--panel2); color: var(--ink); font: inherit;
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  textarea { resize: vertical; min-height: 54px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { cursor: pointer; }
  button.primary { background: #16324a; border-color: #2b587e; color: #cfe9ff;
                   font-weight: 600; margin-top: 4px; }
  button.primary:hover { background: #1a3c59; }
  button.ghost { margin-top: 8px; }
  #results-area { padding: 14px; overflow-x: auto; }
  .columns { display: grid; gap: 14px; grid-template-columns: 1fr; }
  .columns.split { grid-template-columns: 1fr 1fr; }
  .col h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .error { color: var(--bad); white-space: pre-wrap; margin: 8px 0; }
  .hit { border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
         padding: 8px 10px; margin-bottom: 8px; }
  .hit .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .hit .rank { color: var(--accent); font-weight: 700; }
  .hit .id { color: var(--ink); }
  .chip { font-size: 11px; border: 1px solid var(--line); border-radius: 9px;
          padding: 1px 7px; color: var(--muted); }
  .moved-up { color: var(--ok); } .moved-down { color: var(--bad); }
  .moved-new { color: var(--boost); }
  .scores { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px;
            color: var(--muted); margin: 4px 0; }
  .scores b { font-weight: 600; }
  .s-vec b { color: var(--vec); } .s-lex b { color: var(--lex); }
  .s-boost b { color: var(--boost); } .s-fused b { color: var(--accent); }
  .snippet { font-size: 12.5px; color: #b9c3cd; border-top: 1px dashed var(--line);
             margin-top: 6px; padding-top: 6px; white-space: pre-wrap;
             word-break: break-word; }
  .snippet mark { background: #2c4f2c; color: #d2f8d2; border-radius: 2px; padding: 0 1px; }
  .snippet mark.b { background: #54401c; color: #ffe1a8; }
  .lineage { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .debug { border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
           padding: 10px; margin-bottom: 12px; }
  .debug h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted);
              text-transform: uppercase; letter-spacing: 0.08em; }
  .phases { display: flex; height: 18px; border-radius: 4px; overflow: hidden;
            border: 1px solid var(--line); }
  .phases div { min-width: 2px; }
  .ph-embed { background: #565f89; } .ph-analysis { background: #7aa2f7; }
  .ph-stats { background: #2ac3de; } .ph-legs { background: #9ece6a; }
  .ph-fusion { background: #bb9af7; } .ph-boost { background: #e0af68; }
  .phlegend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px;
              color: var(--muted); margin-top: 5px; }
  .phlegend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
                margin-right: 4px; }
  .shard-row { display: grid; grid-template-columns: 70px 1fr 210px; gap: 8px;
               align-items: center; font-size: 12px; margin-top: 6px; }
  .bar { height: 12px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .bar div { height: 100%; background: var(--vec); }
  .scan { font-size: 11px; color: var(--muted); }
  .terms { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .terms mark { background: transparent; color: var(--lex); }
  .terms mark.b { color: var(--boost); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>turbovec console</h1>
  <span id="status" style="font-size:12px;color:var(--muted)"></span>
  <div id="health"></div>
</header>
<main>
  <div id="controls">
    <fieldset>
      <legend>query</legend>
      <label for="q-text">text (embedded + BM25 leg)</label>
      <textarea id="q-text" placeholder="habeas corpus petition after state conviction"></textarea>
      <div class="row">
        <div><label for="q-k">k</label><input id="q-k" type="number" value="10" min="1"></div>
        <div><label for="q-mode">fusion mode</label>
          <select id="q-mode">
            <option value="global_rank">global_rank (RRF, default)</option>
            <option value="cascade">cascade (vector-gated rerank)</option>
            <option value="score_blend">score_blend</option>
            <option value="two_level">two_level</option>
          </select></div>
      </div>
      <label for="q-minvec">min vector score (0 = off)</label>
      <input id="q-minvec" type="number" value="0" step="0.05" min="0">
      <label for="q-filter">CEL filter (empty = off; lexical route, uncheck vector leg)</label>
      <input id="q-filter" placeholder="court == &quot;scotus&quot; &amp;&amp; year >= 1990">
      <div class="row" style="grid-template-columns:1fr 1fr 1fr">
        <div><label for="q-tok">tokenizer</label>
          <select id="q-tok"><option value="default">default</option>
            <option value="whitespace">whitespace</option>
            <option value="simple">simple</option></select></div>
        <div><label for="q-stem">stemmer</label>
          <select id="q-stem"><option value="default">default</option>
            <option value="none">none</option>
            <option value="porter">porter</option></select></div>
        <div><label for="q-src">terms</label>
          <select id="q-src"><option value="default">default</option>
            <option value="tokens">tokens</option>
            <option value="stems">stems</option></select></div>
      </div>
    </fieldset>
    <fieldset id="fs-legs">
      <legend>legs</legend>
      <div class="row">
        <div><label class="check"><input id="q-vleg" type="checkbox" checked> vector leg</label></div>
        <div><label class="check"><input id="q-bleg" type="checkbox" checked> bm25 leg</label></div>
      </div>
      <div class="row">
        <div><label for="q-legk">leg_k (0 = default)</label><input id="q-legk" type="number" value="0" min="0"></div>
        <div><label for="q-rrfk">rrf_k (0 = 60)</label><input id="q-rrfk" type="number" value="0" min="0" step="1"></div>
      </div>
      <div class="row">
        <div><label for="q-vw">vector weight</label><input id="q-vw" type="number" value="0" step="0.1"></div>
        <div><label for="q-bw">bm25 weight</label><input id="q-bw" type="number" value="0" step="0.1"></div>
      </div>
      <div class="row" id="blend-knobs">
        <div><label for="q-norm">normalization</label>
          <select id="q-norm">
            <option value="min_max">min_max</option>
            <option value="z_score">z_score</option>
            <option value="none">none</option>
          </select></div>
        <div><label for="q-comb">combination</label>
          <select id="q-comb">
            <option value="arithmetic">arithmetic</option>
            <option value="geometric">geometric</option>
            <option value="harmonic">harmonic</option>
          </select></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>boost rescore</legend>
      <label for="b-text">boost text (empty = off)</label>
      <input id="b-text" placeholder="ineffective assistance">
      <div class="row">
        <div><label for="b-window">window (0 = all)</label><input id="b-window" type="number" value="0" min="0"></div>
        <div><label for="b-bw">boost weight (0 = 1)</label><input id="b-bw" type="number" value="0" step="0.1"></div>
      </div>
      <label for="b-basew">base weight (0 = 1)</label>
      <input id="b-basew" type="number" value="0" step="0.1">
    </fieldset>
    <button id="go" class="primary">Search</button>
    <button id="hold" class="ghost">Hold as A (compare)</button>
    <button id="clear" class="ghost hidden">Clear A</button>
  </div>
  <div id="results-area">
    <div id="error" class="error hidden"></div>
    <div id="columns" class="columns">
      <div class="col" id="col-a-wrap" style="display:none">
        <h2 id="col-a-title">A</h2>
        <div id="col-a"></div>
      </div>
      <div class="col">
        <h2 id="col-b-title">results</h2>
        <div id="col-b"></div>
      </div>
    </div>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let held = null;   // {label, payload, response}

function knobs() {
  return {
    text: $("q-text").value.trim(),
    k: +$("q-k").value || 10,
    mode: $("q-mode").value,
    leg_k: +$("q-legk").value || 0,
    rrf_k: +$("q-rrfk").value || 0,
    vector_weight: +$("q-vw").value || 0,
    bm25_weight: +$("q-bw").value || 0,
    normalization: $("q-norm").value,
    combination: $("q-comb").value,
    boost_text: $("b-text").value.trim(),
    boost_window: +$("b-window").value || 0,
    boost_base_weight: +$("b-basew").value || 0,
    boost_weight: +$("b-bw").value || 0,
    tokenizer: $("q-tok").value,
    stemmer: $("q-stem").value,
    term_source: $("q-src").value,
    vector_leg: $("q-vleg").checked,
    bm25_leg: $("q-bleg").checked,
    min_vector_score: +$("q-minvec").value || 0,
    filter: $("q-filter").value.trim(),
    fetch_docs: true,
  };
}

function label(p) {
  let s = p.mode + " k=" + p.k;
  if (!p.vector_leg) s += " bm25-only";
  if (!p.bm25_leg) s += " vec-only";
  if (p.min_vector_score) s += " vec\u2265" + p.min_vector_score;
  if (p.mode === "score_blend") s += " " + p.normalization + "/" + p.combination;
  if (p.boost_text) s += " +boost(" + JSON.stringify(p.boost_text) + ")";
  if (p.filter) s += " filter(" + JSON.stringify(p.filter) + ")";
  return s;
}

function esc(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Highlight query terms (green) and boost terms (amber) by word-prefix
// match; terms are the analyzed identities the BM25 legs actually used.
function highlight(text, terms, boostTerms) {
  let html = esc(text);
  const wrap = (list, cls) => {
    for (const t of list || []) {
      if (!t) continue;
      const re = new RegExp("(^|[^\\w])(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[\\w]*)", "gi");
      html = html.replace(re, (m, pre, word) => pre + "<mark" + (cls ? ' class="' + cls + '"' : "") + ">" + word + "</mark>");
    }
  };
  wrap(terms, ""); wrap(boostTerms, "b");
  return html;
}

function snippet(text, terms, boostTerms) {
  if (!text) return "";
  const all = (terms || []).concat(boostTerms || []);
  let at = -1;
  for (const t of all) {
    const i = text.toLowerCase().indexOf(t.toLowerCase());
    if (i >= 0 && (at < 0 || i < at)) at = i;
  }
  const start = at < 0 ? 0 : Math.max(0, at - 140);
  const cut = text.slice(start, start + 420);
  return (start > 0 ? "…" : "") + highlight(cut, terms, boostTerms) + (start + 420 < text.length ? "…" : "");
}

function fmt(x, digits) {
  return x == null ? "–" : (+x).toFixed(digits == null ? 4 : digits);
}

function hitCard(h, i, terms, boostTerms, movement) {
  const rank = h.rank || i + 1;
  const move = movement == null ? "" :
    movement === "new" ? ' <span class="moved-new">●new</span>' :
    movement > 0 ? ' <span class="moved-up">▲' + movement + "</span>" :
    movement < 0 ? ' <span class="moved-down">▼' + (-movement) + "</span>" : "";
  const scores = [
    h.fused_score != null ? '<span class="s-fused">fused <b>' + fmt(h.fused_score, 5) + "</b></span>" : "",
    '<span class="s-vec">vec <b>' + fmt(h.vector_score) + "</b>" + (h.vector_rank ? " #" + h.vector_rank : "") + "</span>",
    '<span class="s-lex">bm25 <b>' + fmt(h.bm25_score) + "</b>" + (h.bm25_rank ? " #" + h.bm25_rank : "") + "</span>",
    h.boost_score ? '<span class="s-boost">boost <b>' + fmt(h.boost_score) + "</b></span>" : "",
  ].filter(Boolean).join(" ");
  const lin = h.lineage ? '<div class="lineage">parent ' + h.lineage.parent_id +
    " · group " + h.lineage.group_id + " · span " + h.lineage.span_start + ".." + h.lineage.span_end + "</div>" : "";
  const snip = h.text ? '<div class="snippet">' + snippet(h.text, terms, boostTerms) + "</div>" : "";
  return '<div class="hit"><div class="top"><span class="rank">#' + rank + "</span>" +
    '<span class="id">doc ' + h.doc_id + "</span>" +
    '<span class="chip">shard ' + h.shard + "</span>" + move + "</div>" +
    '<div class="scores">' + scores + "</div>" + snip + lin + "</div>";
}

function debugBlock(r) {
  const d = r.debug;
  if (!d) return "";
  const phases = [
    ["embed", r.embed_ms], ["analysis", d.analysis_ms], ["stats", d.stats_ms],
    ["legs", d.legs_ms], ["fusion", d.fusion_ms], ["boost", d.boost_ms],
  ].filter((p) => p[1] > 0);
  const total = phases.reduce((a, p) => a + p[1], 0) || 1;
  const bar = phases.map((p) =>
    '<div class="ph-' + p[0] + '" style="width:' + (100 * p[1] / total).toFixed(2) + '%" title="' +
    p[0] + " " + p[1].toFixed(2) + 'ms"></div>').join("");
  const leg = phases.map((p) =>
    '<span><i class="ph-' + p[0] + '"></i>' + p[0] + " " + p[1].toFixed(1) + "ms</span>").join("");
  const maxRpc = Math.max(1e-6, ...d.shards.map((s) => s.rpc_ms));
  const shards = d.shards.map((s) => {
    const scan = s.scan ? '<span class="scan">' + s.scan.chunk_calls + " chunks · " +
      s.scan.candidates_collected + " cand · floors " + s.scan.floors_published + "p/" +
      s.scan.floor_updates_applied + "a</span>" : '<span class="scan">vec ' + s.vector_hits +
      " · bm25 " + s.bm25_hits + "</span>";
    return '<div class="shard-row"><span>shard ' + s.shard + "</span>" +
      '<div class="bar"><div style="width:' + (100 * s.rpc_ms / maxRpc).toFixed(1) + '%"></div></div>' +
      "<span>" + s.rpc_ms.toFixed(2) + "ms " + scan + "</span></div>";
  }).join("");
  const terms = '<div class="terms">terms: ' +
    (d.terms || []).map((t) => "<mark>" + esc(t) + "</mark>").join(" ") +
    (d.boost_terms && d.boost_terms.length ?
      " · boost: " + d.boost_terms.map((t) => '<mark class="b">' + esc(t) + "</mark>").join(" ") : "") + "</div>";
  return '<div class="debug"><h3>profile · total ' + d.total_ms.toFixed(2) +
    "ms (+" + r.embed_ms.toFixed(2) + "ms embed) · leg_k " + d.leg_k + "</h3>" +
    '<div class="phases">' + bar + "</div>" + '<div class="phlegend">' + leg + "</div>" +
    shards + terms + "</div>";
}

function render(el, r, compareTo) {
  const d = r.debug || {};
  const positions = compareTo ? new Map(compareTo.hits.map((h, i) => [h.doc_id, i])) : null;
  const cards = r.hits.map((h, i) => {
    let movement = null;
    if (positions) movement = positions.has(h.doc_id) ? positions.get(h.doc_id) - i : "new";
    return hitCard(h, i, d.terms, d.boost_terms, movement);
  }).join("");
  el.innerHTML = debugBlock(r) + (cards || "<div class='error'>no hits</div>");
}

async function run() {
  const payload = knobs();
  if (!payload.text) { showError("query text is required"); return; }
  $("status").textContent = "searching…";
  $("go").disabled = true;
  try {
    const res = await fetch("/api/search", { method: "POST", body: JSON.stringify(payload) });
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.error || res.statusText);
    showError(null);
    $("col-b-title").textContent = (held ? "B — " : "") + label(payload);
    render($("col-b"), body, held && held.response);
    if (held) render($("col-a"), held.response, null);
    window.last = { payload, response: body };
    $("status").textContent = "total " + ((body.debug || {}).total_ms || 0).toFixed(1) +
      "ms · " + body.hits.length + " hits";
  } catch (e) {
    showError(String(e.message || e));
    $("status").textContent = "";
  } finally {
    $("go").disabled = false;
  }
}

function showError(msg) {
  $("error").classList.toggle("hidden", !msg);
  $("error").textContent = msg || "";
}

function holdA() {
  if (!window.last) return;
  held = { label: label(window.last.payload), response: window.last.response };
  $("col-a-wrap").style.display = "";
  $("col-a-title").textContent = "A — " + held.label;
  render($("col-a"), held.response, null);
  $("columns").classList.add("split");
  $("clear").classList.remove("hidden");
}

function clearA() {
  held = null;
  $("col-a-wrap").style.display = "none";
  $("columns").classList.remove("split");
  $("clear").classList.add("hidden");
  $("col-b-title").textContent = "results";
}

async function pollHealth() {
  try {
    const res = await fetch("/api/health");
    const body = await res.json();
    if (body.error) throw new Error(body.error);
    $("health").innerHTML = body.targets.map((t) =>
      '<span class="dot ' + (t.reachable ? "up" : "down") + '" title="' + esc(t.addr) +
      (t.reachable ? " · " + t.num_vectors + " vecs · " + t.bm25_docs + " docs" : " · " + esc(t.error || "")) +
      '">s' + t.shard + (t.is_replica ? "r" : "") + "</span>").join("");
  } catch (e) {
    $("health").innerHTML = '<span class="dot down">coordinator unreachable</span>';
  }
}

function syncKnobVisibility() {
  const mode = $("q-mode").value;
  $("blend-knobs").style.display = mode === "score_blend" ? "" : "none";
  $("fs-legs").style.display = mode === "cascade" ? "none" : "";
}

$("go").addEventListener("click", run);
$("q-text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); run(); } });
$("hold").addEventListener("click", holdA);
$("clear").addEventListener("click", clearA);
$("q-mode").addEventListener("change", syncKnobVisibility);
syncKnobVisibility();
pollHealth();
setInterval(pollHealth, 5000);
</script>
</body>
</html>
