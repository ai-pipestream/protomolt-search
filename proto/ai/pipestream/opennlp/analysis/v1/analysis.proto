syntax = "proto3";

package ai.pipestream.opennlp.analysis.v1;

option java_multiple_files = true;
option java_package = "ai.pipestream.opennlp.analysis.v1";

// AnalysisService analyzes raw text into the linguistic artifacts that search
// consumers (BM25 and vector indexing) need: sentences, tokens, stems, entities,
// term vectors, and chunk embeddings.
//
// Offset-fidelity guarantee: every Span in every response is expressed in the
// character offsets of the ORIGINAL request text, even when the analyzed terms
// were produced over normalized text (case folding, whitespace collapsing, …).
// Normalization runs through OpenNLP's offset-aware Alignment, so a term such as
// "gross" folded from "Groß" still maps back to the exact original span. This is
// what makes true highlighting in search results possible.
service AnalysisService {
  // Analyze runs a configurable annotation pipeline over the request text and
  // returns the requested layers. The pipeline is model-free by default: no
  // language model is downloaded or loaded unless the server is explicitly
  // configured with one.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);

  // AnalyzeStream analyzes many documents over one call. The FIRST message
  // must carry the options; it fixes the pipeline for the whole stream (a
  // client with two option-sets opens two streams — streams are cheap on
  // HTTP/2). Every later message carries one document, tagged with a
  // client-chosen sequence number that the response echoes back.
  //
  // Responses are NOT guaranteed to arrive in request order: the server
  // analyzes documents concurrently and returns each result as it
  // completes, so a slow document never blocks the finished ones behind
  // it. Match responses to requests by sequence.
  //
  // Error contract: a document that fails on its own (empty text, text over
  // the size cap, an analysis failure) produces an AnalyzeStreamResponse
  // carrying an error for that sequence, and the stream continues. Only
  // protocol violations fail the whole call: a first message that is not
  // options, or a second options message, end the stream with
  // INVALID_ARGUMENT.
  //
  // Flow control is the transport's: the server grants messages from its
  // actual worker capacity, so a client that just writes as the stream
  // allows is automatically paced — no client-side concurrency tuning.
  rpc AnalyzeStream(stream AnalyzeStreamRequest) returns (stream AnalyzeStreamResponse);

  // GetCapabilities reports which features this server instance can actually
  // serve right now (embeddings on/off and model directory, POS/NER model
  // availability, available stemmers and normalizer steps, OpenNLP version).
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// Coordinate system for every Span in one AnalyzeResponse. This changes only
// how original-text boundaries are numbered; tokenization and term identity do
// not change.
enum OffsetUnit {
  // Legacy behavior. Servers resolve this to OFFSET_UNIT_UTF16_CODE_UNITS.
  OFFSET_UNIT_UNSPECIFIED = 0;

  // Java String/OpenNLP coordinates. A supplementary scalar occupies two
  // units. This remains the default for backward compatibility.
  OFFSET_UNIT_UTF16_CODE_UNITS = 1;

  // Byte boundaries in the original text's UTF-8 encoding. This is directly
  // usable to slice a Rust string after validating the returned boundary.
  OFFSET_UNIT_UTF8_BYTES = 2;
}

// A half-open span [start, end), in AnalyzeResponse.offset_unit and
// always relative to the original, un-normalized request text. Offsets survive
// normalization via OpenNLP's Alignment, which enables exact highlighting.
message Span {
  // Start offset (inclusive).
  int32 start = 1;

  // End offset (exclusive).
  int32 end = 2;
}

// AnalyzeRequest carries the text and the analysis configuration.
message AnalyzeRequest {
  // The text to analyze. Must be non-empty and within the server's size cap
  // (default 1 MiB). Invalid requests are rejected with INVALID_ARGUMENT.
  string text = 1;

  // Pipeline configuration. An absent options message selects the server
  // defaults: whitespace tokenizer, sentence detection on, no stemming,
  // no term vectors, no embeddings.
  AnalysisOptions options = 2;
}

// AnalysisOptions selects the annotators the pipeline runs. All annotators in
// a single request share one document, so every returned layer refers to the
// same original text coordinates.
message AnalysisOptions {
  // Tokenizers. TOKENIZER_UNSPECIFIED selects the server default
  // (TOKENIZER_WHITESPACE). WHITESPACE, SIMPLE, and UAX29 are model-free;
  // LATTICE and SENTENCEPIECE need a server-configured dictionary/model and
  // fall back to whitespace tokenization (with a warning) when it is missing.
  // All produce tokens with original-text offsets.
  enum Tokenizer {
    // Unused zero value; resolves to the server default tokenizer.
    TOKENIZER_UNSPECIFIED = 0;

    // Splits on whitespace only. Fastest, keeps punctuation attached.
    TOKENIZER_WHITESPACE = 1;

    // Character-class tokenizer: splits letters, digits, and punctuation into
    // separate tokens.
    TOKENIZER_SIMPLE = 2;

    // Unicode UAX #29 word segmentation: drops punctuation, keeps
    // abbreviation periods ("U.S." stays one token), handles CJK and emoji
    // correctly. Model-free.
    TOKENIZER_UAX29 = 3;

    // Lattice tokenizer over a MeCab dictionary, for CJK text. Requires the
    // server to be configured with a dictionary directory
    // (OPENNLP_LATTICE_DIC_DIR); when none is configured the request still
    // succeeds with whitespace tokenization and a warning is returned.
    TOKENIZER_LATTICE = 4;

    // SentencePiece subword tokenizer, for OOV handling. Requires the server
    // to be configured with a model file (OPENNLP_SENTENCEPIECE_MODEL); when
    // none is configured the request still succeeds with whitespace
    // tokenization and a warning is returned. Pieces without original-text
    // coverage (control symbols, byte-fallback fill) are dropped.
    TOKENIZER_SENTENCEPIECE = 5;
  }

  // Model-free stemmers. STEMMER_UNSPECIFIED behaves as STEMMER_NONE. Every
  // stemmer except STEMMER_HUNSPELL is algorithmic and needs no language model
  // or dictionary. STEMMER_HUNSPELL needs a server-configured Hunspell
  // dictionary (OPENNLP_HUNSPELL_AFF + OPENNLP_HUNSPELL_DIC).
  //
  // Stemmers operate on the token surface form as-is: they do not lowercase
  // and they do not fold case or accents. Fold first (normalizer steps with
  // term_vectors, or client-side) if case-insensitive stems are needed.
  enum Stemmer {
    // Unused zero value; behaves as STEMMER_NONE.
    STEMMER_UNSPECIFIED = 0;

    // No stemming; the stems field of the response stays empty.
    STEMMER_NONE = 1;

    // The classic Porter stemming algorithm (English).
    STEMMER_PORTER = 2;

    // Snowball English stemmer (Porter2).
    STEMMER_SNOWBALL_ENGLISH = 3;

    // Snowball German stemmer.
    STEMMER_SNOWBALL_GERMAN = 4;

    // Snowball French stemmer.
    STEMMER_SNOWBALL_FRENCH = 5;

    // Snowball Spanish stemmer.
    STEMMER_SNOWBALL_SPANISH = 6;

    // English minimal stemmer (light, algorithmic).
    STEMMER_LIGHT_ENGLISH = 7;

    // German light stemmer.
    STEMMER_LIGHT_GERMAN = 8;

    // French light stemmer.
    STEMMER_LIGHT_FRENCH = 9;

    // Spanish light stemmer.
    STEMMER_LIGHT_SPANISH = 10;

    // Snowball Arabic stemmer.
    STEMMER_SNOWBALL_ARABIC = 11;

    // Snowball Catalan stemmer.
    STEMMER_SNOWBALL_CATALAN = 12;

    // Snowball Danish stemmer.
    STEMMER_SNOWBALL_DANISH = 13;

    // Snowball Dutch stemmer.
    STEMMER_SNOWBALL_DUTCH = 14;

    // Snowball Finnish stemmer.
    STEMMER_SNOWBALL_FINNISH = 15;

    // Snowball Greek stemmer.
    STEMMER_SNOWBALL_GREEK = 16;

    // Snowball Hungarian stemmer.
    STEMMER_SNOWBALL_HUNGARIAN = 17;

    // Snowball Indonesian stemmer.
    STEMMER_SNOWBALL_INDONESIAN = 18;

    // Snowball Irish stemmer.
    STEMMER_SNOWBALL_IRISH = 19;

    // Snowball Italian stemmer.
    STEMMER_SNOWBALL_ITALIAN = 20;

    // Snowball Norwegian stemmer.
    STEMMER_SNOWBALL_NORWEGIAN = 21;

    // The Snowball Porter program (the reference Porter implementation in
    // Snowball form; subtly different from STEMMER_PORTER).
    STEMMER_SNOWBALL_PORTER = 22;

    // Snowball Portuguese stemmer.
    STEMMER_SNOWBALL_PORTUGUESE = 23;

    // Snowball Romanian stemmer.
    STEMMER_SNOWBALL_ROMANIAN = 24;

    // Snowball Russian stemmer.
    STEMMER_SNOWBALL_RUSSIAN = 25;

    // Snowball Swedish stemmer.
    STEMMER_SNOWBALL_SWEDISH = 26;

    // Snowball Turkish stemmer.
    STEMMER_SNOWBALL_TURKISH = 27;

    // German minimal stemmer (lighter than STEMMER_LIGHT_GERMAN).
    STEMMER_MINIMAL_GERMAN = 28;

    // French minimal stemmer (lighter than STEMMER_LIGHT_FRENCH).
    STEMMER_MINIMAL_FRENCH = 29;

    // Finnish light stemmer.
    STEMMER_LIGHT_FINNISH = 30;

    // Hungarian light stemmer.
    STEMMER_LIGHT_HUNGARIAN = 31;

    // Italian light stemmer.
    STEMMER_LIGHT_ITALIAN = 32;

    // Norwegian light stemmer, Bokmal variety.
    STEMMER_LIGHT_NORWEGIAN_BOKMAAL = 33;

    // Norwegian light stemmer, Nynorsk variety.
    STEMMER_LIGHT_NORWEGIAN_NYNORSK = 34;

    // Norwegian minimal stemmer, Bokmal variety.
    STEMMER_MINIMAL_NORWEGIAN_BOKMAAL = 35;

    // Norwegian minimal stemmer, Nynorsk variety.
    STEMMER_MINIMAL_NORWEGIAN_NYNORSK = 36;

    // Portuguese light stemmer.
    STEMMER_LIGHT_PORTUGUESE = 37;

    // Russian light stemmer.
    STEMMER_LIGHT_RUSSIAN = 38;

    // Spanish minimal stemmer (lighter than STEMMER_LIGHT_SPANISH).
    STEMMER_MINIMAL_SPANISH = 39;

    // Swedish light stemmer.
    STEMMER_LIGHT_SWEDISH = 40;

    // Swedish minimal stemmer (lighter than STEMMER_LIGHT_SWEDISH).
    STEMMER_MINIMAL_SWEDISH = 41;

    // Hunspell dictionary stemmer. Requires the server to be configured with
    // a dictionary (OPENNLP_HUNSPELL_AFF and OPENNLP_HUNSPELL_DIC); when no
    // dictionary is configured the request still succeeds, stems stays empty,
    // and a warning is returned.
    STEMMER_HUNSPELL = 42;
  }

  // ISO 639 language code, for example "en" or "de". Informational in the
  // model-free default pipeline; selects the language of any server-configured
  // POS/NER models. Defaults to "en".
  string language = 1;

  // Tokenizer to use. Defaults to TOKENIZER_WHITESPACE.
  Tokenizer tokenizer = 2;

  // Whether to split the text into sentences. The default sentence detector is
  // newline-based and model-free, so sentence offsets are always exact.
  // Sentence spans also scope tokenization when enabled.
  bool sentence_detection = 3;

  // Whether to run part-of-speech tagging. Requires the server to be
  // configured with a POS model (OPENNLP_POS_MODEL); when no model is
  // configured the request still succeeds, pos stays empty, and a warning is
  // returned. No model is ever downloaded at request time.
  bool pos_tags = 4;

  // Whether to run named-entity recognition. Requires the server to be
  // configured with an NER model (OPENNLP_NER_MODEL); when no model is
  // configured the request still succeeds, entities stays empty, and a warning
  // is returned. No model is ever downloaded at request time.
  bool ner = 5;

  // Stemmer to apply per token. Defaults to STEMMER_NONE. When a stemmer is
  // selected, the response carries one stem per token, parallel to tokens.
  Stemmer stemmer = 6;

  // Term vector extraction. Absent means disabled.
  TermVectorOptions term_vectors = 7;

  // Chunk embedding extraction. Absent means disabled. Requires the server to
  // be configured with an embedding model (OPENNLP_EMBEDDINGS_DIR); when no
  // model is loaded the request still succeeds, embeddings stays empty, and a
  // warning is returned.
  EmbeddingOptions embeddings = 8;

  // Whether to run dictionary lemmatization. Requires the server to be
  // configured with a lemmatizer backend: a WordNet database directory
  // (OPENNLP_WORDNET_DIR, the Morphy lemmatizer, takes precedence) or a flat
  // lemmatizer dictionary (OPENNLP_LEMMATIZER_DICT); when neither is
  // configured the request still succeeds, lemmas stays empty, and a warning
  // is returned. When served, the response carries one lemma per token,
  // parallel to tokens.
  //
  // Lookup keys on (token, POS tag); the WordNet backend adapts UD tags
  // (PROPN lemmatizes as a noun) and falls back to an all-POS lookup when no
  // POS model produced tags, while the flat dictionary looks up with the
  // neutral empty tag. Words missing from the lexicon come back as "O", the
  // OpenNLP convention.
  bool lemmatize = 9;

  // Whether to score text noise: OCR damage, gibberish, base64-ish blobs.
  // Model-free structural scoring; embedded assets (data URIs and the like)
  // are detected first and excluded from scoring. The response carries one
  // NoiseSpan per finding, so an indexer can skip or downweight a garbage
  // chunk instead of indexing it.
  bool noise = 10;

  // Whether to flag text artifacts: replacement characters, control
  // characters, mojibake, unpaired surrogates, zero-width characters, and the
  // like. Model-free. Detection only FLAGS spans with a type — it never
  // modifies the text; repair decisions belong to the consumer.
  bool artifacts = 11;

  // Glossary matching. Absent means disabled.
  GlossaryOptions glossary = 12;

  // Whether to extract PII: email addresses, phone numbers, IBANs, and card
  // numbers. Model-free (cursor scanners plus validators); always available.
  bool pii = 13;

  // Whether to run coreference resolution: deterministic sieve-based mention
  // chaining, model-free, but it consumes the POS and entity layers, so it
  // requires the server to be configured with POS and NER models. Requesting
  // coref implies pos_tags and ner. When either model is missing the request
  // still succeeds, coref_mentions stays empty, and a warning is returned.
  bool coref = 14;

  // Whether to run dependency parsing. Requires the server to be configured
  // with a dependency-parsing model (OPENNLP_DEPPARSE_MODEL) and a POS model.
  // Requesting dependency_parse implies pos_tags. When a model is missing the
  // request still succeeds, dependencies stays empty, and a warning is
  // returned.
  bool dependency_parse = 15;

  // Relation extraction over dependency paths. Absent means disabled.
  // Consumes the entity and dependency layers, so it requires NER and
  // dependency-parsing models and implies dependency_parse (which implies
  // pos_tags). When a model is missing the request still succeeds, relations
  // stays empty, and a warning is returned.
  RelationOptions relations = 16;

  // Whether to geocode location entities against the bundled Natural Earth
  // gazetteer. Model-free data, but it consumes the entity layer, so it
  // requires the server to be configured with an NER model and implies ner.
  // When no NER model is configured the request still succeeds, locations and
  // regions stay empty, and a warning is returned.
  bool geo = 17;

  // Coordinate system requested for every returned Span. UNSPECIFIED selects
  // UTF16_CODE_UNITS, preserving the original contract. The resolved unit is
  // echoed in AnalyzeResponse.offset_unit and is authoritative.
  OffsetUnit offset_unit = 18;
}

// GlossaryOptions controls multi-word phrase matching: an Aho-Corasick
// automaton over the supplied entries, matched against the raw text with
// word-boundary checks, leftmost-longest overlap resolution. Deterministic,
// model-free, and cheap — the practical answer to "Dungeons & Dragons should
// be one unit", which no stock NER model would ever tag.
message GlossaryOptions {
  // One glossary entry: a stable concept id and its surface form.
  message Entry {
    // Stable concept/product code. Aliases are multiple entries sharing one
    // id.
    string id = 1;

    // The surface form to match; multiword phrases are fine.
    string term = 2;
  }

  // The glossary to match. Must not be empty when glossary is set; an empty
  // glossary fails with INVALID_ARGUMENT.
  repeated Entry entries = 1;

  // Whether matching ignores case (per code point, locale-independent).
  bool ignore_case = 2;
}

// TermVectorOptions controls per-term frequency and occurrence extraction.
// Terms are produced by running the ORIGINAL text through an aligned
// normalizer chain and reading each token's normalized form, so equal surface
// forms ("Groß", "groß", "GROSS" under full case folding) collapse into one
// term while every occurrence keeps its original-text span.
message TermVectorOptions {
  // How much each term vector records.
  enum Mode {
    // Unused zero value; resolves to MODE_FULL.
    MODE_UNSPECIFIED = 0;

    // Frequency plus every occurrence span in ORIGINAL text coordinates.
    // This is the mode highlighting needs.
    MODE_FULL = 1;

    // Frequency only; no occurrence spans are recorded or returned. Cheaper
    // for pure BM25/vector scoring pipelines that never highlight.
    MODE_SCORING_ONLY = 2;
  }

  // One step of the text-normalizer chain. Steps apply in the fixed pipeline
  // order of the OpenNLP normalizer builder, not in request order.
  // Normalization never breaks original-text offsets: steps that can report a
  // character alignment compose into the aligned whole-document chain; steps
  // backed by java.text.Normalizer, JDK case mapping, or regexes (NFKC, NFC,
  // CONFUSABLE_SKELETON, ACCENT_FOLD, CASE_FOLD, URL, NUMBER, SOCIAL_MEDIA,
  // SHRINK), whole-token rewrites (SYMBOL_JOINER), and spell correction
  // (SPELLCHECK) are applied per token instead — occurrence spans are the
  // token spans either way, so both paths return original-text offsets.
  enum NormalizerStep {
    // Unused zero value; ignored when present.
    NORMALIZER_STEP_UNSPECIFIED = 0;

    // Removes invisible characters (zero-width spaces, soft hyphens, …).
    NORMALIZER_STEP_STRIP_INVISIBLE = 1;

    // Collapses runs of whitespace to a single space.
    NORMALIZER_STEP_WHITESPACE = 2;

    // Normalizes the Unicode dash zoo to ASCII '-'.
    NORMALIZER_STEP_DASHES = 3;

    // Normalizes the Unicode quote zoo to ASCII quotes.
    NORMALIZER_STEP_QUOTES = 4;

    // Normalizes Unicode digit variants to ASCII digits.
    NORMALIZER_STEP_DIGITS = 5;

    // Unicode full case folding ("Groß" -> "gross"), locale-independent.
    NORMALIZER_STEP_FULL_CASE_FOLD = 6;

    // Collapses ellipsis characters ("…") to "...".
    NORMALIZER_STEP_ELLIPSIS = 7;

    // Normalizes Unicode bullet characters to '*'.
    NORMALIZER_STEP_BULLETS = 8;

    // Converts emoji to their emoticon text equivalents.
    NORMALIZER_STEP_EMOJI_TO_EMOTICON = 9;

    // Converts emoticons to their emoji equivalents.
    NORMALIZER_STEP_EMOTICON_TO_EMOJI = 10;

    // Expands German umlauts and sharp-s to ASCII digraphs
    // ("ä" -> "ae", "ö" -> "oe", "ü" -> "ue", "ß" -> "ss").
    NORMALIZER_STEP_GERMAN_UMLAUT = 11;

    // Unicode NFKC compatibility normalization: folds ligatures, full-width
    // forms, and compatibility characters to their canonical equivalents.
    NORMALIZER_STEP_NFKC = 12;

    // Unicode NFC canonical composition.
    NORMALIZER_STEP_NFC = 13;

    // Unicode confusable skeleton folding (UTS #39): maps look-alike
    // characters (Cyrillic/Greek homoglyphs, …) to their prototype, so a
    // spoofed or OCR-damaged word collapses onto its Latin twin.
    NORMALIZER_STEP_CONFUSABLE_SKELETON = 14;

    // Strips accents and diacritics ("café" -> "cafe"), separate from case
    // folding. Maps stroke and ligature letters ("ø" -> "o", "æ" -> "ae",
    // "ß" -> "ss").
    NORMALIZER_STEP_ACCENT_FOLD = 15;

    // Simple case folding (locale-independent lowercase), distinct from
    // NORMALIZER_STEP_FULL_CASE_FOLD: "ß" stays "ß" here.
    NORMALIZER_STEP_CASE_FOLD = 16;

    // Collapses horizontal whitespace runs to a single space but preserves
    // line structure: any run containing a line break collapses to one "\n".
    NORMALIZER_STEP_LINE_BREAK_PRESERVING_WHITESPACE = 17;

    // Replaces URLs and mail addresses with a single space.
    NORMALIZER_STEP_URL = 18;

    // Replaces runs of ASCII digits with a single space.
    NORMALIZER_STEP_NUMBER = 19;

    // Replaces social-media artifacts (hashtags, @handles, RT markers) with a
    // single space.
    NORMALIZER_STEP_SOCIAL_MEDIA = 20;

    // Collapses whitespace runs and shrinks repeated-character runs to two
    // ("Helllllloooooo" -> "Helloo"), then trims.
    NORMALIZER_STEP_SHRINK = 21;

    // Spells out a whole-token symbol joiner ("&" -> "and"), so a document
    // writing "Dungeons & Dragons" and a query writing "dungeons and dragons"
    // agree on term identity. The table covers the standalone joiners
    // (&, +, @), unit and legal reference marks (%, section sign, pilcrow,
    // degree), and IP marks (copyright, registered, trademark). Only a token
    // consisting of exactly the symbol is rewritten; symbols embedded in a
    // larger token ("R&D", "AT&T", "TSR®") are left alone.
    NORMALIZER_STEP_SYMBOL_JOINER = 22;

    // SymSpell spell correction of each token ("dargons" -> "dragons"),
    // aimed at OCR-damaged corpora. Requires the server to be configured
    // with a spell-check model (OPENNLP_SPELLCHECK_MODEL); when none is
    // configured the request still succeeds with the step skipped and a
    // warning is returned. Correction re-applies the token's casing pattern
    // and skips numbers, URLs, and short tokens. Handle deliberately: it
    // changes term identity, so it belongs in a parallel column's spec,
    // never silently in the body's.
    NORMALIZER_STEP_SPELLCHECK = 23;

    // Joins words split by typesetting hyphenation at a line break:
    // "litiga-\ntion" -> "litigation" (also "com-\r\n  plete" -> "complete",
    // and soft hyphens U+00AD). Only fires between two letters; an inline
    // hyphen ("well-known") is untouched. The hyphen is always deleted,
    // which is right for typeset hyphenation and wrong for a genuinely
    // hyphenated compound split at its hyphen ("well-\nknown" -> "wellknown")
    // - telling those apart needs a dictionary, which this step deliberately
    // does not consult.
    //
    // This is the one COUNT-CHANGING step: two tokens become one. It is
    // therefore only valid for SOURCE_TOKENS term identity, where the server
    // re-tokenizes the normalized text and maps every occurrence span back
    // to the original offsets (the joined term's span covers the hyphen and
    // line break in the original). It requires every step in the spec to be
    // offset-aware: a spec combining it with a step that cannot report an
    // alignment (NFKC, NFC, CONFUSABLE_SKELETON, ACCENT_FOLD, CASE_FOLD,
    // URL, NUMBER, SOCIAL_MEDIA, SHRINK, SPELLCHECK) fails with
    // INVALID_ARGUMENT, as does using it with SOURCE_STEMS.
    NORMALIZER_STEP_DEHYPHENATE = 24;
  }

  // Which layer supplies term identity. This choice decides what a "term" is:
  //
  // TOKENS: terms are token surface forms after the aligned normalizer chain;
  // the steps define identity (so "Groß"/"GROSS" can collapse under
  // FULL_CASE_FOLD). The stems layer is not involved.
  //
  // STEMS: the stem IS the term identity. Occurrences of different surface
  // forms group under their common stem ("running"/"runs" -> "run"). The
  // normalizer steps are IGNORED for identity in this mode (stems are
  // computed from the raw token surface forms); the term vector annotator is
  // bypassed and grouping happens service-side, one entry per distinct stem,
  // with the occurrence spans of every token carrying that stem, in original
  // text coordinates. Requires a stemmer other than STEMMER_NONE; requesting
  // STEMS without a stemmer fails with INVALID_ARGUMENT.
  enum Source {
    // Unused zero value; resolves to SOURCE_TOKENS.
    SOURCE_UNSPECIFIED = 0;

    // Group by normalized token text (the default; steps define identity).
    SOURCE_TOKENS = 1;

    // Group by stem (the BM25 mode; the stem defines identity, steps ignored).
    SOURCE_STEMS = 2;

    // Group by the stem of the NORMALIZED token: the step chain runs first,
    // then the stemmer, and the resulting stem is the identity.
    //
    // SOURCE_STEMS alone is a trap for any corpus that is not already lower
    // case. Stemmers are written for folded input, so "COURT" survives
    // unchanged while "court" stems to "court", and the two become distinct
    // terms; a query typed in lower case then misses every capitalized
    // occurrence. SOURCE_TOKENS is not the answer either, because it folds
    // but never stems ("court" and "courts" stay apart). This is the mode
    // that composes them, and it is what a BM25 index over prose wants.
    SOURCE_NORMALIZED_STEMS = 3;
  }

  // Whether term vectors are computed.
  bool enabled = 1;

  // Recording mode. Defaults to MODE_FULL.
  Mode mode = 2;

  // Normalizer steps for term identity. When empty and enabled, the server
  // default applies: STRIP_INVISIBLE + WHITESPACE + FULL_CASE_FOLD, which is
  // the chain BM25 consumers usually want. Ignored when source is
  // SOURCE_STEMS: the stem alone defines identity there.
  repeated NormalizerStep steps = 3;

  // Term identity source. Defaults to SOURCE_TOKENS.
  Source source = 4;

  // Whether to ALSO emit the cased term identity in one pass. When true, the
  // response carries cased_term_vectors alongside term_vectors: both are
  // computed from the same tokenization in the same analysis pass, so their
  // occurrence spans coincide exactly.
  //
  // The two identities differ only in case folding: term_vectors runs the
  // step chain as requested, cased_term_vectors runs the SAME chain minus the
  // case-folding steps (FULL_CASE_FOLD, CASE_FOLD). With SOURCE_NORMALIZED_STEMS
  // that means "COURT court Court Dungeons dungeons running runs" yields a
  // folded stream of 3 terms ({court, dungeon, run}) and a cased stream of 6
  // ({COURT, Court, court, Dungeon, dungeon, run}) from one call — the folded
  // form for recall, the cased form for the proper-noun asymmetry, without
  // analyzing the text twice.
  //
  // Meaningless with SOURCE_STEMS (that source ignores the step chain, so
  // there is no folded form to contrast with); requesting the combination
  // fails with INVALID_ARGUMENT. Model-free and always available.
  bool dual_cased = 5;
}

// EmbeddingOptions controls dense vector extraction. The embedding backend is
// a static (Model2Vec-style) embedding model loaded once at server startup;
// vectors are computed for the covered text of each annotation of the source
// layer and stay anchored to original-text spans.
message EmbeddingOptions {
  // Which annotation layer is embedded.
  enum Source {
    // Unused zero value; resolves to SOURCE_SENTENCES.
    SOURCE_UNSPECIFIED = 0;

    // Embed each sentence: chunk embeddings for vector search. Implies
    // sentence detection.
    SOURCE_SENTENCES = 1;

    // Embed each token: token-level vectors.
    SOURCE_TOKENS = 2;
  }

  // Source layer to embed. Defaults to SOURCE_SENTENCES.
  Source source = 1;
}

// A token with its original-text span and surface form.
message Token {
  // Original-text span of the token.
  Span span = 1;

  // The exact characters the span covers in the original text.
  string text = 2;

  // Part-of-speech tag. Empty unless pos_tags was requested AND the server has
  // a POS model configured.
  string pos = 3;
}

// A named entity mention.
message Entity {
  // Original-text span of the mention.
  Span span = 1;

  // Entity type as reported by the model, for example "person" or "location".
  string type = 2;

  // The exact characters the span covers in the original text.
  string text = 3;
}

// A term with its frequency and (in MODE_FULL) every occurrence span in
// original text coordinates.
message TermVector {
  // The normalized term, in the coordinate-free form produced by the
  // normalizer chain (for example "gross" for "Groß"/"GROSS" under full case
  // folding).
  string term = 1;

  // Number of occurrences of the term in the document.
  int32 frequency = 2;

  // Every occurrence span in ORIGINAL text coordinates. Empty when the mode
  // was MODE_SCORING_ONLY.
  repeated Span occurrences = 3;
}

// A dense vector computed for the covered text of one annotation of the
// embedding source layer.
message ChunkEmbedding {
  // Original-text span the vector was computed from.
  Span span = 1;

  // The exact characters the span covers in the original text.
  string text = 2;

  // The embedding vector; dimension depends on the loaded model.
  repeated float vector = 3;
}

// A noise finding: a span of likely-damaged text with a severity and a score.
message NoiseSpan {
  // Original-text span of the finding.
  Span span = 1;

  // Severity bucket: "misspelled", "damaged", "gibberish", or "binaryish"
  // (mild to worst). An open string; new severities may appear.
  string severity = 2;

  // Noise score in (0, 1]; higher is noisier.
  double score = 3;
}

// A flagged text artifact. Detection never modifies the text: the consumer
// decides whether to mask, drop, or repair the flagged span.
message TextArtifact {
  // Original-text span of the artifact.
  Span span = 1;

  // Artifact type: "replacement", "control", "noncharacter",
  // "unpaired-surrogate", "private-use", "bidi-control", "zero-width", or
  // "mojibake". An open string; new types may appear.
  string type = 2;
}

// A glossary match: a span where a glossary entry's term was found.
message GlossaryMatch {
  // Original-text span of the match.
  Span span = 1;

  // The matched entry's concept id.
  string id = 2;

  // The registered term that matched (the span's covered text may differ in
  // case when ignore_case was set).
  string term = 3;
}

// RelationOptions controls relation extraction: rule patterns matched over
// dependency paths between entity mentions.
message RelationOptions {
  // One relation pattern: a dependency-path rule with a type label.
  message Pattern {
    // Relation type label attached to matches.
    string type = 1;

    // Whitespace-separated dependency steps: '<' walks up toward the head,
    // '>' walks down toward dependents; the pivot is the lowest common
    // ancestor. Example: "<nsubj >obj".
    string path = 2;

    // Optional lowercased pivot-token form restricting where the path
    // applies.
    string trigger = 3;
  }

  // The patterns to match. Must not be empty when relations is set; an empty
  // pattern list fails with INVALID_ARGUMENT.
  repeated Pattern patterns = 1;
}

// A PII mention.
message PiiMention {
  // Original-text span of the mention.
  Span span = 1;

  // PII type: "email", "phone", "iban", or "card". An open string; new types
  // may appear.
  string type = 2;

  // Formatting-stripped form (email lowercased; IBAN separators removed;
  // phone/card digits only, phone keeps a leading '+').
  string normalized = 3;
}

// A coreference mention: one member of a mention chain.
message CorefMention {
  // Original-text span of the mention.
  Span span = 1;

  // Chain (cluster) id, numbered by first mention. Singletons included.
  int32 chain = 2;

  // Mention kind: "entity" or "pronoun".
  string kind = 3;

  // Index into the entities layer this mention resolves to, or -1 for
  // pronouns.
  int32 entity = 4;
}

// One dependency arc. Arcs are one per token, in token order.
message DependencyArc {
  // Original-text span of the dependent token.
  Span span = 1;

  // Token index of the head, or -1 for the root.
  int32 head = 2;

  // Token index of the dependent.
  int32 dependent = 3;

  // Dependency relation label, for example "nsubj".
  string relation = 4;
}

// A relation mention linking two entities.
message RelationMention {
  // Original-text span covering both entity mentions.
  Span span = 1;

  // The pattern's relation type.
  string type = 2;

  // Index into the entities layer: the subject.
  int32 subject = 3;

  // Index into the entities layer: the object.
  int32 object = 4;
}

// A geocoded location entity.
message GeoLocation {
  // Original-text span of the location mention.
  Span span = 1;

  // Gazetteer name of the resolved place.
  string name = 2;

  // ISO country code of the resolved place.
  string country_code = 3;

  // Resolved coordinates.
  double latitude = 4;

  // Resolved coordinates.
  double longitude = 5;

  // Resolution confidence in [0, 1].
  double confidence = 6;
}

// A document-level region vote: the share of location evidence pointing at a
// country.
message RegionVote {
  // ISO country code.
  string country_code = 1;

  // Share of the document's location evidence voting for this country.
  double share = 2;
}

// AnalyzeResponse carries every requested layer. Layers that were not
// requested (or that were requested but unavailable — see warnings) are empty.
message AnalyzeResponse {
  // Sentence spans in original text coordinates. Present when
  // sentence_detection was on.
  repeated Span sentences = 1;

  // Tokens in original text coordinates, in document order.
  repeated Token tokens = 2;

  // One stem per token, exactly parallel to tokens. Empty when no stemmer was
  // selected.
  repeated string stems = 3;

  // Named entity mentions. Empty unless ner was requested AND the server has
  // an NER model configured.
  repeated Entity entities = 4;

  // Term vectors in first-occurrence order. Empty unless term vectors were
  // enabled.
  repeated TermVector term_vectors = 5;

  // Chunk embeddings, parallel to the annotations of the requested source
  // layer. Empty unless embeddings were requested AND the server has an
  // embedding model loaded.
  repeated ChunkEmbedding embeddings = 6;

  // Non-fatal issues: requested features the server cannot serve (no embedding
  // model loaded, no POS/NER model configured, …). The analysis itself always
  // reflects exactly what the response contains.
  repeated string warnings = 7;

  // One lemma per token, exactly parallel to tokens. Empty unless lemmatize
  // was requested AND the server has a lemmatizer backend configured
  // (OPENNLP_WORDNET_DIR or OPENNLP_LEMMATIZER_DICT). Lookup keys on (token,
  // POS tag); when no POS model produced tags, the backend's tagless path
  // applies (neutral tag for the flat dictionary, all-POS fallback for
  // WordNet). Words missing from the lexicon come back as "O", the OpenNLP
  // convention.
  repeated string lemmas = 8;

  // Noise findings, in text order. Empty unless noise was requested.
  repeated NoiseSpan noise = 9;

  // Flagged text artifacts, in text order. Empty unless artifacts was
  // requested.
  repeated TextArtifact artifacts = 10;

  // Glossary matches, in text order, non-overlapping (leftmost-longest).
  // Empty unless a glossary was supplied.
  repeated GlossaryMatch glossary_matches = 11;

  // PII mentions, in text order. Empty unless pii was requested.
  repeated PiiMention pii = 12;

  // Coreference mentions. Empty unless coref was requested AND the server has
  // POS and NER models configured.
  repeated CorefMention coref_mentions = 13;

  // Dependency arcs, one per token, in token order. Empty unless
  // dependency_parse was requested AND the server has a dependency-parsing
  // model configured.
  repeated DependencyArc dependencies = 14;

  // Relation mentions. Empty unless relation patterns were supplied AND the
  // server has NER and dependency-parsing models configured.
  repeated RelationMention relations = 15;

  // Geocoded location entities. Empty unless geo was requested AND the server
  // has an NER model configured.
  repeated GeoLocation locations = 16;

  // Document-level region votes, ranked by share. Empty unless geo was
  // requested AND the server has an NER model configured.
  repeated RegionVote regions = 17;

  // The cased term identity, in first-occurrence order, computed in the same
  // pass as term_vectors: the same step chain minus the case-folding steps,
  // then (for stem sources) the same stemmer. Occurrence spans coincide with
  // term_vectors span-for-span. Empty unless term_vectors.dual_cased was
  // requested.
  repeated TermVector cased_term_vectors = 18;

  // Resolved coordinate system shared by every Span in this response. New
  // servers always set this. An absent/UNSPECIFIED value from an older server
  // means the legacy UTF16_CODE_UNITS contract.
  OffsetUnit offset_unit = 19;
}

// One message of the AnalyzeStream request direction. The first message of a
// stream must be options; every later message must be a doc.
message AnalyzeStreamRequest {
  oneof msg {
    // Pipeline configuration for the whole stream. Exactly once, first. An
    // empty AnalysisOptions selects the server defaults, the same way an
    // absent options message does on Analyze.
    AnalysisOptions options = 1;

    // One document to analyze.
    AnalyzeStreamDoc doc = 2;
  }
}

// One document in an AnalyzeStream call.
message AnalyzeStreamDoc {
  // Client-chosen identifier, echoed verbatim on the response for this
  // document. The server never interprets it: reusing a value returns two
  // responses with the same sequence, which only the client can tell apart.
  uint64 sequence = 1;

  // The text to analyze. Same per-document cap as Analyze (max_text_bytes in
  // GetCapabilities); an empty or oversized text produces a per-document
  // error response, not a stream failure.
  string text = 2;
}

// One result of an AnalyzeStream call, in completion order, matched to its
// request by sequence.
message AnalyzeStreamResponse {
  // The sequence of the AnalyzeStreamDoc this responds to.
  uint64 sequence = 1;

  oneof result {
    // The analysis, identical in shape and content to what Analyze would
    // have returned for the same text and options.
    AnalyzeResponse ok = 2;

    // Why this document failed. The stream itself continues.
    AnalyzeStreamError error = 3;
  }
}

// A per-document failure inside an otherwise healthy stream.
message AnalyzeStreamError {
  // Canonical gRPC status code (INVALID_ARGUMENT for empty/oversized text,
  // INTERNAL for an analysis failure) — the code Analyze would have failed
  // the whole call with.
  int32 code = 1;

  // Human-readable description of the failure.
  string message = 2;
}

// GetCapabilitiesRequest is empty: capabilities describe the whole server.
message GetCapabilitiesRequest {}

// GetCapabilitiesResponse reports what this server instance can actually serve.
message GetCapabilitiesResponse {
  // Version of the wrapped OpenNLP build, for example "0.0.0-preview-SNAPSHOT".
  string opennlp_version = 1;

  // Version of this service.
  string service_version = 2;

  // Whether an embedding model is loaded and embedding requests are served.
  bool embeddings_enabled = 3;

  // Directory the embedding model was loaded from. Empty when embeddings are
  // disabled.
  string embeddings_model_dir = 4;

  // Whether a POS model is configured and pos_tags requests are served.
  bool pos_tags_available = 5;

  // Whether an NER model is configured and ner requests are served.
  bool ner_available = 6;

  // Maximum accepted request text size in bytes; larger texts are rejected
  // with INVALID_ARGUMENT.
  int32 max_text_bytes = 7;

  // Stemmer option names this build supports (the Stemmer enum values minus
  // the zero value).
  repeated string stemmers = 8;

  // Normalizer step names this build supports (the NormalizerStep enum values
  // minus the zero value).
  repeated string normalizer_steps = 9;

  // Tokenizer option names this build supports (the Tokenizer enum values
  // minus the zero value).
  repeated string tokenizers = 10;

  // Server-level warnings, for example "OPENNLP_EMBEDDINGS_DIR is not set;
  // embedding requests return a warning and no vectors".
  repeated string warnings = 11;

  // Whether a Hunspell dictionary is configured and STEMMER_HUNSPELL requests
  // are served.
  bool hunspell_available = 12;

  // Whether a lemmatizer dictionary is configured and lemmatize requests are
  // served.
  bool lemmatizer_available = 13;

  // Whether a MeCab dictionary is configured and TOKENIZER_LATTICE requests
  // are served without whitespace fallback.
  bool lattice_available = 14;

  // Whether a SentencePiece model is configured and TOKENIZER_SENTENCEPIECE
  // requests are served without whitespace fallback.
  bool sentencepiece_available = 15;

  // Whether a dependency-parsing model is configured and dependency_parse
  // requests are served.
  bool dependency_parse_available = 16;

  // Whether term_vectors.dual_cased requests are served. Model-free, so this
  // is always true; it exists so a client compiled against an older contract
  // can tell the feature exists on this server.
  bool dual_term_identity_available = 17;

  // Whether a SymSpell spell-check model is configured and
  // NORMALIZER_STEP_SPELLCHECK requests are served without skipping the step.
  bool spellcheck_available = 18;

  // Always true: line-break de-hyphenation (NORMALIZER_STEP_DEHYPHENATE) is
  // model-free. Reported so a client can tell the feature exists on this
  // server.
  bool dehyphenation_available = 19;

  // Whether the vocabulary listener is enabled on this server
  // (OPENNLP_VOCAB_DIR is set and the snapshot directory is writable) and
  // VocabularyService is registered. Reported so a client compiled against an
  // older contract can tell the feature exists on this server.
  bool vocab_listener_available = 20;

  // Coordinate systems this server can return. An empty list from an older
  // server means only the legacy UTF16_CODE_UNITS behavior is available.
  repeated OffsetUnit supported_offset_units = 21;
}

// VocabularyService exposes the streaming vocabulary statistics collected by
// the vocabulary listener on the AnalyzeStream ingest path (see
// VOCABULARY-LISTENER.md): per-window cardinality, frequencies, and heavy
// hitters over the corpus being indexed, plus drift metrics between windows.
// It is registered on the same port as AnalysisService, but ONLY when the
// listener is enabled (OPENNLP_VOCAB_DIR set and writable); on a listener-less
// server every method resolves to UNIMPLEMENTED and
// GetCapabilities.vocab_listener_available is false.
//
// Nothing here gates anything: the metrics inform an operator's decision to
// retrain the embedding model; promotion stays with the A/B harness.
service VocabularyService {
  // GetVocabStats reports the listener state: the live window's counters and
  // cardinality estimates per channel, and the persisted snapshots a drift
  // request can name.
  rpc GetVocabStats(GetVocabStatsRequest) returns (GetVocabStatsResponse);

  // SnapshotVocab seals and persists the live window and starts a fresh one.
  // When the live window holds no documents nothing is written and
  // SnapshotVocabResponse.persisted is false.
  rpc SnapshotVocab(SnapshotVocabRequest) returns (SnapshotVocabResponse);

  // GetVocabDrift compares two windows per channel: cardinality of both and
  // their union, the novelty rate, the Jensen-Shannon divergence over the
  // union of the heavy-hitter lists, and (TOKENS, when an embedding
  // vocabulary is readable) the out-of-vocabulary share of the newer window.
  // Either side may be "live" for the current window; an unknown snapshot
  // reference fails with INVALID_ARGUMENT.
  rpc GetVocabDrift(GetVocabDriftRequest) returns (GetVocabDriftResponse);
}

// The two channels every analyzed document feeds. TERMS carries the
// term-vector entries with their frequencies (exactly the BM25 index
// identity); TOKENS carries the raw token surface forms, pre-normalization.
enum VocabChannel {
  // Unused zero value; never set on a response.
  VOCAB_CHANNEL_UNSPECIFIED = 0;

  // Term-vector entries of the response (folded source), with frequencies.
  VOCAB_CHANNEL_TERMS = 1;

  // Raw token texts of the response (surface forms).
  VOCAB_CHANNEL_TOKENS = 2;
}

// One heavy hitter: a term with its (near-exact) count in the window.
message VocabHeavyHitter {
  // The term or token surface form.
  string term = 1;

  // Number of occurrences the space-saving sketch attributes to the term.
  uint64 count = 2;
}

// Per-channel statistics of one window (the live window in GetVocabStats).
message VocabChannelStats {
  // Which channel these statistics describe.
  VocabChannel channel = 1;

  // Documents fed into the window on this channel.
  uint64 documents = 2;

  // Total term/token occurrences (with multiplicity) in the window.
  uint64 term_occurrences = 3;

  // Estimated number of distinct terms (HyperLogLog, ~0.8% standard error).
  double cardinality_estimate = 4;

  // The heaviest terms of the window, ordered by count descending.
  repeated VocabHeavyHitter heavy_hitters = 5;
}

// The index entry of one persisted snapshot: everything a client needs to
// name it in a drift request, without loading its sketches.
message VocabSnapshotDescriptor {
  // File name of the snapshot, for example "snapshot-3-1780000000000.pb".
  // This is the reference GetVocabDrift names (the bare sequence number works
  // too).
  string name = 1;

  // Monotonic sequence number of the snapshot on this server instance's
  // history.
  uint64 sequence = 2;

  // When the window that produced the snapshot started, epoch milliseconds.
  int64 started_epoch_millis = 3;

  // When the window was sealed and persisted, epoch milliseconds.
  int64 sealed_epoch_millis = 4;

  // Documents the window accumulated (per channel; both channels see the
  // same documents).
  uint64 documents = 5;

  // Size of the snapshot file in bytes.
  uint64 size_bytes = 6;
}

// GetVocabStatsRequest is empty: stats describe the whole listener.
message GetVocabStatsRequest {}

// GetVocabStatsResponse reports the listener state and its snapshot history.
message GetVocabStatsResponse {
  // Always true when this service answers: the service is only registered
  // when the listener is enabled. The field exists so the response shape is
  // stable if registration rules ever change.
  bool enabled = 1;

  // Documents accumulated in the live (not yet snapshotted) window.
  uint64 window_documents = 2;

  // Live-window statistics, one entry per channel (TERMS and TOKENS).
  repeated VocabChannelStats live_channels = 3;

  // Persisted snapshots, ordered by sequence ascending.
  repeated VocabSnapshotDescriptor snapshots = 4;
}

// SnapshotVocabRequest is empty: the live window is always the target.
message SnapshotVocabRequest {}

// SnapshotVocabResponse reports what the explicit snapshot did.
message SnapshotVocabResponse {
  // Whether a snapshot was written. False when the live window held no
  // documents, in which case nothing is persisted and snapshot is absent.
  bool persisted = 1;

  // The descriptor of the persisted snapshot, when persisted is true.
  VocabSnapshotDescriptor snapshot = 2;
}

// GetVocabDriftRequest names the two windows to compare.
message GetVocabDriftRequest {
  // The older window: a snapshot name ("snapshot-3-1780000000000.pb"), a bare
  // sequence number ("3"), or "live" for the current window. Empty or
  // unknown references fail with INVALID_ARGUMENT.
  string from = 1;

  // The newer window, same reference rules as from.
  string to = 2;
}

// Drift metrics between two windows on one channel.
message VocabChannelDrift {
  // Which channel these metrics describe.
  VocabChannel channel = 1;

  // Estimated distinct-term cardinality of the older window.
  double from_cardinality = 2;

  // Estimated distinct-term cardinality of the newer window.
  double to_cardinality = 3;

  // Estimated cardinality of the union (merged HyperLogLog).
  double union_cardinality = 4;

  // Share of the newer window's distinct vocabulary the older window never
  // saw: (|union| - |from|) / |to|. In [0, 1]; 0 when the newer window is
  // empty. The primary "the corpus moved" number.
  double novelty_rate = 5;

  // Jensen-Shannon divergence (base 2, so in [0, 1]) between the two term
  // distributions over the union of their heavy-hitter lists, with missing
  // counts filled from the count-min sketches. Distribution-level movement
  // even when the vocabulary itself is stable.
  double jensen_shannon_divergence = 6;

  // Whether embedding_oov_share was computed: only on VOCAB_CHANNEL_TOKENS
  // and only when an embedding vocabulary was readable from the configured
  // embeddings directory (vocab.txt, or tokenizer.json model.vocab).
  bool embedding_oov_computed = 7;

  // Share of the newer window's token mass (over its heavy-hitter list)
  // whose surface form is ABSENT from the embedding model's vocabulary. When
  // this climbs, the deployed static model is degrading on fresh text — the
  // reweight trigger. Meaningful only when embedding_oov_computed is true.
  double embedding_oov_share = 8;
}

// GetVocabDriftResponse carries the drift metrics, one entry per channel.
message GetVocabDriftResponse {
  // One entry per channel (TERMS and TOKENS), in channel order.
  repeated VocabChannelDrift channels = 1;
}

// The persisted form of one channel of a sealed window. The count-min table
// and HLL registers serialize as raw bytes so every drift metric remains
// computable between any two historical windows, not just adjacent ones.
message VocabChannelSnapshot {
  // Which channel this state belongs to.
  VocabChannel channel = 1;

  // Documents the window accumulated on this channel.
  uint64 documents = 2;

  // Total term/token occurrences (with multiplicity) on this channel.
  uint64 term_occurrences = 3;

  // HyperLogLog precision p (register count is 2^p); 14 at introduction.
  uint32 hll_precision = 4;

  // The 2^p HLL registers, one byte each, in register order.
  bytes hll_registers = 5;

  // Count-min sketch depth (rows); 5 at introduction.
  uint32 cms_depth = 6;

  // Count-min sketch width (columns per row); 2^17 at introduction.
  uint32 cms_width = 7;

  // The count-min table in row-major order as unsigned 64-bit counters,
  // little-endian (depth * width * 8 bytes).
  bytes cms_table = 8;

  // The heavy-hitter list at seal time, ordered by count descending.
  repeated VocabHeavyHitter heavy_hitters = 9;
}

// A sealed vocabulary window, persisted as
// <vocabDir>/snapshot-<sequence>-<sealedEpochMillis>.pb. Snapshots are
// training data for the embedding reweight, so the format is protobuf: any
// tooling, JVM or not, can read them with this contract.
message VocabSnapshot {
  // Monotonic sequence number of the snapshot on the writing instance.
  uint64 sequence = 1;

  // When the window started, epoch milliseconds.
  int64 started_epoch_millis = 2;

  // When the window was sealed, epoch milliseconds.
  int64 sealed_epoch_millis = 3;

  // The per-channel sketch state (one entry per channel).
  repeated VocabChannelSnapshot channels = 4;
}
