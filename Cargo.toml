[package]
name = "turbovec-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Distributed top-k search over turbovec shard indexes with collaborative mid-query floor sharing"

[dependencies]
turbovec = { git = "https://github.com/ai-pipestream/turbovec.git", branch = "turbovec-pipestream-streaming" }
tonic = "0.12"
prost = "0.13"
# google.protobuf.Timestamp on the ingest wire compiles to this crate's
# type; tonic-build emits the reference, the runtime needs the crate.
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
memmap2 = "0.9"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bzip2 = "0.4"
csv = "1"
