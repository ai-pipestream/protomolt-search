  <text x="76" y="320.6" class="tick" text-anchor="end">1</text>
  <line x1="84" y1="237.1" x2="700" y2="237.1" stroke="#e2e8f0" stroke-width="1" />
  <text x="76" y="241.1" class="tick" text-anchor="end">2</text>
  <line x1="84" y1="157.7" x2="700" y2="157.7" stroke="#e2e8f0" stroke-width="1" />
  <text x="76" y="161.7" class="tick" text-anchor="end">3</text>
  <line x1="84" y1="396" x2="700" y2="396" stroke="#cbd5e1" stroke-width="1" />
  <text x="124.0" y="416" class="tick" text-anchor="middle">1</text>
  <text x="231.2" y="416" class="tick" text-anchor="middle">2</text>
  <text x="338.4" y="416" class="tick" text-anchor="middle">4</text>
  <text x="445.6" y="416" class="tick" text-anchor="middle">8</text>
  <text x="552.8" y="416" class="tick" text-anchor="middle">16</text>
  <text x="660.0" y="416" class="tick" text-anchor="middle">32</text>
  <text x="392.0" y="440" class="axis" text-anchor="middle">concurrent clients (log scale)</text>
  <text x="30" y="253.0" class="axis" transform="rotate(-90 30 253.0)" text-anchor="middle">queries per second</text>
  <polyline points="124.0,145.0 231.2,134.6 338.4,141.8 445.6,145.0 552.8,144.2 660.0,138.6" fill="none" stroke="#2a78d6" stroke-width="2" />
  <circle cx="124.0" cy="145.0" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2" />
