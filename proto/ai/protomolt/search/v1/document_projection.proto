syntax = "proto3";
package ai.protomolt.search.v1;

import "ai/protomolt/search/v1/source.proto";
import "ai/protomolt/search/v1/search.proto";

// Trusted local preparation of one immutable accepted source version. This is
// neither an ingest RPC nor evidence that any row is durable or searchable.
message PrepareDocumentProjectionRequest {
  bytes history_id = 1;
  bytes document_key = 2;
  // Exact positive accepted version; never an implicit current head.
  uint64 version = 3;
  // Required for source versions, derived again from the stored descriptor.
  // Deletions require this, body_path and index_definition to be absent/empty.
  string expected_plan_fingerprint = 4;
  string body_path = 5;
  IndexDefinition index_definition = 6;
  // 1 to 65536. Exceeding either budget refuses the entire preparation.
  uint32 max_rows = 7;
  // 1 byte to 64 MiB of the complete encoded PreparedDocumentProjection.
  // Bounds returned data, not all decoder/database heap allocations.
  uint64 max_bytes = 8;
}

message DocumentProjectionRow {
  // Unanalyzed mapped values with the catalog key/version and chunk ordinal.
  // original_source is omitted here: it is carried once in the batch below.
  AddDocumentsRequest document = 1;
  repeated float vector = 2;
}

message PreparedDocumentProjection {
  bytes history_id = 1;
  bytes document_key = 2;
  uint64 version = 3;
  uint64 accepted_sequence = 4;
  // Exact original bytes, including for sources producing zero rows.
  ProtobufSource source = 5;
  // A tombstone has no source, mapping or rows. A zero-row source is not deleted.
  bool deleted = 6;
  string plan_fingerprint = 7;
  string body_path = 8;
  repeated DocumentProjectionRow rows = 9;
}

// Build private analyzed segments from an accepted version. This is an owner
// operation, not a public ingest route or a publication acknowledgment.
message StageDocumentProjectionRequest {
  PrepareDocumentProjectionRequest projection = 1;
  // Every projected TEXT path must have an explicit, pinned analysis contract.
  // Deletions require this list and materialize to be absent.
  repeated MappedFieldAnalysis field_analysis = 2;
  MaterializeSpec materialize = 3;
  // 1 byte to 1 GiB of final private staging files. Checked before returning
  // the candidate; this is not a filesystem quota or a decoder heap limit.
  uint64 max_staged_bytes = 4;
}

// Description of a private candidate. It carries no filesystem paths, commit
// credential or accepted/searchable/durable receipt. Zero rows and deletion are
// distinct outcomes. The target read version must be rechecked at publication.
message DocumentProjectionStage {
  bytes history_id = 1;
  bytes document_key = 2;
  uint64 version = 3;
  uint64 accepted_sequence = 4;
  bool deleted = 5;
  uint64 rows = 6;
  string plan_fingerprint = 7;
  uint64 staged_bytes = 8;
  uint64 target_stats_epoch = 9;
  bytes target_stats_incarnation = 10;
}

// A trusted local owner's observation after both artifact decision and serving
// activation. Bound to this read version, not a perpetual visibility promise.
// This does not rewrite the original accepted/searchable/durable retry receipt.
message DocumentProjectionActivation {
  bytes history_id = 1;
  bytes index_key = 2;
  bytes document_key = 3;
  uint64 version = 4;
  uint64 accepted_sequence = 5;
  bool deleted = 6;
  uint64 rows = 7;
  bytes intent_id = 8;
  uint64 catalog_epoch = 9;
  uint64 stats_epoch = 10;
  bytes stats_incarnation = 11;
}

// Current source-owned maintenance activation on one local node. The read
// version bounds this observation. Acceptance and original retry receipts stay
// unchanged; this is not a collection-wide searchable/durable acknowledgment.
message DocumentMaintenanceActivation {
  bytes history_id = 1;
  bytes index_key = 2;
  uint64 accepted_sequence = 3;
  bytes source_intent_id = 4;
  bytes maintenance_intent_id = 5;
  uint64 catalog_epoch = 6;
  uint64 stats_epoch = 7;
  bytes stats_incarnation = 8;
  uint64 live_rows = 9;
}

// Trusted local compaction of an owned index from its immutable stored rows.
// No source re-analysis, derived re-evaluation, or source acceptance occurs.
// This is also the embedded owner operation; it introduces no network RPC.
message CompactDocumentIndexRequest {
  bytes index_key = 1;
  // 1..65536 input rows per scan and live rows per output segment. A byte
  // limit may shorten a scan or cut. Vector presence also starts a new cut.
  uint32 batch_rows = 2;
  // 1..64 MiB of accounted row content and analysis per input/output batch.
  // Not a process heap quota: readers, one decoded row/posting, allocator and
  // provider build buffers also consume memory. An oversized single row refuses.
  uint64 batch_bytes = 3;
  // Positive budget for completed private output files, checked per cut.
  // Not a filesystem quota; publication also copies outputs into the catalog.
  uint64 max_staged_bytes = 4;
  // 1..1048576 rows per preservation-proof batch.
  uint32 proof_batch_rows = 5;
}
