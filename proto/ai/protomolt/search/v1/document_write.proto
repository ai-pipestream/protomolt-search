syntax = "proto3";
package ai.protomolt.search.v1;
import "ai/protomolt/search/v1/source.proto";

// Receiving-side adapter for explicitly provisioned local source catalogs.
// The receiver enforces current Ingest permission through its source commit.
// This service does not activate, transfer or replicate a managed source owner.
service DocumentWriteService {
  // Requires Ingest. Returns only the exact local resource/history binding;
  // it grants no ownership, source disclosure or permission to write.
  rpc GetWriteTarget(GetDocumentWriteTargetRequest) returns (DocumentWriteTarget);
  // One logical source transaction. Requires version-2 history-pinned input.
  // Cancellation or a lost reply leaves the outcome unknown; retry the same
  // operation under current permission. A committed write may outlive the RPC.
  // Successful acceptance reports searchable=false until separate publication.
  rpc AcceptDocument(DocumentWriteRequest) returns (DocumentWriteReceipt);
}

message GetDocumentWriteTargetRequest {
  // Exact collection; empty names the explicitly configured unnamed catalog.
  string collection = 1;
}

message DocumentWriteTarget {
  string workspace = 1;
  string collection = 2;
  bytes history_id = 3;
}

message DocumentWriteRequest {
  string collection = 1;
  AcceptDocumentRequest document = 2;
}

// Required receiver execution limits. These account encoded requests, not
// total process memory or transport buffers across every connection.
message DocumentWriteServiceLimits {
  // 1..64 MiB, including the complete unary request envelope.
  uint64 max_request_bytes = 1;
  // 1..256 MiB across admitted queued/running work; at least max_request_bytes.
  uint64 max_pending_bytes = 2;
  // 1..1024 queued/running operations. Full capacity refuses rather than queues.
  uint32 max_in_flight = 3;
}

// Acceptance of a logical document, independent of physical index rows.
// Version 1 persists source and retry history. It does not publish a search
// projection; successful receipts explicitly report searchable=false.
message AcceptDocumentRequest {
  // Version 1 is legacy unpinned local acceptance. Version 2 requires history_id.
  uint32 contract_version = 1;
  // Exact collection-local identity, never a hash or physical row number.
  bytes document_key = 2;
  // Exact retry key within this catalog and authenticated actor for controlled
  // acceptance, or within the catalog for trusted unbound local acceptance.
  // Reuse for any different request in that scope fails.
  bytes operation_id = 3;
  // Absent allows an unconditional write. Zero requires no prior version;
  // positive values require exactly that version, including a tombstone.
  optional uint64 expected_version = 4;
  oneof mutation {
    ProtobufSource source = 5;
    // Must be true. Deletion creates a new version and preserves retry history.
    bool delete = 6;
  }
  // Version 2: exact 16-byte catalog history identity from a receipt or history page.
  // Version 1 requires this to be empty. Older receivers reject version 2.
  bytes history_id = 7;
}

message DocumentWriteReceipt {
  bytes document_key = 1;
  uint64 version = 2;
  uint64 accepted_sequence = 3;
  bool accepted = 4;
  bool searchable = 5;
  // True only for a synced local source/history transaction. This does not
  // promise an index-image checkpoint or a replica on another device.
  bool durable = 6;
  bool replayed = 7;
  // Persistent catalog lineage, independent of its path and shard geometry.
  bytes history_id = 8;
  // The owner's write epoch this write committed under: the fence a
  // replacement owner's activation moves. Zero when the catalog is not an
  // activated managed source.
  uint64 write_epoch = 9;
}

// Trusted local consumption of accepted versions in commit order. This is
// source history, not a search result or a searchable acknowledgment.
message ReadAcceptedDocumentsRequest {
  uint64 after_sequence = 1;
  // 1 to 1000 versions per page.
  uint32 limit = 2;
  // Omit on the first page to pin the current accepted sequence. Reuse the
  // returned fence on subsequent pages to exclude concurrent later writes.
  optional uint64 through_sequence = 3;
  // 1 byte to 64 MiB, summed encoded AcceptedDocumentVersion sizes. A first
  // version larger than this budget returns RESOURCE_EXHAUSTED without advancing.
  uint64 max_bytes = 4;
  // Required for nonzero after_sequence or a positive through_sequence fence.
  // Omit only to discover a history at sequence zero. An explicit zero fence
  // returns its identity without reading any source. Always verify the returned
  // identity; older readers can ignore this field and return an empty identity.
  bytes history_id = 5;
}

message AcceptedDocumentVersion {
  bytes document_key = 1;
  uint64 version = 2;
  uint64 accepted_sequence = 3;
  oneof mutation {
    ProtobufSource source = 4;
    bool deleted = 5;
  }
  // The write epoch the version committed under (zero on a catalog that
  // is not an activated managed source).
  uint64 write_epoch = 6;
  // True when the version became durable after its admission lapsed and
  // was then found to have no current right: it stays in the history,
  // marked, with the control revision at which it was fenced. A reader
  // that applies history treats a fenced version as never admitted.
  bool fenced = 7;
  uint64 fenced_at_revision = 8;
}

message ReadAcceptedDocumentsResponse {
  repeated AcceptedDocumentVersion documents = 1;
  uint64 through_sequence = 2;
  // Last returned sequence, or after_sequence when no versions were returned.
  uint64 next_sequence = 3;
  bool complete = 4;
  // Must accompany subsequent cursors, including when tailing without a fence.
  bytes history_id = 5;
}
