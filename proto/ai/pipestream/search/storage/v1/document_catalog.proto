syntax = "proto3";
package ai.pipestream.search.storage.v1;
import "ai/pipestream/search/v1/document_write.proto";

message DocumentCatalogHeader {
  uint32 format_version = 1;
  string collection = 2;
  uint64 accepted_sequence = 3;
}
message DocumentVersionKey {
  bytes document_key = 1;
  uint64 version = 2;
}
message DocumentVersion {
  bytes document_key = 1;
  uint64 version = 2;
  uint64 accepted_sequence = 3;
  bytes source_sha256 = 4;
  bool deleted = 5;
}
message DocumentOperation {
  bytes request_sha256 = 1;
  ai.pipestream.search.v1.DocumentWriteReceipt receipt = 2;
}
