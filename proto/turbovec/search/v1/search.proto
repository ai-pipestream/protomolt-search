syntax = "proto3";

// Distributed top-k search over turbovec (TurboQuant) shard indexes.
//
// Architecture: hub-and-spoke. A client-facing coordinator fans each query
// out to shard-owner nodes over `NodeService.SearchShard` (bidi stream),
// merges the per-shard top-k lists, and answers over `SearchService.Search`.
//
// Collaborative mid-query floor sharing: while a node scans its shard in
// chunks, it publishes its current k-th best score (its heap floor) once its
// top-k heap is full. The coordinator tracks the maximum floor over all
// shards and pushes it back down to every node; nodes seed the remainder of
// their scan with it via turbovec's `SearchOptions.initial_threshold`.
//
// Lossless invariant: once any shard holds k candidates, its k-th best is a
// lower bound on the GLOBAL k-th best (the k-th best of a subset never
// exceeds the k-th best of the union), so pruning candidates that score at
// or below the max published floor can never drop a true global top-k hit.
// turbovec keeps candidates scoring exactly at the floor, so ties at the
// boundary survive.
package turbovec.search.v1;

// NodeService is the internal shard-owner API. Exactly one node owns a given
// shard; the coordinator is the only intended client.
service NodeService {
  // Runs one distributed search against this node's shard.
  //
  // The client sends exactly one `StartShardSearch` first, then any number
  // of `FloorUpdate` messages (monotonically non-decreasing floors; stale or
  // lower updates are ignored). The server scans its shard in chunks of
  // `chunk_blocks` SIMD blocks; between chunks it applies the highest floor
  // received so far to the next chunk's `initial_threshold`, and after each
  // chunk in which its local top-k heap is full it emits a `FloorUpdate`
  // carrying its current k-th best. The stream ends with exactly one
  // `SearchShardDone` holding the shard's local top-k.
  //
  // Cancellation (client closing the stream) aborts the scan between
  // chunks.
  rpc SearchShard(stream SearchShardRequest) returns (stream SearchShardResponse);

  // Exposes the shard's TQ+ calibration (per-coordinate shift/scale) plus
  // basic shape metadata. Scores are only comparable across shards whose
  // indexes were built with byte-identical calibration, so callers can use
  // this to verify a cluster is uniformly seeded before serving traffic.
  rpc GetCalibration(GetCalibrationRequest) returns (GetCalibrationResponse);

  // Pushes a TQ+ calibration to this shard BEFORE its first vector is
  // added. The shard constructs (or, while still empty, re-constructs) its
  // index with `TurboQuantIndex::new_with_calibration`, locking the
  // calibration for the index's lifetime — the same rule turbovec enforces.
  //
  // Rules:
  // - On an empty shard this locks the calibration; sending the SAME
  //   calibration again is an idempotent no-op (`already_seeded = true`).
  // - On a non-empty shard, or with a different calibration than the one
  //   already locked, it is rejected (FAILED_PRECONDITION): calibration
  //   can never change once vectors exist.
  // - Field validation errors (bad dim/bit_width, non-finite shift,
  //   non-positive scale, wrong lengths) are INVALID_ARGUMENT.
  //
  // Deployment order for a from-scratch cluster: fit a calibration on a
  // representative sample, SetCalibration on every shard, then ingest.
  rpc SetCalibration(SetCalibrationRequest) returns (SetCalibrationResponse);

  // Ingests vectors into this shard. Client-streaming: each message is one
  // flat batch (`vectors.len()` a multiple of the shard dim); batches are
  // applied in stream order under the shard's write lock on the blocking
  // pool, so searches never observe a half-applied batch.
  //
  // Ids are SERVER-ASSIGNED and positional: the i-th vector of the shard
  // gets global id `slot_offset + i` (matching `SearchShardDone.hits`).
  // turbovec's id-mapped index does not support the masked, floor-seeded
  // scan this service is built around, so client-chosen ids are out of
  // scope; ingestion order defines identity.
  //
  // If the shard has no index yet (started empty, no SetCalibration), the
  // first batch constructs one: with `dim` from the request (required then)
  // and the shard's configured bit width, UNSEEDED — turbovec will fit
  // calibration from that first batch. Mixing unseeded-from-scratch shards
  // with seeded shards yields incomparable scores; seed first instead.
  //
  // Dimension mismatches and non-finite coordinates are INVALID_ARGUMENT.
  rpc AddVectors(stream AddVectorsRequest) returns (AddVectorsResponse);

  // Persists the shard's index to its configured path (the `index` path of
  // its config entry) in turbovec's atomic .tv format. A restarted node
  // with the same config comes back with all ingested vectors. On a shard
  // with no persistence path configured this is a no-op (`written=false`).
  rpc Flush(FlushRequest) returns (FlushResponse);

  // Installs a centrally built shard image (the atomic .tv index plus its
  // optional .bm25 sidecar) over one client stream — the bulk-load path
  // for pre-computed corpora. Where AddVectors builds the shard on the
  // node from streamed vectors, InstallSnapshot ships the FINISHED index:
  // build once anywhere with the cluster's seeded calibration, push the
  // artifact to every shard owner, and each node swaps it in atomically —
  // no per-node re-embedding, and byte-identical calibration everywhere
  // by construction.
  //
  // Protocol: the first message must be `manifest`, then `data` chunks in
  // any chunking the sender likes. The first `manifest.tv_bytes` of data
  // are the .tv image; the following `manifest.bm25_bytes` are the .bm25
  // sidecar. The node stages both files inside a generation directory
  // (`<index path>.snap/`), loads and validates the image, then swaps the
  // directory into place with ONE atomic rename — the pair can never
  // tear, searches never observe a half-installed shard, and a rejected
  // install leaves both the live shard and the active generation
  // untouched. Replacing an existing generation renames it aside first;
  // the crash window between the two renames is recovered deterministically
  // at startup (snap-old restored or removed).
  //
  // Rules:
  // - The shard must have a persistence path configured
  //   (FAILED_PRECONDITION otherwise): a snapshot install IS persistence.
  // - When the shard has a calibration locked (seeded or fitted) and the
  //   image's calibration differs, the install is rejected
  //   (FAILED_PRECONDITION): mixed calibrations make scores incomparable
  //   across shards. Seed first with SetCalibration, or install on an
  //   unseeded shard, which adopts the image's calibration.
  // - Byte counts that overrun or truncate the manifest's declared sizes
  //   are INVALID_ARGUMENT; nothing is installed.
  //
  // Replacing a NON-empty shard is allowed and wholesale: the image's ids
  // restart at the shard's slot_offset, and an image WITHOUT a .bm25
  // sidecar replaces any existing postings store with none. Callers
  // rebuilding a cluster (recalibration on data drift) must replace every
  // shard together, the same rule BroadcastCalibration documents.
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);

  // Ingests raw-text documents into the shard's BM25 postings index.
  // Client-streaming, one document per message. For each document the node
  // calls the configured analysis sidecar (Analyze, term vectors in
  // MODE_FULL so occurrence offsets survive) and builds postings from the
  // returned terms: term identity, frequency, and occurrence spans in
  // ORIGINAL text coordinates. The raw text is stored in the shard's doc
  // store (the highlight source, read via GetDocuments).
  //
  // Doc ids are SERVER-ASSIGNED and share the shard's positional id space
  // with ingested vectors: the next id is max(vectors, documents) so the
  // vector side can later attach the same id. Global id = slot_offset +
  // local id, as everywhere else.
  //
  // Fails UNAVAILABLE when the shard has no analysis sidecar configured,
  // INVALID_ARGUMENT on empty or oversized text.
  rpc AddDocuments(stream AddDocumentsRequest) returns (AddDocumentsResponse);

  // Returns this shard's per-term document frequencies and corpus stats —
  // phase (b) of the distributed BM25 flow. The coordinator sums these
  // across all shards to build the GLOBAL stats every shard then scores
  // with (see Bm25Query), which is what makes BM25 scores comparable
  // across shards.
  rpc TermStats(TermStatsRequest) returns (TermStatsResponse);

  // Scores BM25 for the given query terms against this shard's postings,
  // using the GLOBAL corpus stats supplied by the coordinator (never
  // shard-local stats — that would make scores incomparable). k1/b of 0
  // select the defaults (1.2 / 0.75). Returns the shard's local top-k.
  rpc Bm25Query(Bm25QueryRequest) returns (Bm25QueryResponse);

  // Reads raw document texts from the shard's doc store (the highlight
  // source). Ids are global; ids outside this shard's range or with no
  // stored text are simply absent from the response.
  rpc GetDocuments(GetDocumentsRequest) returns (GetDocumentsResponse);

  // Candidate-scoped BM25 scoring (phase 2 of FUSION_MODE_CASCADE):
  // score just `candidate_ids` against this shard's postings with the
  // supplied global stats.
  rpc Bm25Rescore(Bm25RescoreRequest) returns (Bm25RescoreResponse);

  // Runs the shard's LOCAL half of a hybrid query: the chunked vector
  // scan and the BM25 scoring (with the supplied global stats), fused
  // with RRF on the node — level one of the settled two-level fusion. The
  // coordinator fuses the per-shard fused lists again (level two).
  rpc HybridShard(HybridShardRequest) returns (HybridShardResponse);

  // Returns the shard's RAW per-leg top-k lists for a hybrid query — no
  // local fusion. This is the shard side of FUSION_MODE_GLOBAL_RANK: the
  // coordinator merges the legs across shards by raw score into global
  // rankings and fuses once. Raw scores must be globally comparable per
  // leg (shared TQ+ calibration for the vector leg; the supplied global
  // stats for the BM25 leg).
  rpc ShardLegs(ShardLegsRequest) returns (ShardLegsResponse);

  // Liveness + shape of this shard: vector count, dim, bit width, BM25
  // doc count, and whether an ingest stream currently holds the shard's
  // single-writer slot. Cheap enough to poll.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// SearchService is the client-facing API served by the coordinator.
service SearchService {
  // Fans the query out to every known shard node, merges the shard top-k
  // lists into one global top-k (score descending; ties broken by shard
  // index, then vector id), and returns it.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Distributed BM25 over the shards' postings. Flow:
  //   1. the coordinator analyzes `text` with the sidecar using the SAME
  //      analysis options, producing the query terms (stem identity when
  //      SOURCE_STEMS is configured, exactly as at ingest);
  //   2. TermStats fan-out: per-shard df + doc count + total doc length;
  //   3. the coordinator sums them into GLOBAL stats and sends them back
  //      with Bm25Query, so every shard scores with identical idf/avgdl;
  //   4. shard hits merge into the global top-k (score desc, shard, doc id).
  // Hits carry per-term occurrence offsets in original-text coordinates;
  // fetch the raw text with NodeService.GetDocuments to highlight.
  rpc Bm25Search(Bm25SearchRequest) returns (Bm25SearchResponse);

  // Hybrid vector + BM25 search with RRF fusion. Default
  // (FUSION_MODE_GLOBAL_RANK): shards return raw per-leg lists and the
  // coordinator merges each leg by raw score into global rankings, then
  // applies single-level RRF — EXACTLY the monolithic result for
  // k <= leg_k when scores are globally comparable per leg (see
  // FusionMode). FUSION_MODE_TWO_LEVEL is the rank-based fallback for
  // incomparable scores. Hits carry global per-leg ranks and raw scores.
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);

  // Pushes ONE TQ+ calibration to every known shard (fan-out of
  // NodeService.SetCalibration). This is the shared-calibration handshake
  // that makes vector scores globally comparable — a prerequisite for
  // FUSION_MODE_GLOBAL_RANK. Fit the calibration once (bootstrap sample
  // or a single indexer), broadcast before ingest, and treat
  // recalibration on data drift as a coordinated cluster event: all
  // shards must be re-seeded and re-ingested together, or their scores
  // stop being comparable.
  rpc BroadcastCalibration(BroadcastCalibrationRequest) returns (BroadcastCalibrationResponse);

  // Fans NodeService.Health out to every shard (and any configured
  // replica) and reports per-target reachability plus the shard's own
  // health. Never fails on an unreachable node — that is a reported
  // outcome, not an error.
  rpc ClusterHealth(ClusterHealthRequest) returns (ClusterHealthResponse);
}

message HealthRequest {}

// One shard's liveness and shape.
message HealthResponse {
  // Vectors resident in the turbovec index (0 for an empty shard).
  uint64 num_vectors = 1;
  // Vector dimensionality (0 until the first add locks it).
  uint32 dim = 2;
  // Quantization bit width.
  uint32 bit_width = 3;
  // The shard's global id base.
  uint64 slot_offset = 4;
  // Documents in the BM25 store (0 when the shard has none).
  uint64 bm25_docs = 5;
  // True while a bulk BM25 build is spilling (searchable only after Flush).
  bool bm25_building = 6;
  // True while an AddVectors/AddDocuments stream holds the single-writer
  // ingest slot.
  bool ingest_active = 7;
}

message ClusterHealthRequest {}

// Health of one fan-out target (a shard's primary or replica).
message ShardHealth {
  // Shard index in fan-out order.
  uint32 shard = 1;
  // The address probed.
  string addr = 2;
  // True when this target is a configured replica rather than a primary.
  bool is_replica = 3;
  // Whether the probe got an answer; `error` says why not.
  bool reachable = 4;
  string error = 5;
  // The target's own report, when reachable.
  HealthResponse health = 6;
}

message ClusterHealthResponse {
  // One entry per probed target: every primary, then every configured
  // replica, in shard order.
  repeated ShardHealth targets = 1;
}

// One message on the client-to-server leg of `SearchShard`. The first
// message on a stream MUST be `start`; `floor_update` messages may follow
// in any quantity.
message SearchShardRequest {
  oneof payload {
    // Opens the scan: the query vector, the per-shard k, and the
    // coordinator-assigned request id (log correlation only).
    StartShardSearch start = 1;
    // Raises the shard's score floor. Applied to the next chunk boundary,
    // never retroactively; already-collected candidates are re-validated
    // by construction because every emitted candidate scored >= every floor
    // that was in effect when it was collected.
    FloorUpdate floor_update = 2;
  }
}

// Opens a shard scan. Exactly one per `SearchShard` stream, first message.
message StartShardSearch {
  // Coordinator-assigned id tying this shard scan to one logical query.
  // Opaque to the node; echoed in logs only.
  string request_id = 1;
  // Number of top hits this shard must return (same k as the global query).
  uint32 k = 2;
  // The query vector. Length must equal the shard index dimension.
  repeated float vector = 3;
  // When true, the shard's running top-k never evicts a candidate whose
  // score equals the current k-th best: the whole boundary tie group
  // rides along, so `SearchShardDone.hits` may exceed k by the tie-group
  // size (worst case: a shard of identical scores returns everything).
  // Used by the cascade fusion mode, whose cutoff is score-defined and
  // must include every tied doc on every shard. Off by default, leaving
  // plain vector Search semantics untouched.
  bool tie_complete = 4;
}

// A score floor: a lower bound on the global k-th best score. Flows both
// directions on the `SearchShard` stream — node to coordinator when the
// node's heap fills, coordinator to node with the max over all shards.
message FloorUpdate {
  // Candidates scoring below this cannot be in the global top-k.
  // Senders must only raise the floor over the life of a stream; receivers
  // ignore updates that do not raise their current floor.
  float floor = 1;
}

// One message on the server-to-client leg of `SearchShard`.
message SearchShardResponse {
  oneof payload {
    // The node's current k-th best score, emitted after each chunk in which
    // the local top-k heap is full. Monotonically non-decreasing within a
    // stream.
    FloorUpdate floor_update = 1;
    // Terminal message: the shard's local top-k plus scan statistics.
    // Exactly one per stream; the server closes the stream after it.
    SearchShardDone done = 2;
  }
}

// Terminal message of a shard scan.
message SearchShardDone {
  // The shard's local top-k, score descending, ties broken by vector id.
  // `vector_id` is the GLOBAL id (node slot offset + local slot), so the
  // coordinator can merge without knowing shard layouts.
  repeated ScoredHit hits = 1;
  // Instrumentation for benchmarking the floor-sharing mechanism.
  ShardScanStats stats = 2;
}

// Per-scan counters a node reports in `SearchShardDone`. These exist so the
// effect of floor sharing is measurable without patching the turbovec scan
// kernel: `candidates_collected` counts every real (non-padding) candidate
// the per-chunk searches returned, which is exactly the set of vectors that
// survived every floor in effect during the scan.
message ShardScanStats {
  // How many per-chunk `search_with_options` calls the scan made.
  uint32 chunk_calls = 1;
  // Real candidates collected across all chunks (sentinel padding excluded).
  uint64 candidates_collected = 2;
  // How many floor values the node published to the coordinator.
  uint64 floors_published = 3;
  // How many chunks ran with a coordinator-pushed floor in effect.
  uint64 floor_updates_applied = 4;
}

// One scored vector. Ids are global across the cluster (see
// `SearchShardDone.hits`).
message ScoredHit {
  // Global vector id (shard slot offset + local slot).
  uint64 vector_id = 1;
  // turbovec score; higher is better. Comparable across shards only when
  // every shard shares the same TQ+ calibration.
  float score = 2;
}

// Empty: the node reports whatever its loaded index holds.
message GetCalibrationRequest {}

// The shard index's shape and TQ+ calibration.
message GetCalibrationResponse {
  // Vector dimensionality the index was built with.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Number of vectors in this shard.
  uint64 num_vectors = 3;
  // Per-coordinate calibration shift (length `dim`). Absent when the index
  // has no locked calibration (never added to and not seeded).
  repeated float shift = 4;
  // Per-coordinate calibration scale (length `dim`); same presence rule as
  // `shift`.
  repeated float scale = 5;
}

// Pushes a TQ+ calibration to a shard (see `NodeService.SetCalibration`).
message SetCalibrationRequest {
  // Vector dimensionality the shard index must have.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Per-coordinate calibration shift (length `dim`).
  repeated float shift = 3;
  // Per-coordinate calibration scale (length `dim`); every entry > 0.
  repeated float scale = 4;
}

// Result of a `SetCalibration` call.
message SetCalibrationResponse {
  // True when the pushed calibration was already locked on this shard
  // (idempotent retry); false when this call locked it.
  bool already_seeded = 1;
}

// One batch on the `AddVectors` stream.
message AddVectorsRequest {
  // Flat row-major batch: `vectors.len()` must be a multiple of the shard
  // dim. Every coordinate must be finite and |value| < 1e16 (turbovec's
  // input rule).
  repeated float vectors = 1;
  // Optional explicit dim. 0 means "use the shard's known dim" (from its
  // index or seeded calibration). Required when the shard has no index
  // and no seeded calibration yet; rejected if it disagrees with a known
  // dim.
  uint32 dim = 2;
}

// Terminal response of an `AddVectors` stream.
message AddVectorsResponse {
  // Vectors added over this stream.
  uint64 added = 1;
  // Total vectors in the shard after the stream.
  uint64 total = 2;
  // Global id assigned to the first vector of this stream
  // (`slot_offset + shard count before the stream`). Ids are contiguous
  // per shard in ingestion order.
  uint64 first_id = 3;
}

// Empty: flush whatever the shard holds.
message FlushRequest {}

// Result of a `Flush` call.
message FlushResponse {
  // Path the index was written to (empty when `written` is false).
  string path = 1;
  // Vectors in the flushed index.
  uint64 num_vectors = 2;
  // False when the shard has no persistence path configured (flush is then
  // a no-op, not an error — a purely in-memory shard is a legitimate
  // configuration).
  bool written = 3;
  // Documents in the flushed BM25 postings store (0 when the shard has no
  // postings).
  uint64 num_documents = 4;
}

// One message on the `InstallSnapshot` stream. The first message MUST be
// `manifest`; `data` chunks follow in any chunking.
message SnapshotChunk {
  oneof payload {
    // Declares the byte split between the two image files. Everything
    // else about the shard (dim, bit width, vector count, calibration)
    // is read from the image itself — the file is the source of truth.
    SnapshotManifest manifest = 1;
    // Opaque image bytes: the first `manifest.tv_bytes` across all data
    // chunks are the .tv file, the next `manifest.bm25_bytes` the .bm25
    // sidecar. Senders should keep chunks around 1 MiB.
    bytes data = 2;
  }
}

// The byte layout of an `InstallSnapshot` stream.
message SnapshotManifest {
  // Total .tv bytes on the stream. Required (nonzero).
  uint64 tv_bytes = 1;
  // Total .bm25 bytes following the .tv bytes; 0 for a vector-only image.
  uint64 bm25_bytes = 2;
}

// Result of an `InstallSnapshot` call.
message InstallSnapshotResponse {
  // The installed index file (inside the shard's generation directory).
  string path = 1;
  // Vectors in the installed index.
  uint64 num_vectors = 2;
  // Documents in the installed BM25 sidecar (0 when none was sent).
  uint64 num_documents = 3;
}

// Client-facing search request.
message SearchRequest {
  // Optional caller id for log correlation; the coordinator assigns one
  // when empty and echoes it back.
  string request_id = 1;
  // Number of global top hits to return.
  uint32 k = 2;
  // The query vector. Length must equal the shard dimension.
  repeated float vector = 3;
}

// Client-facing search response.
message SearchResponse {
  // Echoes `SearchRequest.request_id` (or the assigned one).
  string request_id = 1;
  // Global top-k: score descending, ties broken by shard index then vector
  // id. Fewer than k entries when the whole corpus holds fewer than k
  // vectors.
  repeated ScoredHit hits = 2;
}

// Passthrough for the analysis sidecar's pipeline options (vendored proto
// ai.pipestream.opennlp.analysis.v1). Values are the NUMERIC values of the
// sidecar's enums; 0 always means "sidecar default". Mirroring the enums
// here would just duplicate the vendored definitions.
message AnalysisSpec {
  // AnalysisOptions.Tokenizer value (1 = WHITESPACE, 2 = SIMPLE).
  int32 tokenizer = 1;
  // AnalysisOptions.Stemmer value (1 = NONE, 2 = PORTER, ...). Required to
  // be non-NONE when term_vector_source selects stems.
  int32 stemmer = 2;
  // TermVectorOptions.Mode value (1 = FULL with offsets, 2 = SCORING_ONLY).
  int32 term_vector_mode = 3;
  // TermVectorOptions.Source value (1 = TOKENS, 2 = STEMS). Ingest and
  // query MUST use the same source or term identities will not match.
  int32 term_vector_source = 4;
  // TermVectorOptions.NormalizerRung values for term identity (ignored
  // when source is STEMS).
  repeated int32 normalizer_rungs = 5;
}

// Lineage for one ingested document: where it came from in the source
// corpus. Optional and purely additive; documents ingested without it
// behave exactly as before.
message DocLineage {
  // Source opinion id.
  uint64 opinion_id = 1;
  // Source cluster id.
  uint64 cluster_id = 2;
  // Chunk span start in original-text (char) coordinates.
  uint32 span_start = 3;
  // Chunk span end (exclusive).
  uint32 span_end = 4;
}

// One document on the `AddDocuments` stream.
message AddDocumentsRequest {
  // Raw document text. Non-empty, at most 1 MiB (the sidecar's cap).
  string text = 1;
  // Analysis options for this document. Absent = sidecar defaults with
  // term vectors in MODE_FULL over TOKENS.
  AnalysisSpec analysis = 2;
  // Optional lineage, stored in the doc store and returned by
  // GetDocuments.
  DocLineage lineage = 3;
}

// Terminal response of an `AddDocuments` stream.
message AddDocumentsResponse {
  // Documents ingested over this stream.
  uint64 added = 1;
  // Total documents in the shard's postings after the stream.
  uint64 total = 2;
  // Global doc id assigned to the first document of this stream.
  uint64 first_id = 3;
}

// Phase (b) of the distributed BM25 flow: stats for these query terms.
message TermStatsRequest {
  // Query terms (exact identity: stems when ingest used SOURCE_STEMS).
  repeated string terms = 1;
}

// This shard's share of the global BM25 corpus stats.
message TermStatsResponse {
  // Documents in this shard's postings.
  uint64 doc_count = 1;
  // Sum of document lengths (in terms) over the shard.
  uint64 total_doc_length = 2;
  // Document frequency per requested term, parallel to `terms`.
  repeated uint32 doc_frequencies = 3;
}

// Phase (c) of the distributed BM25 flow: score with GLOBAL stats.
message Bm25QueryRequest {
  // Query terms (same identity as TermStatsRequest.terms).
  repeated string terms = 1;
  // Number of top hits this shard must return.
  uint32 k = 2;
  // Total documents across ALL shards.
  uint64 global_doc_count = 3;
  // Total document length across ALL shards.
  uint64 global_total_doc_length = 4;
  // Global document frequency per term (summed over shards), parallel to
  // `terms`.
  repeated uint32 global_doc_frequencies = 5;
  // BM25 k1 saturation parameter; 0 selects the default (1.2).
  float k1 = 6;
  // BM25 length-normalization parameter; 0 selects the default (0.75).
  float b = 7;
  // Seeded floor: the lexical twin of the vector leg's
  // `SearchOptions.initial_threshold`. A coordinator that already holds
  // a merged k-th best can seed the shard with it; the shard then
  // returns only hits with score >= min_score (ties at the floor
  // survive) and block-max pruning skips postings that provably cannot
  // reach it. 0 means unseeded (scores are always positive).
  float min_score = 8;
}

// A half-open span [start, end) in original-text coordinates.
message OffsetSpan {
  // Start offset (inclusive).
  uint32 start = 1;
  // End offset (exclusive).
  uint32 end = 2;
}

// Occurrences of one query term in one hit document.
message TermOccurrences {
  // The query term as scored (stem identity when SOURCE_STEMS).
  string term = 1;
  // Every occurrence span in original-text coordinates.
  repeated OffsetSpan offsets = 2;
}

// One BM25 hit, highlight-ready.
message Bm25Hit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // BM25 score computed with GLOBAL corpus stats; comparable across
  // shards. Higher is better.
  float score = 2;
  // Per-query-term occurrences in this document (terms absent from the
  // document are omitted).
  repeated TermOccurrences terms = 3;
}

// A shard's BM25 top-k.
message Bm25QueryResponse {
  // Hits, score descending, ties by doc id.
  repeated Bm25Hit hits = 1;
  // The shard's k-th best score: one f32 ULP below the k-th hit's score
  // when the shard returned k hits (emitted one ULP down so a later f32
  // seed can never exceed the true f64 k-th best — scoring is f64, the
  // wire is f32), 0 otherwise (no seedable floor — the shard could not
  // fill the requested k). A caller that re-queries later (e.g. after
  // appends) can seed the fleet with it via
  // Bm25QueryRequest.min_score / Bm25SearchRequest.min_score.
  float kth_best = 2;
}

// Reads raw texts from the doc store.
message GetDocumentsRequest {
  // Global doc ids.
  repeated uint64 doc_ids = 1;
}

// One stored document.
message StoredDocument {
  // Global doc id.
  uint64 doc_id = 1;
  // The raw text as ingested.
  string text = 2;
  // Lineage, when the document was ingested with it.
  optional DocLineage lineage = 3;
}

// Stored documents, in request order, omitting unknown ids.
message GetDocumentsResponse {
  // Found documents.
  repeated StoredDocument documents = 1;
}

// Client-facing distributed BM25 request.
message Bm25SearchRequest {
  // Query text, analyzed with `analysis` before scoring.
  string text = 1;
  // Number of global top hits to return.
  uint32 k = 2;
  // Analysis options for the query. MUST match the options documents were
  // ingested with (term identity source above all).
  AnalysisSpec analysis = 3;
  // Seeded floor for the whole fleet: forwarded to every shard's
  // Bm25QueryRequest.min_score. A client that already holds a floor
  // (e.g. the kth_best of a previous identical query, re-issued after
  // appends) seeds every shard, which then skips postings that provably
  // cannot reach it. 0 means unseeded (scores are always positive).
  float min_score = 4;
}

// Client-facing distributed BM25 response.
message Bm25SearchResponse {
  // Global top-k: score descending, ties by shard index then doc id.
  repeated Bm25Hit hits = 1;
  // The merged k-th best score: one f32 ULP below the k-th hit's score
  // when k hits were returned (see Bm25QueryResponse.kth_best for why),
  // 0 otherwise. Seed a later re-query with it via
  // Bm25SearchRequest.min_score.
  float kth_best = 2;
}

// How the coordinator fuses the per-shard leg results of a hybrid query.
enum FusionMode {
  // Unused zero value; resolves to FUSION_MODE_CASCADE.
  FUSION_MODE_UNSPECIFIED = 0;

  // Default. Shards return RAW per-leg lists (ShardLegs); the coordinator
  // merges each leg across shards by raw score into GLOBAL rankings and
  // applies single-level RRF over them. With globally comparable scores
  // per leg (shared calibration for vectors, global stats for BM25) this
  // is EXACTLY the monolithic result for k <= leg_k: any doc in the true
  // global top-leg_k of a leg is in its shard's local top-leg_k (local
  // rank <= global rank), so the union of shard lists contains the exact
  // global top-leg_k and merging by score reconstructs it.
  FUSION_MODE_GLOBAL_RANK = 1;

  // Fallback for incomparable scores: each shard RRF-fuses its legs
  // locally (HybridShard) and the coordinator RRF-merges the shard lists.
  // Rank-based and therefore scale-free, but NOT partition-independent —
  // shard-local ranks are compressed relative to global ranks, so the
  // result can differ from a monolithic index.
  FUSION_MODE_TWO_LEVEL = 2;

  // Default. Cascade, no score fusion: phase 1 generates vector
  // candidates through the floor-sharing bidi path (cross-shard early
  // termination applies — the cutoff IS the savings, no leg_k hits per
  // shard), with a TIE-COMPLETE cutoff: the candidate pool is
  // {score >= s_k} where s_k is the global k-th vector score, so the
  // pool can exceed k by the boundary tie-group size. Phase 2 reranks
  // the pool by BM25 (global stats, candidate-scoped scoring per owning
  // shard) and returns the top k. Vector recall is a GATE here:
  // keyword-strong but vector-weak docs are not surfaced — use
  // Bm25Search for pure lexical queries, or GLOBAL_RANK for true fusion.
  FUSION_MODE_CASCADE = 3;
}

// Per-leg options for hybrid (RRF-fused) search. Every field is optional;
// 0 selects the documented default.
message HybridLegOptions {
  // Fusion strategy. Absent = FUSION_MODE_GLOBAL_RANK.
  FusionMode fusion_mode = 5;
  // How deep each leg is fetched before fusion. 0 = default
  // max(k, rrf_k): the RRF constant should never exceed a leg's depth, or
  // deep-ranked docs could not contribute their 1/(rrf_k + rank) share.
  // Values below k are clamped to k.
  uint32 leg_k = 1;
  // RRF weight of the vector leg at shard-level fusion. 0 = default 1.0.
  float vector_weight = 2;
  // RRF weight of the BM25 leg at shard-level fusion. 0 = default 1.0.
  float bm25_weight = 3;
  // The RRF constant. 0 = default 60 (the usual value from the RRF paper).
  float rrf_k = 4;
}

// One hybrid query against a shard (internal). The shard runs BOTH legs
// locally — the chunked vector scan and the BM25 scoring with the
// supplied global stats — and fuses them with RRF before returning.
// Per-shard-then-coordinator is the settled two-level fusion design; the
// shared positional doc-ID space is what lets one shard's legs rank the
// same ids.
message HybridShardRequest {
  // Coordinator-assigned request id (log correlation only).
  string request_id = 1;
  // Depth of each leg AND of the fused shard list (the coordinator's
  // leg_k).
  uint32 k = 2;
  // Vector leg query (shard dim).
  repeated float vector = 3;
  // BM25 leg query terms (already analyzed by the coordinator).
  repeated string terms = 4;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 5;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 6;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 7;
  // RRF weight of the vector leg; 0 = default 1.0.
  float vector_weight = 8;
  // RRF weight of the BM25 leg; 0 = default 1.0.
  float bm25_weight = 9;
  // RRF constant; 0 = default 60.
  float rrf_k = 10;
}

// One fused hit in a shard's hybrid result, with per-leg provenance.
message HybridLegHit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // Shard-level fused RRF score.
  float fused_score = 2;
  // 1-based rank in the shard's vector leg. Absent when the doc is not in
  // that leg's fetched depth.
  optional uint32 vector_rank = 3;
  // Raw vector score (turbovec; comparable across shards via shared
  // calibration).
  float vector_score = 4;
  // 1-based rank in the shard's BM25 leg. Absent when not in that leg.
  optional uint32 bm25_rank = 5;
  // Raw BM25 score (computed with global stats; comparable across shards).
  float bm25_score = 6;
}

// A shard's fused hybrid top-k.
message HybridShardResponse {
  // Fused hits, shard-level RRF score descending.
  repeated HybridLegHit hits = 1;
}

// Client-facing hybrid (vector + BM25) search request.
message HybridSearchRequest {
  // Optional caller id; assigned when empty and echoed back.
  string request_id = 1;
  // BM25 leg query text, analyzed with `analysis` (same options as
  // ingest).
  string text = 2;
  // Vector leg query.
  repeated float vector = 3;
  // Number of global fused hits to return.
  uint32 k = 4;
  // Analysis options for the BM25 leg query.
  AnalysisSpec analysis = 5;
  // Per-leg fusion options; absent = defaults (see HybridLegOptions).
  HybridLegOptions legs = 6;
}

// One fused hit, with per-leg provenance from the owning shard so clients
// can see WHY it ranked. A doc present in only one leg has no rank for
// the other leg.
message HybridHit {
  // Global doc id.
  uint64 doc_id = 1;
  // Coordinator-level fused RRF score (this doc appears on exactly one
  // shard, so this is 1/(rrf_k + shard-list rank)).
  float fused_score = 2;
  // Shard that owns the doc.
  uint32 shard = 3;
  // 1-based rank in the owning shard's vector leg (absent if not in it).
  optional uint32 vector_rank = 4;
  // Raw vector score.
  float vector_score = 5;
  // 1-based rank in the owning shard's BM25 leg (absent if not in it).
  optional uint32 bm25_rank = 6;
  // Raw BM25 score (global stats).
  float bm25_score = 7;
}

// Client-facing hybrid search response.
message HybridSearchResponse {
  // Echoes the request id (or the assigned one).
  string request_id = 1;
  // Global fused top-k: coordinator-level RRF score descending, ties by
  // shard then doc id. Populated for FUSION_MODE_GLOBAL_RANK and
  // FUSION_MODE_TWO_LEVEL.
  repeated HybridHit hits = 2;
  // Cascade top-k (BM25 rerank order; pool beyond k is truncated here).
  // Populated for FUSION_MODE_CASCADE; `hits` is then empty.
  repeated CascadeHit cascade_hits = 3;
}

// A shard's raw per-leg lists for a hybrid query (FUSION_MODE_GLOBAL_RANK).
message ShardLegsRequest {
  // Coordinator-assigned request id (log correlation only).
  string request_id = 1;
  // Depth of each leg (the coordinator's leg_k).
  uint32 k = 2;
  // Vector leg query (shard dim).
  repeated float vector = 3;
  // BM25 leg query terms (already analyzed by the coordinator).
  repeated string terms = 4;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 5;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 6;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 7;
}

// One raw leg hit.
message RawLegHit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // Raw leg score; globally comparable per leg by the caller's
  // construction (shared calibration / global BM25 stats).
  float score = 2;
}

// A shard's unfused legs, each score-descending.
message ShardLegsResponse {
  // Vector leg top-k, raw scores.
  repeated RawLegHit vector_hits = 1;
  // BM25 leg top-k, raw scores (global stats).
  repeated RawLegHit bm25_hits = 2;
}

// Pushes one TQ+ calibration to every shard (see
// SearchService.BroadcastCalibration).
message BroadcastCalibrationRequest {
  // Vector dimensionality.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Per-coordinate calibration shift (length `dim`).
  repeated float shift = 3;
  // Per-coordinate calibration scale (length `dim`).
  repeated float scale = 4;
}

// One node's outcome of a calibration broadcast.
message CalibrationApplyResult {
  // The node address, as configured on the coordinator.
  string node = 1;
  // Whether the calibration was applied (or was already locked
  // identically).
  bool ok = 2;
  // True when the node already had this exact calibration locked.
  bool already_seeded = 3;
  // The failure reason when `ok` is false (for example a non-empty shard,
  // which locks calibration for the index lifetime).
  string error = 4;
}

// Per-node outcomes of a calibration broadcast, in configured node order.
message BroadcastCalibrationResponse {
  // One result per configured node.
  repeated CalibrationApplyResult results = 1;
}

// Candidate-scoped BM25 scoring: phase 2 of the cascade fusion mode.
// The coordinator routes each candidate's id to its owning shard; the
// shard scores just those ids against its postings (intersection over
// the append-only, doc-id-sorted postings lists, not a full walk) with
// the supplied GLOBAL stats, so scores are cross-shard comparable.
message Bm25RescoreRequest {
  // Query terms (already analyzed by the coordinator).
  repeated string terms = 1;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 2;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 3;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 4;
  // Global candidate doc ids to score. Ids outside this shard's range
  // (or with no postings) are ignored.
  repeated uint64 candidate_ids = 5;
  // BM25 k1; 0 selects the default (1.2).
  float k1 = 6;
  // BM25 b; 0 selects the default (0.75).
  float b = 7;
}

// BM25 scores for the requested candidates, doc id ascending.
message Bm25RescoreResponse {
  // One hit per candidate that scored above zero.
  repeated Bm25Hit hits = 1;
}

// One cascade hit: the two leg scores as SEPARATE fields (no fused
// score) plus the final rerank rank.
message CascadeHit {
  // Global doc id.
  uint64 doc_id = 1;
  // Final 1-based rank after the BM25 rerank (BM25 desc, vector desc,
  // doc id asc).
  uint32 rank = 2;
  // Shard that owns the doc.
  uint32 shard = 3;
  // Raw vector score from phase 1 (shared calibration; globally
  // comparable).
  float vector_score = 4;
  // Raw BM25 score from phase 2 (global stats; globally comparable).
  float bm25_score = 5;
}
