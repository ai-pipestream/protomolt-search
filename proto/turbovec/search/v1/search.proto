syntax = "proto3";

// Distributed top-k search over turbovec (TurboQuant) shard indexes.
//
// Architecture: hub-and-spoke. A client-facing coordinator fans each query
// out to shard-owner nodes over `NodeService.SearchShard` (bidi stream),
// merges the per-shard top-k lists, and answers over `SearchService.Search`.
//
// Collaborative mid-query floor sharing: while a node scans its shard in
// chunks, it publishes its current k-th best score (its heap floor) once its
// top-k heap is full. The coordinator tracks the maximum floor over all
// shards and pushes it back down to every node; nodes seed the remainder of
// their scan with it via turbovec's `SearchOptions.initial_threshold`.
//
// Lossless invariant: once any shard holds k candidates, its k-th best is a
// lower bound on the GLOBAL k-th best (the k-th best of a subset never
// exceeds the k-th best of the union), so pruning candidates that score at
// or below the max published floor can never drop a true global top-k hit.
// turbovec keeps candidates scoring exactly at the floor, so ties at the
// boundary survive.
package turbovec.search.v1;

import "google/protobuf/timestamp.proto";

// NodeService is the internal shard-owner API. Exactly one node owns a given
// shard; the coordinator is the only intended client.
service NodeService {
  // Runs one distributed search against this node's shard.
  //
  // The client sends exactly one `StartShardSearch` first, then any number
  // of `FloorUpdate` messages (monotonically non-decreasing floors; stale or
  // lower updates are ignored). The server scans its shard in chunks of
  // `chunk_blocks` SIMD blocks; between chunks it applies the highest floor
  // received so far to the next chunk's `initial_threshold`, and after each
  // chunk in which its local top-k heap is full it emits a `FloorUpdate`
  // carrying its current k-th best. The stream ends with exactly one
  // `SearchShardDone` holding the shard's local top-k.
  //
  // Cancellation (client closing the stream) aborts the scan between
  // chunks.
  rpc SearchShard(stream SearchShardRequest) returns (stream SearchShardResponse);

  // Streaming scan: the shard emits EVERY candidate at or above the live
  // floor as the scan passes each calibration block, holds no top-k, and
  // never sees k. The client (the coordinator) owns k: it merges all
  // shards' emissions into the only heap in the system, raises the floor
  // as its global k-th best tightens, and may abandon the scan with
  // `StopStreamSearch`. The terminal `StreamSearchSummary` with
  // `completed = true` is the exactness certificate: every live slot
  // scoring at or above the floor in effect when its block was scored
  // was emitted. Without a floor this emits the whole shard; the relayed
  // floor is the mechanism, not an optimization.
  rpc StreamSearch(stream StreamSearchRequest) returns (stream StreamSearchResponse);

  // Exposes the shard's TQ+ calibration (per-coordinate shift/scale) plus
  // basic shape metadata. Scores are only comparable across shards whose
  // indexes were built with byte-identical calibration, so callers can use
  // this to verify a cluster is uniformly seeded before serving traffic.
  rpc GetCalibration(GetCalibrationRequest) returns (GetCalibrationResponse);

  // Pushes a TQ+ calibration to this shard BEFORE its first vector is
  // added. The shard constructs (or, while still empty, re-constructs) its
  // index with `TurboQuantIndex::new_with_calibration`, locking the
  // calibration for the index's lifetime — the same rule turbovec enforces.
  //
  // Rules:
  // - On an empty shard this locks the calibration; sending the SAME
  //   calibration again is an idempotent no-op (`already_seeded = true`).
  // - On a non-empty shard, or with a different calibration than the one
  //   already locked, it is rejected (FAILED_PRECONDITION): calibration
  //   can never change once vectors exist.
  // - Field validation errors (bad dim/bit_width, non-finite shift,
  //   non-positive scale, wrong lengths) are INVALID_ARGUMENT.
  //
  // Deployment order for a from-scratch cluster: fit a calibration on a
  // representative sample, SetCalibration on every shard, then ingest.
  rpc SetCalibration(SetCalibrationRequest) returns (SetCalibrationResponse);

  // Ingests vectors into this shard. Client-streaming: each message is one
  // flat batch (`vectors.len()` a multiple of the shard dim); batches are
  // applied in stream order under the shard's write lock on the blocking
  // pool, so searches never observe a half-applied batch.
  //
  // Ids are SERVER-ASSIGNED and positional: the i-th vector of the shard
  // gets global id `slot_offset + i` (matching `SearchShardDone.hits`).
  // turbovec's id-mapped index does not support the masked, floor-seeded
  // scan this service is built around, so client-chosen ids are out of
  // scope; ingestion order defines identity.
  //
  // If the shard has no index yet (started empty, no SetCalibration), the
  // first batch constructs one: with `dim` from the request (required then)
  // and the shard's configured bit width, UNSEEDED — turbovec will fit
  // calibration from that first batch. Mixing unseeded-from-scratch shards
  // with seeded shards yields incomparable scores; seed first instead.
  //
  // Dimension mismatches and non-finite coordinates are INVALID_ARGUMENT.
  rpc AddVectors(stream AddVectorsRequest) returns (AddVectorsResponse);

  // Persists the shard's index to its configured path (the `index` path of
  // its config entry) in turbovec's atomic .tv format. A restarted node
  // with the same config comes back with all ingested vectors. On a shard
  // with no persistence path configured this is a no-op (`written=false`).
  rpc Flush(FlushRequest) returns (FlushResponse);

  // Installs a centrally built shard image (the atomic .tv index plus its
  // optional .bm25 sidecar) over one client stream — the bulk-load path
  // for pre-computed corpora. Where AddVectors builds the shard on the
  // node from streamed vectors, InstallSnapshot ships the FINISHED index:
  // build once anywhere with the cluster's seeded calibration, push the
  // artifact to every shard owner, and each node swaps it in atomically —
  // no per-node re-embedding, and byte-identical calibration everywhere
  // by construction.
  //
  // Protocol: the first message must be `manifest`, then `data` chunks in
  // any chunking the sender likes. The first `manifest.tv_bytes` of data
  // are the .tv image; the following `manifest.bm25_bytes` are the .bm25
  // sidecar. The node stages both files inside a generation directory
  // (`<index path>.snap/`), loads and validates the image, then swaps the
  // directory into place with ONE atomic rename — the pair can never
  // tear, searches never observe a half-installed shard, and a rejected
  // install leaves both the live shard and the active generation
  // untouched. Replacing an existing generation renames it aside first;
  // the crash window between the two renames is recovered deterministically
  // at startup (snap-old restored or removed).
  //
  // Rules:
  // - The shard must have a persistence path configured
  //   (FAILED_PRECONDITION otherwise): a snapshot install IS persistence.
  // - When the shard has a calibration locked (seeded or fitted) and the
  //   image's calibration differs, the install is rejected
  //   (FAILED_PRECONDITION): mixed calibrations make scores incomparable
  //   across shards. Seed first with SetCalibration, or install on an
  //   unseeded shard, which adopts the image's calibration.
  // - Byte counts that overrun or truncate the manifest's declared sizes
  //   are INVALID_ARGUMENT; nothing is installed.
  //
  // Replacing a NON-empty shard is allowed and wholesale: the image's ids
  // restart at the shard's slot_offset, and an image WITHOUT a .bm25
  // sidecar replaces any existing postings store with none. Callers
  // rebuilding a cluster (recalibration on data drift) must replace every
  // shard together, the same rule BroadcastCalibration documents.
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);

  // Ingests raw-text documents into the shard's BM25 postings index.
  // Client-streaming, one document per message. For each document the node
  // calls the configured analysis sidecar (Analyze, term vectors in
  // MODE_FULL so occurrence offsets survive) and builds postings from the
  // returned terms: term identity, frequency, and occurrence spans in
  // ORIGINAL text coordinates. The raw text is stored in the shard's doc
  // store (the highlight source, read via GetDocuments).
  //
  // Doc ids are SERVER-ASSIGNED and share the shard's positional id space
  // with ingested vectors: the next id is max(vectors, documents) so the
  // vector side can later attach the same id. Global id = slot_offset +
  // local id, as everywhere else.
  //
  // Fails UNAVAILABLE when the shard has no analysis sidecar configured,
  // INVALID_ARGUMENT on empty or oversized text.
  rpc AddDocuments(stream AddDocumentsRequest) returns (AddDocumentsResponse);

  // Returns this shard's per-term document frequencies and corpus stats —
  // phase (b) of the distributed BM25 flow. The coordinator sums these
  // across all shards to build the GLOBAL stats every shard then scores
  // with (see Bm25Query), which is what makes BM25 scores comparable
  // across shards.
  rpc TermStats(TermStatsRequest) returns (TermStatsResponse);

  // Scores BM25 for the given query terms against this shard's postings,
  // using the GLOBAL corpus stats supplied by the coordinator (never
  // shard-local stats — that would make scores incomparable). k1/b of 0
  // select the defaults (1.2 / 0.75). Returns the shard's local top-k.
  rpc Bm25Query(Bm25QueryRequest) returns (Bm25QueryResponse);

  // Bm25Query with a mid-scan floor relay — the lexical twin of
  // SearchShard (docs/block-max.md, "the floor is already plumbed").
  // The first client message must be `start`; later messages raise the
  // shard's score floor, applied at the scorer's next loop iteration.
  // The shard emits its running k-th best (one f32 ULP down, the same
  // emission-safe seed `kth_best` carries) as its heap rises, and ends
  // the stream with exactly one `done` carrying the same response the
  // unary RPC would have produced. Exactness is the seeded-floor
  // contract delivered mid-scan: every relayed floor is a proven lower
  // bound on the final global k-th best, block-max converts it into
  // blocks never read, and ties at the floor survive. The fused
  // multi-field route accepts the RPC but does not consume floors yet.
  rpc Bm25QueryStream(stream Bm25QueryStreamRequest) returns (stream Bm25QueryStreamResponse);

  // Reads raw document texts from the shard's doc store (the highlight
  // source). Ids are global; ids outside this shard's range or with no
  // stored text are simply absent from the response.
  rpc GetDocuments(GetDocumentsRequest) returns (GetDocumentsResponse);

  // Candidate-scoped BM25 scoring (phase 2 of FUSION_MODE_CASCADE):
  // score just `candidate_ids` against this shard's postings with the
  // supplied global stats.
  rpc Bm25Rescore(Bm25RescoreRequest) returns (Bm25RescoreResponse);

  // Candidate-scoped VECTOR scoring: the vector twin of Bm25Rescore.
  // Scores just `candidate_ids` against this shard's index through a
  // masked scan; the kernel short-circuits fully-masked SIMD blocks, so
  // the cost scales with the allowlist, not the shard. Ids outside this
  // shard's range (or beyond its live slots) are ignored. Scores are
  // bitwise identical to the same slots' scores in a full or streaming
  // search — one kernel, one calibration — which is what lets
  // FUSION_MODE_DECOMPOSED use this as phase 0: rescore the BM25 leg's
  // top docs to seed the fused floor before the vector streams open.
  rpc VectorRescore(VectorRescoreRequest) returns (VectorRescoreResponse);

  // Runs the shard's LOCAL half of a hybrid query: the chunked vector
  // scan and the BM25 scoring (with the supplied global stats), fused
  // with RRF on the node — level one of the settled two-level fusion. The
  // coordinator fuses the per-shard fused lists again (level two).
  rpc HybridShard(HybridShardRequest) returns (HybridShardResponse);

  // Returns the shard's RAW per-leg top-k lists for a hybrid query — no
  // local fusion. This is the shard side of FUSION_MODE_GLOBAL_RANK: the
  // coordinator merges the legs across shards by raw score into global
  // rankings and fuses once. Raw scores must be globally comparable per
  // leg (shared TQ+ calibration for the vector leg; the supplied global
  // stats for the BM25 leg).
  rpc ShardLegs(ShardLegsRequest) returns (ShardLegsResponse);

  // Liveness + shape of this shard: vector count, dim, bit width, BM25
  // doc count, and whether an ingest stream currently holds the shard's
  // single-writer slot. Cheap enough to poll.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// SearchService is the client-facing API served by the coordinator.
service SearchService {
  // Fans the query out to every known shard node, merges the shard top-k
  // lists into one global top-k (score descending; ties broken by shard
  // index, then vector id), and returns it.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Distributed BM25 over the shards' postings. Flow:
  //   1. the coordinator analyzes `text` with the sidecar using the SAME
  //      analysis options, producing the query terms (stem identity when
  //      SOURCE_STEMS is configured, exactly as at ingest);
  //   2. TermStats fan-out: per-shard df + doc count + total doc length;
  //   3. the coordinator sums them into GLOBAL stats and sends them back
  //      with Bm25Query, so every shard scores with identical idf/avgdl;
  //   4. shard hits merge into the global top-k (score desc, shard, doc id).
  // Hits carry per-term occurrence offsets in original-text coordinates;
  // fetch the raw text with NodeService.GetDocuments to highlight.
  rpc Bm25Search(Bm25SearchRequest) returns (Bm25SearchResponse);

  // Hybrid vector + BM25 search with RRF fusion. Default
  // (FUSION_MODE_GLOBAL_RANK): shards return raw per-leg lists and the
  // coordinator merges each leg by raw score into global rankings, then
  // applies single-level RRF — EXACTLY the monolithic result for
  // k <= leg_k when scores are globally comparable per leg (see
  // FusionMode). FUSION_MODE_TWO_LEVEL is the rank-based fallback for
  // incomparable scores. Hits carry global per-leg ranks and raw scores.
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);

  // Pushes ONE TQ+ calibration to every known shard (fan-out of
  // NodeService.SetCalibration). This is the shared-calibration handshake
  // that makes vector scores globally comparable — a prerequisite for
  // FUSION_MODE_GLOBAL_RANK. Fit the calibration once (bootstrap sample
  // or a single indexer), broadcast before ingest, and treat
  // recalibration on data drift as a coordinated cluster event: all
  // shards must be re-seeded and re-ingested together, or their scores
  // stop being comparable.
  rpc BroadcastCalibration(BroadcastCalibrationRequest) returns (BroadcastCalibrationResponse);

  // Fans NodeService.Health out to every shard (and any configured
  // replica) and reports per-target reachability plus the shard's own
  // health. Never fails on an unreachable node — that is a reported
  // outcome, not an error.
  rpc ClusterHealth(ClusterHealthRequest) returns (ClusterHealthResponse);

  // Runs two or more query configurations over the SAME corpus in one
  // request and reports how far apart their rankings are: the A/B
  // primitive, served by the engine rather than reassembled by every
  // client.
  //
  // The engine is the right place for this because the comparison is
  // only meaningful if the runs are otherwise identical. Search is
  // bitwise deterministic and layout-invariant here (tests/score_layout),
  // so two variants of one query differ ONLY by the variant — there is no
  // recall noise to average out, and a one-query diff is already a real
  // observation rather than a sample. An approximate engine cannot make
  // that claim, which is why A/B there means traffic splitting and weeks
  // of accumulation.
  //
  // Each variant is a COMPLETE ordinary request (Bm25Search or
  // HybridSearch) and runs the ordinary code path, so the thing measured
  // is the thing served. A variant-only scoring path would eventually
  // drift from production and the A/B would then be measuring the drift.
  rpc VariantSearch(VariantSearchRequest) returns (VariantSearchResponse);
}

message HealthRequest {}

// One shard's liveness and shape.
message HealthResponse {
  // Vectors resident in the turbovec index (0 for an empty shard).
  uint64 num_vectors = 1;
  // Vector dimensionality (0 until the first add locks it).
  uint32 dim = 2;
  // Quantization bit width.
  uint32 bit_width = 3;
  // The shard's global id base.
  uint64 slot_offset = 4;
  // Documents in the BM25 store (0 when the shard has none).
  uint64 bm25_docs = 5;
  // True while a bulk BM25 build is spilling (searchable only after Flush).
  bool bm25_building = 6;
  // True while an AddVectors/AddDocuments stream holds the single-writer
  // ingest slot.
  bool ingest_active = 7;
}

message ClusterHealthRequest {}

// Health of one fan-out target (a shard's primary or replica).
message ShardHealth {
  // Shard index in fan-out order.
  uint32 shard = 1;
  // The address probed.
  string addr = 2;
  // True when this target is a configured replica rather than a primary.
  bool is_replica = 3;
  // Whether the probe got an answer; `error` says why not.
  bool reachable = 4;
  string error = 5;
  // The target's own report, when reachable.
  HealthResponse health = 6;
}

message ClusterHealthResponse {
  // One entry per probed target: every primary, then every configured
  // replica, in shard order.
  repeated ShardHealth targets = 1;
}

// One message on the client-to-server leg of `SearchShard`. The first
// message on a stream MUST be `start`; `floor_update` messages may follow
// in any quantity.
message SearchShardRequest {
  oneof payload {
    // Opens the scan: the query vector, the per-shard k, and the
    // coordinator-assigned request id (log correlation only).
    StartShardSearch start = 1;
    // Raises the shard's score floor. Applied to the next chunk boundary,
    // never retroactively; already-collected candidates are re-validated
    // by construction because every emitted candidate scored >= every floor
    // that was in effect when it was collected.
    FloorUpdate floor_update = 2;
  }
}

// Opens a shard scan. Exactly one per `SearchShard` stream, first message.
message StartShardSearch {
  // Coordinator-assigned id tying this shard scan to one logical query.
  // Opaque to the node; echoed in logs only.
  string request_id = 1;
  // Number of top hits this shard must return (same k as the global query).
  uint32 k = 2;
  // The query vector. Length must equal the shard index dimension.
  repeated float vector = 3;
  // When true, the shard's running top-k never evicts a candidate whose
  // score equals the current k-th best: the whole boundary tie group
  // rides along, so `SearchShardDone.hits` may exceed k by the tie-group
  // size (worst case: a shard of identical scores returns everything).
  // Used by the cascade fusion mode, whose cutoff is score-defined and
  // must include every tied doc on every shard. Off by default, leaving
  // plain vector Search semantics untouched.
  bool tie_complete = 4;
  // When true, the shard collapses by PARENT DOCUMENT: k means k
  // distinct parents, each represented by its best-scoring chunk (the
  // entry point c'), and `SearchShardDone.hits` carry `parent_id`. The
  // parent of a slot is its doc-store lineage `opinion_id`; slots
  // without lineage parent themselves (high-bit-tagged global id).
  // Published floors become k-th best PARENT scores, which are >= the
  // plain chunk floors, so collaborative pruning only strengthens; the
  // lossless invariant holds unchanged (a chunk below the floor can
  // neither beat its own parent's best nor introduce a new top-k
  // parent). Mutually exclusive with `tie_complete`. Requires a doc
  // store on shards that should map real parents; a vector-only shard
  // degrades to self-parents (no collapse effect, still correct).
  bool collapse_parents = 5;
}

// A score floor: a lower bound on the global k-th best score. Flows both
// directions on the `SearchShard` stream — node to coordinator when the
// node's heap fills, coordinator to node with the max over all shards.
message FloorUpdate {
  // Candidates scoring below this cannot be in the global top-k.
  // Senders must only raise the floor over the life of a stream; receivers
  // ignore updates that do not raise their current floor.
  float floor = 1;
}

// One message on the server-to-client leg of `SearchShard`.
message SearchShardResponse {
  oneof payload {
    // The node's current k-th best score, emitted after each chunk in which
    // the local top-k heap is full. Monotonically non-decreasing within a
    // stream.
    FloorUpdate floor_update = 1;
    // Terminal message: the shard's local top-k plus scan statistics.
    // Exactly one per stream; the server closes the stream after it.
    SearchShardDone done = 2;
  }
}

// Terminal message of a shard scan.
message SearchShardDone {
  // The shard's local top-k, score descending, ties broken by vector id.
  // `vector_id` is the GLOBAL id (node slot offset + local slot), so the
  // coordinator can merge without knowing shard layouts.
  repeated ScoredHit hits = 1;
  // Instrumentation for benchmarking the floor-sharing mechanism.
  ShardScanStats stats = 2;
}

// Per-scan counters a node reports in `SearchShardDone`. These exist so the
// effect of floor sharing is measurable without patching the turbovec scan
// kernel: `candidates_collected` counts every real (non-padding) candidate
// the per-chunk searches returned, which is exactly the set of vectors that
// survived every floor in effect during the scan.
message ShardScanStats {
  // How many per-chunk `search_with_options` calls the scan made.
  uint32 chunk_calls = 1;
  // Real candidates collected across all chunks (sentinel padding excluded).
  uint64 candidates_collected = 2;
  // How many floor values the node actually PUT ON THE WIRE. This is
  // what --floor-warmup-chunks and --floor-min-interval-ms move, and it
  // is strictly <= floors_offered.
  uint64 floors_published = 3;
  // How many chunks ran with a coordinator-pushed floor in effect.
  uint64 floor_updates_applied = 4;
  // How many chunks OFFERED a floor: one per chunk whose heap held k.
  // The scan's own behaviour, independent of what the node does with
  // them. This field used to be missing and `floors_published` counted
  // offers, so the broadcast knobs measured as having no effect.
  uint64 floors_offered = 5;
}

// One scored vector. Ids are global across the cluster (see
// `SearchShardDone.hits`).
message ScoredHit {
  // Global vector id (shard slot offset + local slot).
  uint64 vector_id = 1;
  // turbovec score; higher is better. Comparable across shards only when
  // every shard shares the same TQ+ calibration.
  float score = 2;
  // Collapse mode only: the parent document this hit represents
  // (lineage opinion_id, or a high-bit-tagged global id for slots
  // without lineage). 0 outside collapse mode.
  uint64 parent_id = 3;
}

// One message on the client-to-shard leg of `StreamSearch`.
message StreamSearchRequest {
  oneof payload {
    // Opens the scan. Exactly one per stream, first message.
    StartStreamSearch start = 1;
    // Raises the shard's emission floor. Applied from the next
    // calibration block; floors only rise (lower values are ignored).
    FloorUpdate floor_update = 2;
    // Abandons the scan: emissions stop, the terminal summary arrives
    // with `completed = false`, and the stream closes.
    StopStreamSearch stop = 3;
  }
}

// Opens a streaming scan. There is no k: the shard emits everything at
// or above the floor and the client keeps what it wants.
message StartStreamSearch {
  // Coordinator-assigned id tying this scan to one logical query.
  // Opaque to the node; echoed in logs only.
  string request_id = 1;
  // The query vector. Length must equal the shard index dimension.
  repeated float vector = 2;
  // Starting emission floor: a known lower bound on the global k-th
  // best (for example a finished BM25 leg's decomposed floor). Absent
  // means no floor, which emits the entire shard.
  optional float initial_floor = 3;
  // Token identifying this stream on the node's UDP floor lane (the
  // same host:port as the gRPC listener, UDP namespace). 12-byte
  // little-endian datagrams of u64 token + f32 floor fold into this
  // stream's floor exactly like FloorUpdate messages: an unreliable
  // fast copy of the same monotone hint, so loss, duplication, and
  // reordering cost nothing (the gRPC stream stays the reliable lane).
  // 0 disables the UDP lane for this stream.
  uint64 floor_token = 4;
  // Document-mode streaming: when true, every batch record carries the
  // emitted slot's PARENT (20-byte records, see StreamSearchBatch) —
  // the doc-store lineage opinion_id, or a high-bit-tagged global id
  // for slots without lineage. The scan itself is unchanged; what
  // changes is the floor's MEANING: the coordinator relays k-th best
  // PARENT scores (a parent's score is its best chunk's score), which
  // are >= plain chunk floors, so pruning only strengthens and the
  // lossless invariant holds — a chunk below the floor can neither
  // beat its own parent's best nor introduce a new top-k parent.
  // Chunks of one parent may live on several shards; every shard's
  // qualifying chunks flow to the coordinator, which aggregates by
  // parent id — document collapse without Lucene-style colocation.
  bool collapse_parents = 5;
}

// Abandon request for a streaming scan.
message StopStreamSearch {}

// One message on the shard-to-client leg of `StreamSearch`.
message StreamSearchResponse {
  oneof payload {
    // Candidates from one calibration block.
    StreamSearchBatch batch = 1;
    // Terminal message: exactly one per stream; the server closes the
    // stream after it.
    StreamSearchSummary summary = 2;
  }
}

// Every candidate of one calibration block scoring at or above the
// floor in effect when the block was scored, as PACKED fixed-stride
// records rather than per-hit messages: streaming volume concentrates
// in the pre-floor blocks, and a single byte blob is one pack pass on
// the node (fused into the slot-to-global-id rebase it does anyway)
// and one stride walk at the coordinator — no per-hit protobuf
// encode/decode, no per-hit allocation, and 12 bytes per record on
// the wire instead of ~18.
//
// Record stride: 12 bytes, little-endian, `hits.len() % 12 == 0`:
//   u64 global vector id (shard slot offset + local slot)
//   f32 score
// When the stream's `StartStreamSearch.collapse_parents` is true the
// stride is 20 bytes (`hits.len() % 20 == 0`) with a third field:
//   u64 parent id (lineage opinion_id, or high-bit-tagged global id)
// Records are score-descending within a batch. Empty batches are never
// sent.
message StreamSearchBatch {
  bytes hits = 1;
}

// What the scan did; terminal message of a `StreamSearch` stream.
message StreamSearchSummary {
  // True when every block was scanned to the end: for this query, every
  // live slot scoring at or above the floor in effect when its block
  // was scored was emitted — the exactness certificate a merging
  // coordinator waits for. False only after `StopStreamSearch` (or a
  // broken client connection).
  bool completed = 1;
  // Candidates emitted across all batches.
  uint64 emitted = 2;
  // Calibration blocks scored.
  uint64 blocks_scanned = 3;
  // Floor raises that took effect between blocks.
  uint64 floor_raises_applied = 4;
}

// Empty: the node reports whatever its loaded index holds.
message GetCalibrationRequest {}

// The shard index's shape and TQ+ calibration.
message GetCalibrationResponse {
  // Vector dimensionality the index was built with.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Number of vectors in this shard.
  uint64 num_vectors = 3;
  // Per-coordinate calibration shift (length `dim`). Absent when the index
  // has no locked calibration (never added to and not seeded).
  repeated float shift = 4;
  // Per-coordinate calibration scale (length `dim`); same presence rule as
  // `shift`.
  repeated float scale = 5;
}

// Pushes a TQ+ calibration to a shard (see `NodeService.SetCalibration`).
message SetCalibrationRequest {
  // Vector dimensionality the shard index must have.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Per-coordinate calibration shift (length `dim`).
  repeated float shift = 3;
  // Per-coordinate calibration scale (length `dim`); every entry > 0.
  repeated float scale = 4;
}

// Result of a `SetCalibration` call.
message SetCalibrationResponse {
  // True when the pushed calibration was already locked on this shard
  // (idempotent retry); false when this call locked it.
  bool already_seeded = 1;
}

// One batch on the `AddVectors` stream.
message AddVectorsRequest {
  // Flat row-major batch: `vectors.len()` must be a multiple of the shard
  // dim. Every coordinate must be finite and |value| < 1e16 (turbovec's
  // input rule).
  repeated float vectors = 1;
  // Optional explicit dim. 0 means "use the shard's known dim" (from its
  // index or seeded calibration). Required when the shard has no index
  // and no seeded calibration yet; rejected if it disagrees with a known
  // dim.
  uint32 dim = 2;
}

// Terminal response of an `AddVectors` stream.
message AddVectorsResponse {
  // Vectors added over this stream.
  uint64 added = 1;
  // Total vectors in the shard after the stream.
  uint64 total = 2;
  // Global id assigned to the first vector of this stream
  // (`slot_offset + shard count before the stream`). Ids are contiguous
  // per shard in ingestion order.
  uint64 first_id = 3;
}

// Empty: flush whatever the shard holds.
message FlushRequest {}

// Result of a `Flush` call.
message FlushResponse {
  // Path the index was written to (empty when `written` is false).
  string path = 1;
  // Vectors in the flushed index.
  uint64 num_vectors = 2;
  // False when the shard has no persistence path configured (flush is then
  // a no-op, not an error — a purely in-memory shard is a legitimate
  // configuration).
  bool written = 3;
  // Documents in the flushed BM25 postings store (0 when the shard has no
  // postings).
  uint64 num_documents = 4;
}

// One message on the `InstallSnapshot` stream. The first message MUST be
// `manifest`; `data` chunks follow in any chunking.
message SnapshotChunk {
  oneof payload {
    // Declares the byte split between the two image files. Everything
    // else about the shard (dim, bit width, vector count, calibration)
    // is read from the image itself — the file is the source of truth.
    SnapshotManifest manifest = 1;
    // Opaque image bytes: the first `manifest.tv_bytes` across all data
    // chunks are the .tv file, the next `manifest.bm25_bytes` the .bm25
    // sidecar. Senders should keep chunks around 1 MiB.
    bytes data = 2;
  }
}

// The byte layout of an `InstallSnapshot` stream.
message SnapshotManifest {
  // Total .tv bytes on the stream. Required (nonzero).
  uint64 tv_bytes = 1;
  // Total .bm25 bytes following the .tv bytes; 0 for a vector-only image.
  uint64 bm25_bytes = 2;
}

// Result of an `InstallSnapshot` call.
message InstallSnapshotResponse {
  // The installed index file (inside the shard's generation directory).
  string path = 1;
  // Vectors in the installed index.
  uint64 num_vectors = 2;
  // Documents in the installed BM25 sidecar (0 when none was sent).
  uint64 num_documents = 3;
}

// Client-facing search request.
message SearchRequest {
  // Optional caller id for log correlation; the coordinator assigns one
  // when empty and echoes it back.
  string request_id = 1;
  // Number of global top hits to return. Optional: 0 (proto3 unset)
  // selects the coordinator's configured `max_k` (default 10000, its
  // stop bound); a value above `max_k` is refused, never clamped.
  uint32 k = 2;
  // The query vector. Length must equal the shard dimension.
  repeated float vector = 3;
  // Collapse by parent document (Lucene-style field collapsing): k
  // means k distinct parents, each hit is a parent's best chunk and
  // carries `parent_id`. See StartShardSearch.collapse_parents.
  bool collapse_parents = 4;
}

// Client-facing search response.
message SearchResponse {
  // Echoes `SearchRequest.request_id` (or the assigned one).
  string request_id = 1;
  // Global top-k: score descending, ties broken by shard index then vector
  // id. Fewer than k entries when the whole corpus holds fewer than k
  // vectors.
  repeated ScoredHit hits = 2;
  // Document-mode only (`collapse_parents` on a coordinator running the
  // streaming path): one group per returned parent, parallel to `hits`
  // (hits[i] is groups[i]'s best chunk). Each group holds EVERY chunk
  // of that parent scoring at or above `chunk_floor`, across all
  // shards — the cross-shard chunk retrieval that collapse-only Search
  // does not do. Empty on every other path.
  repeated ParentGroup groups = 3;
  // Document-mode only: the completeness bound on `groups` — one f32
  // ULP below the k-th best parent score when k distinct parents were
  // found, -inf otherwise (fewer than k parents exist, so no floor ever
  // rose and every chunk of every parent is present). Score-defined and
  // layout-invariant: the same corpus in any shard layout yields the
  // same groups.
  float chunk_floor = 4;
}

// One parent document's chunks in a document-mode search response.
message ParentGroup {
  // The parent (lineage opinion_id, or a high-bit-tagged global id for
  // chunks ingested without lineage).
  uint64 parent_id = 1;
  // Every emitted chunk of this parent scoring at or above
  // `SearchResponse.chunk_floor`: score descending, ties by vector id.
  // chunks[0] is the parent's best chunk, the representative in `hits`.
  repeated ScoredHit chunks = 2;
}

// Passthrough for the analysis sidecar's pipeline options (vendored proto
// ai.pipestream.opennlp.analysis.v1). Values are the NUMERIC values of the
// sidecar's enums; 0 always means "sidecar default". Mirroring the enums
// here would just duplicate the vendored definitions.
message AnalysisSpec {
  // AnalysisOptions.Tokenizer value (1 = WHITESPACE, 2 = SIMPLE).
  int32 tokenizer = 1;
  // AnalysisOptions.Stemmer value (1 = NONE, 2 = PORTER, ...). Required to
  // be non-NONE when term_vector_source selects stems.
  int32 stemmer = 2;
  // TermVectorOptions.Mode value (1 = FULL with offsets, 2 = SCORING_ONLY).
  int32 term_vector_mode = 3;
  // TermVectorOptions.Source value (1 = TOKENS, 2 = STEMS). Ingest and
  // query MUST use the same source or term identities will not match.
  int32 term_vector_source = 4;
  // Character filters applied before tokenization, in order, defining
  // term identity (IGNORED when source is STEMS). "Char filter" is
  // Lucene's name for this stage and OpenNLP implements them as
  // CharSequenceNormalizer; the sidecar's wire enum spells them
  // TermVectorOptions.NormalizerStep, whose values these are.
  repeated int32 char_filters = 5;
}

// Lineage for one ingested document: where it came from in the source
// corpus. Optional and purely additive; documents ingested without it
// behave exactly as before.
message DocLineage {
  // Source opinion id.
  uint64 opinion_id = 1;
  // Source cluster id.
  uint64 cluster_id = 2;
  // Chunk span start in original-text (char) coordinates.
  uint32 span_start = 3;
  // Chunk span end (exclusive).
  uint32 span_end = 4;
}

// One additional indexed field of a document (docs/multi-field.md). The
// body stays the top-level `text` + `analysis` pair; entries here index
// under their named field with their own analysis. Field values are
// indexed-only (scoring structures); the stored text remains the body.
message DocumentField {
  // Field name; must exist in the shard's field table (--bm25-fields),
  // must not be "body" (the body is the top-level text), and must not
  // repeat within one document. Unknown names are INVALID_ARGUMENT.
  string field = 1;
  // Raw field text. Non-empty, same cap as the body.
  string text = 2;
  // Analysis options for this field (a field's terms share identity
  // with queries analyzed under the same spec). Absent = sidecar
  // defaults, same rule as the body.
  AnalysisSpec analysis = 3;
}

// One facet value of a document: a single string value for one declared
// facet field ("court" -> "scotus"). Facet values are NOT analyzed —
// they are opaque identifiers counted exactly as sent — and land in the
// shard's dictionary-encoded facet column, not in postings.
message FacetValue {
  // Facet field name; must exist in the shard's facet field table
  // (--facet-fields) and must not repeat within one document. Unknown
  // names are INVALID_ARGUMENT — the same typo protection as
  // DocumentField.field.
  string field = 1;
  // The value. Non-empty; a document without a value for a facet field
  // simply omits the entry and is counted under no value.
  string value = 2;
}

// One numeric value of a document: a single f64 for one declared
// numeric field ("decision_date" -> 15706, epoch days). Values land in
// the shard's f64 column (docs/score-functions.md), never in postings.
// Non-finite values are INVALID_ARGUMENT: NaN is the column's absence
// sentinel and infinities break the score-function bound algebra.
message NumericValue {
  // Numeric field name; must exist in the shard's numeric field table
  // (--numeric-fields) and must not repeat within one document.
  // Unknown names are INVALID_ARGUMENT.
  string field = 1;
  // The value. A document without a value for a numeric field simply
  // omits the entry and passes through every score stage unchanged.
  double value = 2;
}

// One integer value of a document: a single i64 for one declared
// integer field ("citations" -> 4103). Values land in the shard's i64
// column (docs/range-facets.md), never in postings. An f64 column
// cannot hold these: past 2^53 it silently rounds, and this engine
// argues from exactness, so integers get a true i64 kind.
message IntegerValue {
  // Integer field name; must exist in the shard's integer field table
  // (--integer-fields) and must not repeat within one document (nor
  // across `integers` and `timestamps`, which target the same
  // columns). Unknown names are INVALID_ARGUMENT.
  string field = 1;
  // The value. INT64_MIN is INVALID_ARGUMENT: it is the column's
  // absence sentinel, so a document cannot hold it. A document without
  // a value for an integer field simply omits the entry.
  sint64 value = 2;
}

// One timestamp value of a document. Pure ingest sugar over
// IntegerValue: the NODE converts the instant to EPOCH MICROSECONDS
// and stores it in the named i64 column, so range facets and score
// stages over the column work in epoch micros and nothing downstream
// knows about timestamps. i64 micros spans roughly year -290307 to
// +294247, which covers every court date by a wide margin.
//
// Sub-microsecond precision is NOT representable and is dropped: the
// conversion floors toward negative infinity (nanos are always >= 0 in
// a valid Timestamp, so it is a plain truncation of the remainder). A
// producer that needs nanosecond identity must send an IntegerValue of
// its own and own the unit. The WAL persists this request verbatim, so
// replay reproduces the same conversion from the same instant.
message TimestampValue {
  // Integer field name; must exist in the shard's integer field table
  // (--integer-fields), the same table `integers` names. A field
  // valued by both `integers` and `timestamps` in one document is
  // INVALID_ARGUMENT — a document holds one value per column.
  string field = 1;
  // The instant. Refused when the epoch-micros conversion overflows
  // i64 or lands exactly on INT64_MIN (the absence sentinel).
  google.protobuf.Timestamp value = 2;
}

// One geo point of a document: a (lat, lon) pair for one declared geo
// field ("courthouse" -> 38.8904, -77.0090). Values land in the
// shard's geo-point column (kind 5, docs/geo-columns.md) as a 16-byte
// fixed-stride pair, never in postings. Coordinates are first-class so
// that bbox and radius FILTERS and distance-decay score stages can read
// them exactly, and so a routing enrichment sidecar
// (docs/plans/routing-enrichment.md) has a place to read from.
message GeoPointValue {
  // Geo field name; must exist in the shard's geo field table
  // (--geo-fields) and must not repeat within one document. Unknown
  // names are INVALID_ARGUMENT.
  string field = 1;
  // Latitude in DEGREES, finite and within [-90, 90]. Anything else is
  // INVALID_ARGUMENT: a coordinate off the globe is a producer bug, and
  // NaN is half of the column's absence sentinel.
  double lat = 2;
  // Longitude in DEGREES, finite and within [-180, 180]. Same rules.
  double lon = 3;
}

// One map-facet entry of a document: a single string value under a
// string key in one declared map<string, string> column
// (docs/map-columns.md). Keys and values are opaque — never analyzed —
// and land in the column's dictionaries; the map is ONE column no
// matter how many distinct keys the corpus carries, which is the
// structural answer to the field-per-key explosion flattening causes.
message MapFacetEntry {
  // Map column name; must exist in the shard's map-facet table
  // (--map-facet-fields). Unknown names are INVALID_ARGUMENT.
  string field = 1;
  // The entry's key. Non-empty (an empty key is almost always a
  // producer bug; a document without an entry simply omits it). At
  // most one value per (document, field, key) — map semantics.
  string key = 2;
  // The value. Non-empty, exact identity.
  string value = 3;
}

// One map-numeric entry of a document: a single f64 under a string key
// in one declared map<string, f64> column. Same rules as
// MapFacetEntry; values must be finite (there is no NaN sentinel in
// map pairs — absence is the key simply not being present — and
// infinities break the score-function bound algebra).
message MapNumericEntry {
  // Map column name; must exist in the shard's map-numeric table
  // (--map-numeric-fields).
  string field = 1;
  // The entry's key. Non-empty; at most one per (document, field, key).
  string key = 2;
  // The value. Finite.
  double value = 3;
}

// One document on the `AddDocuments` stream.
message AddDocumentsRequest {
  // Raw document text. Non-empty, at most 1 MiB (the sidecar's cap).
  string text = 1;
  // Analysis options for this document. Absent = sidecar defaults with
  // term vectors in MODE_FULL over TOKENS.
  AnalysisSpec analysis = 2;
  // Optional lineage, stored in the doc store and returned by
  // GetDocuments.
  DocLineage lineage = 3;
  // Additional indexed fields (docs/multi-field.md). Empty = body-only,
  // exactly the pre-multi-field document. This message is the WAL's
  // durable record, so old logs replay as body-only automatically and
  // reshard replay is the field-migration lever.
  repeated DocumentField fields = 4;
  // Facet values for this document, one entry per declared facet field
  // the document has a value for. Rides the same durable-record lever
  // as `fields`: old WAL logs replay facet-less, and reshard replay is
  // how an existing corpus grows facet columns.
  repeated FacetValue facets = 5;
  // Numeric values for this document, one entry per declared numeric
  // field it has a value for. Same durable-record lever as `facets`.
  repeated NumericValue numerics = 6;
  // Map-facet entries for this document (docs/map-columns.md). Same
  // durable-record lever: old WAL logs replay map-less, reshard replay
  // is how an existing corpus grows map columns.
  repeated MapFacetEntry map_facets = 7;
  // Map-numeric entries for this document. Same lever.
  repeated MapNumericEntry map_numerics = 8;
  // Integer values for this document, one entry per declared integer
  // field it has a value for. Same durable-record lever as `facets`.
  repeated IntegerValue integers = 9;
  // Timestamp values for this document: sugar over `integers`, stored
  // as epoch micros in the SAME i64 columns (see TimestampValue). Same
  // durable-record lever, and replay redoes the conversion.
  repeated TimestampValue timestamps = 10;
  // Geo points for this document, one entry per declared geo field it
  // has a value for (docs/geo-columns.md). Same durable-record lever:
  // the WAL keeps the request verbatim, so durability and reshard
  // replay come free.
  repeated GeoPointValue geo_points = 11;
}

// Terminal response of an `AddDocuments` stream.
message AddDocumentsResponse {
  // Documents ingested over this stream.
  uint64 added = 1;
  // Total documents in the shard's postings after the stream.
  uint64 total = 2;
  // Global doc id assigned to the first document of this stream.
  uint64 first_id = 3;
}

// One field's query terms in a multi-field TermStats request.
message FieldTerms {
  // Field name ("body" for field 0).
  string field = 1;
  // Query terms under THIS field's analysis (term identity is per
  // field).
  repeated string terms = 2;
}

// Phase (b) of the distributed BM25 flow: stats for these query terms.
message TermStatsRequest {
  // Query terms against the body field (exact identity: stems when
  // ingest used SOURCE_STEMS).
  repeated string terms = 1;
  // Additional per-field term lists (multi-field queries,
  // docs/multi-field.md). A shard without a named field answers zeros
  // for it — that IS its share of the global stats.
  repeated FieldTerms fields = 2;
}

// One field's share of the global stats (multi-field queries).
message FieldStats {
  // Sum of THIS field's document lengths over the shard (avgdl_f
  // numerator).
  uint64 total_doc_length = 1;
  // Document frequency per requested term, parallel to the request
  // entry's `terms`.
  repeated uint32 doc_frequencies = 2;
  // Whether this shard's field table contains the named field at all.
  //
  // The zeros above cannot answer that on their own: an empty shard, a
  // shard whose documents simply never filled the field, and a shard
  // that has never heard of the field are indistinguishable in them.
  // The difference matters because one of those is a typo in the query,
  // and scoring a misspelled field as "contributes nothing" returns a
  // confidently wrong ranking instead of an error. The coordinator
  // refuses a field NO shard knows, and tolerates one that only some
  // know (a genuinely heterogeneous fleet).
  bool known = 3;
}

// This shard's share of the global BM25 corpus stats.
message TermStatsResponse {
  // Documents in this shard's postings. Shared across fields (a
  // document is a document; idf's N is corpus-wide).
  uint64 doc_count = 1;
  // Sum of BODY document lengths (in terms) over the shard.
  uint64 total_doc_length = 2;
  // Body document frequency per requested term, parallel to `terms`.
  repeated uint32 doc_frequencies = 3;
  // Per-field shares, parallel to the request's `fields`.
  repeated FieldStats field_stats = 4;
  // This shard's stats epoch: a counter that advances on every mutation
  // of the shard's BM25 store (ingest, flush, load, snapshot install).
  // Everything in this response is a pure function of the store at one
  // epoch, so a caller may cache the response for as long as the shard
  // still reports the same epoch — and may ask the shard to enforce
  // that, by echoing the epoch back as `expected_stats_epoch` on a
  // scoring request. Always >= 1 (0 is reserved to mean "no claim" in
  // the echo).
  uint64 stats_epoch = 5;
}

// Phase (c) of the distributed BM25 flow: score with GLOBAL stats.
message Bm25QueryRequest {
  // Query terms (same identity as TermStatsRequest.terms).
  repeated string terms = 1;
  // Number of top hits this shard must return.
  uint32 k = 2;
  // Total documents across ALL shards.
  uint64 global_doc_count = 3;
  // Total document length across ALL shards.
  uint64 global_total_doc_length = 4;
  // Global document frequency per term (summed over shards), parallel to
  // `terms`.
  repeated uint32 global_doc_frequencies = 5;
  // BM25 k1 saturation parameter; 0 selects the default (1.2).
  float k1 = 6;
  // BM25 length-normalization parameter; 0 selects the default (0.75).
  float b = 7;
  // Seeded floor: the lexical twin of the vector leg's
  // `SearchOptions.initial_threshold`. A coordinator that already holds
  // a merged k-th best can seed the shard with it; the shard then
  // returns only hits with score >= min_score (ties at the floor
  // survive) and block-max pruning skips postings that provably cannot
  // reach it. 0 means unseeded (scores are always positive). For a
  // fused query (`fields` non-empty) the floor applies to the FUSED
  // score.
  float min_score = 8;
  // Fused multi-field query (docs/multi-field.md): when non-empty,
  // these legs REPLACE the flat single-field query — `terms`,
  // `global_total_doc_length`, `global_doc_frequencies`, `k1`, and `b`
  // are ignored; `global_doc_count`, `k`, and `min_score` still apply.
  // The body scores as the leg named "body". List order is the pinned
  // accumulation order (IEEE addition is not associative), so the
  // coordinator MUST send the same leg order to every shard for
  // bit-identical distributed scoring. A shard skips legs naming fields
  // it does not have: its documents hold no postings there, so the
  // fused scores are unchanged — the graceful path for a fleet
  // mid-migration.
  repeated Bm25FieldLeg fields = 9;
  // The stats epoch (TermStatsResponse.stats_epoch) the global stats in
  // this request were computed under, for THIS shard. When non-zero and
  // the shard's current epoch differs, the shard REFUSES with
  // FAILED_PRECONDITION rather than scoring with stats that no longer
  // describe it: a coordinator serving stats from a cache would
  // otherwise degrade silently under ingest, with no bound on how stale
  // the idf values could get. 0 means "no claim" and is never refused —
  // the pre-epoch semantics, where the stats are simply whatever the
  // coordinator fetched moments before.
  uint64 expected_stats_epoch = 10;
  // Facet fields to count over the match set (count-then-rank,
  // docs/plans/track-1-features.md section 2): every document matching
  // at least one query term AND passing every filter (`geo_filters`
  // and `filter`) is counted, independent of `k` and `min_score` — the
  // floor bounds what is SURFACED, never what matched, while a filter
  // bounds what MATCHES. Counting walks each scored term's doc run to
  // exhaustion, so a query that asks for facets pays that traversal;
  // empty means no counting and no cost. On a fused query the match
  // set is the union over every leg's terms.
  repeated string facet_fields = 11;
  // Score-function chain (docs/score-functions.md), applied in list
  // order to each candidate's BM25 score BEFORE the floor test and
  // heap insertion: hits, `min_score`, and `kth_best` are all on the
  // FINAL scale. List order is the pinned evaluation order (IEEE math
  // is not associative), so the coordinator MUST send the same list to
  // every shard. Currently the flat single-field route only; setting
  // this with `fields` legs is refused. Empty = identity.
  repeated ScoreStage score_stages = 12;
  // Map-facet keys to count over the match set (as `facet_fields`
  // defines it, filters included; docs/map-columns.md): each entry
  // names a map column and a key,
  // counted exactly like a plain facet field — count-then-rank, one
  // ords lookup per matched document, independent of k and the floor.
  // Answered in Bm25QueryResponse.facets AFTER the plain facet
  // entries, with FacetFieldCounts.key set.
  repeated MapFacetField map_facet_fields = 13;
  // Range buckets to count over the match set (as `facet_fields`
  // defines it, filters included; docs/range-facets.md): "how many
  // results per year band". Same
  // count-then-rank pass as `facet_fields` — one shared match bitmap
  // serves all three facet kinds — so a query asking for any of them
  // pays the traversal once. Answered in
  // Bm25QueryResponse.range_facets, positionally.
  repeated RangeFacetField range_facet_fields = 14;
  // Geo filters over a geo-point column (docs/geo-columns.md). ALL
  // filters must pass (AND semantics). Applied on the node BEFORE the
  // floor test and heap insertion, in the pruned scorer and the
  // exhaustive oracle identically: a filter only REMOVES documents, so
  // every block-max bound stays a valid upper bound with no new pruning
  // math. A document without a value fails every filter — no location
  // is inside no region — which is exact, not degradation. Answered by
  // `geo_columns_known`, positionally.
  repeated GeoFilter geo_filters = 15;
  // Compiled filter tree (see FilterExpr for the full contract):
  // applied on the node BEFORE the floor test and heap insertion, in
  // the pruned scorer and the exhaustive oracle identically, ANDed
  // with `geo_filters` when both are set. The facet match set (plain,
  // map, and range) counts only documents that pass BOTH. Answered by
  // `filter_columns_known`, positionally over the tree's leaves in
  // depth-first order.
  FilterExpr filter = 16;
}

// One geo filter: a geo-point column plus the region a document's point
// must lie in to survive (docs/geo-columns.md).
message GeoFilter {
  // The geo-point column to read (--geo-fields). A shard whose table
  // lacks it answers known=false and contributes NO hits through this
  // filter — its documents genuinely hold no locations, so this is
  // exact — but the coordinator REFUSES a column NO shard knows, the
  // same typo rule as facets, chains, and range facets.
  string column = 1;
  // The region. Exactly one must be set; an unset region is
  // INVALID_ARGUMENT naming the column (a filter that filters nothing
  // is a request nobody meant to send).
  oneof region {
    // An axis-aligned latitude/longitude box.
    GeoBbox bbox = 2;
    // A great-circle or local-Manhattan disc.
    GeoRadius radius = 3;
  }
}

// An axis-aligned bounding box in degrees. All four edges are
// INCLUSIVE: a point exactly on a boundary is inside.
message GeoBbox {
  // Southern edge, finite, within [-90, 90], and <= max_lat.
  double min_lat = 1;
  // Northern edge, finite, within [-90, 90].
  double max_lat = 2;
  // Western edge, finite, within [-180, 180], and <= max_lon.
  // min_lon > max_lon would describe an ANTIMERIDIAN-CROSSING box; this
  // increment REFUSES that by name rather than silently reinterpreting
  // the pair as a wraparound, because the two readings differ by the
  // whole planet and only the caller knows which was meant.
  double min_lon = 3;
  // Eastern edge, finite, within [-180, 180].
  double max_lon = 4;
}

// A disc around an origin. `distance <= meters` is INSIDE (the edge
// belongs to the disc, like the bbox edges).
message GeoRadius {
  // Origin latitude, finite, within [-90, 90].
  double lat = 1;
  // Origin longitude, finite, within [-180, 180].
  double lon = 2;
  // Radius in METERS: finite and strictly greater than zero. Zero or
  // negative is INVALID_ARGUMENT naming the column.
  double meters = 3;
  // Which distance the radius measures.
  GeoMetric metric = 4;
}

// The distance function a radius filter or a decay stage measures with.
enum GeoMetric {
  // Unused zero value; refused (a filter must say what it measures).
  GEO_METRIC_UNSPECIFIED = 0;
  // Great-circle distance on a sphere of the WGS84 mean radius
  // 6371008.8 m. The general-purpose choice.
  GEO_METRIC_HAVERSINE = 1;
  // Meters along the meridian plus meters along the parallel AT THE
  // ORIGIN'S latitude — a LOCAL approximation for city-scale use, not a
  // globe-scale distance (docs/geo-columns.md).
  GEO_METRIC_MANHATTAN = 2;
}

// A compiled filter expression: the predicate IR the coordinator sends
// to every shard (docs/cel-filters.md). The public surface syntax is
// CEL (Bm25SearchRequest.filter); the coordinator parses and compiles
// it ONCE into this tree, and each shard then resolves column names
// and string values against its OWN dictionaries — ordinals are
// shard-local and never travel, and shards never see CEL text.
//
// Evaluation is three-valued (Kleene, the SQL rule): a comparison on a
// document that lacks the value is UNKNOWN; and/or/not propagate it;
// only a document whose whole tree evaluates TRUE survives. The
// presence tests (`has`, `map_has_key`) are total — TRUE or FALSE,
// never UNKNOWN — so they are the one thing an absent value can pass.
// This deliberately deviates from stock CEL, which ERRORS on a missing
// field: erroring a fleet-wide scan on its first absent value is
// unusable, and adopting proto-default zero values instead would make
// an unset string equal "" — a silent lie. The deviation is pinned in
// docs/cel-filters.md and in tests.
//
// A filter only REMOVES documents, so every block-max bound stays a
// valid upper bound with no new pruning math — the argument
// docs/score-functions.md pinned for this layer. Applied on the node
// BEFORE the floor test and heap insertion, in the pruned scorer and
// the exhaustive oracle identically; the facet match set is narrowed
// by it (all three facet kinds count only surviving documents).
//
// The typo rule guards STRUCTURE, not data: a column (or map-facet
// key) no shard knows is refused via `filter_columns_known`, but a
// VALUE the corpus never held is an honest FALSE — zero results is the
// true answer when zero documents hold the value.
message FilterExpr {
  // Exactly one must be set. An unset node is INVALID_ARGUMENT: an
  // empty filter is the `filter` field left absent, never an empty
  // node. Trees deeper than 32 nodes or holding more than 256 leaves
  // are refused (a filter is a predicate, not a program).
  oneof expr {
    // Every child must pass. Kleene AND: any FALSE child makes it
    // FALSE; otherwise any UNKNOWN child makes it UNKNOWN.
    FilterList and = 1;
    // Some child must pass. Kleene OR: any TRUE child makes it TRUE;
    // otherwise any UNKNOWN child makes it UNKNOWN.
    FilterList or = 2;
    // Kleene NOT: TRUE and FALSE swap, UNKNOWN stays UNKNOWN — a
    // document missing the value fails `!(court == "x")` exactly as it
    // fails the positive form, and `has` is the escape hatch.
    FilterExpr not = 3;
    // String equality/membership on a plain facet column.
    FacetPredicate facet = 4;
    // Range or equality on an i64 or f64 column.
    NumberPredicate number = 5;
    // String equality/membership on one key of a map-facet column.
    MapFacetPredicate map_facet = 6;
    // Range or equality on one key of a map-numeric column.
    MapNumberPredicate map_number = 7;
    // Key presence in a map column (CEL `"k" in m`).
    MapKeyPredicate map_has_key = 8;
    // Value presence under this name in ANY column family (CEL
    // `has(col)`).
    HasPredicate has = 9;
    // Geo containment: the existing filter family as a leaf, so one
    // expression can mix regions with scalar predicates.
    GeoFilter geo = 10;
  }
}

// The children of an and/or node. At least one is required: a
// connective with nothing to connect is refused rather than resolved
// to a vacuous truth value nobody asked for.
message FilterList {
  repeated FilterExpr exprs = 1;
}

// One bound of a NumberPredicate / MapNumberPredicate range.
message FilterBound {
  // The bound's value. Exactly one must be set. Integer bounds against
  // i64 columns compare in i64 (exact); against f64 columns the
  // comparison is performed exactly across the two domains — an i64
  // bound is never rounded through f64, so a bound above 2^53 still
  // means the integer it says. Double bounds must be finite; against
  // i64 columns they are normalized to exact integer bounds
  // (ceil/floor with the exclusivity folded in), never compared in
  // float.
  oneof value {
    int64 int = 1;
    double num = 2;
  }
  // When true the bound itself is outside the range (`>` / `<` rather
  // than `>=` / `<=`).
  bool exclusive = 3;
}

// String equality/membership on a plain facet column: TRUE when the
// document's value is one of `values`, FALSE when it holds some other
// value, UNKNOWN when it holds none. Known = the shard's facet table
// has the column; the literal's TYPE picks the family, so comparing a
// number-holding column against a string refuses under the typo rule
// rather than answering an empty set.
message FacetPredicate {
  // Facet column name (--facet-fields).
  string column = 1;
  // Accepted values, at least one. One value is equality; several are
  // CEL `in`. Each value resolves against the shard's dictionary; a
  // value this shard never ingested simply matches none of its
  // documents.
  repeated string values = 2;
}

// Range or equality on an i64 column (--integer-fields) or an f64
// column (--numeric-fields), resolved in that order per shard. At
// least one bound is required (use `has` for bare presence); both with
// min > max is a legal empty range that no present value satisfies.
// Equality is min == max, both inclusive.
message NumberPredicate {
  // Column name.
  string column = 1;
  // Lower bound, absent = unbounded below.
  FilterBound min = 2;
  // Upper bound, absent = unbounded above.
  FilterBound max = 3;
}

// String equality/membership on one key of a map-facet column
// (docs/map-columns.md). Known = the column exists AND its key
// dictionary has the key — the same rule as MapFacetField counting: a
// key no shard ever ingested is drill-down structure spelled wrong.
message MapFacetPredicate {
  // Map-facet column name (--map-facet-fields).
  string column = 1;
  // The key whose value is tested.
  string key = 2;
  // Accepted values, at least one (one = equality, several = CEL `in`).
  repeated string values = 3;
}

// Range or equality on one key of a map-numeric column
// (--map-numeric-fields). Known = column AND key, like
// MapFacetPredicate; bounds as in NumberPredicate (map-numeric values
// are f64).
message MapNumberPredicate {
  // Map-numeric column name.
  string column = 1;
  // The key whose value is tested.
  string key = 2;
  // Lower bound, absent = unbounded below.
  FilterBound min = 3;
  // Upper bound, absent = unbounded above.
  FilterBound max = 4;
}

// Key presence in a map column (CEL `"k" in m`), resolved against the
// map-facet table first, then map-numeric. TOTAL: TRUE when the
// document has an entry under the key, FALSE otherwise — `"k" in {}`
// is false, not unknown, exactly as in CEL. Known = the COLUMN exists;
// the key is deliberately not part of the known handshake, because the
// key's presence is the question being asked, and refusing a key no
// shard ingested would make `!("k" in m)` unanswerable. This is the
// one deliberate departure from the map-facet counting known rule.
message MapKeyPredicate {
  // Map column name.
  string column = 1;
  // The key whose presence is tested.
  string key = 2;
}

// Value presence under a name (CEL `has(col)`): TRUE when the document
// holds a value in ANY column family of that name — facet, f64, i64,
// or geo — FALSE otherwise. TOTAL, never UNKNOWN: this is the escape
// hatch that lets a query see absence. Known = any family has the
// name. Map columns are not covered (test a key with `"k" in m`
// instead); asking `has` of a map column refuses at compile.
message HasPredicate {
  // Column name.
  string column = 1;
}

// One range-facet count request: a numeric-ish column plus the bucket
// edges to count into.
message RangeFacetField {
  // The column to read: an f64 column (--numeric-fields) or an i64
  // column (--integer-fields) when `key` is empty, resolved in that
  // order; a map<string, f64> column (--map-numeric-fields) when `key`
  // is set. i64 values are converted to double for bucketing.
  string column = 1;
  // For a map-numeric column, the key whose values are bucketed. Empty
  // selects a plain (f64 or i64) column.
  string key = 2;
  // Bucket boundaries: at least 2, all finite, STRICTLY ascending —
  // anything else is INVALID_ARGUMENT naming the column, because a
  // silently repaired edge list answers a question nobody asked.
  // Buckets are half-open [edges[i], edges[i+1]), so a value sitting
  // exactly on an interior edge lands in the UPPER bucket. There are
  // no implicit underflow/overflow buckets: a value below edges[0] or
  // at/above the last edge is counted in NO bucket. Explicit edges
  // only — if you want the tails, ask for them.
  repeated double edges = 3;
}

// One bucket's count within one range facet.
message RangeBucket {
  // Inclusive lower edge.
  double from = 1;
  // Exclusive upper edge.
  double to = 2;
  // Matching documents whose value falls in [from, to).
  uint64 count = 3;
}

// One requested range facet's counts, from one shard or merged.
message RangeFacetCounts {
  // The column name, echoed from the request.
  string column = 1;
  // The map key, echoed from the request (empty for plain columns).
  string key = 2;
  // Whether this shard can resolve the column (and, for a map entry,
  // the key). A shard without it answers known=false and no buckets —
  // legitimate for a heterogeneous fleet — but the coordinator REFUSES
  // a column NO shard knows, the same typo rule as `facet_fields`.
  bool known = 3;
  // One bucket per [edges[i], edges[i+1]) interval, in edge order.
  // Counts are additive, so the coordinator's merge is the positional
  // sum. Empty when `known` is false.
  repeated RangeBucket buckets = 4;
}

// One map-facet count request: a (column, key) pair. Structured rather
// than a "column[key]" string so keys never need escaping — keys are
// arbitrary map keys, and a parsing ambiguity here would miscount
// silently.
message MapFacetField {
  // Map column name (--map-facet-fields).
  string column = 1;
  // The key within the column whose values are counted.
  string key = 2;
}

// The transform of one score stage. Every op is monotone
// non-decreasing in the incoming score and ships with a bound rule
// (docs/score-functions.md) — that is the admission bar, because
// block-max pruning lifts its bounds through the chain.
enum ScoreOp {
  // Unused zero value; refused (a stage must say what it does).
  SCORE_OP_UNSPECIFIED = 0;
  // score *= exp(-|x - origin| / scale): recency decay. scale > 0.
  SCORE_OP_MULT_EXP_DECAY = 1;
  // score *= 1 + weight * ln(1 + max(x, 0)): log boost. weight >= 0 —
  // a negative weight could turn the factor negative, which breaks
  // monotonicity in the score, so it is refused.
  SCORE_OP_MULT_LOG = 2;
  // score += weight * x: additive boost, any finite weight. Note that
  // negative contributions can push final scores to or below zero;
  // correctness is unaffected, but kth_best seeding degrades to
  // unseeded for non-positive floors (floor_seed clamps at 0).
  SCORE_OP_ADD_LINEAR = 3;
  // score *= exp(-haversine_meters((lat, lon), (origin_lat,
  // origin_lon)) / scale): distance decay over a GEO-POINT column
  // (docs/geo-columns.md). Reads `origin_lat`, `origin_lon`, and
  // `scale` (meters, > 0). The multiplier lies in (0, 1], so the stage
  // is monotone non-decreasing in the incoming score and its bound lift
  // is identity — exactly MULT_EXP_DECAY's argument.
  SCORE_OP_MULT_GEO_DECAY_HAVERSINE = 4;
  // The same decay measured with the local Manhattan distance (meters
  // along the meridian plus meters along the parallel at the ORIGIN'S
  // latitude). A city-scale approximation, not a globe-scale distance.
  SCORE_OP_MULT_GEO_DECAY_MANHATTAN = 5;
}

// One stage of a score-function chain.
message ScoreStage {
  // The transform. SCORE_OP_UNSPECIFIED is refused.
  ScoreOp op = 1;
  // The numeric field (--numeric-fields) the stage reads — or, when
  // `key` is set, the map-numeric column (--map-numeric-fields) whose
  // entry under that key it reads. A document without a value passes
  // through unchanged (identity) — exact, not degraded, and the same
  // rule makes a shard that lacks the column entirely correct. A
  // column (or, for map stages, a (column, key) pair) NO shard knows
  // is refused by the coordinator (the typo rule, as for fields and
  // facets).
  string column = 2;
  // Weight; used by MULT_LOG (>= 0) and ADD_LINEAR (any finite).
  double weight = 3;
  // Decay origin (MULT_EXP_DECAY): the value where the factor is 1.
  double origin = 4;
  // Decay scale: > 0, finite. Value units for MULT_EXP_DECAY; METERS
  // for the two MULT_GEO_DECAY_* ops.
  double scale = 5;
  // When set, `column` names a map-numeric column and the stage reads
  // its entry under this key (docs/map-columns.md); bounds lift from
  // that key's min/max metadata. Empty = plain numeric column.
  string key = 6;
  // Decay origin latitude in degrees (MULT_GEO_DECAY_*): finite,
  // within [-90, 90]. `column` then names a geo-point column
  // (--geo-fields), resolved after the f64 and i64 tables.
  double origin_lat = 7;
  // Decay origin longitude in degrees (MULT_GEO_DECAY_*): finite,
  // within [-180, 180].
  double origin_lon = 8;
}

// One field's leg of a fused multi-field BM25 query.
message Bm25FieldLeg {
  // Field name ("body" for field 0).
  string field = 1;
  // Query terms under THIS field's analysis.
  repeated string terms = 2;
  // Global sum of this field's document lengths (avgdl_f numerator).
  uint64 global_total_doc_length = 3;
  // Global document frequency per term, parallel to `terms`.
  repeated uint32 global_doc_frequencies = 4;
  // Query-time weight w_f; 0 selects the default (1.0). Negative
  // weights are INVALID_ARGUMENT.
  float weight = 5;
  // This field's BM25 k1; 0 selects the default (1.2).
  float k1 = 6;
  // This field's BM25 b; 0 selects the default (0.75).
  float b = 7;
  // Fingerprint of the analyzer that produced `terms`
  // (turbovec_search::analyzer::analysis_fingerprint). The shard REFUSES
  // the query when this disagrees with the analyzer its column was built
  // under, because the two would score different term identities against
  // one idf and report a confident wrong ranking rather than an error.
  // 0 means the caller does not know its own analyzer and disables the
  // check; a shard whose column predates fingerprints is 0 on its side
  // and also does not enforce.
  uint64 analysis_fingerprint = 8;
}

// A half-open span [start, end) in original-text coordinates.
message OffsetSpan {
  // Start offset (inclusive).
  uint32 start = 1;
  // End offset (exclusive).
  uint32 end = 2;
}

// Occurrences of one query term in one hit document.
message TermOccurrences {
  // The query term as scored (stem identity when SOURCE_STEMS).
  string term = 1;
  // Every occurrence span in original-text coordinates.
  repeated OffsetSpan offsets = 2;
  // The field this term matched in. Empty on the single-field path
  // (the body); fused multi-field hits name the field explicitly
  // ("body" included).
  string field = 3;
}

// One BM25 hit, highlight-ready.
message Bm25Hit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // BM25 score computed with GLOBAL corpus stats; comparable across
  // shards. Higher is better.
  float score = 2;
  // Per-query-term occurrences in this document (terms absent from the
  // document are omitted).
  repeated TermOccurrences terms = 3;
}

// A shard's BM25 top-k.
message Bm25QueryResponse {
  // Hits, score descending, ties by doc id.
  repeated Bm25Hit hits = 1;
  // The shard's k-th best score: one f32 ULP below the k-th hit's score
  // when the shard returned k hits (emitted one ULP down so a later f32
  // seed can never exceed the true f64 k-th best — scoring is f64, the
  // wire is f32), 0 otherwise (no seedable floor — the shard could not
  // fill the requested k). A caller that re-queries later (e.g. after
  // appends) can seed the fleet with it via
  // Bm25QueryRequest.min_score / Bm25SearchRequest.min_score.
  float kth_best = 2;
  // Facet counts over this shard's match set, one entry per requested
  // facet field in request order. Counts are shard-local shares; they
  // are additive, so the coordinator's global counts are the plain sum
  // over shards — there is no analog of the global-df trap here.
  repeated FacetFieldCounts facets = 3;
  // Whether this shard's numeric table has each requested score
  // stage's column, parallel to `score_stages` (empty when none were
  // sent). A shard without the column answered identity for all its
  // documents — exact — but the coordinator refuses a column NO shard
  // knows, because a typo'd chain would otherwise be a silent no-op.
  repeated bool stage_columns_known = 4;
  // Range-facet counts over this shard's match set, one entry per
  // requested range facet in request order. Additive like `facets`.
  repeated RangeFacetCounts range_facets = 5;
  // Whether this shard's geo table has each requested filter's column,
  // parallel to `geo_filters` (empty when none were sent). A shard
  // without the column contributed no hits through that filter — its
  // documents hold no locations, so failing the filter is exact — but
  // the coordinator refuses a column NO shard knows, because a typo'd
  // filter would otherwise read as "zero results everywhere".
  repeated bool geo_columns_known = 6;
  // Whether this shard can resolve each leaf of the request's `filter`
  // tree, positionally over the leaves in depth-first order (empty
  // when no filter was sent). What "resolve" means is per leaf kind —
  // see each predicate message: facet = the facet table has the
  // column; number = the i64 or f64 table has it; map predicates =
  // column and key (column alone for map_has_key); has = any family;
  // geo = the geo table. A shard that cannot resolve a leaf evaluates
  // it as the absent case for every document — exact — but the
  // coordinator refuses a leaf NO shard can resolve, the same typo
  // rule as every other named column on this response.
  repeated bool filter_columns_known = 7;
}

// One message on the client-to-shard leg of `Bm25QueryStream`.
message Bm25QueryStreamRequest {
  oneof payload {
    // Opens the scan. Exactly one per stream, first message; the same
    // request the unary Bm25Query takes, `min_score` included (the
    // relay's floors arrive on top of it, never instead of it).
    Bm25QueryRequest start = 1;
    // Raises the shard's score floor mid-scan. Same monotone contract
    // as the vector relay: senders only raise, receivers ignore
    // non-raises. Values are emission-safe seeds (one f32 ULP below a
    // true k-th best), so ties at the floor survive by construction.
    FloorUpdate floor_update = 2;
  }
}

// One message on the shard-to-client leg of `Bm25QueryStream`.
message Bm25QueryStreamResponse {
  oneof payload {
    // The shard's running k-th best, one f32 ULP down (`floor_seed`),
    // emitted as the local heap rises. Monotone within a stream.
    FloorUpdate floor_update = 1;
    // Terminal message, exactly one per stream: the same response the
    // unary Bm25Query would have returned.
    Bm25QueryResponse done = 2;
  }
}

// One facet value's count within one facet field.
message FacetCount {
  // The value, exactly as ingested.
  string value = 1;
  // Number of matching documents holding this value.
  uint64 count = 2;
}

// One requested facet field's counts, from one shard or merged.
message FacetFieldCounts {
  // The facet field name — a plain facet column, or a map column when
  // `key` is set.
  string field = 1;
  // Whether this shard has the field in its facet table. A shard
  // without it answers known=false and no counts — legitimate for a
  // heterogeneous fleet (its documents hold no values), but the
  // coordinator REFUSES a facet field NO shard knows, because a typo
  // would otherwise read as "zero results everywhere". The same rule
  // as FieldStats.known.
  bool known = 2;
  // Non-zero value counts. Node responses list them in dictionary
  // order; the coordinator's merged response sorts by count
  // descending, ties by value ascending. Values matched by no document
  // are omitted.
  repeated FacetCount counts = 3;
  // For a map-facet entry (docs/map-columns.md): the key within the
  // map column these counts are for. Empty for plain facet fields.
  // `known` then means "this shard's column has this key in its key
  // dictionary" — the same partial-knowledge rule, applied per key so
  // a typo'd key cannot read as zero results everywhere.
  string key = 4;
}

// Reads raw texts from the doc store.
message GetDocumentsRequest {
  // Global doc ids.
  repeated uint64 doc_ids = 1;
}

// One stored document.
message StoredDocument {
  // Global doc id.
  uint64 doc_id = 1;
  // The raw text as ingested.
  string text = 2;
  // Lineage, when the document was ingested with it.
  optional DocLineage lineage = 3;
}

// Stored documents, in request order, omitting unknown ids.
message GetDocumentsResponse {
  // Found documents.
  repeated StoredDocument documents = 1;
}

// Client-facing distributed BM25 request.
message Bm25SearchRequest {
  // Query text, analyzed with `analysis` before scoring.
  string text = 1;
  // Number of global top hits to return. Optional: 0 selects the
  // coordinator's `max_k`; above it is refused (see SearchRequest.k).
  uint32 k = 2;
  // Analysis options for the query. MUST match the options documents were
  // ingested with (term identity source above all).
  AnalysisSpec analysis = 3;
  // Seeded floor for the whole fleet: forwarded to every shard's
  // Bm25QueryRequest.min_score. A client that already holds a floor
  // (e.g. the kth_best of a previous identical query, re-issued after
  // appends) seeds every shard, which then skips postings that provably
  // cannot reach it. 0 means unseeded (scores are always positive).
  // For a fused query (`fields` non-empty) the floor applies to the
  // fused score.
  float min_score = 4;
  // Fused multi-field search (docs/multi-field.md): when non-empty
  // these entries REPLACE the flat single-field query. `text` is
  // analyzed once per entry under that entry's analysis and scored
  // against its field; the fused score is the weighted per-field sum,
  // accumulated in entry order. Setting `analysis` (field 3) as well is
  // REFUSED rather than ignored: a caller that set it meant it, and
  // quietly dropping it runs the query under the sidecar's default
  // analysis, whose terms need not exist in the index at all.
  repeated QueryField fields = 5;
  // Facet fields to count over the full match set (count-then-rank).
  // Forwarded to every shard's Bm25QueryRequest.facet_fields; the
  // response carries the summed global counts. A query that asks for
  // facets pays a full doc-run traversal per scored term on every
  // shard; empty means no counting and no cost. A facet field no shard
  // knows is refused (INVALID_ARGUMENT).
  repeated string facet_fields = 6;
  // Score-function chain (docs/score-functions.md), forwarded verbatim
  // to every shard's Bm25QueryRequest.score_stages: hits, `min_score`,
  // and `kth_best` are on the FINAL (chained) scale. Flat single-field
  // route only for now; setting this with `fields` is refused. A stage
  // column no shard knows is refused (INVALID_ARGUMENT).
  repeated ScoreStage score_stages = 7;
  // Map-facet keys to count over the full match set
  // (docs/map-columns.md), forwarded to every shard and summed like
  // plain facet fields; answered in `facets` after the plain entries,
  // with FacetFieldCounts.key set. A (column, key) pair no shard knows
  // is refused (INVALID_ARGUMENT).
  repeated MapFacetField map_facet_fields = 8;
  // Range buckets to count over the full match set
  // (docs/range-facets.md), forwarded to every shard and summed
  // positionally; answered in `range_facets`. A column no shard knows
  // is refused (INVALID_ARGUMENT), as are edge lists that are not at
  // least two finite strictly ascending values.
  repeated RangeFacetField range_facet_fields = 9;
  // Geo filters (docs/geo-columns.md), forwarded verbatim to every
  // shard: ALL must pass, a document without a value fails every one,
  // and a column no shard knows is refused (INVALID_ARGUMENT). Carried
  // by the flat and the fused route; the hybrid route REFUSES them,
  // because its vector leg has no filter machinery yet and silently
  // filtering only the lexical half would be a lie about the result
  // set. Facet counting (plain, map, and range) counts only documents
  // that pass every filter (these and `filter` alike): a filtered-out
  // document is not in the result set, so counting it would misstate
  // the drill-down.
  repeated GeoFilter geo_filters = 10;
  // Filter expression in CEL surface syntax (docs/cel-filters.md),
  // e.g. `court == "scotus" && year >= 1990 && "color" in tags`. The
  // coordinator parses and compiles it ONCE into the FilterExpr
  // predicate IR and forwards that tree to every shard — shards never
  // see CEL text. Only constructs that compile to dictionary-resolved
  // predicates plus boolean algebra are accepted; everything else
  // (arithmetic, ternary, string functions, macros, regex `matches`)
  // is REFUSED BY NAME at INVALID_ARGUMENT, never interpreted slowly.
  // Column names no shard knows refuse under the typo rule. ANDed with
  // `geo_filters` when both are set; same absence semantics and facet
  // narrowing as FilterExpr documents. Empty = no filter. The hybrid
  // route refuses it for the same reason it refuses `geo_filters`.
  string filter = 11;
}

// One field of a fused multi-field search.
message QueryField {
  // Field to score ("body" for the body field).
  string field = 1;
  // Analysis options for THIS field's query terms; MUST match the
  // options the field was ingested with (term identity is per field).
  AnalysisSpec analysis = 2;
  // Query-time weight w_f; 0 selects the default (1.0).
  float weight = 3;
  // This field's BM25 k1; 0 selects the coordinator's configured
  // default.
  float k1 = 4;
  // This field's BM25 b; 0 selects the coordinator's configured
  // default.
  float b = 5;
}

// Client-facing distributed BM25 response.
message Bm25SearchResponse {
  // Global top-k: score descending, ties by shard index then doc id.
  repeated Bm25Hit hits = 1;
  // The merged k-th best score: one f32 ULP below the k-th hit's score
  // when k hits were returned (see Bm25QueryResponse.kth_best for why),
  // 0 otherwise. Seed a later re-query with it via
  // Bm25SearchRequest.min_score.
  float kth_best = 2;
  // Global facet counts, one entry per requested facet field in
  // request order: the plain sum of every shard's shares, sorted by
  // count descending, ties by value ascending. EXACT over the full
  // match set — computed by full traversal, never sampled from the
  // candidate pool. `known` is true when at least one shard has the
  // field (a field no shard knows was refused instead). Empty when the
  // query analyzed to no scoring terms — there is no match set to
  // count.
  repeated FacetFieldCounts facets = 3;
  // Global range-facet counts, one entry per requested range facet in
  // request order: the positional sum of every shard's bucket counts,
  // buckets in edge order. EXACT over the full match set, like
  // `facets`, and empty under the same conditions.
  repeated RangeFacetCounts range_facets = 4;
}

// How the coordinator fuses the per-shard leg results of a hybrid query.
enum FusionMode {
  // Unused zero value; resolves to FUSION_MODE_CASCADE.
  FUSION_MODE_UNSPECIFIED = 0;

  // Default. Shards return RAW per-leg lists (ShardLegs); the coordinator
  // merges each leg across shards by raw score into GLOBAL rankings and
  // applies single-level RRF over them. With globally comparable scores
  // per leg (shared calibration for vectors, global stats for BM25) this
  // is EXACTLY the monolithic result for k <= leg_k: any doc in the true
  // global top-leg_k of a leg is in its shard's local top-leg_k (local
  // rank <= global rank), so the union of shard lists contains the exact
  // global top-leg_k and merging by score reconstructs it.
  FUSION_MODE_GLOBAL_RANK = 1;

  // Fallback for incomparable scores: each shard RRF-fuses its legs
  // locally (HybridShard) and the coordinator RRF-merges the shard lists.
  // Rank-based and therefore scale-free, but NOT partition-independent —
  // shard-local ranks are compressed relative to global ranks, so the
  // result can differ from a monolithic index.
  FUSION_MODE_TWO_LEVEL = 2;

  // Default. Cascade, no score fusion: phase 1 generates vector
  // candidates through the floor-sharing bidi path (cross-shard early
  // termination applies — the cutoff IS the savings, no leg_k hits per
  // shard), with a TIE-COMPLETE cutoff: the candidate pool is
  // {score >= s_k} where s_k is the global k-th vector score, so the
  // pool can exceed k by the boundary tie-group size. Phase 2 reranks
  // the pool by BM25 (global stats, candidate-scoped scoring per owning
  // shard) and returns the top k. Vector recall is a GATE here:
  // keyword-strong but vector-weak docs are not surfaced — use
  // Bm25Search for pure lexical queries, or GLOBAL_RANK for true fusion.
  FUSION_MODE_CASCADE = 3;

  // Score-based fusion (the normalize + weighted-combine family):
  // shards return RAW per-leg lists exactly as in GLOBAL_RANK; the
  // coordinator merges each leg into one global list, truncates it
  // TIE-COMPLETE to leg_k (the retained set is {score >= s_k} with s_k
  // the leg's leg_k-th best — score-defined, hence layout-invariant),
  // normalizes the retained scores per leg (ScoreNormalization) and
  // combines each doc's normalized leg scores (ScoreCombination)
  // weighted by vector_weight/bm25_weight. Rank-free: score GAPS
  // survive fusion — a runaway leg leader stays far ahead where RRF
  // compresses every gap to the fixed distance between adjacent ranks.
  // Requires globally comparable scores per leg, same as GLOBAL_RANK.
  FUSION_MODE_SCORE_BLEND = 4;

  // EXACT fused top-k over the raw weighted sum
  //
  //   fused(d) = vector_weight * v(d) + bm25_weight * b(d)
  //
  // with no leg truncation: unlike SCORE_BLEND (whose blend runs over
  // the union of two leg_k-deep lists, missing docs mediocre in both
  // legs but strong fused), every doc in the corpus is accounted for.
  // Requires both weights > 0 and globally comparable raw scores per
  // leg (shared calibration, global stats).
  //
  // Execution is BM25-first with decomposed floors over the streaming
  // vector path (docs/multi-field.md "Hybrid streaming interplay"):
  //   1. the BM25 leg runs to depth leg_k (milliseconds; postings over
  //      a few terms). Its top score b_1 is the EXACT global maximum
  //      b(d), the bound every decomposed floor divides through.
  //   2. VectorRescore pins v(d) for the leg's top k docs — k true
  //      fused scores, whose k-th best s_0 is a lower bound on the
  //      final fused k-th best. Every vector stream then opens with
  //      initial_floor = (s_0 - bm25_weight * b_1) / vector_weight:
  //      any doc scoring below that satisfies fused(d) < s_0 whatever
  //      its b(d), so pruning it is lossless. (A BM25-only bound can
  //      never floor the vector scan — the top lexical doc could sit
  //      at any vector score — which is why phase 2 exists.)
  //   3. as emissions accumulate, the coordinator's k-th best known
  //      fused lower bound rises and re-decomposed floors chase it.
  //   4. close-out: emitted docs outside the BM25 leg's list get their
  //      b(d) pinned by Bm25Rescore (candidate-scoped) unless even
  //      b = the leg's boundary score cannot lift them to the k-th
  //      best; docs never emitted were certified fused < s by their
  //      floor. Exact by construction, every certificate checked.
  // leg_k is a cost knob here, not a correctness knob: deeper legs
  // pin more b(d) up front and shrink the close-out rescore.
  FUSION_MODE_DECOMPOSED = 5;
}

// SCORE_BLEND only: how each leg's retained scores are rescaled before
// combining. Statistics are computed over the leg's GLOBAL retained
// list (tie-complete top leg_k across all shards) — never per shard,
// which would break partition-independence.
enum ScoreNormalization {
  // Unused zero value; resolves to SCORE_NORMALIZATION_MIN_MAX.
  SCORE_NORMALIZATION_UNSPECIFIED = 0;
  // (s - min) / (max - min), onto [0, 1]. A degenerate leg (every
  // retained score equal) maps to 1.0. The default: bounded and
  // scale-free, and the boundary doc maps to 0.0 — a doc AT the
  // truncation boundary blends exactly like an absent one, which makes
  // min-max robust to boundary-tie membership differences between
  // layouts.
  SCORE_NORMALIZATION_MIN_MAX = 1;
  // (s - mean) / stddev (population stddev over the retained set).
  // Unbounded and can be negative; a degenerate leg maps to 0.0.
  // Preserves outlier magnitude that min-max compresses. Caveat: under
  // ARITHMETIC combination a doc ABSENT from a leg contributes 0 (the
  // leg mean), which outscores a present-but-weak (negative z) doc;
  // GEOMETRIC/HARMONIC skip non-positive scores entirely.
  SCORE_NORMALIZATION_Z_SCORE = 2;
  // No rescaling: raw leg scores combine directly. Only meaningful when
  // the legs already share a scale (or to inspect the blend itself).
  SCORE_NORMALIZATION_NONE = 3;
}

// SCORE_BLEND only: how one doc's normalized per-leg scores combine
// into its fused score, weighted by vector_weight/bm25_weight.
enum ScoreCombination {
  // Unused zero value; resolves to SCORE_COMBINATION_ARITHMETIC.
  SCORE_COMBINATION_UNSPECIFIED = 0;
  // Weighted arithmetic mean over ALL weighted legs: a leg the doc is
  // absent from contributes 0 with its weight still in the denominator,
  // so single-leg docs are proportionally penalized. This is the
  // classic weighted-sum hybrid formula (union-flavored). The default.
  SCORE_COMBINATION_ARITHMETIC = 1;
  // Weighted geometric mean over the legs where the doc has a POSITIVE
  // normalized score, weights renormalized over those legs; a doc with
  // no positive leg scores 0. Favors docs that are good in EVERY leg
  // without zeroing single-leg docs.
  SCORE_COMBINATION_GEOMETRIC = 2;
  // Weighted harmonic mean over the positive legs (same skip rule as
  // GEOMETRIC). The most AND-flavored: dominated by the doc's WEAKEST
  // leg.
  SCORE_COMBINATION_HARMONIC = 3;
}

// Per-leg options for hybrid (RRF-fused) search. Every field is optional;
// 0 selects the documented default.
message HybridLegOptions {
  // Fusion strategy. Absent = FUSION_MODE_GLOBAL_RANK.
  FusionMode fusion_mode = 5;
  // How deep each leg is fetched before fusion. 0 = default
  // max(k, rrf_k): the RRF constant should never exceed a leg's depth, or
  // deep-ranked docs could not contribute their 1/(rrf_k + rank) share.
  // Values below k are clamped to k. For DECOMPOSED this is the BM25
  // leg's depth — a cost knob, never a correctness knob (see
  // FUSION_MODE_DECOMPOSED).
  uint32 leg_k = 1;
  // Weight of the vector leg: its RRF weight under GLOBAL_RANK and
  // TWO_LEVEL, its blend weight under SCORE_BLEND. ABSENT = default
  // 1.0; an EXPLICIT 0 disables the leg entirely (GLOBAL_RANK and
  // SCORE_BLEND only — a single-leg query is how "vector primary" or
  // "lexical primary" runs through the hybrid path, composing with
  // boost and debug; TWO_LEVEL rejects explicit 0, its wire format
  // cannot distinguish 0 from unset at the node; CASCADE ignores
  // weights). Disabling both legs is INVALID_ARGUMENT.
  optional float vector_weight = 2;
  // Weight of the BM25 leg (same dual role, same disable rule).
  optional float bm25_weight = 3;
  // The RRF constant. 0 = default 60 (the usual value from the RRF paper).
  float rrf_k = 4;
  // SCORE_BLEND only: per-leg score normalization before combining.
  // Absent = MIN_MAX.
  ScoreNormalization normalization = 6;
  // SCORE_BLEND only: how normalized leg scores combine. Absent =
  // ARITHMETIC.
  ScoreCombination combination = 7;
  // Vector-score floor on the RESULT SET: every returned hit must have
  // a vector-leg score >= this (docs absent from the vector leg are
  // dropped too). Applied BEFORE fusion, truncation, and boost, so
  // deeper qualifying docs are promoted rather than the list just
  // shrinking, and (SCORE_BLEND) normalization statistics are computed
  // over the filtered retained set. Score-defined, hence
  // layout-invariant. Applies to every mode including cascade (where
  // it tightens the phase-1 gate before the BM25 rerank). 0 = off.
  float min_vector_score = 8;
}

// One hybrid query against a shard (internal). The shard runs BOTH legs
// locally — the chunked vector scan and the BM25 scoring with the
// supplied global stats — and fuses them with RRF before returning.
// Per-shard-then-coordinator is the settled two-level fusion design; the
// shared positional doc-ID space is what lets one shard's legs rank the
// same ids.
message HybridShardRequest {
  // Coordinator-assigned request id (log correlation only).
  string request_id = 1;
  // Depth of each leg AND of the fused shard list (the coordinator's
  // leg_k).
  uint32 k = 2;
  // Vector leg query (shard dim).
  repeated float vector = 3;
  // BM25 leg query terms (already analyzed by the coordinator).
  repeated string terms = 4;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 5;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 6;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 7;
  // RRF weight of the vector leg; 0 = default 1.0.
  float vector_weight = 8;
  // RRF weight of the BM25 leg; 0 = default 1.0.
  float bm25_weight = 9;
  // RRF constant; 0 = default 60.
  float rrf_k = 10;
  // BM25 k1 for the BM25 leg; 0 selects the default (1.2). The
  // coordinator forwards its configured params; before this field the
  // leg always scored with defaults regardless of tuning.
  float k1 = 11;
  // BM25 b for the BM25 leg; 0 selects the default (0.75).
  float b = 12;
  // Stats-epoch claim for the BM25 leg's global stats; see
  // Bm25QueryRequest.expected_stats_epoch. 0 = no claim.
  uint64 expected_stats_epoch = 13;
}

// One fused hit in a shard's hybrid result, with per-leg provenance.
message HybridLegHit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // Shard-level fused RRF score.
  float fused_score = 2;
  // 1-based rank in the shard's vector leg. Absent when the doc is not in
  // that leg's fetched depth.
  optional uint32 vector_rank = 3;
  // Raw vector score (turbovec; comparable across shards via shared
  // calibration).
  float vector_score = 4;
  // 1-based rank in the shard's BM25 leg. Absent when not in that leg.
  optional uint32 bm25_rank = 5;
  // Raw BM25 score (computed with global stats; comparable across shards).
  float bm25_score = 6;
}

// A shard's fused hybrid top-k.
message HybridShardResponse {
  // Fused hits, shard-level RRF score descending.
  repeated HybridLegHit hits = 1;
}

// A second-pass lexical boost applied AFTER fusion (the rescore-window
// pattern): the top `window` hits are rescored as
//
//   final = base_weight * base + boost_weight * bm25(text)
//
// and reordered by it; hits beyond the window keep their relative order
// after the reordered window. `base` is the mode's ordering score: the
// fused score for the fused modes, the phase-2 BM25 score for cascade.
// The boost BM25 runs CANDIDATE-SCOPED through NodeService.Bm25Rescore
// with global stats fetched for the boost terms, so a boost costs one
// TermStats fan-out plus one Bm25Rescore per owning shard — never a
// full postings walk.
//
// Scale note: `base` and the boost BM25 live on unrelated scales (RRF
// fused scores are ~1/rrf_k; BM25 is unbounded), exactly as in the
// classic rescore pattern — the weights are the scale knob, and hits
// carry `boost_score` separately so clients can see both parts.
message BoostRescore {
  // Boost query text, analyzed with the request's `analysis` options
  // (same identity rules as the main query). Must be non-empty.
  string text = 1;
  // How many top hits are rescored. 0 = the whole result list.
  uint32 window = 2;
  // Weight of the base score. 0 = default 1.0.
  float base_weight = 3;
  // Weight of the boost BM25 score. 0 = default 1.0.
  float boost_weight = 4;
}

// Client-facing hybrid (vector + BM25) search request.
message HybridSearchRequest {
  // Optional caller id; assigned when empty and echoed back.
  string request_id = 1;
  // BM25 leg query text, analyzed with `analysis` (same options as
  // ingest).
  string text = 2;
  // Vector leg query.
  repeated float vector = 3;
  // Number of global fused hits to return. Optional: 0 selects the
  // coordinator's `max_k`; above it is refused (see SearchRequest.k).
  uint32 k = 4;
  // Analysis options for the BM25 leg query.
  AnalysisSpec analysis = 5;
  // Per-leg fusion options; absent = defaults (see HybridLegOptions).
  HybridLegOptions legs = 6;
  // When true, the response's `debug` block carries coordinator phase
  // timings, per-shard leg wall times and depths, and (cascade) the
  // vector scan's stats — the explain/profile surface. Costs a few
  // clock reads; results are unchanged.
  bool debug = 7;
  // Optional second-pass boost over the top hits (any fusion mode).
  BoostRescore boost = 8;
}

// Profile of one hybrid query; populated only when the request set
// `debug`.
message HybridDebug {
  // The fusion mode that actually ran.
  FusionMode fusion_mode = 1;
  // Effective per-leg depth after defaulting and clamping.
  uint32 leg_k = 2;
  // Query terms after analysis: the BM25 leg's identity.
  repeated string terms = 3;
  // Coordinator phases, milliseconds of wall time. `legs_ms` covers the
  // whole shard fan-out (for cascade: both phases); `fusion_ms` the
  // coordinator-side merge and fuse.
  float analysis_ms = 4;
  float stats_ms = 5;
  float legs_ms = 6;
  float fusion_ms = 7;
  float total_ms = 8;
  // Per-shard visibility, in shard order.
  repeated HybridShardDebug shards = 9;
  // Wall time of the boost pass (boost analysis + stats + rescore
  // fan-out), included in total_ms; 0 when no boost was requested.
  float boost_ms = 10;
  // The boost query's terms after analysis; empty without boost.
  repeated string boost_terms = 11;
}

// One shard's contribution to a hybrid query.
message HybridShardDebug {
  // Shard index in fan-out order.
  uint32 shard = 1;
  // Wall time of this shard's leg work as measured at the coordinator:
  // the ShardLegs / HybridShard RPC, or for cascade the phase-1
  // SearchShard stream plus this shard's phase-2 Bm25Rescore.
  float rpc_ms = 2;
  // Hits this shard returned per leg; for cascade: phase-1 candidates
  // generated / phase-2 candidates rescored on this shard.
  uint32 vector_hits = 3;
  uint32 bm25_hits = 4;
  // Cascade only: the phase-1 vector scan's stats.
  ShardScanStats scan = 5;
}

// One fused hit, with per-leg provenance from the owning shard so clients
// can see WHY it ranked. A doc present in only one leg has no rank for
// the other leg.
message HybridHit {
  // Global doc id.
  uint64 doc_id = 1;
  // The coordinator-level fused score: RRF for GLOBAL_RANK/TWO_LEVEL,
  // the normalized combination for SCORE_BLEND, and the raw weighted
  // sum vector_weight * v + bm25_weight * b for DECOMPOSED.
  float fused_score = 2;
  // Shard that owns the doc.
  uint32 shard = 3;
  // 1-based rank in the owning shard's vector leg (absent if not in it).
  optional uint32 vector_rank = 4;
  // Raw vector score.
  float vector_score = 5;
  // 1-based rank in the owning shard's BM25 leg (absent if not in it).
  optional uint32 bm25_rank = 6;
  // Raw BM25 score (global stats).
  float bm25_score = 7;
  // Raw BM25 score of the boost query against this doc (global stats
  // over the BOOST terms). 0 when no boost was requested, the doc fell
  // outside the boost window, or no boost term matches it. When a boost
  // ran, the window is ordered by
  // base_weight * fused_score + boost_weight * boost_score.
  float boost_score = 8;
}

// Client-facing hybrid search response.
message HybridSearchResponse {
  // Echoes the request id (or the assigned one).
  string request_id = 1;
  // Global fused top-k: coordinator-level RRF score descending, ties by
  // shard then doc id. Populated for FUSION_MODE_GLOBAL_RANK and
  // FUSION_MODE_TWO_LEVEL.
  repeated HybridHit hits = 2;
  // Cascade top-k (BM25 rerank order; pool beyond k is truncated here).
  // Populated for FUSION_MODE_CASCADE; `hits` is then empty.
  repeated CascadeHit cascade_hits = 3;
  // The profile block; present only when the request set `debug`.
  HybridDebug debug = 4;
}

// A shard's raw per-leg lists for a hybrid query (FUSION_MODE_GLOBAL_RANK).
message ShardLegsRequest {
  // Coordinator-assigned request id (log correlation only).
  string request_id = 1;
  // Depth of each leg (the coordinator's leg_k).
  uint32 k = 2;
  // Vector leg query (shard dim).
  repeated float vector = 3;
  // BM25 leg query terms (already analyzed by the coordinator).
  repeated string terms = 4;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 5;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 6;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 7;
  // BM25 k1 for the BM25 leg; 0 selects the default (1.2). The
  // coordinator forwards its configured params; before this field the
  // leg always scored with defaults regardless of tuning.
  float k1 = 8;
  // BM25 b for the BM25 leg; 0 selects the default (0.75).
  float b = 9;
  // Stats-epoch claim for the BM25 leg's global stats; see
  // Bm25QueryRequest.expected_stats_epoch. 0 = no claim.
  uint64 expected_stats_epoch = 10;
}

// One raw leg hit.
message RawLegHit {
  // Global doc id (slot_offset + local id).
  uint64 doc_id = 1;
  // Raw leg score; globally comparable per leg by the caller's
  // construction (shared calibration / global BM25 stats).
  float score = 2;
}

// A shard's unfused legs, each score-descending.
message ShardLegsResponse {
  // Vector leg top-k, raw scores.
  repeated RawLegHit vector_hits = 1;
  // BM25 leg top-k, raw scores (global stats).
  repeated RawLegHit bm25_hits = 2;
}

// Pushes one TQ+ calibration to every shard (see
// SearchService.BroadcastCalibration).
message BroadcastCalibrationRequest {
  // Vector dimensionality.
  uint32 dim = 1;
  // Quantization bit width (2, 3, or 4).
  uint32 bit_width = 2;
  // Per-coordinate calibration shift (length `dim`).
  repeated float shift = 3;
  // Per-coordinate calibration scale (length `dim`).
  repeated float scale = 4;
}

// One node's outcome of a calibration broadcast.
message CalibrationApplyResult {
  // The node address, as configured on the coordinator.
  string node = 1;
  // Whether the calibration was applied (or was already locked
  // identically).
  bool ok = 2;
  // True when the node already had this exact calibration locked.
  bool already_seeded = 3;
  // The failure reason when `ok` is false (for example a non-empty shard,
  // which locks calibration for the index lifetime).
  string error = 4;
}

// Per-node outcomes of a calibration broadcast, in configured node order.
message BroadcastCalibrationResponse {
  // One result per configured node.
  repeated CalibrationApplyResult results = 1;
}

// Candidate-scoped BM25 scoring: phase 2 of the cascade fusion mode.
// The coordinator routes each candidate's id to its owning shard; the
// shard scores just those ids against its postings (intersection over
// the append-only, doc-id-sorted postings lists, not a full walk) with
// the supplied GLOBAL stats, so scores are cross-shard comparable.
message Bm25RescoreRequest {
  // Query terms (already analyzed by the coordinator).
  repeated string terms = 1;
  // Global corpus stats for the BM25 leg (see Bm25QueryRequest).
  uint64 global_doc_count = 2;
  // Global total document length for the BM25 leg.
  uint64 global_total_doc_length = 3;
  // Global per-term document frequencies for the BM25 leg.
  repeated uint32 global_doc_frequencies = 4;
  // Global candidate doc ids to score. Ids outside this shard's range
  // (or with no postings) are ignored.
  repeated uint64 candidate_ids = 5;
  // BM25 k1; 0 selects the default (1.2).
  float k1 = 6;
  // BM25 b; 0 selects the default (0.75).
  float b = 7;
  // Stats-epoch claim for the global stats above; see
  // Bm25QueryRequest.expected_stats_epoch. 0 = no claim.
  uint64 expected_stats_epoch = 8;
}

// BM25 scores for the requested candidates, doc id ascending.
message Bm25RescoreResponse {
  // One hit per candidate that scored above zero.
  repeated Bm25Hit hits = 1;
}

// Candidate-scoped vector scoring (see NodeService.VectorRescore).
message VectorRescoreRequest {
  // The query vector (shard dim).
  repeated float vector = 1;
  // Global candidate doc ids to score. Ids outside this shard's range,
  // or beyond its live slots, are ignored.
  repeated uint64 candidate_ids = 2;
}

// Scores for the requested candidates present on this shard, score
// descending. A shard with no index answers empty (it holds none of
// the candidates).
message VectorRescoreResponse {
  repeated RawLegHit hits = 1;
}

// One cascade hit: the two leg scores as SEPARATE fields (no fused
// score) plus the final rerank rank.
message CascadeHit {
  // Global doc id.
  uint64 doc_id = 1;
  // Final 1-based rank after the BM25 rerank (BM25 desc, vector desc,
  // doc id asc).
  uint32 rank = 2;
  // Shard that owns the doc.
  uint32 shard = 3;
  // Raw vector score from phase 1 (shared calibration; globally
  // comparable).
  float vector_score = 4;
  // Raw BM25 score from phase 2 (global stats; globally comparable).
  float bm25_score = 5;
  // Raw BM25 score of the boost query (see HybridHit.boost_score; for
  // cascade the boosted window orders by
  // base_weight * bm25_score + boost_weight * boost_score, and `rank`
  // reflects the final order).
  float boost_score = 6;
}

// One labelled query configuration to evaluate.
//
// A variant carries a whole request rather than a set of overrides so
// that anything the engine can be asked is something the engine can A/B,
// including comparisons across kinds: BM25-only against hybrid answers
// "is the vector leg earning its latency", which an overrides-shaped
// message could not express.
message SearchVariant {
  // Caller's name for this configuration ("control", "normalized-stems").
  // Echoed on every result and diff; must be non-empty and unique within
  // the request, because the diffs are unreadable if two arms share a
  // name.
  string label = 1;
  // The query to run. Its own `k` and `request_id` are ignored: depth is
  // shared across the request so the rankings are comparable, and the
  // request id is assigned once for the whole comparison.
  oneof query {
    Bm25SearchRequest bm25 = 2;
    HybridSearchRequest hybrid = 3;
  }
}

// Evaluate several query configurations over one corpus.
message VariantSearchRequest {
  // Optional caller id; assigned when empty and echoed back.
  string request_id = 1;
  // The configurations to compare, in order. At least two. The FIRST is
  // the reference for every diff (conventionally the incumbent), which is
  // what makes score_regret's asymmetry well defined.
  repeated SearchVariant variants = 2;
  // Depth for every variant and for the diffs. Applied to all arms, since
  // rankings truncated at different depths are not comparable. Optional:
  // 0 selects the coordinator's `max_k`; above it is refused (see
  // SearchRequest.k). An arm's own `k` is always overridden by this one.
  uint32 k = 3;
  // RBO persistence: the probability a reader continues to the next rank,
  // so 0.9 weights roughly the first ten results. 0 selects 0.9.
  float rbo_p = 4;
  // When true, also return the two variants' results merged by team-draft
  // interleaving, ready to serve to a user whose selection then credits
  // one arm. Requires EXACTLY two variants: team draft is a two-way
  // method, and an "interleaving" of three arms would be a different
  // algorithm wearing the same name.
  bool interleave = 5;
  // Seed for the interleaving's tie-breaking coin. 0 derives a stable
  // seed from the first variant's query text, which keeps a re-run of the
  // same query reproducible while still varying across queries. Set it
  // explicitly only to replay a specific past interleaving.
  uint64 interleave_seed = 6;
}

// One variant's ranking.
message VariantResult {
  // The variant's label, echoed.
  string label = 1;
  // The top-k, best first. Ids and scores only: this message exists to be
  // compared, and per-term occurrences would multiply the response by the
  // number of arms. Re-issue the winning variant as an ordinary request
  // for the full hit detail.
  repeated RankedHit hits = 2;
  // Wall time of this variant's fan-out, measured at the coordinator.
  // Variants run one after another, not concurrently, so this is the
  // configuration's own cost rather than its share of a contended fleet.
  float elapsed_ms = 3;
}

// A ranked result reduced to what a comparison needs.
message RankedHit {
  // Global doc id.
  uint64 doc_id = 1;
  // The variant's own score for it: fused score for a hybrid variant, the
  // (possibly multi-field) BM25 score for a BM25 variant. Comparable
  // WITHIN a variant, and across variants only when they score the same
  // way — which is why the diffs below lean on rank, and why score_regret
  // reads its scores from the reference alone.
  float score = 2;
}

// How far one variant's ranking sits from the reference's.
//
// These measure disagreement, not quality. Nothing here says which arm is
// better; that needs labels, or the interleaving's selections.
message RankingDiff {
  // Label of the reference arm (the request's first variant).
  string reference = 1;
  // Label of the arm being compared to it.
  string variant = 2;
  // Ranks compared: min(k, both list lengths).
  uint32 depth = 3;
  // Documents present in both top-`depth` sets.
  uint32 overlap = 4;
  // `overlap` as a fraction of `depth`; 1.0 means the same set in any
  // order.
  float overlap_fraction = 5;
  // Kendall tau-b over the UNION of both rankings: +1 identical order, -1
  // reversed, 0 no association. Documents one arm omitted are ranked past
  // the end of its list rather than dropped, so omission counts as the
  // disagreement it is.
  float kendall_tau = 6;
  // Truncated rank-biased overlap at the request's `rbo_p`: like overlap
  // but top-weighted, so a swap at rank 1 costs far more than one at rank
  // 50. Truncated means it assumes nothing about the unseen tail and is
  // therefore a LOWER bound.
  float rbo = 7;
  // Mean reference score given up per compared rank: at each rank, the
  // reference's score there minus the reference's score of whatever this
  // variant put there. Both sides are measured by the reference's
  // yardstick, so only the selection differs.
  //
  // This measures the SET and not the order — any reordering of the same
  // documents cancels to exactly 0. Read it WITH kendall_tau: a large tau
  // change at zero regret is the near-duplicate shuffle signature, while
  // real regret means the variant reached for worse documents.
  //
  // The SIGN is only meaningful when regret_unscored below is 0. The
  // cancellation needs the compared ranks to be a permutation of the
  // reference's own prefix, and skipped ranks break that, so a divergent
  // variant can report a negative mean that says nothing about quality.
  float score_regret = 8;
  // Ranks where both the reference and the variant's document had a
  // reference score, so the regret term above is a mean over these.
  uint32 regret_counted = 9;
  // Variant documents the reference never scored. Not averaged in: they
  // may be better or worse and this measure cannot tell, so they are
  // reported instead of being silently absorbed into the mean. A high
  // count means the arms have diverged past what regret can judge.
  uint32 regret_unscored = 10;
  // Whether the two arms disagree about the single best result — the
  // difference a user is most likely to notice, and easily invisible in
  // an aggregate.
  bool top1_flipped = 11;
}

// Which arm contributed an interleaved result.
enum InterleaveTeam {
  // Unused zero value.
  INTERLEAVE_TEAM_UNSPECIFIED = 0;
  // The request's first variant.
  INTERLEAVE_TEAM_A = 1;
  // The request's second variant.
  INTERLEAVE_TEAM_B = 2;
}

// Two variants merged into the one list a user sees.
//
// Team-draft interleaving alternates which arm contributes the next
// result, so both get equal exposure within a single query and a
// selection is evidence about the ranking rather than about the position.
// A document both arms returned is contributed once and credits neither
// beyond that: results the arms agree on carry no information, and
// counting them would drown the disagreements that discriminate.
message Interleaving {
  // The merged list, in display order.
  repeated uint64 doc_ids = 1;
  // Contributing arm per position; parallel to `doc_ids`.
  repeated InterleaveTeam teams = 2;
  // The seed actually used, so the exact merge can be replayed.
  uint64 seed = 3;
}

// The comparison.
message VariantSearchResponse {
  // Echoes the request id (or the assigned one).
  string request_id = 1;
  // One entry per variant, in request order.
  repeated VariantResult results = 2;
  // Every variant after the first, diffed against the first.
  repeated RankingDiff diffs = 3;
  // Present only when the request asked to interleave.
  Interleaving interleaving = 4;
}
