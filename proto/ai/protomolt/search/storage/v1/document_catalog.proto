syntax = "proto3";
package ai.protomolt.search.storage.v1;
import "ai/protomolt/search/v1/document_write.proto";
import "ai/protomolt/search/v1/search.proto";

message DocumentCatalogHeader {
  uint32 format_version = 1;
  string collection = 2;
  uint64 accepted_sequence = 3;
  // Format 3: created once and persisted; reopen never invents a replacement.
  bytes history_id = 4;
  // Receipts through this migration boundary may predate the identity field.
  uint64 legacy_receipts_through_sequence = 5;
  // Format 4 is a terminal sealed source. Readers predating sealing refuse it.
  // A backup preserves this fence; reopening never makes the source writable.
  SourceHistorySeal history_seal = 6;
}

// Trusted local retirement operation, not permission to activate a replacement.
// Resolve all pending index decisions first. The expected sequence prevents
// retirement from silently omitting a concurrently accepted write.
message SourceSealRequest {
  bytes history_id = 1;
  uint64 expected_accepted_sequence = 2;
  bytes operation_id = 3;
}

// Durable terminal fence. It is evidence about this source store only, not a
// credential or proof that another store/host is safe to activate. No unseal
// operation exists. Exact retries preserve this decision across restart.
message SourceHistorySeal {
  uint32 format_version = 1;
  bytes history_id = 2;
  uint64 accepted_sequence = 3;
  bytes operation_id = 4;
}
message DocumentVersionKey {
  bytes document_key = 1;
  uint64 version = 2;
}
message DocumentVersion {
  bytes document_key = 1;
  uint64 version = 2;
  uint64 accepted_sequence = 3;
  bytes source_sha256 = 4;
  bool deleted = 5;
}
message DocumentOperation {
  bytes request_sha256 = 1;
  ai.protomolt.search.v1.DocumentWriteReceipt receipt = 2;
}

// Optional source-catalog extension. Decisions describe durable index artifacts,
// never a serving-state activation or a searchable write receipt.
message ProjectionJournalHeader {
  uint32 format_version = 1;
  bytes history_id = 2;
}
message ProjectionDecisionKey {
  bytes index_key = 1;
  uint64 accepted_sequence = 2;
}
message ProjectionIntent {
  bytes index_key = 1;
  bytes history_id = 2;
  DocumentVersion source = 3;
  bytes before_manifest_sha256 = 4;
  bytes after_manifest_sha256 = 5;
  uint64 before_epoch = 6;
  uint64 after_epoch = 7;
  uint64 rows = 8;
  // SHA-256 of this message with intent_id empty, using format-1 encoding.
  bytes intent_id = 9;
}
message ProjectionJournalState {
  bytes index_key = 1;
  bytes history_id = 2;
  uint64 committed_sequence = 3;
  bytes committed_manifest_sha256 = 4;
  ProjectionIntent pending = 5;
  // Journal format 2. Source and maintenance intents are mutually exclusive.
  MaintenanceIntent pending_maintenance = 6;
  MaintenanceCursor maintenance_tip = 7;
}

// Persistent authority of a source-managed index. It is not a credential and
// contains no storage path or network address. Mutations must join this source
// history's publication journal; ordinary row/WAL mutation routes refuse.
message SourceIndexOwner {
  uint32 format_version = 1;
  bytes history_id = 2;
  bytes index_key = 3;
  string collection = 4;
}

// Local artifact comparison, not an authorization grant or a write receipt.
// The maintenance publisher must compute this from its held before/after views.
message SourceRewriteCertificate {
  uint32 format_version = 1;
  SourceIndexOwner owner = 2;
  uint64 live_rows = 3;
  bytes schema_sha256 = 4;
  bytes identity_content_sha256 = 5;
}

// Physical index semantics retained independently of the remaining row files.
message IndexGenerationDeclaration {
  uint32 format_version = 1;
  repeated GenerationTextField text_fields = 2;
  GenerationColumns columns = 3;
  ai.protomolt.search.v1.DerivedColumns derived = 4;
  // Absent until a source publication first establishes a vector backend.
  GenerationVectorState vector = 5;
}
message GenerationTextField {
  string name = 1;
  // Absent until analysis has established this field's fingerprint.
  optional fixed64 analysis_fingerprint = 2;
  bool positions = 3;
  bool sentences = 4;
}
message GenerationColumns {
  repeated string facets = 1;
  repeated string numerics = 2;
  repeated string integers = 3;
  repeated string unsigned_integers = 4;
  repeated string geo = 5;
  repeated string map_facets = 6;
  repeated string map_numerics = 7;
  repeated string map_integers = 8;
  repeated string map_unsigned_integers = 9;
}
message GenerationVectorState {
  uint32 dimension = 1;
  ai.protomolt.search.v1.VectorBackendConfig config = 2;
}

// Immutable physical maintenance history, independent of accepted sequence.
message MaintenanceDecisionKey {
  bytes index_key = 1;
  uint64 after_epoch = 2;
}
message MaintenanceCursor {
  uint64 after_epoch = 1;
  bytes intent_id = 2;
}
message MaintenanceIntent {
  uint32 format_version = 1;
  SourceIndexOwner owner = 2;
  uint64 accepted_sequence = 3;
  bytes source_intent_id = 4;
  bytes before_manifest_sha256 = 5;
  bytes after_manifest_sha256 = 6;
  uint64 before_epoch = 7;
  uint64 after_epoch = 8;
  MaintenanceCursor previous = 9;
  SourceRewriteCertificate preservation = 10;
  // SHA-256 of this message with intent_id empty, using format-1 encoding.
  bytes intent_id = 11;
}

// Source half of a coherent backup. The database contains exact accepted
// source history, retry receipts and projection/maintenance journal records
// from one read transaction. This is not an index backup or a serving receipt:
// a complete backup must also include each index's committed manifest and all
// of its artifacts, matching the states below, before publishing a bundle.
message DocumentCatalogCheckpoint {
  uint32 format_version = 1;
  DocumentCatalogHeader header = 2;
  repeated ProjectionJournalState indexes = 3;
  uint64 bytes = 4;
  bytes sha256 = 5;
  uint64 records = 6;
}

message DocumentCatalogCheckpointLimits {
  // 1..64 MiB of accounted record content per output transaction. A record
  // larger than this is refused rather than split or truncated.
  uint64 batch_bytes = 1;
  // Positive completed output database size bound, checked after each commit.
  // It is not a filesystem quota or a whole-process memory bound.
  uint64 max_file_bytes = 2;
}

// Trusted local backup construction budgets, not transport or serving grants.
message SourceBackupLimits {
  // 1..64 MiB of serialized source/index metadata and inventory accounting.
  uint64 metadata_bytes = 1;
  // 1..65536 inventory files; the final completion manifest is one extra file.
  // Artifact pinning may also refuse when the OS file-descriptor limit is lower.
  uint32 max_files = 2;
  // Positive completed bundle byte bound, including the completion manifest.
  // Checked as files are completed; not a filesystem quota.
  // Separately caps the temporary source-audit database, checked after each
  // batch of at most 1024 receipts. Scratch is removed before the source copy.
  uint64 max_bytes = 3;
  // 1..64 MiB of source records per output database transaction.
  // Also bounds each decoded record during the pinned source-history audit.
  uint64 source_batch_bytes = 4;
}

message SourceBackupIndex {
  bytes index_key = 1;
  // Canonical relative directory inside this bundle, never a source path.
  string directory = 2;
  uint64 catalog_epoch = 3;
}

// Written last as source-backup.pb after the entire local bundle is durable.
// It binds one accepted source snapshot to all of its journaled indexes. It
// does not authorize activation, replace current grants or advance receipts.
message SourceBackupManifest {
  uint32 format_version = 1;
  DocumentCatalogCheckpoint source = 2;
  repeated SourceBackupIndex indexes = 3;
  repeated ai.protomolt.search.v1.SnapshotArtifact artifacts = 4;
  // SHA-256 of this format-1 message with manifest_sha256 cleared.
  // Integrity binding only; this is not an authentication signature.
  bytes manifest_sha256 = 5;
}

// Trusted local restore expectation. The owner supplies the expected digest
// and identity independently of the incoming bundle. No field grants serving,
// writer activation, remote export or permission rollback.
message SourceRestoreRequest {
  bytes expected_manifest_sha256 = 1;
  // Exact collection binding; the empty/default collection is a valid value.
  string collection = 2;
  bytes history_id = 3;
  SourceBackupLimits limits = 4;
}
