<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipestream Search API explorer</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top"></header>
<div class="layout explorer">
  <aside>
    <div class="panel">
      <h2>Methods</h2>
      <input id="method-filter" placeholder="filter" autocomplete="off" aria-label="filter methods">
      <div id="methods" class="methods"></div>
    </div>
  </aside>
  <main>
    <div class="panel">
      <div class="toolbar">
        <h3 id="method-name" class="mono">Choose a method</h3><span id="method-kind" class="pill hidden"></span>
        <span class="spacer"></span>
        <label for="target">Process</label><select id="target"><option value="coordinator">coordinator</option></select>
        <button id="run" class="primary" disabled>Run</button>
      </div>
      <div id="method-comment" class="muted small"></div>
      <textarea id="body" class="mono" rows="12" spellcheck="false" aria-label="request message as proto3 JSON">{}</textarea>
      <div class="toolbar"><span id="body-state" class="muted small"></span><span class="spacer"></span>
        <button id="format" class="quiet">format</button><button id="reset" class="quiet">reset</button></div>
      <div id="error" class="error hidden"></div>
    </div>
    <div class="panel">
      <div class="tabs"><button class="active" data-tab="response">Response</button><button data-tab="grpcurl">grpcurl</button></div>
      <div class="toolbar"><span id="status" class="muted small mono"></span><span class="spacer"></span><button id="copy-raw">Copy</button></div>
      <pre class="raw tall" id="raw"></pre>
    </div>
  </main>
  <aside>
    <div class="panel">
      <div class="tabs"><button class="active" data-shape="request">Request</button><button data-shape="response">Response</button></div>
      <div id="shape-name" class="mono small muted"></div>
      <div id="shape" class="shape muted small">The fields of the chosen method's messages, with the comments from the <code>.proto</code>. Click a request field to add it to the JSON.</div>
    </div>
  </aside>
</div>
<script type="module" src="/explorer.js"></script>
</body>
</html>
