[package]
name = "protomolt-ann-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Dev tooling only. Its own workspace and lockfile keep every baseline
# engine out of the product's dependency graph and Cargo.lock (#53).
[workspace]

[dependencies]
turbo-sha256 = { git = "https://github.com/ai-pipestream/turboembed.git", rev = "6702ddfb7de49c3f4c40fe2eeb95097eb3993b1e" }
pipestream-search = { path = "../..", default-features = false }
serde_json = "1"
hnsw_rs = { version = "0.3.5", features = ["simdeez_f"] }
hnsw = "0.11"
# hnsw 0.11 uses space 0.17 traits and rand_core 0.6 RNGs.
space = "0.17"
rand_pcg = "0.3"
hnswlib-rs = "0.10"
usearch = "2.26"
flate2 = "1"

[profile.release]
debug = 1
