[package]
name = "protomolt-search-embedded"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Embedded, no-egress Protomolt Search runtime for Android, iOS, and desktop"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pipestream-search = { path = "../..", default-features = false }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-stream = "0.1"
tonic = "0.12"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[dev-dependencies]
prost-types = "0.13"
