[package]
name = "route-cost"
version = "0.1.0"
edition = "2021"
publish = false
# routee-compass 0.19.x pins toolchain 1.96.1 upstream; declaring the
# floor here makes an old rustc refuse by name instead of failing
# somewhere inside arrow's build.
rust-version = "1.96"
description = "Batch travel-cost enrichment sidecar: (anchors x points) -> cost records via routee-compass"
license = "BSD-3-Clause"

# Deliberately NOT a workspace member of pipestream-search: the engine
# takes no routing dependency (docs/plans/routing-enrichment.md). This
# crate builds on its own, with its own lockfile and target directory.

[dependencies]
routee-compass = { version = "0.19.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Energy-aware routing (routee-compass's powertrain models, ONNX
# runtime included). Off by default so plain travel-time builds stay
# lean; `--features energy` when a config wants trip_energy costs.
energy = ["routee-compass/routee-compass-powertrain"]
